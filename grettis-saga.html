i úr ætt gengið.", "\"Hvaðan kom þér fé þetta?\" sagði Þorfinnur.", "Grettir kvað þá vísu:", "Mér hefir brugðist, báru", "blikrýrandi, að skýru,", "brátt spyrji bragnar þetta,", "bauga von í haugi.", "Þó sé eg hitt að Hrotta", "hríð-Ullr muni síðan", "fár að Fáfnis mýri", "fullteitr þannig leita.", "Þorfinnur svarar: \"Ekki mun þér allt í augu blæða og öngvan hefir þessa fýst fyrr að brjóta hauginn. En fyrir því að eg veit að það fé er illa komið er fólgið er í jörðu eða í hauga borið þá mun eg ekki gefa þér hér skuld fyrir með því að þú færðir mér. Eða hvar náðir þú saxinu góða?\"", "Grettir segir og kvað:", "Fékk í firna dökkum,", "féll draugr, tekið haugi", "sax það er seggja vexir", "sár, hyrlestir báru.", "Og skyldi mér aldrei", "jálms dýrlogi hjálma", "ýtum hættr, ef ættag,", "angrs hendi firr ganga.", "Þorfinnur svarar: \"Vel er til mælt en sýna skaltu nokkuð áður það er frægð þyki í vera en eg gefi þér saxið því að það fékk eg aldrei af föður mínum meðan hann lifði.\"", "Grettir svarar: \"Eigi má vita hverjum að mestu gagni kemur um það er lýkur.\"", "Þorfinnur tók við fénu og geymdi saxið hjá sæng sinni. Leið svo veturinn framan til jóla að ekki bar fleira til frásagna."], "recap": ["Þorfinnur á bú í Háramarsey - höfðingi mikill.\nÞorfinnur kemur Hafliða og hans mönnum til bjargar en skipið sekkur og mikill varningur með því. Mennirnir eru í viku hjá Þorfinni en hverfa svo hver í sína áttina.\nGrettir verður eftir hjá Þorfinni en lætur lítið fyrir sér fara og er fátalaður.\nÞorfinnur skiptir sér lítið af Gretti en gefur honum þó mat þrátt fyrir að Grettir vilji lítið við hann tala.\nHúsakynni Þorfinns eru glæsileg og hann vill hafa fjör í kringum sig og býður oft fólki heim.\nGrettir heimsækir reglulega bæ á Vindheimi, þar býr Auðun nokkur og verður kært á milli þeirra.\nGrettir er eitt kvöld á leið heim og sér þá mikinn eld á nesi sem stóð rétt við bæ Auðunar. Auðun segir Gretti að þar hafi Kár, faðir Þorfinns, verið lagður í haug en hann hafi gengið aftur og hrakið burt alla aðra bændur í sveitinni svo Þorfinnur eigi nú einn allt landið í eynni.", "Grettir vill endilega reyna sig við að stoppa drauginn Kár og biður Auðun að hafa klárt fyrir sig daginn eftir áhöld til að grafa með því hann ætli að grafa upp hauginn.\nAuðun reynir að stoppa Gretti því hann hefur áhyggjur af að með þessu kalli hann yfir sig fjandskap að hálfu Þorfinns. \nGrettir lætur ekki segjast og mætir daginn eftir til að grafa upp hauginn, hann kemst inn í hauginn og tekst á við haugbúann (látinn Kár) með miklum látum. Svo fer að Grettir hefur betur þegar hann heggur höfuðið af Kár með sverðinu Jökulsnaut.", "Grettir flytur verðmæti út haugnum en þegar hann kemur út er Auðun á bak og burt.\nGrettir er mjög þreyttur eftir viðureignina við drauginn Kár en snýr heim til bæjar Þorfinns með féð úr haugnum en þar er einnig sverð sem Grettir er mjög hrifinn af. Er það ættargripur fjölskyldu Þorfinns, sverð sem Þorfinnur hafði aldrei fengið að prófa hjá pabba sínum.\nÞorfinni bregður þegar hann sér hvað Grettir er með en er ánægður með að fá bæði féð og saxið góða, tekur við því og geymir saxið hjá sæng sinni."]}, {"num": 19, "paras": ["Þetta sumar hið næsta bjóst Eiríkur jarl Hákonarson úr landi vestur til Englands á fund Knúts konungs hins ríka mágs síns en hann setti eftir til ríkis í Noregi Hákon jarl son sinn og fékk hann í hendur Sveini jarli bróður sínum til forsjá og ríkisstjórnar því að Hákon var barn að aldri.", "En áður Eiríkur jarl fór úr landi stefndi hann til sín lendum mönnum og ríkum bóndum. Töluðu þeir mart um lög og landsskipun því að Eiríkur jarl var stjórnsamur. Þótti mönnum það mikill ósiður í landinu að úthlaupsmenn eða berserkir skoruðu á hólm göfgum mönnum til fjár eða kvenna. Skyldu hvorir ógildir falla sem féllu fyrir öðrum. Fengu margir af þessu smán og fjármissu en sumir líftjón með öllu og því tók Eiríkur jarl af allar hólmgöngur í Noregi. Hann gerði og útlaga alla ránsmenn og berserki þá sem með óspektir fóru. Var í þessari skipan og ráðagerð með jarli Þorfinnur Kársson úr Háramarsey því að hann var vitur maður og kær vinur jarla.", "Tveir bræður eru nefndir til að verstir voru. Hét annar Þórir þömb en annar Ögmundur illi. Þeir voru háleyskir að ætt, meiri og sterkari en aðrir menn. Þeir gengu berserksgang og eirðu öngu þegar þeir reiddust. Þeir tóku á burt konur manna og höfðu við hönd sér viku eða hálfan mánuð og færðu síðan aftur þeim sem áttu. Þeir rændu hvar sem þeir koma eða gerðu aðrar óspektir. Eiríkur jarl gerði þá útlæga fyrir endilangan Noreg. Gekk Þorfinnur mest manna fyrir sekt þeirra. Þóttust þeir honum eiga fullan fjandskap að gjalda. Síðan fór jarl úr landi sem segir í sögu hans en Sveinn jarl hafði yfirvald í Noregi og ríki.", "Þorfinnur fór heim til bús síns og sat heima mjög til jóla sem fyrr er sagt. Í móti jólum býst Þorfinnur að fara til bús síns þangað sem hét í Slysfirði. Það er á meginlandi. Hafði hann boðað þangað mörgum vinum sínum. Húsfreyja Þorfinns mátti eigi fara með bónda því að dóttir þeirra frumvaxta lá sjúk og voru þær báðar heima. Grettir var heima og húskarlar átta. Þorfinnur fór nú við þrjá tigu frelsingja til jólaveislunnar. Var þar hinn mesti mannfagnaður og gleði.", "Nú kemur aðfangadagur jóla. Þá var veður bjart og kyrrt. Grettir var lengstum úti um daginn og sá að skip fór suður og norður með landi því að hver sótti til annars þangað sem samdrykkjan var sett. Bóndadóttur var þá batnað svo að hún gekk með móður sinni. Leið nú á daginn.", "Þá sá Grettir að skip reri að eynni. Það var ekki mikið og skarað skjöldum milli stafna. Skipið var steint fyrir ofan sjá. Þeir reru knálega og stefndu að naustum Þorfinns. Og er skipið kenndi niður hljópu þeir fyrir borð sem á voru. Grettir hafði tölu á mönnum þessum að þeir voru tólf saman. Ekki þótti honum þeir friðlega láta. Þeir tóku upp skip sitt og báru af sjó. Eftir það hlupu þeir að naustinu. Þar stóð inni karfinn Þorfinns sá hinn stóri. Hann settu aldrei færri menn á sjó en þrír tigir en þeir tólf rykktu honum þegar fram á fjörugrjótið. Síðan tóku þeir upp sitt skip og báru inn í naustið.", "Þá þóttist Grettir sjá að þeir mundu ætla að bjóða sér sjálfir beina. Hann gekk þá til móts við þá og fagnaði þeim vel og spyr hverjir þeir væru eða hversu formaður þeirra hét.", "Sá svarar skjótt er til var mælt og kvaðst heita Þórir og kallaður þömb, og bróðir hans Ögmundur og aðrir kompánar þeirra.", "\"Vænti eg,\" segir Þórir, \"að Þorfinnur húsbóndi yðvar hafi heyrt vor getið eða hvort er hann heima?\"", "Grettir svarar: \"Gæfumenn miklir munuð þér vera því að þér hafið hér góða aðkomu ef þeir eru mennirnir sem eg ætla. Bóndi er heiman farinn með alla heimamenn þá sem frjálsir eru og ætlar eigi heim fyrr en að bak jólunum. Húsfreyja er heima og bóndadóttir. Og ef eg þættist nokkurn mótgang eiga að gjalda þá vildi eg þann veg að koma því að hér er hvetvetna það er hafa þarf, bæði öl og annar fagnaður.\"", "Þórir þagði meðan Grettir lét ganga töluna. Síðan mælti hann til Ögmundar: \"Fór nokkuð fjarri því sem eg gat til?\" sagði hann, \"og væri mér það í hug að hefna Þorfinni er hann hefir gert oss útlaga. Er þessi maður og góður af tíðindum. Þurfum vér eigi að togast eftir orðum við hann.\"", "\"Orða sinna á hver ráð,\" sagði Grettir, \"og gera skal eg yður slíkan forbeina sem eg má og gangið heim með mér.\"", "Þeir báðu hann hafa þökk fyrir, kváðust hans boði hlíta mundu. En er þeir komu heim að bænum tók Grettir í hönd Þóri og leidd hann til stofu. Grettir var þá málreifur mjög. Húsfreyja var í stofunni og lét tjalda hana og búast um vel. En er hún heyrði til Grettis nam hún staðar á gólfinu og spurði hverjum Grettir fagnaði svo alvarlega.", "Grettir svarar: \"Það er ráð húsfreyja að taka vel við gestum. Hér er kominn Þórir bóndi þömb og þeir tólf saman og ætla hér að sitja um jólin. Er það allgott því að vér áttum heldur fámennt áður.\"", "Hún svarar: \"Eigi tel eg þá með bóndum eða góðum mönnum því að þeir eru hinir verstu ránsmenn og illvirkjar. Vildi eg gjarna hafa gefið til mikinn hlut eigu minnar að þeir hefðu hér eigi komið í þetta sinn. Launar þú og illa Þorfinni fyrir það er hann tók þig af skipbroti félausan og hefir haldið þig í vetur sem frjálsan mann.\"", "Grettir svarar: \"Réttar er nú fyrst að taka vosklæði af gestunum en að ámæla mér. Þess mun lengi kostur.\"", "Þórir mælti þá: \"Ver eigi stygg húsfreyja. Enginn missir skal þér í verða þó að bóndi sé eigi heima því að fá skal mann í stað hans og svo dóttur þinni og öllum heimakonum.\"", "\"Slíkt er karlmannlega talað,\" segir Grettir, \"mega þær þá eigi yfir sinn hlut sjá.\"", "Nú stukku fram konur allar og sló á þær óhug miklum og gráti.", "Grettir mælti til berserkja: \"Seljið mér það í hendur sem þér viljið af leggja, vopn og vosklæði, því að eigi mun oss fólkið stýrilátt meðan það er óhrætt.\"", "Þórir kvaðst eigi hirða hvað konur nögguðu \"en mikinn mun eigum vér að gera þín eða annarra heimamanna. Líst mér sem vér munum þig hafa að trúnaðarmanni.\"", "\"Sjáið þér fyrir því,\" sagði Grettir, \"en eigi geri eg mér alla menn jafna.\"", "Síðan lögðu þeir af flest öll vopn.", "Eftir það mælti Grettir: \"Ráðlegt þykir mér að þér farið til borðs og drekkið nokkuð því að yður mun þyrsta af róðri.\"", "Þeir kváðust þess albúnir en sögðu sér ókunnigt til kjallara. Grettir spurði hvort þeir vildu hlíta hans forsjá og umgangi. Berserkir létust það gjarna vilja. Grettir fer til og sækir öl og gefur þeim að drekka. Þeir voru mjög móðir og sulgu stórum. Lætur hann óspart ölið, það er áfengast var til, og gekk því lengi. Hann segir þeim og margar kátlegar sögur. Varð af þessu öllu saman háreysti til þeirra að heyra. Eigi fýsti heimamenn til þeirra að koma.", "Þá mælti Þórir: \"Eigi hefi eg þann mann fundið ókunnan er svo vel vildi við oss gera sem þessi maður eða hver laun viltu af oss félögum þiggja fyrir þína þjónustu?\"", "Grettir svarar: \"Eigi ætla eg hér til launa fyrir að svo gervu en ef vér erum þvílíkir vinir þá er þér farið á burt sem nú horfist þá mun eg ráðast til lags með yður. En þó að eg megi minna en einnhver yðvar þá mun eg eigi letja stórræðanna.\"", "Þeir urðu mjög glaðir við og vildu þegar binda félag sitt með fastmælum.", "Grettir kvað það eigi skyldu \"því að það er satt sem mælt er að öl er annar maður og skal eigi bráðabug að þessu gera framar en áður hef eg sagt. Erum vér litlir skapdeildarmenn hvorirtveggju.\"", "Þeir sögðust eigi ætla þessu að bregða. Leið nú á kveldið svo að mjög tók að myrkva. Þá sér Grettir að þeir gerast mæddir nokkuð af drykknum.", "Hann mælti þá: \"Þykir yður eigi mál að fara til svefns?\"", "Þórir kvað svo vera skyldu \"og skal efna það er eg hét húsfreyju.\"", "Grettir gekk fram og mælti hátt: \"Gangið til sængur, konur,\" segir hann, \"svo vill Þórir bóndi skipa.\"", "Þær báðu honum ills á móti. Var hinn mesti úlfaþytur til þeirra að heyra. Berserkir komu fram í þessu.", "Grettir mælti: \"Göngum vér út og mun eg sýna yður fatabúr Þorfinns.\"", "Þeir létu það leiðast. Komu þeir að útibúri ákaflega stóru. Þar voru á útidyr og sterkur lás fyrir. Það var allsterkt hús. Þar var hjá salerni mikið og sterkt og eitt skjaldþili milli húsanna. Húsin stóðu hátt og var nokkurt rið upp að ganga. Berserkir gerðust nú umfangsmiklir og stokuðu Gretti. Hann fór undan í flæmingi og er þeim var minnst von hljóp hann út úr húsinu og greip í hespuna og rekur aftur húsið og setur lás fyrir. Þórir og hans félagar ætluðu fyrst að svarfast mundi aftur hafa hurðin og gáfu sér ekki að. Þeir höfðu ljós hjá sér því að Grettir hafði sýnt þeim marga gripi þá er Þorfinnur átti. Litu þeir þar á um stund. Grettir flýtir ferðinni heim að bænum og þegar hann kemur í dyrnar kallar hann hátt og spyr hvar húsfreyja væri. Hún þagði því að hún þorði eigi að svara.", "Hann mælti: \"Hér er næsta veiðarefni eða eru nokkur vopn þau sem neyt eru?\"", "Hún svarar: \"Eru vopnin en eigi veit eg til hvers þér koma.\"", "\"Tölum síðar um það,\" segir hann. \"Dugi nú hver sem má. Eigi mun síðar vænna.\"", "Húsfreyja mælti: \"Nú væri guð í garði ef nokkuð mætti um bætast vorn hag. Yfir sæng Þorfinns hangir krókaspjótið stóra er átt hefir Kár hinn gamli. Þar er og hjálmur og brynja og saxið góða og munu eigi bila vopnin ef þér dugir hugurinn.\"", "Grettir þrífur hjálminn og spjótið en gyrðir sig með saxinu og gengur út skjótt. Húsfreyja kallar á húskarla og bað þá fylgja svo góðum dreng. Þeir hlupu til vopna fjórir en aðrir fjórir þorðu hvergi nær að koma.", "Nú er að segja frá berserkjunum að þeim þótti Gretti dveljast afturkoman. Grunar þá nú hvort eigi munu vera svik í. Hlaupa þeir á hurðina og finna að hún var læst, treysta nú á timburveggina svo brakar í hverju tré. Hér kemur um síðir að þeir fá brotið skjaldþilið og komust svo fram í gangrúmið og þar út á riðið. Kemur á þá berserksgangur og grenja sem hundar.", "Í því bili kom Grettir að. Hann tvíhenti spjótið á Þóri miðjum er hann ætlaði ofan fyrir riðið svo þegar gekk í gegnum hann. Fjöðurin var bæði löng og breið á spjótinu. Ögmundur illi gekk næst Þóri og hratt honum á lagið svo allt gekk upp að krókunum. Stóð þá spjótið út um herðarnar á Þóri og svo framan í brjóstið að Ögmundi. Steyptust þeir báðir dauðir af spjótinu.", "Þá hljóp þar hver út af riðinu sem komið var. Grettir sótti að sérhverjum, gerði ýmist að hann hjó með saxinu eða lagði með spjótinu en þeir vörðust með trjám er lágu á vellinum og öllu því er þeir fengu til. Var það hin mesta mannhætta að fást við þá fyrir afls sakir þó að þeir hefðu eigi vopn. Grettir drap þá tvo af Háleygjum þar í túninu. Húskarlar fjórir komu þá út. Höfðu þeir ekki ásáttir á orðið hver vopn að hvergi skyldi hafa, sóttu þá að þegar berserkirnir hörfuðu undan en er þeir snerust á mót hrukku húskarlar upp undir húsin.", "Sex féllu þar víkingar og varð Grettir banamaður allra. Síðan leituðu aðrir sex undan. Bárust þeir þá ofan að naustinu og inn í naustið. Vörðust þeir þá með árum. Fékk Grettir þá stór högg af þeim svo að við meiðingum var búið.", "Húskarlar fóru þá heim og sögðu mikið af framgöngu sinni. Húsfreyja bað þá vita hvað af Gretti yrði en það fékkst ekki af þeim.", "Tvo drap Grettir í naustinu en fjórir komust út hjá honum. Fóru þá sinn veg hvorir tveir. Hann eltir þá sem nær honum voru. Gerði nú myrkt af nótt. Þeir hlupu í kornhlöðu nokkura á þeim bæ sem fyrr var nefndur er á Vindheimi hét. Þar áttust þeir lengi við en um síðir drap Grettir báða. Var þá ákaflega móður og stirður en mikið var af nótt. Veður gerði kalt mjög með fjúki. Nennti hann þá ekki að leita víkinganna, þeirra tveggja er þá voru eftir. Gekk hann nú heim til bæjar.", "Húsfreyja lét kveikja ljós í hinum efstum loftum við gluggana að hann hefði það til leiðarvísis. Var og svo að hann fat af því heim er hann sá ljósið.", "En er hann kom í dyrnar gekk húsfreyja að honum og bað hann vera velkominn \"og hefir þú,\" segir hún, \"mikla frægð unnið og leyst mig og hjú mín frá þeirri skemmd er vér hefðum aldrei bót fengið nema þú hefðir borgið oss.\"", "Grettir segir: \"Eg þykist nú mjög hinn sami og í kveld er þér töluðuð hraklegar við mig.\"", "Húsfreyja mælti svo: \"Vér vissum eigi að þú værir slíkur afreksmaður sem nú höfum vér reynt. Skal þér allt sjálfboðið innan bæjar það sem hæfir að veita en þér sæmd í að þiggja. En mig varir að Þorfinnur launi þér þó betur er hann kemur heim.\"", "Grettir svarar: \"Lítils mun nú við þurfa fyrst um launin en þiggja mun eg boð þitt þar til er bóndi kemur heim. En þess væntir mig að þér megið sofa í náðum fyrir berserkjunum.\"", "Grettir drakk lítið um kveldið og lá með vopnum sínum um nóttina. Um morguninn þegar lýsa tók var mönnum saman stefnt um eyna. Var þá farið að leita berserkjanna, þeirra sem undan höfðu komist um kveldið. Þeir fundust að áliðnum degi undir einum steini og voru þá dauðir af kulda og sárum. Síðan voru þeir færðir í flæðarurð eina og dysjaðir þar. Eftir það fóru þeir heim og þóttust eyjarskeggjar í frið þegnir.", "Grettir kvað vísu þessa er hann kom heim til húsfreyju:", "Tólf höfum gröf hjá gjálfri", "gunnelds búið runnum.", "Einn nam eg öllum vinna", "ótrauðr beran dauða.", "Hver munu gild um gjörvast,", "gulls vel borin selja,", "verk, þau er einn fær orkað,", "ítr, ef slík eru lítil.", "Húsfreyja mælti: \"Víst ertu fárra manna líki, þeirra sem nú eru til.\"", "Setur hún hann í öndugi og gerði til hans alla hluti vel. Leið nú svo fram uns Þorfinns var heim von."], "recap": ["Eiríkur jarl Hákonarson ræður yfir Noregi, hann þarf að fara til Englands á fund Knúts konungs, Hákon jarl sonur hans er barn að aldri og því biður Eiríkur Svein jarl bróður sinn að vera Hákoni syni sínum til aðstoðar við stjórn landsins á meðan Eiríkur er í burtu.\nFyrir brottför kallar Eiríkur á fund til sín alla þá höfðingja og ríku menn sem höfðu fengið land að láni frá konungi til að búa á (embættismenn konungs) og er sú ákvörðun tekin að afnema hólmgöngur.\nMargir berserkir og ránsmenn sem ferðuðust um og skoruðu heiðarlega menn á hólm um fé eða konur þeirra. Þetta þoldi konungur ekki og var því sú ákvörðun tekin að gera útlæga alla þá menn sem gengu berserksgang, með konungi í ráðum var Þorfinnur Kársson úr Háramarsey. \nTveir berserkir; Þórir þömb og Ögmundur illi, sterkir og miklir, ganga um og ræna fé og konum hvar sem þeir koma.\nEiríkur gerir Þóri og Ögmund útlæga og gengur Þorfinnur harðast allra fram í að sækja þá til saka svo þeir eru mjög ósáttir við Þorfinn.", "Þorfinnur er heima til jóla en vill þá fara til bús síns í Slysfirði þar sem hann hefur boðið mörgum til jólaboðs. \nKona hans er heima með dóttur þeirra (á bilinu 14-18 ára) þar sem hún er lasin, Grettir er einnig heima ásamt átta húskörlum.\nÁ aðfangadag er Grettir úti við og sér þá að skip nálgast eyjuna, hann sér tólf menn taka skipið upp á land og sýnist þeir láta ófriðlega, hann fer á móti þeim og býður þá velkomna og spyr hverjir þarna séu á ferð. Þá svara honum berserkirnir Þórir þömb og Ögmundur illi og segja að Þorfinnur eigi að þekkja þá því þeir séu komnir til að hefna fyrir að hann hafi fengið þá dæmda í útlegð.\nGrettir segir Þorfinn vera í burtu en býður þeim að koma með sér heim á bæinn og segist ætla að slá upp veislu fyrir þá, þeir geti fengið þar öl og konur og haft það huggulegt. \nKona Þorfinns bregst ókvæða við þegar hún sér hverjir koma inn í bæinn og allar konur á bænum verða hræddar og bresta í grát, Grettir gefur þeim hins vegar öl og fær þá til að taka af sér vosklæði og vopn, þykist vilja ganga til liðs við þá.\nOrð Grettis: ,,Öl er annar maður.”", "Berserkir drekka stíft og undir nóttina eru þeir orðnir ansi drukknir, Grettir leiðir þá út og vill sýna þeim skemmu sem Þorfinnur á, þeir fylgja Gretti en þegar þeir eru komnir inn í skemmuna læsir hann þá inni, þeir átta sig hins vegar ekki á því en halda að hurðin standi á sér.\nGrettir hleypur inn og kallar til húsfreyju að finna til öll vopn sem hægt sé að nota, hún kallar einnig á húskarlana og biður þá að aðstoða Gretti, fjórir þeirra hlaupa til en aðrir þora ekki í bardaga.\nGrettir klæddur hjálm og brynju, vopnaður saxinu góða frá Kár og krókaspjóti sem einnig var í hans eigu.\nNú fara að renna tvær grímur á berserkina, þeir átta sig á að brögð eru í tafli og ná að brjótast út úr skemmunni. \nÞeir mæta Gretti úti og verður mikill bardagi, Grettir drepur fyrsta þá Þóri þömb og Ögmund illa og svo átta menn þeirra til viðbótar en síðustu tveir ná að flýja, þeir finnast þó um morguninn örendir af sárum sínum og kulda. \nGrettir er hylltur af húsfreyju fyrir þessi afrek, líður að því að Þorfinnur komi aftur heim.\n,,Víst ertu fárra manna líki, þeirra sem nú eru til.”"]}, {"num": 20, "paras": ["Eftir jólin býst Þorfinnur til heimferðar og leysti marga með góðum gjöfum burt er hann hafði til sín boðið. Síðan fór hann með sínu föruneyti þar til er hann kemur mjög að naustum sínum. Þeir sjá að skip lá á sandinum og bera brátt kennsli á að það var karfi hans hinn stóri. Ekki hafði Þorfinnur þá spurt til víkinganna.", "Hann bað þá flýta sér að landi \"því að mig grunar,\" segir hann, \"að hér hafi eigi vinir um vélt.\"", "Þorfinnur gekk fyrst á land sinna manna og þegar að naustinu. Hann sá þar skip standa og kenndi að það var skip berserkja.", "Hann mælti þá til sinna manna: \"Það grunar mig,\" segir hann, \"að þeir atburðir munu hér orðið hafa að eg vildi gefa til eyna og allt það sem hér stendur saman að eigi hefði orðið.\"", "Þeir spurðu hví svo væri.", "Hann mælti þá: \"Hér hafa komið þeir víkingar er eg veit versta í öllum Noregi sem eru Þórir þömb og Ögmundur illi. Munu þeir hafa ekki búið heppilega fyrir oss en eg treysti ekki vel Íslendingi.\"", "Talaði hann hér til mart við félaga sína.", "Grettir var heima og olli hann því er seint var til strandar gengið. Kvaðst hann eigi hirða þótt bónda blikraði nokkuð til hvað fyrir væri. En húsfreyja bað hann leyfis. Sagði hann að hún skyldi ráða ferðum sínum en hvergi lést hann fara mundu.", "Hún gekk skjótt til fundar við Þorfinn og fagnaði honum vel.", "Hann varð glaður við það og mælti: \"Guð hafi lof fyrir er eg sé þig heila og svo dóttur mína. Eða hversu hefir ykkur til gengið síðan er eg fór heiman?\"", "Hún segir: \"Vel hefir úr ráðist en lá oss við svo mikilli svívirðingu að vér hefðum aldrei bót fengið ef eigi hefði veturtaksmaður þinn hjálpað oss.\"", "Þorfinnur mælti þá: \"Nú skal setjast niður en þú seg frá tíðindum.\"", "Hún segir þá greinilega alla atburði sem þar höfðu gerst og lofaði mjög hreysti Grettis og framgöngu.", "Þorfinnur þagði á meðan og er hún hafði úti söguna svarar hann svo: \"Satt er það mælt er, lengi skal manninn reyna. Eða hvar er Grettir nú?\"", "Húsfreyja segir: \"Hann er heima í stofu.\"", "Síðan gengu þeir heim á bæinn. Þorfinnur gekk til Grettis og hvarf til hans og þakkar honum með fögrum orðum þann drengskap er hann hafði honum sýnt \"og það mun eg til þín mæla,\" segir Þorfinnur, \"sem fáir menn mæla til vinar síns að eg vildi að þú þyrftir manna við og vissir þú hvort eg gengi þér fyrir nokkurn mann eða eigi. En aldrei fæ eg launað þér þinn velgerning ef þig stendur engi nauður. En vist þín skal standa hér hjá mér nær sem þú þarft að þiggja og þú skalt fremst haldinn af mínum sveinum.\"", "Grettir bað hann hafa mikla þökk fyrir \"og mundi eg þegið hafa þó að þú hefðir fyrr boðið.\"", "Nú sat Grettir þar um veturinn og var í hinum mestum kærleikum við Þorfinn. Varð hann nú og frægur af verki þessu um allan Noreg og þar mest sem þeir höfðu mestar óspektar gert, berserkirnir.", "Um vorið spurði Þorfinnur Gretti hvað hann vildi að hafast. Hann kvaðst ætla að fara norður í Voga meðan þar var stefnutími. Þorfinnur kvað honum til reiðu skyldu peninga sem hann vildi. Grettir kvaðst eigi þurfa að sinni peninga meir en til skotsilfurs. Þorfinnur kvað það skylt og fylgdi honum til skips. Þá gaf hann Gretti saxið góða. Það bar Grettir meðan hann lifði og var hin mesta gersemi. Bað Þorfinnur hann til sín fara þegar hann þyrfti liðs við.", "Grettir fór nú norður í Voga og var þar allmikið fjölmenni. Fögnuðu þeir margir honum þar vel sem hann höfðu eigi séð fyrr fyrir sakir þess frægðarverks sem hann hafði unnið þá er hann drap víkingana. Buðu honum margir göfgir menn til sín en hann vildi fara aftur til Þorfinns vinar síns. Réðst hann þá í byrðing er átti sá maður er Þorkell hét. Hann bjó í Sálfti á Hálogalandi og var göfugur maður. En er Grettir kom heim til Þorkels tók hann við honum harðla vel og bað Gretti með sér vera um veturinn og lagði til þess mörg orð. Það þekktist Grettir og var með Þorkeli þenna vetur í góðu yfirlæti."], "recap": ["Þorfinnur kemur heim og þegar hann nálgast bæinn sér hann ferju sína í fjörunni eftir berserkina er þeir komu að landi. \nÞorfinnur óttast að ekki sé allt með felldu, að Þórir þömb og Ögmundur illi hafi komið þar að, og biður menn sína að flýta sér að landi.\nGrettir nennir ekki að fara til móts við Þorfinn en kona Þorfinns biður um að fá að fara á móti honum og fagnar honum vel.\nHún segir Þorfinni allt sem gengið hefur á og lofar Gretti í hástert.\nÞorfinnur lofar Gretti og segist aldrei fá honum fullþakkað, býður honum liðsinni allt til enda, býður honum að vera hjá sér eins lengi og hann vill og segir hann vera fremstan sinna manna.\nGrettir þakkar fyrir og er í miklum kærleikum hjá Þorfinni um veturinn. \nVerður hann frægur af þessum verkum sínum um allan Noreg. \nGrettir vill fara norður í Voga á markað og fær Þorfinnur honum peninga auk þess að gefa honum saxið góða frá Kár. Býður honum að koma aftur hvenær sem er.\n,,Það bar Grettir meðan hann lifði og var hin mesta gersemi.”\nFrægðarverk Grettis hafa spurst út og margir höfðingjar bjóða honum að vera með sér, hann endar á að vera hjá Þorkeli á Sálfti á Hálogalandi um veturinn."]}, {"num": 21, "paras": ["Björn hét maður er þar var á vist með Þorkeli. Hann var ákafamaður í lyndi og góðrar ættar, skyldur nokkuð Þorkeli. Ekki var hann vinsæll maður af alþýðu því að hann afflutti mjög fyrir þeim mönnum er voru með Þorkatli. Kom hann svo mörgum á burt. Fátt kom á með þeim Gretti. Þótti Birni hann lítils verður hjá sér en Grettir var ótillátssamur og kom til þverúð með þeim. Björn var hávaðamaður mikill og gerði um sig mikið. Fylgdu honum að því margir ungir menn og höfðu þeir oft á kveldum slentur mikið úti.", "Það bar til á öndverðum vetri að híðbjörn einn grimmur hljóp úr híði sínu og varð svo grimmur að hann eirði hvorki mönnum né fé. Ætluðu menn að hann mundi vaknað hafa af háreysti því er Björn hafði gert með kumpánum sínum. Gerðist dýrið svo illt viðfangs að það reif niður hjörð fyrir mönnum. Hafði Þorkell af þessu mestan skaða því hann var manna ríkastur í þessu byggðarlagi.", "Á nokkurn dag kvaddi Þorkell til fylgdar menn sína að leita hvar híð bjarnarins væri. Þeir fundu það í sjóvarhömrum. Var þar hamarklettur einn og hellisskúti framan í hamrinum einum en einn stígur til að ganga. Bjarg var undir hellinum og urð við sjóinn. Var þar vís bani því er ofan hrapaði. Lá björninn í híðinu á daginn en leitaði á burt jafnan er náttaði. Héldu öngvar grindur fénu fyrir honum. Komu þeir eigi hundum við. Þótti mönnum þetta hið mesta vandræði.", "Björn frændi Þorkels kvað vera að gert hið mesta er híðið var fundið \"skal eg nú prófa,\" sagði hann, \"hversu leikur fer með okkur nöfnum.\"", "Eigi lét Grettir sem hann vissi hvað Björn talaði um þetta.", "Jafnan bar svo til á kveldum þá er menn fóru að sofa, þá hvarf Björn út. Það var eina nótt að Björn fór til híðsins. Hann varð var við að dýrið var þar fyrir og grenjaði illilega. Björn lagðist niður við einstigið og hafði með sér skjöldinn og ætlaði að bíða þar til er dýrið leitaði á burt eftir vanda. Bessi hafði veður af manninum og seinkaði heldur ferðinni. Björn syfjaði heldur mjög þar sem hann lá og getur eigi vakað. Og í þessu ræður dýrið úr híðinu, getur nú séð hvar maðurinn liggur, krækir til hramminum og hnykkir af honum skildinum og kastar ofan fyrir bjargið. Björn bregður við hart. En er hann vaknar, tekur til fóta og hleypur heim, var þá búið við að dýrið mundi grípa hann. Vissu þetta félagar hans því að þeir höfðu njósn á um ferðir Bjarnar. Fundu þeir skjöldinn um morguninn og gerðu af þessu hið mesta gabb.", "Fór Þorkell sjálfur til híðsins og þeir átta saman. Þar var þá Björn og Grettir og aðrir fylgdarmenn Þorkels. Grettir hafði yfir sér loðkápu og lagði hana af sér meðan þeir sóttu að dýrinu. Þar var óhægt á að sækja því að ekki mátti við koma nema spjótalögum og beit hann þau af sér. Björn eggjaði þá mjög til atsóknar en þó gekk hann eigi svo nær að honum væri við nokkuru hætt. Og er minnst varði þrífur Björn kápu Grettis og kastaði í híðið til bjarnarins. Ekki gátu þeir að gert og hurfu aftur er á leið daginn. En er Grettir bjóst heim að ganga saknar Grettir feldar síns. Hann gat séð að björn hafði drepið undir sig kápuna.", "Hann mælti þá: \"Hver hefir glest við mig og kastað feld mínum í híðið?\"", "Björn svarar: \"Sá einn mun það gert hafa er þora mun við að ganga.\"", "Grettir svarar: \"Eigi legg eg slíkt langt upp.\"", "Þá sneru þeir heim á leið. Og er þeir gengið höfðu um hríð slitnaði hosnasterta Grettis. Þorkell bað þá bíða hans. Grettir kvað þess eigi þurfa.", "Þá mælti Björn: \"Eigi þurfið þér það að ætla að Grettir renni frá kápu sinni. Mun hann vilja hafa frægð af og drepa einn dýrið það er vér höfum frá gengið átta. Þá væri hann slíkur sem hann er sagður en allslælega hefir hann fram gengið í dag.\"", "\"Eigi veit eg,\" sagði Þorkell, \"hversu þér fer af en eigi munuð þið jafnir hreystimenn vera og legg þú fátt til hans.\"", "Björn kvað hvorugan þeirra kjósa orð úr munni sér.", "Nú ber leiti á milli þeirra. Grettir sneri þá aftur að einstiginu. Var þá ekki að metast við aðra um atgönguna. Hann brá þá sverðinu Jökulsnaut en hann hafði hönk á meðalkaflanum á saxinu og smeygði á hönd sér. Því gerði hann svo að hann þóttist heldur mega taka til þess er hann vildi ef laus væri höndin.", "Hann gekk þegar í einstigið. Og er dýrið sá manninn hljóp það með grimmd mikilli og móti Gretti og laust til hans með hramminum þeim er firr var berginu. Grettir hjó í móti með sverðinu og kom á hramminn fyrir ofan klærnar og tók þar af. Þá vildi dýrið ljósta með þeim fætinum sem heill var, skaust á stúfinn og varð hann lægri en hann ætlaði og féll þá dýrið í fang Gretti. Hann þrífur þá meðal hlusta dýrinu og hélt þá frá sér svo það náði eigi að bíta hann. Svo hefir Grettir sagt að hann þóttist þá aflraun mesta gert hafa að halda dýrinu. En með því að dýrið braust um fast en rúmið lítið þá viku þeir báðir ofan fyrir bjargið. Nú var dýrið þyngra og kom það fyrri niður á urðina. Varð Grettir þá efri en dýrið lamdist þá mjög þeim megin sem niður vissi. Grettir þrífur þá til saxins og lagði björninn til hjartans og var það hans bani. Eftir það fór hann heim og tók feld sinn og var hann allur rifinn í sundur. Hann hafði með sér það er hann hafði höggvið af hramminum.", "Þorkell sat að drykkju þá er Grettir kom í stofuna. Hlógu þeir að feldarslitrinu er Grettir hafði yfir sér. Hann setur nú upp á borðið það er hafði hann höggvið af hramminum.", "Þorkell mælti: \"Hvar er nú Björn frændi minn? Aldrei sá eg þér svo bíta járnin og vil eg að þú bætir Gretti sæmd fyrir þessa svívirðing sem þú hefir til hans gert.\"", "Björn kvað það frestast mundu \"og hirði eg aldrei hvort honum líkar vel eða illa.\"", "Grettir kvað vísu þessa:", "Oft kom heim í húmi", "hræddr, þá er öngum blæddi,", "sá er vetrliða vitja", "víg-Njörðr í haust gjörði.", "Sá engi mig sitja", "síð fyr bjarnar híði.", "Þó kom eg ullar otra", "út úr hellis skúta.", "\"Bæði er,\" sagði Björn, \"að þú hefir vel fram gengið enda berð þú okkur ólíkt söguna. Skil eg að þú munt þykjast mér þessa sneið stinga.\"", "Þorkell mælti: \"Það vildi eg Grettir,\" sagði hann, \"að þú hefnir þín eigi á Birni en eg mun bæta fyrir hann fullum manngjöldum og séuð þið sáttir.\"", "Björn kvað hann verja mega betur fé sínu en bæta fyrir þetta \"þykir mér það ráð að hér hafi eik það er af annarri skefur er við Grettir eigumst við.\"", "Grettir kvað sér það allvel líka.", "\"Þá muntu Grettir,\" sagði Þorkell, \"gera það fyrir mína skuld að gera ekki á hluta Bjarnar meðan þið eruð hjá mér.\"", "\"Það skal vera,\" segir Grettir.", "Björn kvaðst óhræddur ganga skyldu fyrir Gretti hvar sem þeir fyndust. Grettir glotti að en vildi ekki þiggja féð fyrir Björn og voru þeir þar um veturinn."], "recap": ["Björn frændi Þorkels er einnig í vist á Sálfti ásamt Gretti.\nBjörn óvinsæll meðal fólks því hann baktalar það og býr til vesen, er með læti útivið ásamt hópi manna á kvöldin,\nGretti og Birni kemur illa saman.\nBjörn og félagar vekja híðbjörn úr vetrardvala með látum sínum. Híðbjörnin gerir mikinn usla á næturna og drepur fébúnað en liggur í híði sínu á daginn, híðið er í klettum út við sjó og að því er einstigi (bara einn getur farið stiginn í einu).\nÞorkell fer með menn sína, þar á meðal Björn og Gretti, að finna híðið sem og þeir gera.\nBjörn fer eina nóttina að híðinu og ætlar að reyna sig við bjarndýrið en hefur ekki erindi sem erfiði og hrekst á brott, menn gera grín að þessari mislukkuðu tilraun Björns.\nÞorkell fer við átta menn til að gera atlögu að bjarndýrinu og eru Grettir og Björn þar með í för.\nGrettir er í loðkápu mikilli og kastar henni af sér í atganginum en svo fer að Björn tekur loðkápuna og hendir henni að birninum við litla kátínu Grettis, björninn leggur feldinn undir sig.", "Þeir snúa heim á leið en þegar þeir eru komnir aðeins frá híði bjarnarins losna reimar Grettis svo hann stoppar og biður hópinn að halda áfram. Þegar leiti (hæð, hóll) er á milli hans og hópsins snýr hann við og fer að híði bjarnarins. \nGrettir og björninn takast á, Grettir er vopnaður sverðinu Jökulsnaut og heggur af annan hramminn ofan við klærnar, eftir mikil átök nær Grettir að stinga með sverðinu í hjarta bjarnarins og drepa hann.\nGrettir fer heim með afskorna hramminn og feldinn sinn sem allur var sundurrifinn.\nÞorkell vill að Björn bæti Gretti þá svívirðingu að hafa hent feldi Grettis í björninn og eyðilagt hann en Björn neitar því.\nÞorkell býðst þá til að bæta Gretti með því að greiða honum full manngjöld til að ná sáttum milli hans og Bjarnar svo Grettir hefni sín ekki. Björn er ósáttur við það og finnst nóg að Grettir hafi á hann þá skömm að hann hafi ekki sjálfur náð að drepa dýrið.\nBjörn segist óhræddur við að berjast við Gretti en Grettir glottir að honum, Grettir neitar að taka fé Þorkels en lofar þó að halda friðinn, í bili."]}, {"num": 22, "paras": ["Um vorið fór Grettir norður í Voga með byrðingsmönnum. Skildu þeir Þorkell með vináttu en Björn fór vestur til Englands og var fyrir skipi Þorkels því er þangað fór. Hafðist Björn þar við um sumarið og keypti til handa Þorkeli þá hluti sem hann hafði honum um boðið. Sigldi hann vestan er á leið haustið.", "Grettir var í Vogum til þess er flotinn leysti. Síðan sigldi hann norðan með byrðingsmönnum nokkurum þar til er þeir komu í höfn þá er í Görtum heitir, það er fyrir Þrándheimsmynni, og tjölduðu þar yfir sig. Og er þeir höfðu um búist sigldi skip sunnan fyrir land. Þeir kenndu brátt að það var Englandsfar. Þessir lögðu að utar við ströndina, gengu á land.", "Grettir og hans félagar viku til móts við þá. En er þeir fundust sér Grettir að Björn er þar í liði og mælti: \"Það er vel að við höfum hér fundist. Munum við nú taka til hinna fornu greina okkarra. Vil eg nú reyna hvor okkar meira má.\"", "Björn kvað sér það fornt vera \"en ef það hefir nokkuð verið þá vil eg bæta svo að þú þykist vel haldinn af.\"", "Grettir kvað þá vísu:", "Íugtanna gat eg unnið,", "orð lék á því forðum.", "Feld reif hart af höldi", "hugstríðr meginsíðan.", "Baugs olli því bellinn", "Baldr en nú skal gjalda.", "Oft þykjumst eg ekki", "allhælinn kappmælum.", "Björn sagði bætt hafa verið stærri sakir fé en þessar.", "Grettir kvað fá til hafa orðið að gera sér öfundarbrögð enda lést hann aldrei fé hafa á tekið og sagði að enn mundi svo fara \"skulum við báðir eigi héðan heilir ganga ef eg má ráða. Legg eg nú bleyðiorð á bak þér ef þú þorir eigi að berjast.\"", "Björn sá nú að honum tjáði ekki undan að mælast, tók nú vopn sín og gekk á land. Síðan hlupust þeir að og börðust og ekki lengi áður en Björn varð sár og því næst féll hann dauður niður á jörð en það sáu fylgdarmenn Bjarnar. Gengu þeir á skip sitt, sneru norður með landi til móts við Þorkel og sögðu honum þennan atburð. Hann kvað það eigi fyrr hafa fram komið en von var að.", "Brátt eftir þetta fór Þorkell suður til Þrándheims, fann þar Svein jarl.", "Grettir fór á Mæri eftir víg Bjarnar og hitti Þorfinn vin sinn og sagði honum þetta sem til hafði borið.", "Þorfinnur tók vel við honum \"og er það gott,\" sagði hann, \"að þú ert vinþurfi. Skaltu með mér vera þar til er lýkur þessum málum.\"", "Grettir þakkaði honum fyrir boð sitt og kvaðst það nú þiggja mundu.", "Sveinn jarl sat inn í Þrándheimi að Steinkerum þá er hann spurði víg Bjarnar. Þá var þar með honum Hjarrandi, Bjarnar bróðir. Hann var hirðmaður jarls. Hann varð við reiður mjög er hann spurði víg Bjarnar og beiddi jarl liðveislu til málsins. Jarl hét honum því. Sendi hann þá mann til Þorfinns og stefndi þeim Gretti báðum á sinn fund. Bjóst hann þegar og þeir Grettir báðir eftir boði jarls og fóru inn í Þrándheim á hans fund. Átti jarl þá stefnu að málinu og bað Hjarranda hjá vera.", "Hjarrandi kvaðst eigi mundu bera bróður sinn í sjóði. \"Skal eg annaðhvort fara slíka fór sem hann ella hefna hans,\" segir hann.", "Nú er málið var skoðað fannst jarli sem margar sakir hefði Björn gert við Gretti en Þorfinnur bauð fébætur eftir því sem jarli þætti erfingjar sæmdir af og talaði um það langt erindi hvert frelsi að Grettir hefði unnið mönnum norður í landi þá er hann drap berserkina sem áður var sagt.", "Jarl svaraði: \"Satt segir þú það Þorfinnur. Það var hin mesta landhreinsun og vel samir oss að taka fébætur fyrir þín orð. Er og Grettir frægur maður fyrir sakir afls og hreysti.\"", "Hjarrandi vildi eigi sættum taka og skildu þeir málstefnuna. Þorfinnur fékk til Arnbjörn, frænda sinn, að ganga með Gretti hvern dag því að hann vissi að Hjarrandi sat um líf hans."], "recap": ["Vorið eftir fer Grettir norður í Voga með kaupmönnum og skilur við Þorkel í vináttu, fer síðan á eyjuna Gartar í Þrándheimsfirði\nBjörn fer vestur til Englands á skipi Þorkels til að reka erindi fyrir frænda sinn, þar var hann um sumarið en siglir svo aftur til Noregs um haustið.\nGrettir sér hvað skip Björns og félaga kemur að strönd nálægt þeim, Grettir og félagar fara til móts við skipverja.\nGrettir segist vilja taka upp ágreiningsefni þeirra Björns og útkljá það (feldurinn sem Þorkell vildi bæta Gretti en Grettir tók ekki við bótunum) en Björn telur að búið sé að ganga frá því með bótum sem Grettir geti sannarlega verið sáttur við.\nGrettir segist ekki hafa tekið við bótunum og því séu sakirnar óuppgerðar, hann eggjar Björn til að berjast við sig með því að kalla hann bleyðu, svo fer að þeir berjast og Grettir drepur Björn.\nFylgdarmenn Björns fara beint til Þorkels og segja honum lát Björns frænda hans og kemur það Þorkeli lítið á óvart.", "Þorkell fer suður til Þrándheims og hittir þar Svein jarl sem ræður yfir Noregi.\nGrettir fer að finna Þorfinn vin sinn, þann sem hann kom fyrst til í Noregi (berserkjadrápið).\nÞorfinnur er honum skuldbundinn eftir það afrek Grettis að drepa berserkina og tekur hann undir sinn verndarvæng.\nHjarrandi bróðir Björns er við hirð Sveins jarls, Hjarrandi er æfur út í Gretti fyrir að hafa drepið Björn og óskar eftir aðstoð Sveins jarls við að ná fram réttlæti.\nSveinn kallar Þorkel og Gretti á fund sinn, Hjarrandi neitar alfarið að taka við fébótum eftir bróður sinn og vill bara hefna, Þorfinnur talar máli Grettis og býður fébætur og jarl er sammála því að Grettir hafi unnið stórvirki við ,,landhreinsun” með að drepa berserkina, auk þess hafi Björn hafi nú ekki verið alsaklaus í samskiptum sínum við Gretti.\nSáttarfundi er slitið en Hjarrandi er áfram sótillur og situr um líf Grettis, Þorfinnur fær því Arnbjörn frænda sinn til að ganga með Gretti hvern dag honum til aðstoðar gegn Hjarranda."]}, {"num": 23, "paras": ["Það var einn dag er Grettir og Arnbjörn gengu úti um stræti að skemmta sér, og er þeir komu fram fyrir garðshlið nokkuð hljóp maður fram úr garðshliðinu með reidda öxi og hjó til Grettis tveim höndum. Hann varði einskis um þetta og gekk undan seint. Arnbjörn gat séð manninn, þreif til Grettis og hratt honum áfram svo hart að hann féll á kné. Öxin kom á herðarblaðið og renndi undir höndina. Var það mikið sár. Grettir snaraðist við fast, brá saxinu. Hann kenndi að þar var kominn Hjarrandi. Öxin stóð föst í strætinu og varð honum seint að sér að kippa. Og í því hjó Grettir til Hjarranda og kom á höndina uppi við öxl svo af tók. Þá hlupu að fylgdarmenn Hjarranda fimm saman. Sló þá í bardaga með þeim. Urðu skjótt umskipti. Drápu þeir Grettir og Arnbjörn þá fimm er með Hjarranda voru en einn komst undan og sá fór þegar á fund jarls og sagði honum þessi tíðindi.", "Jarl varð afar reiður er hann frétti þetta og stefndi þing annan dag eftir. Kom Þorfinnur á þingið.", "Bar jarl sakir á hendur Gretti um vígin en hann gekk við og sagðist hann hafa átt hendur sínar að verja.", "\"Mun eg og hafa merki á mér,\" sagði Grettir. \"Hefði eg bana af fengið ef Arnbjörn hefði eigi borgið mér.\"", "Jarl segir að það var illa er hann var eigi drepinn \"mun það verða margs manns bani ef þú lifir.\"", "Þá var til jarls kominn Bersi Skáld-Torfuson, félagi Grettis og vin. Gengu þeir Þorfinnur fyrir jarl og báðu griða til handa Gretti og buðu að jarl skyldi einn dæma um þetta mál þegar Grettir hefir grið og landsvist. Jarl var tregur í öllu sáttmáli en lét þó leiðast eftir bænastað þeirra. Var þá komið á griðum til vors fyrir hönd Grettis en þó vildi jarl eigi sættast fyrr en við væri Gunnar, bróðir þeirra Bjarnar og Hjarranda. Gunnar var garðsbóndi í Túnsbergi.", "Um vorið stefndi jarl þeim Gretti og Þorfinni austur til Túnsbergs því að hann ætlaði þar að vera meðan mest aðsigling var austur þar. Fóru þeir þá austur þangað. Var jarl þar fyrir í bænum er þeir komu austur.", "Grettir fann þar Þorstein drómund bróður sinn. Tók hann við honum allvel og bauð honum til sín. Þorsteinn var þar garðsbóndi í bænum. Sagði Grettir honum af málum sínum og tók Þorsteinn vel undir en bað hann vera varan um sig fyrir Gunnari. Leið nú svo fram á vorið."], "recap": ["Grettir og Arnbjörn á göngu úti á götu, maður stekkur að þeim með reidda öxi og heggur til Grettis sem hlýtur stórt sár á öxl, þeir átta sig á að þetta er Hjarrandi og fjórir menn með honum.\nGrettir tekur öxina úr sárinu og heggur hendina af Hjarranda við öxl, úr verða mikil átök og fer svo að Grettir og Arnbjörn drepa Hjarranda og þrjá manna hans en einn sleppur. \nSá fer strax á fund Sveins jarls og segir honum hvað hafi gerst, jarl kallar saman fund daginn eftir til að fara yfir málið.\nJarl sakar Gretti um vígin, Grettir gengst við þeim en segir þau hafa verið í sjálfsvörn, hann hafi stórt sár á öxlinni því til sönnunar og Arnbjörn hafi bjargað sér frá bana.\nBersi Skáld-Torfuson, vinur Grettis frá Íslandi, og Þorfinnur ganga fyrir jarl og biðja griðar fyrir Gretti, jarl er tregur til en lætur undan að lokum, þó með því skilyrði að Gunnar, bróðir Björns og Hjarranda, komi einnig að sáttamálum en hann var húseigandi í Túnsbergi.\nUm vorið stefnir jarl Gretti og Þorfinni til Túnsbergs, þar hittir Grettir hálfbróður sinn Þorstein drómund, sem einnig var húseigandi í bænum, og segir honum frá sínum málum. \nÞorsteinn tekur Gretti vel en segir honum að vara sig á Gunnari."]}, {"num": 24, "paras": ["Gunnar var í bænum og sat um Gretti nær sem færi gæfi á honum.", "Það bar til á einhverjum degi að Grettir sat í búð nokkurri og drakk því að hann vildi eigi verða fyrir Gunnari. Og er hann varði minnst var hlaupið á hurðina svo hart að hún brotnaði í sundur. Þar hlupu inn fjórir menn alvopnaðir. Var þar kominn Gunnar og fylgdarmenn hans. Þeir sóttu að Gretti. Hann þreif vopn sín er héngu uppi yfir honum, opaði hann þá upp í hyrninguna og varðist þaðan. Hann hafði fyrir sér skjöldinn en hjó með saxinu. Sóttist þeim eigi fljótt. Kom hann á höggi einn fylgdarmann Gunnars. Þurfti sá eigi fleiri. Rýmdi Grettir þá fram á gólfið. Hrukku þeir þá utar eftir búðinni. Féll þá annar maður af Gunnari. Þá vildi Gunnar undan leita og hans förunautar. Komst sá til dyranna og drap fótunum í þröskuldinn og lá fallinn og komst seint upp. Gunnar hafði fyrir sér skjöldinn og opaði Gretti undan en hann sótti að með kappi og hljóp upp í þverpallinn við dyrnar. Bar þá hendur Gunnars úr dyrunum inn og svo skjöldinn. Grettir hjó þá niður í milli Gunnars og skjaldarins og af honum báðar hendurnar í úlfliðnum. Féll hann á bak aftur út úr dyrunum. Grettir hjó hann banahögg og því komst sá á fætur er honum hafði fylgt og fór þegar á fund jarls og sagði honum þessi tíðindi.", "Sveinn jarl varð ákaflega reiður við þessa sögu og stefndi þegar þing í bænum. En er þeir Þorfinnur og Þorsteinn drómundur vissu þetta heimtu þeir að sér tengdamenn sína og vini og fjölmenntu mjög til þingsins. Jarl var allstyggur og mátti lítt orðum við hann koma.", "Þorfinnur gekk fyrst fyrir jarl og mælti: \"Því er eg hér kominn að eg vil bjóða yður sátt og sæmdir fyrir víg þessi er Grettir hefir vegið. Skuluð þér einir skera og skapa ef maðurinn hefir grið.\"", "Jarl svarar reiður mjög: \"Seint leiðist þér að biðja griða til handa Gretti en grunar mig að þú hafir þar eigi gott að sök. Hefir hann nú drepið þrjá bræður hvern á fætur öðrum. Voru þeir svo hraustir menn í sér að enginn þeirra vildi í sjóð bera annan. Nú tjáir þér Þorfinnur eigi að biðja fyrir Gretti því að eg vil eigi leiða svo inn rangindi í landið að taka bætur fyrir slík óhæfuverk.\"", "Þá gekk fram Bersi Skáld-Torfuson, bað jarl taka sættum \"vil eg,\" sagði hann, \"þar til biðja og bjóða mitt góss því Grettir er maður stórættaður og góður vin minn. Megið þér sjá herra að betra er að gefa einum manni grið og hafa í móti margra manna þökk en ráða einn fésektum, heldur en brjótast í móti sæmd sinni og hætta hvort þér náið manninum eða eigi.\"", "Jarl svarar: \"Vel fer þér Bersi þetta og sýnir þú það jafnan að þú ert góður drengur en þó nenni eg eigi að brjóta svo landslögin að gefa þeim grið sem ólífismenn eru.\"", "Þá gekk fram Þorsteinn drómundur og kvaddi jarl og bauð boð fyrir Gretti og fór þar um mörgum fögrum orðum. Jarlinn spurði hvað honum gengi til að bjóða boð fyrir þenna mann. Þorsteinn sagði að þeir voru bræður.", "Jarl kvaðst það eigi vitað hafa \"en drengskapur er þér í þó að vildir hjálpa honum. En fyrir því að vér höfum ætlað eigi hér fébætur fyrir þessi mál þá munum vér hér alla jafndýra um gera. Skulum vér hafa líf Grettis, hvað er kostar, þegar vér komumst við.\"", "Hljóp jarl þá upp og vildi ekki á líta um sættirnar þeirra Þorfinns og gengu þá heim í garð Þorsteins og bjuggust þar um. En er jarl sá þetta lét hann vopnast alla hirð sína, gengu síðan með fylktu liði þangað. Og áður liðið kom að skipuðust þeir til varnar fyrir garðshliðinu. Stóðu þeir fremstir Þorfinnur og Þorsteinn og Grettir og þá Bersi. Hafði hver þeirra mikla sveit manna.", "Jarl bað þá selja fram Gretti og halda sig eigi í ófæru. Þeir buðu öll hin sömu boð sem fyrr. Jarl vildi það ekki heyra.", "Þeir Þorfinnur og Þorsteinn kváðu jarl skyldu meira fyrir verða að ná lífi Grettis \"því eitt skal yfir oss og mun það þá mælt að þér vinnið mikið til eins manns lífs ef vér erum allir við velli lagðir.\"", "Jarl kvað öngan þeirra spara skyldu. Var þá við sjálfu búið að þeir mundu berjast. Þá gengu að jarli margir góðgjarnir menn og báðu að hann héldi eigi til svo mikils vandræðis, sögðu að þeir mundu mikið afráð gjalda áður þeir væru drepnir. Jarl fann að þetta var heilræði. Lét hann þá heldur sefast. Síðan var dregin saman sættin. Voru þeir Þorfinnur og Þorsteinn þess fúsir þegar Grettir næði griðum.", "Jarl mælti: \"Það skuluð þér vita,\" sagði hann, \"þó að eg geri hér mikið miðlunarmál um víg þessi að eg kalla þetta öngva sætt en eigi nenni eg að berjast við menn mína þó að eg sjái að þér metið mig lítils í þessu máli.\"", "Þá mælti Þorfinnur: \"Þetta er yður meiri sæmd herra því að þér skuluð einir ráða fégjöldum.\"", "Jarl sagði þá að Grettir skyldi fara í friði fyrir honum út til Íslands þegar skip ganga ef þeim líkaði þá vel. Þeir kváðust það þiggja mundu. Luku þeir jarli fé svo honum gast að og skildu með öngum kærleikum. Fór Grettir með Þorfinni. Skildust þeir Þorsteinn bróðir hans með vináttu. Varð Þorfinnur frægur af fylgd þeirri er hafði veitt Gretti, við slíkt ofurefli sem hann átti að eiga. Engi af þeim mönnum komst í kærleika við jarl þaðan frá, þeirra er Gretti hafði lið veitt, nema Bersi einn.", "Svo kvað Grettir:", "Var Þorfinnr", "Þundar sessi", "aldar alinn", "oss til hjálpar", "þá er mig víf", "í valskorum", "lukt og læst", "lífs um kvaddi.", "Var stórskip", "stallgoðs bana", "Rauðahafs", "og Regins skáli", "er Býleists", "bróðurdóttur", "manna mest", "mér varnaði.", "Og enn þessa:", "Þótti þá", "þengils mönnum", "ekki dælt", "oss að stríða", "er hlébarðr", "hlífar eldi", "bragða borg", "brenna vildi.", "Grettir fór með Þorfinni norður aftur og er með honum þar er hann kom honum í skip með kaupmönnum þeim að ætluðu til Íslands og gaf honum mörg góð þing í klæðum og söðul steindan og bitul með. Skildu þeir með vináttu. Bað Þorfinnur hann sín vitja ef hann kæmi aftur til Noregs."], "recap": ["Gunnar situr fyrir Gretti í bænum við hvert tækifæri sem gefst, Grettir alltaf var um sig.\nEinn dag situr grettir í tjaldbúð og drekkur, að reyna að fela sig fyrir Gunnari, Gunnar ræðst að honum ásamt þremur mönnum, svo fer að Grettir nær að drepa tvo manna Gunnars og svo hann sjálfan eftir að hafa hoggið af honum hendurnar við úlnliði.\nEinn manna Gunnars sleppur og kemst til Sveins jarls og segir honum tíðindin, jarl verður mjög reiður og kallar til fundar.\nÞorfinnur og Þorsteinn drómundur fjölmenna til fundarins ásamt Bersa og tala máli Grettis.\nÞorfinnur gengur fyrst fyrir jarl og býður honum sættir ef Grettir fái grið og jarl skuli einn ákveða hvernig málinu lýkur.\nJarl svarar reiður að Grettir hafi drepið þrjá hrausta og flotta bræður sem ekki vildu þiggja fébætur af Gretti og ekki sé hægt að horfa framhjá því, það gefi röng skilaboð að gefa honum grið fyrir slíkt.", "Bersi stígur næst fram fyrir hönd Grettis, segir að betra sér að gefa einum manni grið og fá þakklæti margra manna auk fésekta heldur en að vinna gegn virðingu sinni og fara í að elta Gretti uppi.\nJarl svarar að hann vilji ekki brjóta landslög með því að gefa grið þeim manni sem verðskuldar að vera drepinn.\nÞá stígur Þorsteinn drómundur fram, fer mörgum fögrum orðum um Gretti og biður um vægð.\nJarl spyr af hverju hann sé að tala máli Grettis og Þorsteinn svarar að þeir séu bræður, jarl segist ekki hafa vitað það og skilji nú af hverju hann sýnir Gretti stuðning.\nAð lokum segir jarl að ekki verði hægt að greiða fébætur fyrir þann skaða sem Grettir hefur valdið heldur muni hans menn ekki una sér hvíldar fyrr en þeir hafi drepið Gretti.", "Þorfinnur, Þorsteinn drómundur og Bersi safna liði ásamt Gretti og búast til að berjast við jarl og hans menn.\nJarl mætir með sína sveit og biður um að Grettir verði framseldur svo ekki verði vandræði.\nÞorfinnur, Þorsteinn og Bersi bjóða aftur sættir eins og á fundinum en jarl vill ekki heyra á það minnst og lítur út fyrir að þeir ætli að berjast. \nÞá ganga að jarli margir öflugir menn og biðja hann að endurskoða mál sitt því þeir verði annars fyrir miklu tjóni í bardaganum, jarl sefast og hættir við að berjast og fellst á sættir með fébótum.\nÞorfinnur hlýtur mikla frægð af því að hafa staðið svo þétt við bakið á Gretti gegn hinum öfluga jarli.\nGrettir fer aftur norður með Þorfinni og er hjá honum þar til hann kemst á skip til Íslands, þeir skilja með vináttu og kærleika og gefur Þorfinnur Gretti góðar gjafir að skilnaði; klæði, málaðan söðul og mél í beisli, Þorfinnur biður Gretti jafnframt að heimsækja sig komi hann aftur til Noregs. \nGrettir kemst heim aftur til Íslands en nú er þriggja ára útlegð hans líka lokið. Hann er orðinn að manni og orðinn frægur fyrir afrek sín í Noregi."]}, {"num": 25, "paras": ["Ásmundur hærulangur bjó á Bjargi meðan Grettir var utan og þótti hann þá gildur bóndi í Miðfirði. Þorkell krafla andaðist á þeim tímum er Grettir var eigi á Íslandi. Þorvaldur Ásgeirsson bjó þá í Ási í Vatnsdal og gerðist höfðingi mikill. Hann var faðir Döllu er átti Ísleifur er síðan var biskup í Skálholti. Var Ásmundi að Þorvaldi hinn mesti styrkur til málafulltings og margra hluta annarra.", "Með Ásmundi óx upp sá maður er Þorgils hét. Hann var kallaður Þorgils Máksson. Hann var náskyldur frændi Ásmundar. Þorgils var sterkur að afli og græddi mikið fé með umsjá Ásmundar. Keypti hann til handa Þorgilsi landið að Lækjamóti og bjó þar. Þorgils var aðdráttarmaður mikill og fór á Strandir hvert ár. Aflaði hann þar hvala og annarra fanga. Þorgils var fullhugi mikill. Hann fór allt á Almenninga hina eystri.", "Í þenna tíma var uppgangur þeirra fóstbræðra sem mestur, Þorgeirs Hávarssonar og Þormóðar Kolbrúnarskálds. Þeir áttu ferju og létu víða verða til drepið og þóttu ekki miklir jafnaðarmenn.", "Það bar til á einu sumri að Þorgils Máksson fann hval á Almenningum. Gekk hann þegar á skurð og hans félagar. En er þeir fóstbræður fréttu það fóru þeir þangað til og horfðist fyrst líklega á um umtal þeirra. Bauð Þorgils að þeir skyldu hafa að helmingi hvalinn þann er óskorinn var en þeir vildu hafa einir þann er óskorinn var ella skipta í helminga bæði skorinn og óskorinn. Þorgils þverneitti því að leggja þann af er skorinn var. Sló þá í heitan með þeim og því næst vopnuðust hvorirtveggju og börðust eftir það. Þorgeir og Þorgils sóttust lengi svo að engi skakkaði með þeim og var hvortveggi hinn ákafasti. Var þeirra viðskipti bæði hart og langt en sá varð endir á að Þorgils féll dauður fyrir Þorgeiri til jarðar. En Þormóður og aðrir fylgdarmenn Þorgils börðust við í öðrum stað. Sigraði Þormóður í þeirra viðskiptum. Féllu þrír félagar Þorgils fyrir honum.", "Eftir víg Þorgils sneru fylgdarmenn hans aftur inn til Miðfjarðar og fluttu lík Þorgils með sér. Þótti mönnum að honum hinn mesti skaði. Þeir fóstbræður tóku þar allan hvalinn til sín. Þeirra fundar getur Þormóður í erfidrápu þeirri er hann orti um Þorgeir.", "Ásmundur hærulangur frétti víg Þorgils frænda síns. Hann var aðili að eftirmálinu um víg Þorgils. Fór hann til og nefndi votta að benjum og stefndi málinu til alþingis því að þeim sýndist þá lög er málið hafði til borið í öðrum fjórðungi. Og liðu svo stundir fram."], "recap": ["Þorgeir Hávarsson og Þormóður Kolbrúnarskáld, tveir frægir fóstbræður og skáld, koma stuttlega við sögu — bornir saman við Gretti sem líka er bæði kappi og hagorður."]}, {"num": 26, "paras": ["Maður er nefndur Þorsteinn. Hann var sonur Þorkels kugga, Þórðarsonar gellis, Ólafssonar feilans, Þorsteinssonar rauðs, Auðarsonar djúpauðgu. Móðir Þorsteins Kuggasonar var Þuríður dóttir Ásgeirs æðikolls. Ásgeir var föðurbróðir Ásmundar hærulangs.", "Þorsteinn Kuggason átti eftirmál um vígið Þorgils Mákssonar jafnfram Ásmundi hærulangi. Gerði hann nú orðsending til Þorsteins að hann kæmi til móts við hann. Þorsteinn var kappi mikill og ofstopamaður hinn mesti. Fór hann þegar til móts við Ásmund frænda sinn og töluðu þeir um vígsmálið. Var Þorsteinn hinn ákafasti, kvað hér eigi skyldu fébætur fyrir koma, sagði að þeir hefðu nógan frænda afla til þess að annaðhvort kæmi fyrir vígið sekt eða mannhefndir. Ásmundur kvaðst honum mundu að fund fylgja hverju sem hann vildi fram fara. Riðu þeir norður til Þorvalds frænda síns, og beiddi hann liðveislu en hann játaði honum því skjótt. Bjuggu þeir málið til á hendur Þorgeiri og Þormóði. Þorsteinn reið heim til bús síns. Hann bjó þá í Ljárskógum í Hvammssveit.", "Skeggi bjó í Hvammi. Hann réðst í málið með Þorsteini. Skeggi var sonur Þórarins fylsennis, Þórðarsonar gellis. Móðir Skeggja var Friðgerður dóttir Þórðar frá Höfða.", "Þeir fjölmenntu mjög til alþingis og héldu málum fram með miklu kappi. Riðu þeir Ásmundur og Þorvaldur norðan til með sex tigu manna og sátu í Ljárskógum margar nætur."], "recap": ["Deilt er um rekinn hval og víg Þorgils Mákssonar, skjólstæðings Ásmundar á Bjargi. Ásmundur fer með eftirmálið og eykst við það virðing hans og tengsl við valdamenn eins og Skafta lögmann."]}, {"num": 27, "paras": ["Þorgils bjó þá á Reykjahólum. Hann var son Ara Mássonar, Atlasonar hins rauða, Úlfssonar hins skjálga er nam Reykjanes. Móðir Þorgils Arasonar var Þorgerður dóttir Álfs úr Dölum. Önnur dóttir Álfs var Þórelfur, móðir Þorgeirs Hávarssonar. Átti Þorgeir þar traust mikið fyrir frændsemis sakir því að Þorgils var mestur höfðingi í Vestfirðingafjórðungi. Hann var svo mikill þegnskaparmaður að hann gaf hverjum frjálsum manni mat svo lengi sem þiggja vildi. Varð af þessu jafnan fjölmennt á Reykjahólum. Hafði Þorgils rausn mikla af búnaði sínum. Hann var góðgjarn maður og forvitri. Þorgeir var með Þorgilsi á vetrum en fór á Strandir á sumrum.", "Eftir víg Þorgils Mákssonar fór Þorgeir á Reykjahóla og sagði Þorgils þessi tíðindi.", "Þorgils sagði honum þar vist til reiðu hjá sér \"en það hygg eg,\" sagði hann, \"að þeir verði þungir í eftirmálinu en eg er ófús að auka vandræðum. Nú mun eg senda mann til Þorsteins og bjóða fébætur fyrir víg Þorgils en ef hann vill eigi sættum taka þá mun eg þetta mál ekki með kappi verja.\"", "Þorgeir kvaðst hans forsjá hlíta mundu.", "Um haustið sendi Þorgils mann til Þorsteins Kuggasonar að leita um sættir en hann var þver í því að taka fé fyrir vígsmálið við Þorgils en um önnur víg kvaðst hann gera mundu eftir skynsamra manna tillögum. Og er Þorgils frétti þetta kallar hann Þorgeir á tal við sig og spyr hver liðveisla honum þætti sér þá hallkvæmust. Þorgeir kvaðst helst utan fara ef hann yrði sekur. Þorgils sagði að þessa mundi freistað verða.", "Skip stóð uppi í Norðurá í Borgarfirði. Í því skipi keypti Þorgils á laun far til handa þeim fóstbræðrum. Leið svo af veturinn.", "Þorgils frétti að þeir Þorsteinn fjölmenntu mjög til alþingis og sátu í Ljárskógum. Því frestaði hann heiman að ríða að hann vildi að þeir Þorsteinn væru undan suður riðnir þá er hann kæmi vestan og svo varð. Reið Þorgils suður og þeir fóstbræður með honum. Í þessi ferð drap Þorgeir Böggul-Torfa að Márskeldu. Þá drap hann þá Skúf og Bjarna í Hundadal.", "Svo segir Þormóður í Þorgeirsdrápu:", "Kapp lét höldr með heppni,", "hríð gerðist þá sverða,", "hrátt gat hrafn að slíta", "hold, Máks syni goldið.", "Enn var vogs að vígi", "viggríðandi síðan,", "kænn bar greipr að gunni", "gjarna, Skúfs og Bjarna.", "Þorgils sættist þar þegar á vígin Skúfs og Bjarna þar í dalinum og dvaldist honum lengur en hann hafði áður ætlað. Fór Þorgeir til skips en Þorgils til þings og kom eigi fyrr en gengið var til dóma.", "Þá bauð Ásmundur hærulangur til varna um vígsmálið Þorgils Mákssonar. Þorgils gekk að dóminum og bauð fébætur fyrir vígið ef Þorgeir yrði þá sýkn. Hann leitaði til varna í málinu hvort þeir ættu eigi allan veiðiskap frjálsan á almenningum. Var þá lögmaður að spurður hvort þetta væri lögvörn. Skafti var þá lögmaður og fylgdi hann Ásmundi fyrir frændsemis sakir. Sagði hann að það væru lög ef þeir væru jafnir menn en sagði að fyrr ættu að taka bændur en einhleypingar. Ásmundur sagði að Þorgils hefði boðið þeim fóstbræðrum jafnaðarskipti á þeim hvalnum hinum óskorna þá er þeir komu til, og var þá lokið þeirri vörn. Gengu þeir Þorsteinn og frændur hans þá að með kappi og létu sér ekki annað líka en Þorgeir væri sekur ger. Sá Þorgils að þá varð annaðhvort að gera að ganga að með fjölmenni, en þó óvíst hvað í aflaðist, eða láta þá fara fram sem þeim líkaði. Og við það að Þorgeiri var í skip komið leiddi Þorgils hjá sér málið. Var Þorgeir sekur ger en fyrir Þormóð voru teknar fébætur og skyldi hann sýkn vera.", "Þeir Ásmundur og Þorsteinn þóttu mikið vaxa af þessu eftirmáli. Riðu menn þá heim af þinginu. Töluðu sumir menn að Þorgils hefði lítt fylgt málinu en hann gaf sér fátt að því og lét hvern tala hér um slíkt er vildi.", "En er Þorgeir frétti sekt sína sagði hann svo: \"Það mundi eg vilja að þeir er mig hafa sekan gert hefðu þessa full gjöld áður lýkur ef eg mætti ráða.\"", "Gautur hét maður og var kallaður Sleituson. Hann var frændi Þorgils Mákssonar. Gautur var ráðinn í skip þetta er Þorgeir skyldi sigla í. Hann ýfðist við Þorgeir og lét ófrýnlega. En er kaupmenn fundu það þótti þeim ekki einsætt að þeir færu í einu skipi. Þorgeir sagðist eigi hirða hversu Gautur léti síga brýnnar en þó var það til ráðs tekið að Gautur réðst úr skipinu og fór norður til sveita. Varð eigi að með þeim Þorgeiri að því sinni en þó reis af þessu sundurþykki með þeim sem síðar bar raun á."], "recap": ["Áfram er sagt frá frægð og vinsældum Ásmundar á Bjargi eftir að hann rekur eftirmálið farsællega — undirbúningur fyrir að sýna hve gott orð fer af fjölskyldunni áður en sjónum er aftur beint að Gretti."]}, {"num": 28, "paras": ["Grettir Ásmundarson kom þetta sumar út í Skagafirði. Hann var þá svo frægur maður fyrir sakir afls og hreysti að engi þótti þá slíkur af ungum mönnum. Hann reið brátt heim til Bjargs og tók Ásmundur þá við honum sæmilega. Atli hafði þá búsforráð. Féll vel á með þeim bræðrum. Þá gerðist ofsi Grettis svo mikill að honum þótti sér ekki ófært.", "Þá gerðust þeir margir fullhraustir menn er þá voru ungir er Grettir var að leikum á Miðfjarðarvatni með þeim áður en hann fór utan. Einn af þeim var Auðunn er þá bjó á Auðunarstöðum í Víðidal. Hann var Ásgeirsson, Auðunarsonar, Ásgeirssonar æðikolls. Auðunn var góður bóndi og gegn maður. Allra manna var hann sterkastur norður þar. Hann þótti hinn gæfasti í byggðarlagi.", "Grettir kom nú það í hug að hann þóttist hafa orðið varhluta fyrir Auðuni að knattleiknum sem áður er sagt og vildi hann prófa hvor þeirra meira hefði við gengist síðan. Af því gerir Grettir heiman ferð sína á Auðunarstaði. Það var um öndverðan sláttutíma. Grettir barst á mikið og reið í steindum söðli mjög vönduðum er Þorfinnur gaf honum. Hann hafði góðan hest og vopn öll hin bestu.", "Grettir kom snemma dags á Auðunarstaði og drap á dyr. Fátt var manna heima. Grettir spurði hvort Auðunn væri heima. Menn sögðu að hann væri farinn til sels eftir mat. Grettir hleypti beisli af hesti sínum. Túnið var óslegið og gekk hesturinn þangað sem loðnast var. Grettir gekk til skála og settist niður á setstokkinn og síðan sofnaði hann.", "Litlu síðar kom Auðunn heim. Hann sá að hestur var í túninu með steindum söðli. Auðunn bar mat á tveimur hestum og bar skyr á hesti og var það í húðum og var bundið um fyrir ofan. Það kölluðu menn skyrkylla. Auðunn tók af hestum og ber inn skyr í fangi sér. Honum var myrkt fyrir augum. Grettir rétti fótinn fram af stokkinum og féll Auðunn áfram og varð undir honum skyrkyllirinn og gekk af yfirbandið. Auðunn spratt upp og spurði hvað skelmi þar væri. Grettir nefndi sig.", "Auðunn mælti: \"Þanninn var óspaklega farið eða hvert er erindið þitt?\"", "\"Eg vil berjast við þig,\" segir Grettir.", "\"Sjá mun eg fyrst ráð fyrir mat mínum,\" sagði Auðunn.", "\"Vel má það,\" segir Grettir, \"ef þú mátt eigi öðrum mönnum að því hlíta.\"", "Auðunn laut þá niður og þreif upp skyrkyllinn og sletti framan í fang Gretti og bað hann fyrst taka við því er honum var sent. Grettir varð allur skyrugur. Þótti honum það meiri smán en þó Auðunn hefði veitt honum mikinn áverka. Síðan réðust þeir á og glímdu heldur sterklega. Sækir Grettir með ákefð en Auðunn fer undan. Finnur hann þá að Grettir hefir dregið undan honum. Gengur upp allt það er fyrir þeim verður og rekast þeir víða um skálann. Sparði hvorgi af en þó verður Grettir drjúgari og fellur Auðunn að lyktum. Hann hafði slitið öll vopnin af Gretti. Knýjast þeir fast og verður brak mikið um þá og þá kemur dynur mikill undir bæinn og heyrir Grettir að riðið var að húsunum og af baki stigið og inn gengið snúðigt. Sér hann að maður gengur inn þriflegur í rauðum kyrtli og hafði hjálm á höfði. Sjá sneri til skálans því að hann heyrði umfang mikið er þeir áttust við. Hann spurði hvað í skálanum væri.", "Grettir nefndi sig \"eða hver spyr að?\"", "\"Barði heiti eg,\" segir sá er kominn var.", "\"Ertu Barði Guðmundarson úr Ásbjarnarnesi?\"", "\"Sá er maður hinn sami,\" segir Barði. \"Eða hvað hefstu að?\" sagði hann.", "Grettir svarar: \"Við Auðunn eigum hér gamanleika.\"", "\"Ekki veit eg um gaman það,\" segir Barði. \"Er og ekki jafnkomið á með ykkur. Þú ert ójafnaðarmaður og ofurkappsfullur en hann er gæfur og góðfengur og láttu hann upp standa skjótt.\"", "Grettir svarar: \"Margur seilist um hurð til lokunnar. Þætti mér þér nær að hefna Halls bróður þíns en að hlutast til með okkur Auðuni hvað við eigumst við.\"", "\"Jafnan heyri eg það,\" segir Barði, \"en eigi veit eg hvort þess verður nokkuð hefnt. En þó vil eg að þú látir Auðun vera í náðum því hann er spakur maður.\"", "Grettir gerði svo fyrir tillögur Barða og líkaði þó illa. Barði spurði hvað til saka væri með þeim.", "Grettir kvað vísu:", "Eigi veit eg nema utan", "Jalfaðr að þér sjalfum", "kverkr fyr kapp og orku,", "kvelling er það, svelli.", "Svo bannaði sinnir", "seim-Gauts, þá eg var heima,", "ungum endr fyr löngu", "ákall þinul fjalla.", "Barði kvað það víst vorkunn ef hann ætti sín víst í að hefna.", "\"Mun eg nú gera með ykkur,\" sagði Barði. \"Vil eg að þið skiljið að svo gervu og sé nú slitið með ykkur.\"", "Og það létu þeir haldast því þeir voru skyldir og líkaði Gretti heldur illa við Barða og bræður hans, riðu á burt allir saman.", "Og er þeir voru í veg komnir þá mælti Grettir: \"Það hefi eg spurt að þú ætlar suður til Borgarfjarðar í sumar. Nú vil eg bjóða þér Barði að fara suður með þér og þykist eg þá gera við þig verðleikum betur.\"", "Barði varð glaður við þetta og játaði skjótt þessu og bað hann hafa þökk fyrir. Síðan skildu þeir.", "Þá veik Barði aftur og mælti: \"Það vil eg til skilja,\" segir hann, \"að þú farir ei nema Þórarinn leyfi því hann skal ráða ferðinni.\"", "\"Vel þætti mér þú mega einhlítur vera að ráðum þínum. Á eg ekki,\" sagði Grettir, \"ferðir mínar undir öðrum mönnum en illa mun mér þykja ef þú gerir mig liðrækan.\"", "Nú fara sína leið hvorir og kvaðst Barði skyldu gera Gretti vissu \"ef Þórarinn vill að þú farir\" en ella skyldi hann sitja um kyrrt.", "Grettir reið heim til Bjargs en Barði til bús síns."], "recap": ["Grettir kemur út í Skagafirði eftir Noregsdvölina, 18 ára. Hann glímir við Auðun (sættast eftir fyrri deilu) og kynnist Barða Guðmundssyni."]}, {"num": 29, "paras": ["Um sumarið var lagið hestaþing fjölmennt á Langafit ofan frá Reykjum. Kom þar margt manna. Atli að Bjargi átti hest góðan, móálóttan, af Kengálu kyni. Höfðu þeir feðgar mætur miklar á hestinum. Þeir bræður Kormákur og Þorgils á Mel áttu brúnan öruggan hest til vígs. Þeir skyldu etja saman og Atli frá Bjargi. Margir voru þar aðrir góðir hestar.", "Oddur ómagaskáld frændi Kormáks skyldi fylgja hesti þeirra frænda sinna um daginn. Oddur gerðist sterkur maður og lét um sig mikið, ódæll og ófyrirleitinn. Grettir spurði Atla bróður sinn hver fylgja skyldi hans hesti.", "\"Eigi er mér það svo glöggt,\" sagði hann.", "\"Viltu að eg standi hjá?\" sagði Grettir.", "\"Vertu vel stilltur þá frændi,\" sagði Atli, \"því að hér er við metnaðarmenn um að eiga.\"", "\"Gjaldi þeir sjálfir ofstopa síns,\" sagði Grettir, \"ef þeir hafa hann eigi í hófi.\"", "Nú eru hestarnir fram leiddir en hrossin stóðu framarlega á árbakkanum og voru bundin saman. Hylur mikill var fyrir framan bakkann. Hestarnir bitust allvel og var það hin mesta skemmtan. Oddur fylgdi með kappi en Grettir lét hefjast við og tók í taglið annarri hendi en hélt með annarri stafnum er hann keyrði með hestinn. Oddur stóð framarlega hjá sínum hesti og eigi traust að hann styngi eigi hest Atla af takinu. Eigi lét Grettir sem hann sæi það. Bárust hestarnir fram að ánni. Þá stingur Oddur stafinum til Grettis og kom á herðarblaðið því að Grettir horfði öxlinni að honum. Það var mikið tilræði svo að undan hljóp holdið en lítt skeindist Grettir. Í því bili risu hestarnir hátt upp. Grettir hljóp undir hömina á hesti sínum en rak stafinn á síðu Oddi svo hart að þrjú rifin brotnuðu í honum en Oddur hraut út á hylinn og svo hestur hans og hrossin öll þau er bundin voru. Var þá lagist til hans og dreginn af ánni.", "Þá var óp mikið gert að þessu. Þeir Kormákur hlupu til vopna en Bjargsmenn í öðrum stað. En er það sáu Hrútfirðingar og Vatnsnesmenn gengu þeir í milli og urðu þeir þá skildir og fóru heim og höfðu hvorir ill heit við aðra og sátu þó um kyrrt um hríð. Atli var fátalaður um þetta en Grettir var heldur ósvífur og kvað þá finnast skyldu annan tíma ef hann mætti ráða."], "recap": ["Hestaþing er haldið á Langafit — vinsæl skemmtun þar sem hestar eru att saman og oft úr verða illindi milli manna."]}, {"num": 30, "paras": ["Þorbjörn hét maður er bjó á Þóroddsstöðum í Hrútafirði. Hann var son Arnórs heynefs Þóroddssonar er numið hafði Hrútafjörð þeim megin til móts við Bakka. Þorbjörn var allra manna sterkastur. Hann var kallaður öxnamegin. Þóroddur hét bróðir hans. Hann var kallaður drápustúfur. Móðir þeirra var Gerður dóttir Böðvars úr Böðvarshólum.", "Þorbjörn var garpur mikill og hafði mannmargt með sér. Hann var til þess tekinn að honum var verra til hjóna en öðrum mönnum og galt nær öngum manni kaup. Ekki þótti hann dæll maður.", "Þorbjörn hét frændi hans og var kallaður ferðalangur. Hann var siglingamaður og áttu þeir nafnar félag saman. Var hann á Þóroddsstöðum jafnan og þótti hann lítið bæta um fyrir Þorbirni. Hann var tilfyndinn og fór með dáruskap til ýmsra manna.", "Þórir hét maður, son Þorkels á Borðeyri. Þórir bjó fyrst á Melum í Hrútafirði. Hans dóttir var Helga er Sleitu-Helgi fékk. En eftir vígið á Fagrabrekku réðst Þórir suður í Haukadal og bjó á Skarði en seldi landið á Melum Þórhalli Gamlasyni Vínlendingi. Hans son var Gamli er átti Rannveigu dóttur Ásmundar hærulangs, systur Grettis. Þau bjuggu í þenna tíma á Melum og áttu gott ráð.", "Þórir á Skarði átti tvo sonu. Hét annar Gunnar en annar Þorgeir. Þeir voru efnilegir menn og höfðu þeir þá tekið við búi eftir föður sinn en þó voru þeir jafnan með Þorbirni öxnamegin. Þeir gerðust offorsfullir.", "Þetta sumar sem nú var frá sagt riðu þeir Kormákur og Þorgils og Narfi frændi þeirra suður til Norðurárdals að erindum sínum. Oddur ómagaskáld var og í ferð með þeim. Var þá batnað stirðleikans er hann hafði fengið á hestaþinginu. Og meðan þeir voru fyrir sunnan heiðina fór Grettir heiman frá Bjargi og með honum tveir húskarlar Atla. Þeir riðu yfir til Búrfells og þaðan yfir hálsinn til Hrútafjarðar og komu til Mela um kveldið. Þrjár nætur voru þeir þar. Þau Rannveig og Gamli tóku allvel við Gretti og buðu honum með sér að vera en hann vildi heim ríða. Þá frétti Grettir að þeir Kormákur voru sunnan komnir og höfðu gist í Tungu um nóttina.", "Grettir bjóst snemma frá Melum. Gamli bauð honum menn til fylgdar. Grímur hét bróðir Gamla. Hann var allra manna hvatastur. Hann reið með Gretti við annan mann. Þeir voru fimm saman, riðu uns þar til er þeir komu á Hrútafjarðarháls vestur frá Búrfelli. Þar stendur steinn mikill er kallaður er Grettishaf. Hann fékkst við lengi um daginn að hefja steininn og dvaldi svo þar til er þeir Kormákur komu. Grettir sneri til móts við þá og hlupu af baki hvorirtveggju. Grettir sagði að frjálsmannlegra væri nú að höggva sem stærst heldur en berjast með stöfum sem förumenn. Kormákur bað þá verða við mannlega og duga sem best.", "Eftir það hlupust þeir að og börðust. Grettir var fremstur af sínum mönnum og bað þá geyma að eigi væri gengið að baki honum. Sóttust þeir um hríð og urðu hvorirtveggja sárir.", "Þorbjörn öxnamegin hafði riðið þenna dag yfir háls til Búrfells og er þeir riðu aftur sér hann fundinn. Þar var þá með honum Þorbjörn ferðalangur og Gunnar og Þorgeir Þórissynir og Þóroddur drápustúfur. Og er þeir komu að heitir Þorbjörn á sína menn til meðalgöngu. Hinir voru svo ákafir að þeir gátu ekki að gert. Grettir ruddist um fast. Þeir voru fyrir honum Þórissynir og féllu báðir senn er hann hratt þeim frá sér. Þeir urðu óðir mjög við það svo að Gunnar hjó húskarl Atla banahögg. Og er Þorbjörn sá það biður hann þá skilja. Kvaðst hann skyldu þeim lið veita er hans orð vildu rækja. Þá voru farnir tveir húskarlar Kormáks. Þá sá Grettir að varla mundi duga ef Þorbjörn réðist í lið með þeim og því lætur hann verða upp gefinn bardagann. Allir voru þeir sárir sem á fundinum höfðu verið. Illa þótti Gretti er þeir voru skildir. Eftir það riðu þeir heim hvorirtveggju. Ekki sættust þeir á mál þessi.", "Þorbjörn ferðalangur gerði að þessu mikið kalls. Þá tók að versna með þeim Bjargsmönnum og Þorbirni öxnamegin svo af því gerðist fullur fjandskapur sem síðar kom fram. Öngvar bætur voru Atla boðnar fyrir húskarl sinn. Eigi lét hann sem hann vissi það. Grettir sat á Bjargi fram til tvímánaðar. Ekki er sagt að þeir fyndust Kormákur síðan svo þess sé getið."], "recap": ["Bardagi verður við Grettishaf: Grettir slæst við Kormák, Þorgils og Odd ómagaskáld en Þorbjörn öxnamegin stöðvar átökin áður en yfir lýkur."]}, {"num": 31, "paras": ["Barði Guðmundarson og bræður hans riðu heim í Ásbjarnarnes þá er þeir skildust Grettir. Þeir voru synir Guðmundar Sölmundarsonar. Móðir Sölmundar var Þorlaug dóttir Sæmundar hins suðureyska, fóstbróður Ingimundar hins gamla. Barði var göfugmenni mikið. Hann reið nú brátt að finna Þórarin hinn spaka fóstra sinn. Hann fagnaði Barða vel og spurði hvað hann hefði þá um árnað liðveisluna því að þeir höfðu áður gert ráð um ferð Barða. Barði svarar að hann hefði fengið þann mann til fylgdar við sig er honum þætti betra hans lið en tveggja annarra.", "Þórarinn þagnaði við og mælti: \"Það mun vera Grettir Ásmundarson.\"", "\"Spá er spaks geta,\" sagði Barði, \"sá er maður hinn sami fóstri minn.\"", "Þórarinn svarar: \"Satt er það að mikið afbragð er Grettir annarra manna, þeirra er nú er kostur á voru landi, og seint mun hann sóttur vopnum verða ef hann er heill. En grunar mig um hversu heilladrjúgur hann verður og muntu þess þurfa að eigi séu allir ógæfumenn í þinni ferð og nóg mun að gert þó eigi fari hann með. Skal hann hvergi fara ef eg ræð.\"", "\"Eigi varði mig þess fóstri minn,\" segir hann, \"að þú mundir fyrirmuna mér hins vaskasta manns hvað sem í gerist. Má ekki fyrir öllu sjá þá er menn verða svo neyddir til sem eg þykist vera.\"", "\"Duga mun þér,\" segir Þórarinn, \"þó að eg sjái fyrir.\"", "Varð nú svo að vera sem Þórarinn vildi að Gretti voru engi orð send en Barði fór suður til Borgarfjarðar og urðu þá Heiðarvígin.", "Grettir var að Bjargi er hann frétti að Barði var suður riðinn. Hann brást við reiður er honum voru engin orð ger og kvað þá eigi svo búið skilja skyldu. Hafði hann þá spurn af nær þeirra væri sunnan von og reið hann þá ofan til Þóreyjargnúps og ætlaði að sitja þar fyrir þeim Barða þá þeir riðu sunnan. Hann fór frá bænum í hlíðina og beið þar.", "Þenna sama dag riðu þeir Barði sunnan af Tvídægru frá Heiðarvígum. Þeir voru sex saman og allir sárir mjög.", "Og er þeir komu fram fyrir bæinn þá mælti Barði: \"Maður er þar uppi í hlíðinni, mikill, með vopnum eða hvern kennið þér þar?\"", "Þeir sögðust eigi vita hver var.", "Barði mælti: \"Það hygg eg,\" sagði hann, \"að þar sé Grettir Ásmundarson og ef svo er þá mun hann vilja oss finna. Get eg honum hafa mislíkað er hann hefir ekki farið með oss en mér þykir vér nú ekki vel við látnir ef hann gerir nokkura óvissu af sér. Mun eg nú senda eftir mönnum heim til Þóreyjargnúps og eiga ekki undir ójafnaði hans.\"", "Þeir segja það allráðlegt og svo gerðu þeir. Síðan riðu þeir Barði veg sinn. Grettir sá ferð þeirra og sneri þegar fyrir þá og er þeir fundust heilsa hvorir öðrum. Grettir spurði að tíðindum en Barði segir ófelmtlega slík sem voru. Grettir spurði hvað manna væri í ferð með honum. Barði kvað þar vera bræður sína og Eyjólf mág sinn.", "\"Af þér hefir þú rekið ámælið nú,\" sagði Grettir, \"enda er nú og næst að við reynum með okkur hvor hér má meira.\"", "Barði mælti: \"Legið hafa mér andvirki nær garði en að berjast við þig fyrir sakleysi og þykist eg nú hafa rekið það af mér.\"", "Grettir svarar: \"Bleyðast þykir mér þú Barði,\" sagði Grettir, \"ef þú þorir eigi að berjast við mig.\"", "\"Kalla þú það sem vilt,\" segir Barði, \"en í öðrum stað vildi eg að þú kæmir fram ójafnaði þínum en við mig. Er það eigi ólíklegt því að nú gengur úr hófi offors þitt.\"", "Gretti þóttu illar spár hans og efar nú fyrir sér hvort hann skyldi ráða til einhvers þeirra og sýnist honum það óforsjálegt er þeir voru sex en hann einn. Og í því bili komu menn heiman frá Þóreyjargnúpi til liðs við þá Barða. Lætur Grettir þá dragast sundur með þeim og snýr til hests síns en Barði og hans félagar fóru leiðar sinnar og varð ekki af kveðjum með þeim að skilnaði. Ekki áttust þeir Barði og Grettir fleira við svo þess sé getið.", "Svo hefir Grettir sagt að hann þóttist öruggur til vígs við flesta menn þó að þrír væru saman en hann mundi eigi flýja fyrir fjórum að óreyndu en því að eins berjast við fleiri nema ætti hann hendur sínar að verja sem segir í þessari vísu:", "Treysti eg mér við, Mistar", "mótkennandi, þrenna,", "hvað er í Hildar veðri", "heiftminnigt skal vinna.", "Vil eg eigi fleiri en fjórum", "fársætöndum mæta", "að gnýfengnum Gungnis", "gráð ef eg skal ráða.", "Eftir skilnað þeirra Barða fór Grettir aftur til Bjargs. Þá þótti Gretti mikið mein er hann mátti hvergi prófa afl sitt og fréttist fyrir ef nokkuð væri það er hann mætti við fást."], "recap": ["Grettir situr um kyrrt fram á haust. Heiðarvíg ber á góma og Grettir hittir Barða við Þóreyjarnúp en fær ekki að fylgja honum til bardaga."]}, {"num": 32, "paras": ["Þórhallur hét maður er bjó á Þórhallsstöðum í Forsæludal. Forsæludalur er upp af Vatnsdal. Þórhallur var Grímsson, Þórhallarsonar, Friðmundarsonar er nam Forsæludal. Þórhallur átti þá konu er Guðrún hét. Grímur hét son þeirra en Þuríður dóttir er þá var vel á legg komin. Þórhallur var vel auðigur maður og mest að kvikfé svo að engi maður átti jafnmargt ganganda fé sem hann. Ekki var hann höfðingi en þó skilríkur bóndi.", "Þar var reimt mjög og fékk hann varla sauðamenn svo að honum þætti duga. Hann leitaði ráðs við marga vitra menn hvað hann skyldi til bragðs taka en engi gat það ráð til gefið er dygði.", "Þórhallur reið til þings hvert sumar. Hann átti hesta góða. Það var eitt sumar á alþingi að Þórhallur gekk til búðar Skafta lögmanns Þóroddssonar. Skafti var manna vitrastur og heilráður ef hann var beiddur. Það skildi með þeim feðgum. Þóroddur var forspár og kallaður undirhyggjumaður af sumum mönnum en Skafti lagði það til með hverjum manni sem hann ætlaði að duga skyldi ef eigi væri af því brugðið. Því var hann kallaður beturfeðrungur.", "Þórhallur gekk í búð Skafta. Hann fagnaði vel Þórhalli því að hann vissi að hann var ríkur maður að fé og spurði hvað að tíðindum væri.", "Þórhallur mælti: \"Heilræði vildi eg af yður þiggja.\"", "\"Í litlum færum er eg til þess,\" sagði Skafti, \"eða hvað stendur þig?\"", "Þórhallur mælti: \"Það er svo háttað að mér helst lítt á sauðamönnum. Verður þeim heldur klaksárt en sumir gera öngvar lyktir á. Vill nú engi til taka sá er kunnigt er til hvað fyrir býr.\"", "Skafti svarar: \"Þar mun liggja meinvættur nokkur er menn eru tregari til að geyma síður þíns fjár en annarra manna. Nú fyrir því að þú hefir að mér ráð sótt þá skal eg fá þér sauðamann þann er Glámur heitir, ættaður úr Svíþjóð úr Sylgsdölum, er út kom í fyrra sumar, mikill er og sterkur og ekki mjög við alþýðuskap.\"", "Þórhallur kvaðst ekki um það gefa ef hann geymdi vel fjárins.", "Skafti sagði öðrum eigi vænt horfa ef hann geymdi eigi fyrir afls sakir og áræðis. Þórhalli gekk þá út. Þetta var að þinglausnum.", "Þórhalli var vant hesta tveggja ljósbleikra og fór sjálfur að leita. Af því þykjast menn vita að hann var ekki mikilmenni. Hann gekk upp undir Sleðás og suður með fjalli því er Ármannsfell heitir.", "Þá sá hann hvar maður fór ofan úr Goðaskógi og bar hrís á hesti. Brátt bar saman fund þeirra. Þórhallur spurði hann að nafni en hann kveðst Glámur heita. Þessi maður var mikill vexti og undarlegur í yfirbragði, bláeygður og opineygður, úlfgrár á hárslit. Þórhalli brá nokkuð í brún er hann sá þenna mann en þó spurði hann og skildi hann að honum mundi til þessa vísað.", "\"Hvað er þér best hent að vinna?\" segir Þórhallur.", "Glámur kvað sér vel hent að geyma sauðfjár á vetrum.", "\"Viltu geyma sauðfjár míns?\" segir Þórhallur. \"Gaf Skafti þig á mitt vald.\"", "\"Svo mun þér hentust mín vist að eg fari sjálfráður því eg er skapstyggur ef mér líkar eigi vel,\" segir Glámur.", "\"Ekki mun mér mein að því,\" segir Þórhallur, \"og vil eg að þú farir til mín.\"", "\"Gera má eg það,\" segir Glámur, \"eða eru þar nokkur vandhæfi á?\"", "\"Reimt þykir þar vera,\" segir Þórhallur.", "\"Ekki hræðist eg flykur þær,\" sagði Glámur, \"og þykir mér að ódauflega.\"", "\"Þess muntu við þurfa,\" segir Þórhallur, \"og hentar þar betur að vera eigi alllítill fyrir sér.\"", "Eftir það kaupa þeir saman og skal Glámur koma að veturnóttum. Síðan skildu þeir og fann Þórhallur hesta sína. Þar hafði hann nýleitað. Reið Þórhallur heim og þakkaði Skafta velgerning.", "Sumar leið af og frétti Þó
