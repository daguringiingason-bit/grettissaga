rhallur ekki til sauðamanns og engi kunni skyn á honum en að ánefndum tíma kom hann á Þórhallsstaði. Tekur bóndi við honum vel en öllum öðrum gast ekki að honum en húsfreyju þó minnst. Hann tók við fjárvarðveislu og varð honum lítið fyrir því. Hann var hljóðmikill og dimmraddaður og fé stökk allt saman þegar hann hóaði. Kirkja var á Þórhallsstöðum. Ekki vildi Glámur til hennar koma. Hann var ósöngvinn og trúlaus, stirfinn og viðskotaillur. Öllum var hann hvimleiður.", "Nú leið svo þar til er kemur aðfangadagur jóla. Þá stóð Glámur snemma upp og kallaði til matar síns.", "Húsfreyja svaraði: \"Ekki er það háttur kristinna manna að matast þenna dag því að á morgun er jóladagur hinn fyrsti,\" segir hún, \"og er því fyrst skylt að fasta í dag.\"", "Hann svarar: \"Marga hindurvitni hafið þér þá er eg sé til einskis koma. Veit eg eigi að mönnum fari nú betur að heldur en þá er menn fóru ekki með slíkt. Þótti mér þá betri siður er menn voru heiðnir kallaðir og vil eg mat minn en öngvar refjar.\"", "Húsfreyja mælti: \"Víst veit eg að þér mun illa farast í dag ef þú tekur þetta illbrigði til.\"", "Glámur bað hana taka mat í stað, kvað henni annað skyldu vera verra. Hún þorði eigi annað en að gera sem hann vildi. Og er hann var mettur gekk hann út og var heldur gustillur. Veðrið var svo farið að myrkt var um að litast og flögraði úr drífa og gnýmikið og versnaði mikið sem á leið daginn. Heyrðu menn til sauðamanns öndverðan daginn en miður er á leið daginn. Tók þá að fjúka og gerði á hríð um kveldið. Komu menn til tíða og leið svo fram að dagsetri. Ei kom Glámur heim. Var þá um talað hvort hans skyldi eigi leita en fyrir því að hríð var á og niðamyrkur þá varð ekki af leitinni. Kom hann ekki heim jólanóttina. Biðu menn svo fram um tíðir.", "Að ærnum degi fóru menn í leitina og fundu féið víða í fönnum, lamið af ofviðri eða hlaupið á fjöll upp. Því næst komu þeir á traðk mikinn ofarlega í dalnum. Þótti þeim því líkt sem þar hefði glímt verið heldur sterklega því að grjótið var víða upp leyst og svo jörðin. Þeir hugðu að vandlega og sáu hvar Glámur lá skammt á burt frá þeim. Hann var dauður og blár sem hel en digur sem naut. Þeim bauð af honum óþekkt mikla og hraus þeim mjög hugur við honum. En þó leituðu þeir við að færa hann til kirkju og gátu ekki komið honum nema á einn gilsþröm þar skammt ofan frá sér og fóru heim við svo búið og sögðu bónda þenna atburð.", "Hann spurði hvað Glámi mundi hafa að bana orðið. Þeir kváðust rakið hafa spor svo stór sem keraldsbotni væri niður skellt þaðan frá sem traðkurinn var og upp undir björg þau er þar voru ofarlega í dalnum og fylgdu þar með blóðdrefjar miklar. Það drógu menn saman að sú meinvættur er áður hafði þar verið mundi hafa deytt Glám en hann mundi fengið hafa henni mikinn áverka þann er tekið hafi til fulls því að við þá meinvætti hefir aldrei vart orðið síðan.", "Annan dag jóla var farið að leita við enn að færa Glám til kirkju. Voru eykir fyrir beittir og gátu þeir hvergi fært hann þegar sléttlendið var og eigi var forbrekkis að fara. Gengu nú frá við svo búið. Hinn þriðja dag fór prestur með þeim og leituðu allan daginn og Glámur fannst ekki. Ekki vildi prestur oftar til fara en sauðamaður fannst þegar prestur var eigi í ferð. Létu þeir þá fyrir vinnast að færa hann til kirkju og dysjuðu hann þar sem þá var hann kominn.", "Litlu síðar urðu menn varir við það að Glámur lá eigi kyrr. Varð mönnum að því mikið mein svo að margir féllu í óvit ef sáu hann en sumir héldu eigi vitinu. Þegar eftir jólin þóttust menn sjá hann heima þar á bænum. Urðu menn ákaflega hræddir. Stukku þá margir menn í burt. Því næst tók Glámur að ríða húsum á nætur svo að lá við brotum. Gekk hann þá nálega nætur og daga. Varla þorðu menn að fara upp í dalinn þó að ættu nóg erindi. Þótti mönnum þar í héraðinu mikið mein að þessu."], "recap": ["Þórhallur Grímsson á Þórhallsstöðum í Forsæludal, upp af Vatnsdal.\nKona hans heitir Guðrún og börn þeirra Grímur og Þuríður.\nÞórhallur auðugur maður, á mikið af kvikfé, ekki höfðingi en þó öflugur bóndi.\nMjög reimt á bænum og í sveitinni svo hann á erfitt með að fá sauðmenn til að starfa hjá sér við umhirðu búfénaðarins.\nHann leitar ráða hjá mörgum vitrum mönnum um hvað hann geti gert til að halda betur í sauðamenn sína en fátt er um svör.\nÁ þingi um sumarið gengur hann á fund Skafta Þóroddssonar lögmanns sem var bæði vitur og ráðagóður.\nÞórhallur segir Skafta að honum haldist illa á sauðamönnum, þeir séu oft illa útleiknir eftir störf sín og margir hverjir stingi af áður en vistinni sé lokið án nokkurrar útskýringar.\nSkapti segir honum að ástæðan sé sú að hjá honum liggi meinvættur nokkur sem geri sauðamönnum hans lífið leitt svo þeir haldist ekki í vistinni.", "Skafti segist munu fá honum sauðamann til vinnu sem hann ætli að muni standa sig, sá er sænskur og heiti Glámur, hafi komið til landsins ári áður og sé bæði sérlundaður og illa þokkaður en mjög sterkur, áræðinn, mikill vexti og öflugur.\n,,Mikill vexti og undarlegur í yfirbragði, bláeygður og opineygður, úlfgrár á hárslit.”\nÞórhallur fer og hittir Glám og felst Svíinn á að taka að sér starf sauðamanns Þórhalls, hann muni koma til hans er haustar.\nUm haustið mætir Glámur til starfa á Þórhallsstaði, heimilisfólki geðjast lítið að honum, Guðrúnu húsfreyju minnst.\nGlámi gengur vel að smala en hann er með svo sterka og dimma rödd að búfénaðurinn stekkur til um leið og hann kallar.", "Kirkja er á Þórhallsstöðum og þar er fólk trúrækið.\nGlámur er hins vegar trúlaus og neitar að ganga til kirkju eða biðja bæna, hann er önugur og geðstirður og kemur illa við fólkið á bænum.\nÁ aðfangadag var siður að fasta en Glámur neitar að taka þátt í því með heimilisfólki og heimtar mat, Guðrún húsfreyja segir að þetta sé illa til fundið hjá Glámi en þorir ekki annað en að gefa honum að borða.\nEftir matinn gengur Glámur út, veður var vont; dimmt og snjókoma, og versnaði mikið eftir því sem á leið daginn.\nGlámur skilar sér ekki heim um kvöldið en engin leit er gerð að honum og fénu þar sem verður er svo vont.\nDaginn eftir bólar hvorki á Glámi né fénu svo gerð er út leit, féð finnst á víð og dreif um dalinn og nærliggjandi fjöll en hvergi finnst Glámur, menn finna þó ummerki um átök ofarlega í dalnum.\nÞá er leitað betur og finnst Glámur örendur.\n,,Hann var dauður og blár sem hel en digur sem naut.”", "Menn færa lík Gláms heim á bæinn og segja Þórhalli bónda fréttirnar, bóndi spyr hvað hafi orðið Glámi að bana og segjast menn hafa fundið ummerki um átök hans og einhvers meinvættar; skessu eða draugs, töldu menn að um hefði verið að ræða þann meinvætt er hafði gert sauðamönnum lífið leitt áður og að Glámur hefði náð að drepa hann því ekki varð hans vart aftur eftir þetta.\nDaginn eftir ætla menn að færa Glám til kirkju en tekst það ekki.\nÞriðja daginn ætla menn aftur að reyna að færa Glám til kirkju ásamt presti en þá finnst ekki lík hans.\nNú leita menn enn frekar að líkinu og finnst það loksins, afráða þeir þá að dysja hann þar sem hann fannst og utan kirkjugarðs. \nEftir það fer að bera á miklum reimleikum á bænum og í dalnum í kring og er þar Glámur mættur afturgenginn.\nHann gerir fólkinu á bænum lífið leitt og þykir mönnum í héraðinu mikið mein að, misstu margir vitið sem sáu hann.\n,,Því næst tók Glámur að ríða húsum á nætur svo að lá við brotum” - situr klofvega á þakinu og lemur fótunum í þakið eins og hann sé á hestbaki - mikil læti á næturnar og fólk skelfingu lostið."]}, {"num": 33, "paras": ["Um vorið fékk Þórhalli sér hjón og gerði bú á jörðu sinni. Tók þá að minnka afturgangur meðan sólargangur var mestur. Leið svo fram á miðsumar.", "Þetta sumar kom út skip í Húnavatni. Þar var á sá maður er Þorgautur hét. Hann var útlendur að kyni, mikill og sterkur. Hann hafði tveggja manna afl. Hann var laus og einn fyrir sér. Hann vildi fá starfa nokkurn því hann var félaus.", "Þórhallur reið til skips og fann Þorgaut, spurði ef hann vildi vinna fyrir honum. Þorgautur kvað það vel mega vera og kveðst eigi vanda það.", "\"Svo skaltu við búast,\" segir Þórhallur, \"sem þar sé ekki veslingsmönnum hent að vera fyrir afturgöngum þeim er þar hafa verið um hríð en eg vil ekki þig á tálar draga.\"", "Þorgautur svarar: \"Eigi þykist eg upp gefinn þó að eg sjái smávofur. Mun þá eigi öðrum dælt ef eg hræðist og ekki bregð eg vist minni fyrir það.\"", "Nú semur þeim vel kaupstefnan og skal Þorgautur gæta sauðfjár að vetri. Leið nú af sumarið. Tók Þorgautur við fénu að veturnóttum. Vel líkaði öllum við hann. Jafnan kom Glámur heim og reið húsum.", "Það þótti Þorgauti allkátlegt og kvað þrælinn þurfa mundu nær að ganga \"ef eg hræðist.\"", "Þórhallur bað hann hafa fátt um \"er best að þið reynið ekki með ykkur.\"", "Þorgautur mælti: \"Sannlega er skekinn þróttur úr yður og dett eg ekki niður milli dægra við skraf þetta.\"", "Nú fór svo fram um veturinn allt til jóla. Aðfangakveld jóla fór sauðamaður til fjár.", "Þá mælti húsfreyja: \"Þurfa þætti mér að nú færi eigi að fornum brögðum.\"", "Hann svarar: \"Ver ekki hrædd um það húsfreyja,\" sagði hann. \"Verða mun eitthvert sögulegt ef eg kem ekki aftur.\"", "Síðan gekk hann aftur til fjár síns. Veður var heldur kalt og fjúk mikið. Því var Þorgautur vanur að koma heim þá er hálfrökkvað var en nú kom hann ekki heim í það mund. Komu tíðamenn sem vant var. Þegar þótti mönnum eigi ólíkt á horfast sem fyrr. Bóndi vildi leita láta eftir sauðamanni en tíðamenn töldust undan og sögðust eigi mundu hætta sér út í tröllahendur um nætur og treystist bóndi eigi að fara og varð ekki af leitinni.", "Jóladag er menn voru mettir fóru menn til og leituðu sauðamanns. Gengu þeir fyrst til dysjar Gláms því að menn ætluðu af hans völdum mundi orðið um hvarf sauðamanns. En er þeir komu nær dysinni sáu þeir þar mikil tíðindi og þar fundu þeir sauðamann og var hann brotinn á háls og lamið sundur hvert bein í honum. Síðan færðu þeir hann til kirkju og varð öngum manni mein að Þorgauti síðan. En Glámur tók að magnast af nýju. Gerði hann nú svo mikið af sér að menn allir stukku burt af Þórhallsstöðum utan bóndi einn og húsfreyja.", "Nautamaður hafði þar verið lengi hinn sami. Vildi Þórhallur hann ekki lausan láta fyrir góðvilja sakir og geymslu. Hann var mikið við aldur og þótti honum mikið að fara á burt. Sá hann og að allt fór að ónytju það er bóndi átti ef engi geymdi.", "Og einn tíma eftir miðjan vetur var það einn morgun að húsfreyja fór til fjóss að mjólka kýr eftir tíma. Þá var alljóst því að engi treystist fyrr úti að vera annar en nautamaður. Hann fór út þegar lýsti. Hún heyrði brak mikið í fjósið og beljan öskurlega. Hún hljóp inn æpandi og kvaðst eigi vita hver ódæmi um væru í fjósinu. Bóndi gekk út og kom til nautanna og stangaði hvert annað. Þótti honum þar eigi gott og gekk inn að hlöðunni. Hann sá hvar lá nautamaður og hafði höfuðið í öðrum bási en fætur í öðrum. Hann lá á bak aftur. Bóndi gekk að honum og þreifaði um hann, finnur brátt að hann er dauður og sundur hryggurinn í honum. Var hann brotinn um báshelluna.", "Nú þótti bónda eigi vært og fór í burt af bænum með allt það sem hann mátti í burt flytja. En allt kvikfé það sem eftir var deyddi Glámur og þar næst fór hann um allan dalinn og eyddi alla bæi upp frá Tungu.", "Var Þórhalli þá með vinum sínum það eftir var vetrarins. Engi maður mátti fara upp í dalinn með hest eða hund því að það var þegar drepið.", "En er voraði og sólargangur var sem mestur létti heldur afturgöngunum. Vildi Þórhallur nú fara aftur til lands síns. Urðu honum ekki auðfengin hjón en þó gerði hann bú á Þórhallsstöðum. Fór allt á sama veg sem fyrr. Þegar að haustaði tók að vaxa reimleikar. Var þá mest sótt að bóndadóttur og svo fór að hún lést af því. Margra ráða var í leitað og varð ekki að gert. Þótti mönnum til þess horfast að eyðast mundi allur Vatnsdalur ef eigi yrðu bætur á ráðnar."], "recap": ["Næsta sumar ræðst til vinnu hjá Þórhalli erlendur maður að nafni Þorgautur, mikill og sterkur sem og hugrakkur, og gerist sauðamaður. \nÞorgautur segist alls óhræddur við drauginn Glám. \nÖllum á bænum líkar vel við Þorgaut, ólíkt því sem var með Glám árið áður. \nÞorgautur gerir bara grín að því þegar Glámur lætur að sér kveða á húsþakinu á næturna og segir að hann þurfi nú að gera betur til að láta sér bregða en Þórhallur biður hann að hafa sig hægan og reyna sig ekki við Glám.\nÁ aðfangadagskvöld er kalt í veðri og snjófjúk, Þorgautur fer út að sækja féð en skilar sér ekki aftur og þora menn ekki að fara að leita að honum.\nDaginn eftir finnst Þorgautur látinn við dys Gláms, eru þar ummerki um mikil átök og er Þorgautur bæði hálsbrotin og lamið sundur hvert annað bein í honum.\nÞorgautur er færður til kirkju og grafinn og verður hans ekki vart eftir það en Glámur hins vegar eflist í sinni afturgöngu, svo mikil verða lætin í honum að nær allir flýja frá Þórhallsstöðum nema Þórhallur bóndi og Guðrún kona hans.\nLíkindin með dauða Gláms og Þorgautar.", "Nautamaður (fjósamaður) Þórhalls verður eftir með honum á bænum.\nMikil læti heyrast frá fjósinu og þegar að er gáð kemur í ljós að nautamaðurinn liggur látinn á fjósagólfinu, hryggbrotin eftir átök, og nautgripirnir eru mjög æstir.\nEftir þetta fara Þórhallur og Guðrún einnig af bænum með allt sem þau gátu tekið með sér en draugurinn Glámur drepur allt það fé sem eftir verður.\nGlámur eflist nú til muna og svo fer að hann hrekur burt marga ábúendur bæja í Vatnsdalnum.\nMest lét Glámur finna fyrir sér á veturna í myrkrinu en reimleikar minnkuðu mjög á sumrin.\nÞórhallur hóf aftur búskap á Þórhallsstöðum um sumarið en reimleikarnir jukust aftur um haustið og fór svo að bóndadóttirin lést úr sótt, líklega af völdum Gláms.\nMörg ráð voru reynd til að ráða niðurlögum Gláms en ekkert gekk og sáu menn fram á að Vatnsdalur legðist í eyði ef ekkert yrði að gert."]}, {"num": 34, "paras": ["Nú er þar til að taka að Grettir Ásmundarson sat heima að Bjargi um haustið síðan þeir Víga-Barði skildu á Þóreyjargnúpi. Og er mjög var komið að veturnóttum reið Grettir heiman norður yfir hálsa til Víðidals og gisti á Auðunarstöðum. Sættust þeir Auðunn til fulls og gaf Grettir honum öxi góða og mæltu til vináttu með sér. Auðunn bjó lengi á Auðunarstöðum og var kynsæll maður. Hans son var Egill er átti Úlfheiði dóttur Eyjólfs Guðmundarsonar og var þeirra son Eyjólfur er veginn var á alþingi. Hann var faðir Orms kapiláns Þorláks biskups.", "Grettir reið norður til Vatnsdals og kom á kynnisleit í Tungu. Þar bjó þá Jökull Bárðarson móðurbróðir Grettis. Jökull var mikill maður og sterkur og hinn mesti ofsamaður. Hann var siglingamaður og mjög ódæll en þó mikilhæfur maður. Hann tók vel við Gretti og var hann þar þrjár nætur.", "Þá var svo mikið orð á afturgöngum Gláms að mönnum var ekki jafntíðrætt sem það. Grettir spurði innilega að þeim atburðum er höfðu orðið.", "Jökull kvað þar ekki meira af sagt en til væri haft \"eða er þér forvitni á frændi að koma þar?\"", "Grettir sagði að það var satt.", "Jökull bað hann eigi gera \"því það er gæfuraun mikil en frændur þínir eiga mikið í hættu þar sem þú ert,\" sagði hann. \"Þykir oss nú engi slíkur af ungum mönnum sem þú en illt mun af illum hljóta þar Glámur er. Er og miklu betur að fást við mennska menn en við óvættir slíkar.\"", "Grettir kvað sér hug að koma á Þórhallsstaði og sjá hversu þar væri um gengið.", "Jökull mælti: \"Sé eg nú, ekki tjáir að letja þig en satt er það sem mælt er að sitt er hvað, gæfa eða gjörvugleikur.\"", "\"Þá er öðrum vo fyrir dyrum, er öðrum er áður inn um komið, og hygg að hversu þér mun fara sjálfum áður lýkur,\" kvað Grettir.", "Jökull svarar: \"Vera kann að við sjáum báðir nokkuð fram en hvorgi fái við gert.\"", "Eftir það skildu þeir og líkaði hvorigum annars spár."], "recap": ["Grettir hefur verið heima á Bjargi um tíma en ríður nú yfir í Víðidal og fær gistingu á Auðunarstöðum, þeir Auðun sættast að fullu (síðan á leikunum og eftir heimkomuna) og gefur Grettir honum góða öxi til marks um vináttu þeirra.\nGrettir heldur áfram í Vatnsdal og kemur þar á bæinn Tungu þar sem Jökull Bárðarson móðurbróðir hans býr, Grettir gistir þar í þrjár nætur og fær þá veður af reimleikunum af völdum Gláms.\nGrettir verður spenntur fyrir því verkefni að reyna sig við Glám en Jökull frændi hans biður hann að láta vera, það muni ekki fara vel fyrir honum ef hann vaði í Glám, þrátt fyrir að Grettir sé eins öflugur og raun ber vitni.\nGrettir vill þó endilega fara á Þórhallsstaði og láta reyna á hvort hann gæti ráðið niðurlögum Gláms og sér Jökull að hann getur ekki stoppað frænda sinn.\n,,Sé eg nú, ekki tjáir að letja þig en satt er það sem mælt er, að sitt er hvað, gæfa eða gjörvugleikur.”\nKjarni sögunnar - Grettir er sterkur og mikill afreksmaður en kann sér ekki hóf og kallar yfir sig ógæfu með stórmennskubrjálæði."]}, {"num": 35, "paras": ["Grettir reið á Þórhallsstaði og fagnaði bóndi honum vel. Hann spurði hvert Grettir ætlaði að fara en hann sagðist þar vilja vera um nóttina en bónda líkaði að svo væri.", "Þórhallur kvaðst þökk fyrir kunna að hann væri \"en fám þykir slægur til að gista hér um tíma. Muntu hafa heyrt getið um hvað hér er að véla en eg vildi gjarna að þú komist heill á brott. Þá veit eg fyrir víst að þú missir hests þíns því engi heldur hér heilum sínum fararskjót sá er kemur.\"", "Grettir kvað gott til hesta hvað sem af þessum yrði.", "Þórhallur varð glaður við er Grettir vildi þar vera og tók við honum báðum höndum. Var hestur Grettis læstur í húsi sterklega. Þeir fóru til svefns og leið svo af nóttin að ekki kom Glámur heim.", "Þá mælti Þórhallur: \"Vel hefir brugðið við þína komu því að hverja nótt er Glámur vanur að rísa, ríða húsum eða brjóta upp hurðir sem þú mátt merki sjá.\"", "Grettir mælti: \"Þá mun vera annaðhvort að hann mun ekki lengi á sér sitja eða mun af venjast meir en eina nótt. Skal eg vera nótt aðra og sjá hversu fer.\"", "Síðan gengu þeir til hests Grettis og var ekki við hann glest. Allt þótti bónda að einu fara.", "Nú er Grettir þar aðra nótt og kom ekki þrællinn heim. Þá þótti bónda mjög vænkast. Fór hann þá að sjá hest Grettis. Þá var upp brotið húsið er bóndi kom til en hesturinn dreginn til dyra utar og lamið í sundur í honum hvert bein.", "Þórhallur sagði Gretti hvar þá var komið og bað hann forða sér \"því að vís er dauðinn ef þú bíður Gláms.\"", "Grettir svarar: \"Eigi má eg minna hafa fyrir hest minn en að sjá þrælinn.\"", "Bóndi sagði að það var ekki bati að sjá hann \"því að hann er ólíkur nokkurri mannlegri mynd. En góð þykir mér hver sú stund er þú vilt vera.\"", "Nú líður dagurinn og er menn skyldu fara til svefns vildi Grettir eigi fara af klæðum og lagðist niður í sætið gegnt lokrekkju bónda. Hann hafði röggvarfeld yfir sér og hneppti annað skautið niður undir fætur sér en annað snaraði hann undir höfuð sér og sá út um höfuðsmáttina. Setstokkur var fyrir framan sætið mjög sterkur og spyrnti hann þar í. Dyraumbúningurinn allur var frá brotinn útidyrunum en nú var þar fyrir bundinn hurðarflaki og óvendilega um búið. Þverþilið var allt brotið frá skálanum, þar fyrir framan hafði verið, bæði fyrir ofan þvertréið og neðan. Sængur allar voru úr stað færðar. Heldur var þar óvistulegt. Ljós brann í skálanum um nóttina.", "Og er af mundi þriðjungur af nótt heyrði Grettir út dynur miklar. Var þá farið upp á húsin og riðið skálanum og barið hælunum svo að brakaði í hverju tré. Það gekk lengi. Þá var farið ofan af húsunum og til dyra gengið. Og er upp var lokið hurðunni sá Grettir að þrællinn rétti inn höfuðið og sýndist honum afskræmilega mikið og undarlega stórskorið. Glámur fór seint og réttist upp er hann kom inn í dyrnar. Hann gnæfaði ofarlega við rjáfrinu, snýr að skálanum og lagði handlegginn upp á þvertréið og gægðist innar yfir skálann. Ekki lét bóndi heyra til sín því að honum þótti ærið um er hann heyrði hvað um var úti. Grettir lá kyrr og hrærði sig hvergi. Glámur sá að hrúga nokkur lá í sætinu og ræður nú innar eftir skálanum og þreif í feldinn stundar fast. Grettir spyrnti í stokkinn og gekk því hvergi. Glámur hnykkti annað sinn miklu fastara og bifaðist hvergi feldurinn. Í þriðja sinn þreif hann í með báðum höndum svo fast að hann rétti Gretti upp úr sætinu, kipptu nú í sundur feldinum í millum sín. Glámur leit á slitrið er hann hélt á og undraðist mjög hver svo fast mundi togast við hann. Og í því hljóp Grettir undir hendur honum og þreif um hann miðjan og spennti á honum hrygginn sem fastast gat hann og ætlaði hann að Glámur skyldi kikna við. En þrællinn lagði að handleggjum Grettis svo fast að hann hörfaði allur fyrir orku sakir. Fór Grettir þá undan í ýmis sætin. Gengu þá frá stokkarnir og allt brotnaði það sem fyrir varð. Vildi Glámur leita út en Grettir færði við fætur hvar sem hann mátti en þó gat Glámur dregið hann fram úr skálanum. Áttu þeir þá allharða sókn því að þrællinn ætlaði að koma honum út úr bænum. En svo illt sem að eiga var við Glám inni þá sá Grettir að þó var verra að fást við hann úti og því braust hann í móti af öllu afli að fara út. Glámur færðist í aukana og hneppti hann að sér er þeir komu í anddyrið. Og er Grettir sér að hann fékk eigi við spornað hefir hann allt eitt atriðið að hann hleypur sem harðast í fang þrælnum og spyrnir báðum fótum í jarðfastan stein er stóð í dyrunum. Við þessu bjóst þrællinn eigi. Hann hafði þá togast við að draga Gretti að sér og því kiknaði Glámur á bak aftur og rauk öfugur út á dyrnar svo að herðarnar námu af dyrið og rjáfrið gekk í sundur, bæði viðirnir og þekjan frerin, féll svo opinn og öfugur út úr húsunum en Grettir á hann ofan. Tunglskin var mikið úti og gluggaþykkn. Hratt stundum fyrir en stundum dró frá.", "Nú í því er Glámur féll rak skýið frá tunglinu en Glámur hvessti augun upp í móti. Og svo hefir Grettir sagt sjálfur að þá eina sýn hafi hann séð svo að honum brygði við. Þá sigaði svo að honum af öllu saman, mæði og því er hann sá að Glámur gaut sínum sjónum harðlega, að hann gat eigi brugðið saxinu og lá nálega í milli heims og heljar.", "En því var meiri ófagnaðarkraftur með Glámi en flestum öðrum afturgöngumönnum að hann mælti þá á þessa leið: \"Mikið kapp hefir þú á lagið Grettir,\" sagði hann, \"að finna mig en það mun eigi undarlegt þykja þó að þú hljótir ekki mikið happ af mér. En það má eg segja þér að þú hefir nú fengið helming afls þess og þroska er þér var ætlaður ef þú hefðir mig ekki fundið. Nú fæ eg það afl eigi af þér tekið er þú hefir áður hreppt en því má eg ráða að þú verður aldrei sterkari en nú ertu og ertu þó nógu sterkur og að því mun mörgum verða. Þú hefir frægur orðið hér til af verkum þínum en héðan af mun falla til þín sektir og vígaferli en flest öll verk þín snúist þér til ógæfu og hamingjuleysis. Þú munt verða útlægur ger og hljóta jafnan úti að búa einn samt. Þá legg eg það á við þig að þessi augu séu þér jafnan fyrir sjónum sem eg ber eftir og mun þér erfitt þykja einum að vera. Og það mun þér til dauða draga.\"", "Og sem þrællinn hafði þetta mælt þá rann af Gretti ómegin það sem á honum hafði verið. Brá hann þá saxinu og hjó höfuð af Glámi og setti þá við þjó honum. Bóndi kom þá út og hafði klæðst á meðan Glámur lét ganga töluna en hvergi þorði hann nær að koma fyrr en Glámur var fallinn. Þórhallur lofaði guð fyrir og þakkaði vel Gretti er hann hafði unnið þenna óhreina anda. Fóru þeir þá til og brenndu Glám að köldum kolum. Eftir það grófu þeir þar niður sem síst voru fjárhagar eða mannavegir. Gengu heim eftir það og var þá mjög komið að degi. Lagðist Grettir niður því að hann var stirður mjög.", "Þórhallur sendi menn á næstu bæi eftir mönnum, sýndi og sagði hversu farið hafði. Öllum þótti mikils um vert um þetta verk þeir er heyrðu. Var það þá almælt að engi væri þvílíkur maður á öllu landinu fyrir afls sakir og hreysti og allrar atgervi sem Grettir Ásmundarson.", "Þórhallur leysti Gretti vel af hendi og gaf honum góðan hest og klæði sæmileg því þau voru öll sundur leyst er hann hafði áður borið. Skildu þeir með vináttu. Reið Grettir þaðan í Ás í Vatnsdal og tók Þorvaldur við honum vel og spurði innilega að sameign þeirra Gláms en Grettir segir honum viðskipti þeirra og kvaðst aldrei í þvílíka aflraun komið hafa, svo langa viðureign sem þeir höfðu saman átt.", "Þorvaldur bað hann hafa sig spakan \"og mun þá vel duga en ella mun þér slysgjarnt verða.\"", "Grettir kvað ekki batnað hafa um lyndisbragðið og sagðist nú miklu verr stilltur en áður og allar mótgerðir verri þykja. Í því fann hann mikla muni að hann var orðinn maður svo myrkfælinn að hann þorði hvergi að fara einn saman þegar myrkva tók. Sýndist honum þá hvers kyns skrípi. Og það er haft síðan fyrir orðtæki að þeim ljái Glámur augna eða gefi glámsýni er mjög sýnist annan veg en er.", "Grettir reið heim til Bjargs er hann hafði gert erindi sín og sat heima um veturinn."], "recap": ["Grettir fer á Þórhallsstaði og tekur bóndi honum vel.\nGrettir fær gistingu og er hestur hans læstur inni því Glámur er þekktur fyrir að drepa öll þau dýr sem koma á bæinn.\nEkki bólar á Glámi fyrstu nótt Grettis á Þórhallsstöðum og er hesturinn hans heill um morgunin og bóndinn mjög glaður.\nNæstu nótt heyrist ekki í Glámi en morgunin eftir finnst hesthúsið brotið upp og hesturinn dauður, lamið í sundur í honum hvert bein.\nÞórhallur biður nú Gretti að forða sér því víst sé að hann muni deyja ætli hann að bíða lengur eftir Glámi.\nGrettir segist nú í það minnsta verða að sjá Glám fyrst hann hafi drepið hestinn hans, bóndi fagnar því að Grettir vilji dvelja lengur en hefur áhyggjur af honum. \nÞriðju nóttina lætur Glámur sjá sig, ríður húsum sem fyrr til að byrja með en kemur svo inn í bæinn og verða þar mikil átök á milli Grettis og Gláms.\nÞeir eigast við í hörðum bardaga, kastast til og frá og enda úti á hlaði, tungl veður í skýjum, úti er mjög drungalegt og Gretti þykir Glámur ógurlegur viðeignar og útlits.", "Svo fer loks að Grettir nær góðri stöðu og ætlar að höggva til Gláms með saxi en getur það ekki, eins og fyrir einhvers konar álög.\nÞá leggur Glámur á hann að þessi átök þeirra verði Gretti til bölvunar, að hann verði aldrei sterkari og stærri en hann er orðinn núna (hefði orðið tvöfalt stærri og sterkari annars), héðan af muni síga á ógæfuhliðina í hans lífi, hamingjuleysi muni elta hann, hann verði útlægur og muni búa einn, hann muni sjá fyrir sér augu Gláms og verði ákaflega myrkfælinn, að lokum muni það draga hann til dauða hvað honum þykir erfitt að vera einn:\n,,Mikið kapp hefir þú á lagið Grettir að finna mig en það mun eigi undarlegt þykja þó að þú hljótir ekki mikið happ af mér. En það má eg segja þér að þú hefir nú fengið helming afls þess og þroska er þér var ætlaður ef þú hefðir mig ekki fundið. Nú fæ eg það afl eigi af þér tekið er þú hefur áður hreppt, en því má eg ráða að þú verður aldrei sterkari en nú ertu og ertu þó nógu sterkur og að því mun mörgum verða. Þú hefir frægur orðið hér til af verkum þínum en héðan af munu falla til þín sektir og vígaferli en flestöll verk þín snúast þér til ógæfu og hamingjuleysis. Þú munt verða útlægur ger og hljóta jafnan úti að búa einn samt. Þá legg eg það á við þig að þessi augu séu þér jafnan fyrir sjónum sem eg ber eftir og mun þér þá erfitt þykja einum að vera. Og það mun þér til dauða draga.” \nGrettir heggur höfuðið af Glámi og leggur það við rassinn á honum.\nÞórhallur verður alsæll með afrek Grettis og saman brenna þeir lík Gláms, setja öskuna í skinnskjóðu og dysja.\nGrettir mjög aumur eftir bardagann og finnur jafnframt að eitthvað er breytt - myrkfælni."]}, {"num": 36, "paras": ["Þorbjörn öxnamegin hafði haustboð mikið og kom þar margt manna. Þetta var meðan að Grettir fór norður til Vatnsdals um haustið.", "Þorbjörn ferðalangur var þar að boðinu. Þar varð margt talað. Spurðu þeir Hrútfirðingar að sameign þeirra Grettis á hálsinum um sumarið. Þorbjörn öxnamegin bar Gretti allvel söguna, kvað Kormák verra mundu af hafa fengið ef öngvir hefðu til komið að skilja þá.", "Þá mælti Þorbjörn ferðalangur: \"Það var bæði,\" sagði hann, \"að eg sá hann Gretti ekki til frægðar vinna enda hygg eg að honum skyti skelk í bringu er vér komum að og allfús var hann að skilja. Og ekki sá eg hann til hefnda leita er húskarl Atla var drepinn og í því ætla eg aldrei hug í honum ef hann hefir eigi nógan liðsafla.\"", "Gerði Þorbjörn að þessu hið mesta gabb.", "Margir tóku undir að þetta væri þarfleysuglens og Grettir mundi eigi svo búið hafa vilja ef hann frétti þessi orð. Ekki bar þar til tíðinda fleira að boðinu. Fóru menn heim. Voru dylgjur miklar með þeim um veturinn en hvorigir réðu á aðra. Bar þá ekki til tíðinda um veturinn."], "recap": ["Þorbjörn öxnamegin (kafli 30) heldur mikið haustboð og er þar mannmargt, var þetta á meðan Grettir var í vatnsdal að berjast við Glám.\nVeislugestir ræða um viðureign Grettis við þá Kormák, Þorgils og Odd ómaga (sem Þorbjörn öxnamegin stöðvaði í kafla 30).\nÞorbjörn öxnamegin segir Gretti hafa staðið sig vel og hefði líklega unnið bardagann hefði hann ekki komið til að skilja þá að.\nÞorbjörn ferðalangur (einnig úr kafla 30), sem hafið verið með Þorbirni öxnamegin þegar hann stöðvaði bardagann, gerir þó grín að Gretti fyrir að hafa gefist upp auðveldlega og ekki leitað bóta eða hefnda fyrir húskarl Atla sem var drepinn í bardaganum.\nÞorbjörn ferðalangur er fremur illa liðinn og þykir veislugestum þetta óþarfa glens hjá honum og telja líklegt að Grettir myndi taka því illa ef hann heyrði hvernig Þorbjörn ferðalangur talaði um hann."]}, {"num": 37, "paras": ["Snemma um vorið eftir kom skip út af Noregi. Það var fyrir þing. Þeir kunnu að segja mörg tíðindi. Það fyrst að höfðingjaskipti var orðið í Noregi. Var þá kominn til ríkis Ólafur konungur Haraldsson en Sveinn jarl úr landi stokkinn um vorið eftir Nesjaorustu. Voru margir merkilegir hlutir sagðir frá Ólafi konungi og það með að hann tók þá menn alla best sem voru atgervismenn um nokkura hluti og gerði sér þá handgengna. Við þetta urðu glaðir margir ungir menn og fýstust til utanferðar.", "Og svo sem Grettir spurði þessi tíðindi gerist honum hugur á að sigla. Vænti hann sér sæmdar sem aðrir af konunginum. Skip stóð uppi að Gásum í Eyjafirði. Þar tók Grettir sér far og bjóst til utanferðar. Ekki hafði hann enn mikil fararefni.", "Ásmundur gerðist nú mjög hrumur af elli og reis nú lítt úr rekkju. Þau Ásdís áttu ungan son er Illugi hét, manna efnilegastur. Atli tók nú við allri búsýslu og fjárvarðveislu. Þótti það mikið batna því að hann var gæfur og forsjáll.", "Grettir fór til skips. Í þetta sama skip hafði ráðist Þorbjörn ferðalangur áður en þeir vissu að Grettir mundi þar í sigla. Löttu margir Þorbjörn að sigla samskipa við Gretti en Þorbjörn kveðst fara mundu fyrir allt það. Bjóst hann til utanferðar og varð heldur síðbúinn. Kom hann eigi fyrr norður á Gáseyri en skipið var albúið.", "Áður Þorbjörn færi vestan hafði Ásmundur hærulangur tekið krankleika nokkurn og reis þá ekki úr rekkju.", "Þorbjörn ferðalangur kom síð dags í sandinn. Voru menn þá búnir til borða og tóku handlaugar úti hjá búðinni. En er Þorbjörn reið fram í búðarsundin var honum heilsað og spurður tíðinda.", "Hann lést engin segja kunna \"utan þess get eg að kappinn Ásmundur að Bjargi sé nú dauður.\"", "Margir tóku undir að þar færi gildur af heiminum sem hann var \"eða hversu bar það til?\" sögðu þeir.", "Hann svarar: \"Lítið lagðist nú fyrir kappann því að hann kafnaði í stofureyk sem hundur en eigi var skaði að honum því að hann gerðist nú gamalær.\"", "Þeir svara: \"Þú talar undarlega við þvílíkan mann og eigi mundi Gretti vel líka ef hann heyrði.\"", "\"Þola má eg það,\" sagði Þorbjörn, \"og hærra mun Grettir bera verða saxið en í fyrra sumar á Hrútafjarðarhálsi ef eg hræðist hann.\"", "Grettir heyrði fullgerla hvað Þorbjörn sagði og gaf sér ekki að meðan Þorbjörn lét ganga söguna.", "En er hann hætti þá mælti Grettir: \"Það spái eg þér Ferðalangur,\" sagði hann, \"að þú deyir ekki í stofureyknum og þó má vera að þú verðir ei ellidauður. En það er undarlega gert að tala sneyðilega til saklausra manna.\"", "Þorbjörn mælti: \"Ekki mun eg aftra mér að þessu og eigi þótti mér þú svo snæfurlega láta þá er vér tókum þig undan er þeir Melamenn börðu þig sem nautshöfuð.\"", "Grettir kvað þá vísu:", "Jafnan verðr til orða", "of löng boga slöngvi,", "því kemr þar tll sumra", "þung hefnd fyrir, tunga.", "Margr hefir beiðir borgar", "benlinns sakir minni,", "Ferðalangr, þótt fengir", "fjörtjón, en þú gjörvar.", "Þorbjörn mælti: \"Jafnfeigur þykist eg sem áður þótt þú skjalir slíkt.\"", "Grettir svarar: \"Ekki hafa spár mínar átt langan aldur hér til og enn mun svo fara. Vara þig ef þú vilt. Eigi mun síðar sýnna.\"", "Síðan hjó Grettir til Þorbjörns en hann bar við hendinni og ætlaði svo að bera af sér höggið. En höggið kom á höndina fyrir ofan úlfliðinn og síðan hljóp saxið á hálsinn svo að af fauk höfuðið. Kaupmenn sögðu hann stórhöggvan og slíkt væru konungsmenn og ekki þótti þeim skaði að þótt Þorbjörn væri drepinn því að hann hafði bæði verið kífinn og köllsugur.", "Litlu síðar létu þeir í haf og komu að áliðnu sumri til Noregs suður við Hörðaland. Frétta þeir þá að Ólafur konungur sat norður í Þrándheimi. Fékk Grettir sér far með byrðingsmönnum norður þangað því að hann vildi fara á konungs fund."], "recap": ["Þær fréttir berast til Íslands að nýr þjóðhöfðingi sé tekinn við í Noregi; Ólafur konungur Haraldsson í stað Sveins jarls sem hafði flúið land eftir Nesjaorustu.\nGott orð og merkilegt fer af Ólafi konungi og spyrst það út að hann sé að leita eftir öflugum mönnum í her sinn, margir íslenskir menn heillast af þessu og vilja freista þess að komast til konungs, þar á meðal Grettir.\nGrettir kemst á skip sem stendur uppi að Gásum í Eyjafirði, Atli er heima og tekur við búinu af Ásmundi sem er orðinn hrumur af elli, Illugi yngsti bróðir þeirra er einnig heima.\nÞorbjörn ferðalangur ætlar að fara utan með sama skipi og Grettir, Þorbjörn mætir seint til skips og með þær fréttir að Ásmundur faðir Grettis sé látinn og gerir grín að dauða hans; segir að hann hafi kafnað í stofureyk eins og hundur því hann hafi ekki geta staðið upp fyrir elli og aumingjaskap.", "Menn á skipinu biðja Þorbjörn að tala ekki svona því Grettir gæti heyrt í honum og líkað illa en Þorbjörn lætur sem honum sé alveg sama og gerir aftur grín að því að Grettir skyldi ekki klára bardagann við þá Kormál, Þorgils og Odd ómaga (kafli 30).\nGrettir heyrir í Þorbirni og svarar honum að líklega deyi hann ekki í stofureyknum og ekki heldur ellidauða.\nEftir frekari orðaskipti tekur Grettir upp sverðið sitt og heggur til Þorbjörns ferðalangs svo höfuðið fór af.\nEkki þótti mönnum slæmt að Þorbjörn ferðalangur hefði verið veginn því hann hagaði sér oft illa og var með leiðindi, var þrætugjarn og hæddi samferðafólk sitt, því verða engin eftirmál af vígi hans.\nLitlu síðar leggur skipið í haf áleiðis til Noregs og Grettir þar með í för til að freista þess að komast í her konungs."]}, {"num": 38, "paras": ["Þórir hét maður er bjó í Garði í Aðaldal. Hann var Skeggjason Böðólfssonar. Skeggi hafði numið Kelduhverfi upp til Kelduness. Hann átti Helgu dóttur Þorgeirs á Fiskilæk. Þórir son hans var höfðingi mikill og siglingamaður. Hann átti tvo sonu. Hét Þorgeir annar en annar Skeggi. Þeir voru báðir efnilegir menn og mjög fulltíða er þetta var.", "Þórir hafði verið í Noregi um sumarið þá er Ólafur konungur kom vestan af Englandi og kom sér þá í kærleika mikla við konung og svo við Sigurð biskup og það til marks um að Þórir hafði látið gera knörr mikinn í skógi og bað Sigurð biskup vígja og svo gerði hann. Eftir það fór Þórir út til Íslands og lét höggva upp knörrinn þá er honum leiddist siglingar en brandana af knerrinum lét hann setja yfir útidyr sínar og voru þeir þar lengi síðan og svo veðurspáir að í öðrum þaut fyrir sunnanveðri en í öðrum fyrir norðanveðri.", "En er Þórir spurði að Ólafur konungur hafði fengið einn vald yfir öllum Noregi þóttist hann nú þar eiga að vitja vináttumála. Þá sendi Þórir syni sína til Noregs á konungs fund og ætlaði að þeir skyldu verða honum handgengnir. Komu þeir að sunnarlega síð um haustið og fengu sér eina róðraskútu og fóru norður með landi og ætluðu að fara á konungs fund. Þeir komu í höfn eina fyrir sunnan Stað og lágu þar nokkrar nætur. Þeir héldu sig vel að vist og drykk og höfðu sig ekki úti er eigi voru góð veður.", "Nú er að segja frá er þeir Grettir fóru norður með landi og fengu oft hörð veður því að þetta var öndverðan vetur. Og þá er þeir sóttu norður að Staði fengu þeir illviðri mikið með fjúki og frosti og tóku nauðulega land eitt kveld, allir mjög væstir, og lögðu þar við bala nokkurn og gátu þá borgið fé sínu og föngum. Þeir bárust illa af, kaupmennirnir, því að þeir gátu eigi tekið eldinn. Þeim þótti þar nálega við liggja heilsa sín og líf. Lágu þeir þar um kveldið allilla staddir.", "Þá er á leið kveldið sáu þeir að eldur kom upp mikill öðrumegin þess sunds er þeir voru þá við komnir. En er skipverjar Grettis sáu eldinn töluðu þeir til að sá væri heppinn er honum gæti náð og efuðust í hvort þeir leysa skyldu skipið en það sýndist öllum ei hættulaust. Þá höfðu þeir um tal mikið hvort nokkur maður mundi svo vel fær að næði eldinum. Grettir gaf sér fátt að og segir að verið mundu hafa þeir menn er það mundu ekki trauðað hafa.", "Kaupmenn sögðu að sér væri ekki að borgnara hvað er verið hafði ef þá væri til einskis að taka \"eða treystir þú þér Grettir?\" sögðu þeir, \"því að þú ert nú mestur atgervismaður af íslenskum mönnum kallaður en þú veist nú gjörla hvað oss liggur á.\"", "Grettir svarar: \"Eigi líst mér mikið þrekvirki að ná eldinum en eigi veit eg hvort þér launið betur en sá fer á leit er það gerir.\"", "Þeir mæltu: \"Því ætlar þú oss þá svívirðingarmenn að vér mundum það eigi góðu launa?\"", "\"Reyna má eg þetta ef það er að yður þykir hér allmikið á liggja en eigi segir mér vænt hugur um að eg hafi gott að sök hér fyrir.\"", "Þeir kváðu það eigi skyldu vera og kváðu hann mæla drengja heilastan.", "Eftir það bjóst Grettir til sunds og kastaði af sér klæðunum. Hann fór í kufl einn klæða og söluvoðarbrækur. Hann stytti upp um sig kuflinn og rak að sér utan basttaug að sér miðjum og hafði með sér kerald. Síðan hljóp hann fyrir borð. Hann lagðist nú yfir þvert sundið og gekk þar á land. Hann sér þar standa eitt hús og heyrði þangað mannamál og glaum mikinn. Grettir sneri að húsinu.", "Nú er að segja frá þeim sem fyrir voru að hér voru komnir þeir Þórissynir sem fyrr var getið. Þeir höfðu legið þar margar nætur og beðið þar veðurfalls að þeim gæfi norður fyrir Staði. Þeir höfðu sest til drykkju og voru tólf saman. Þeir lágu í meginhöfninni og var þar gert sæluhús mönnum þeim til ívistar er fara með landi fram og var borinn í húsið hálmur mikill. Eldur var og mikill á gólfinu.", "Grettir ræður nú inn í húsið og vissi ekki hverjir fyrir voru. Kuflinn var sýldur allur þegar hann kom á land og var hann furðu mikill tilsýndar sem tröll væri. Þeim sem fyrir voru brá mjög við þetta og hugðu að óvættur mundi vera. Börðu þeir hann með öllu því er þeir fengu til og varð nú brak mikið um þá en Grettir hratt fast af handleggjum. Sumir börðu hann með eldibröndum. Hraut þá eldurinn um allt húsið. Komst hann við það út með eldinn og fór svo aftur til félaga sinna. Lofuðu þeir mjög hans ferð og frækleik og kváðu engvan hans jafningja mundu vera.", "Leið nú af nóttin og þóttust þeir þegar hólpnir er þeir fengu eldinn. Um morguninn eftir var gott veður. Vöktu þeir við snemma kaupmennirnir og bjuggust til ferðar, töluðu þá um að þeir skyldu finna þá er fyrir eldinum höfðu ráðið og vita hverjir þeir væru. Leystu þeir nú skipið og fóru yfir sundið. Fundu þeir þá ekki skálann en sáu ösku þar, hrúgu mikla, og þar í fundu þeir mannabein mörg, þóttust nú vita að sæluhúsið mundi hafa brunnið allt upp og þeir menn sem þar höfðu í verið. Þeir spurðu hvort Grettir hefði ollað þessu óhappi og sögðu þetta hið mesta illvirki. Grettir kvað nú það fram komið er hann grunaði að þeir mundu honum illa eldsóknina launa og segir illt ódrengjum lið að veita. Af þessu fékk Grettir svo mikið ólið að kaupmenn sögðu hvar sem þeir komu að Grettir hefði þessa menn inni brennt.", "Það fréttist nú brátt að í þessu húsi höfðu þeir látist Þórissynir úr Garði sem fyrr voru nefndir og fylgdarmenn þeirra. Nú ráku þeir Gretti í burt úr skipinu og vildu ekki hafa hann með sér. Varð hann nú svo fyrirlitinn að nær öngvir vildu honum gott gera. Þótti honum nú allóvænt horfa og vildi nú fyrir hvern mun fara á konungs fund og leitaði nú norður til Þrándheims. Þar var konungur fyrir og hafði spurt allt þetta áður Grettir kom. Var hann allmjög affluttur fyrir konunginum. Var Grettir nokkura daga í bænum áður hann næði að ganga á konungs fund."], "recap": ["Þórir Skeggjason er höfðingi mikill í Aðaldal, synir hans eru Þorgeir og Skeggi, báðir efnilegir menn og fullvaxnir.\nÞórir hafði verið í Noregi þegar Ólafur konungur kom til Noregs og voru þeir kærir vinir.\nNú þegar Ólafur hafði náð völdum yfir Noregi sendir Þórir syni sína Þorgeir og Skeggja utan til að gerast hermenn konungs. Þeir koma sunnarlega að Noregi og ætla að gista þar nokkrar nætur áður en þeir finna konung, vel fer um þá í hlýju húsi, þeir eiga nægan mat og drykk og hætta sér ekki út þegar veður er vont.\nGrettir kemur nú til Noregs með skipinu sem hann hafði fengið far með, þeir lenda í vondu veðri og kulda og komast af skipinu inn á sléttlendi við fjörð að kveldi og eru mjög kaldir.\nÞeir hafa engan eld til að hlýja sér og hafa áhyggjur af því að þeir muni hreinlega deyja úr kulda.\nÞeir sjá þá eld í húsi hinum megin fjarðarins og velta fyrir sér hver geti farið þangað til að fá eld til að hlýja þeim og bjarga frá köldum dauða.\nSvo ferð að Grettir tekur að sér að fara og sækja eld eftir að hafa verið beðinn um það af samferðarmönnum en segir:\n,,Eigi líst mér mikið þrekvirki að ná eldinum en eigi veit eg hvort þér launið betur en sá fer á leit er það gerir.”\nGettir telur að samferðarmenn hans muni ekki launa honum vel fyrir ferðina en þeir lofa öllu fögru.", "Svo fer að Grettir heldur af stað til að sækja eldinn og ætlar að synda yfir fjörðinn að húsinu, hann er klæddur í kufl (síð yfirhöfn úr vaðmáli) og vaðmálsbuxur, bindur um sig fötin með bastbandi og er svo með kerald til að geyma í eldinn.\nGrettir kemur að landi hinum megin og er mjög kaldur og föt hans freðin og útlit frekar stórkarlalegt og ógnvekjandi í myrkrinu.\nGrettir sér hvar hús stendur við bakkann og heyrir hann glaum og gleði óma frá húsinu og sér eld lýsa, þetta var húsið sem synir Þóris Skeggjasonar, Þorgeir og Skeggi, dvöldust í og voru þetta þeir ásamt tíu öðrum mönnum við drykkju og skemmtun.\nÍ húsinu var mikill hálmur, mjög eldfimur, og mikill eldur logaði til að halda hita á mönnum.\nGrettir ræðst inn í húsið, eins og tröll í útliti eftir sjósundið og frostið, og verða menn hræddir við að þarna sem kominn einhver óvættur sem ætli að gera þeim mein.\nUppi verður fótur og fit, mennirnir tólf ráðast að Gretti og berja hann, eldur breiðist út um húsið og mikill reykur, Grettir kemst út með eld fyrir sig og sinn hóp en þegar hann yfirgefur húsið eru aðrir á lífi.\nHann syndir aftur yfir fjörðinn og fagna samferðarmenn hans honum mjög því þeim sé nú borgið frá því að deyja úr kulda.", "Morguninn eftir vakna Grettir og samferðamenn við gott veður, fara á skip sitt og sigla yfir fjörðinn því þeir ætla að finna þá sem hafi verið svo góðir að gefa Gretti eldinn.\nÞegar þeir koma yfir finna þeir hins vegar engan skála heldur bara brunarústir og fjölmörg mannabein.\nSamferðamenn Grettis reiðast og saka hann um það illvirki að hafa brennt mennina inni þegar hann sótti eldinn.\nGrettir segir þar með komna fram þá spá sína að ekki myndu þeir launa honum vel fyrir að sækja eldinn.\nSamferðamennirnir snúast nú gegn Gretti og skilja leiðir en þeir segja hvar sem þeir koma frá því að Grettir hafi brennt mennina tólf inni viljandi og hafi það verið Þórissynir og félagar þeirra.\nGrettir vill komast sem fyrst á fund konungs en fréttirnar af brunanum komast til Konungs á undan Gretti og hefur Grettir verið baktalaður mjög við konung."]}, {"num": 39, "paras": ["Það var einn dag þá er konungur sat að málstefnu að Grettir gekk fyrir konunginn og kvaddi hann vel.", "Konungur leit við honum og mælti: \"Ertu Grettir hinn sterki?\"", "Hann svarar: \"Kallaður hefi eg svo verið og er eg af því hér kominn að eg vænti af yður nokkurrar linunar um það illmæli er mér hefir kennt verið en eg þykist þessa eigi valdur.\"", "Ólafur konungur mælti: \"Ærið ertu gildur en eigi veit eg hverja gæfu þú berð til að hrinda þessu máli af þér. En líkara væri að þú hefðir eigi viljandi mennina inni brennt.\"", "Grettir kvaðst gjarna vilja af sér koma þessu ámæli ef konungi þætti það vera mega. Konungur bað hann satt frá segja hversu farið hefði með þeim.", "Grettir sagði þá allt sem áður var greint og það með að þeir lifðu allir er hann komst út með eldinn \"vil eg nú bjóða mig til slíkrar undanfærslu sem yður þykja lög til standa.\"", "Ólafur konungur mælti þá: \"Unna viljum vér þér að bera járn fyrir þetta mál ef þér verður þess auðið.\"", "Gretti líkaði það allvel. Tók hann nú að fasta til járnsins og leið til þess er sá dagur kom er skírslan skyldi fram fara. Þá gekk konungur til kirkju og biskup og fjöldi fólks því að mörgum var forvitni á að sjá Gretti, svo mikið sem af honum var sagt. Síðan var Grettir til kirkju leiddur. Og er hann kom til kirkjunnar litu þeir margir til hans er fyrir voru og töluðu þeir að hann væri ólíkur flestum mönnum fyrir sakir afls og vaxtar. Gekk Grettir nú innar eftir gólfinu.", "Þá hljóp fram piltur einn frumvaxta, heldur sviplegur, og mælti til Grettis: \"Undarlegur háttur er nú hér í landi þessu þar sem menn skulu kristnir heita að illvirkjar og ránsmenn og þjófar skulu fara í friði og gera þeim skírslur. En hvað mundi illmenninu fyrir verða nema forða lífinu meðan hann mætti? Hér er nú einn ódáðamaðurinn er sannreyndur er að illvirkjum og hefir brennt inni saklausa menn og skal hann þó enn ná undanfærslu og er þetta allmikill ósiður.\"", "Hann fór að Gretti og rétti honum fingur og skar honum höfuð og kallaði hann margýgjuson og mörgum öðrum illum nöfnum. Gretti varð skapfátt mjög við þetta og gat þá eigi stöðvað sig. Grettir reiddi þá upp hnefann og sló piltinn undir eyrað svo að hann lá þegar í óviti en sumir segja að hann væri dauður þá þegar. En engi þóttist vita hvaðan sjá piltur kom eða hvað af honum varð en það ætla menn helst að það hafi verið óhreinn andi sendur til óheilla Gretti.", "Nú varð hark mikið í kirkjunni og var nú sagt til konunginum að sá barðist um sem járnið skyldi bera.", "Ólafur konungur gekk nú fram í kirkjuna og sá hvað um var og mælti: \"Mikill ógæfumaður ertu Grettir,\" segir konungur, \"er nú skyldi eigi skírslan fram fara svo sem nú var allt til búið og mun eigi hægt að gera við ógæfu þinni.\"", "Grettir svarar: \"Það hafði eg ætlað að eg mundi meiri sæmd til yðvar sækja herra en nú horfist á fyrir sakir ættar minnar\" og sagði hversu mönnum var farið með þeim Ólafi konungi sem fyrr var talað.", "\"Vildi eg nú gjarna,\" sagði Grettir, \"að þér takið við mér. Hafið þér þá marga með yður að ekki mun víglegri þykja en eg.\"", "\"Sé eg það,\" sagði konungur, \"að fáir menn eru nú slíkir fyrir afls sakir og hreysti sem þú ert en miklu ertu meiri ógæfumaður en þú megir fyrir það með oss vera. Nú skaltu fara í friði fyrir mér hvert er þú vilt vetrarlangt en að sumri far þú út til Íslands því að þar mun þér auðið verða þín bein að bera.\"", "Grettir svarar: \"Eg vildi fyrst færast undan brennumálinu ef eg mætti því að það hefi eg eigi viljandi gert.\"", "\"Það er alllíklegt,\" segir konungur, \"en fyrir sakir þess að nú ónýttist skírslan fyrir sakir þolleysis þíns þá muntu þessu máli ekki framar fá af þér hrundið en svo sem nú er orðið og hlýtur jafnan illt af athugaleysinu. Og ef nokkrum manni hefir verið fyrirmælt þá mun þér hóti helst.\"", "Eftir það dvaldist Grettir í bænum nokkra stund og fékk ekki meira af Ólafi konungi en nú var sagt. Síðan fór hann suður í land og ætlaði austur til Túnbergs að finna Þorstein drómund bróður sinn. Og er ekki sagt af hans ferðum fyrr en hann kom austur á Jaðar."], "recap": ["Grettir kemur á fund konungs, konungur spyr hvort hann sér Grettir hinn sterki og Grettir svarar að svo hafi hann verið kallaður.\nGrettir biður konung að hlusta á sig, hann hafi ekki framið það ódæðisverk sem hann sé sakaður um, að brenna inni Þórissyni og hans menn, heldur hafi það verið slys, að mennirnir hafi verið á lífi þegar hann yfirgaf húsið með eldinn.\nGrettir biður konung um tækifæri til að hreinsa mannorð sitt á þann veg sem konungi þyki sæma.\nKonungur býður þá Gretti að fremja skírslu til að sanna sakleysi sitt og Grettir fellst á það:\nGrettir fastaði til að undirbúa sig og átti svo að mæta í kirkju þar sem hann myndi bera glóandi járn í hanskalausri hendi nokkur skref, eftir það var svo búið um höndina, þremur dögum síðar var höndin skoðuð og ef hún væri heil þá þótti sakleysi Grettis sannað. \nGrettir mætir til kirkju til að fremja skírsluna og er fjöldi fólks þar til að fylgjast með en auk þess konungur og biskup, fólk hefur orð á að Grettir sé stærri og sterkari en flestir aðrir menn.", "Grettir gengur innar eftir kirkjugólfinu en þá stekkur fram unglingsdrengur, svipljótur og ófrýnilegur, blótar Gretti, kallar hann alls kyns illum nöfnum og skammast yfir því að hann fái tækifæri til að hreinsa sig af þeim glæp sem hann hefur framið, drengurinn sýnir Gretti svo fingurinn á óviðeigandi hátt og dregur fingur eftir hálsi eins og til að boða Gretti dauða.\nGrettir reiðist mjög og getur ekki hamið sig svo hann kýlir drenginn, einhverjir segja að hann hafi misst meðvitund en aðrir að hann hafi dáið við höggið.\nDrengurinn hverfur jafn skjótt og hann birtist og enginn kannast við hann en menn telja helst að þar hafi verið á ferð óhreinn andi sendur Gretti til óheilla (mögulega móri á vegum Gláms?).\nEftir þessi læti fer svo að konungur vill ekki leyfa Gretti að hreinsa mannorð sitt með því að fremja skírslu, þrátt fyrir mótbárur Grettis.\nKonungur vill heldur ekki leyfa Gretti að vera hjá sér, þrátt fyrir afl hans, þar sem konungur telur hann ógæfumann, konungur leyfir honum þó að vera í friði yfir veturinn í Noregi en segir að svo verði hann að fara heim til Íslands aftur.\nGrettir yfirgefur konung og heldur af stað suður til Túnbergs að finna Þorstein drómund hálfbróður sinn."]}, {"num": 40, "paras": ["Að jólum kom Grettir til þess bónda er Einar hét. Hann var ríkur maður og kvæntur og átti dóttur gjafvaxta er Gýríður er nefnd. Hún var fríð kona og þótti harla góður kostur. Einar bauð Gretti með sér að vera um jólin og það þá hann.", "Það var þá víða í Noregi að markarmenn og illvirkjar hlupu ofan af mörkum og skoruðu á menn til kvenna en tóku á burt fé manna með ofríki ef eigi var liðsfjöldi fyrir.", "Svo bar hér til að það var einn dag á jólunum að komu til Einars bónda illvirkjar margir saman. Hét sá Snækollur sem fyrir þeim var. Hann var berserkur mikill. Hann skoraði á Einar bónda að hann skyldi leggja upp við hann dóttur sína eða verja hana ef hann þættist maður til. En bóndi var þá af æskuskeiði og engi styrjaldarmaður.", "Þótti honum nú mikill vandi að höndum kominn og spurði Gretti í hljóði hvað hann vildi til leggja \"því að þú ert kallaður frægur maður.\"", "Grettir bað hann því einu játa er honum þætti sér smánarlaust. Berserkurinn sat á hesti og hafði hjálm á höfði og ekki spennt kinnbjörgunum. Hann hafði skjöld járni rendan fyrir sér og lét hann hið ógurlegasta.", "Hann mælti við bónda: \"Kjós skjótt annan hvorn kostinn. Eða hvað ræður sá þér hinn mikli hrottinn er þar stendur hjá þér eða er ekki það að hann vilji eiga leik við mig?\"", "Grettir segir: \"Jafnkomið er á með okkur bónda því að hér er hvorgi skefjumaður.\"", "Snækollur mælti: \"Heldur mun ykkur ægja við mig að fást ef eg reiðist.\"", "\"Þá veit það er reynt er,\" segir Grettir.", "Berserkurinn fann nú undandrátt í málinu. Tók hann þá að grenja hátt og beit í skjaldarröndina og setti skjöldinn upp í munn sér og gein yfir hornið skjaldarins og lét allólmlega. Grettir varpaði sér um völlinn. Og er hann kemur jafnfram hesti berserksins slær hann fæti sínum neðan undir skjaldarsporðinn svo hart að skjöldurinn gekk upp í munninn svo að rifnaði kjafturinn en kjálkarnir hlupu ofan á bringuna. Hann hafði þá allt eitt atriðið að hann þreif í hjálminn vinstri hendi og svipti víkinginum af baki en hægri hendi brá hann saxinu er hann var gyrður með og setti á hálsinn svo af tók höfuðið. En er þetta sáu fylgdarmenn Snækolls flýði sinn veg hver þeirra. Ekki nennti Grettir að elta þá því hann sá að engi var hugur í þeim. Þakkaði bóndi honum vel fyrir þetta verk og margir menn aðrir. Þótti þessi atburður bæði vera af hvatleik og harðfengi unninn.", "Var Grettir þar um jólin vel haldinn. Leysti bóndi hann vel af garði. Fór Grettir síðan austur til Túnbergs og hitti Þorstein bróður sinn. Tók hann við Gretti með blíðu og spurði að ferðum hans og að hann vann berserkinn.", "Grettir kvað vísu:", "Snart á snæðings porti", "Snækolls þrimu rækis", "ímunbukl, það er ökla", "áspyrnu fékk þyrnis.", "Svo tvískipti tóptum", "tanngarðs hinn járnvarði", "brodda gangs, að á bringu,", "bálkr, rifnuðu kjálkar.", "Þorsteinn mælti: \"Slyngt yrði þér um margt frændi ef eigi fylgdu slysin með.\"", "Grettir svarar: \"Þess verður þó getið er gert er.\""], "recap": ["Á leið sinni til Þorsteins fær Grettir inni að jólum hjá bónda sem heitir Einar, ríkur maður og kvæntur og á dóttur sem er fríð og þykir góður kostur.\nEinn dag um jólin koma margir illvirkjar/berserkir saman til Einars til að ræna og rupla, Snækollur heitir sá sem fer fyrir hópnum.\nSnækollur skorar á Einar að gefa sér dóttur sína eða berjast við sig um hana en hann er orðinn gamall maður og ræður illa við Snækoll.\nGrettir berst þess í stað við Snækoll sem er mjög vel útbúinn og lætur mjög ófriðlega, gengur berserksgang.\nSvo fer að Grettir særir Snækoll þannig að skjöldurinn hans sker kjálkann frá andlitinu og eftir það heggur Grettir höfuðið af honum. \nMenn Snækolls verða hræddir við þennan atgang og flýja af hólmi, Grettir nennir ekki að elta þá en bóndi er honum ákaflega þakklátur og er Grettir hjá honum í góðu yfirlæti um jólin.\nEftir það fer hann að hitta Þorstein drómund hálfbróður sinn sem fagnar honum vel:\nSlyngt yrði þér um margt frændi ef eigi fylgdu slysin með.” - Margt gengi þér í haginn ef þessi slys fylgdu ekki alltaf með líka."]}, {"num": 41, "paras": ["Nú var Grettir með Þorsteini það sem eftir var vetrarins og fram á vorið.", "Það var einn morgun er þeir bræður Þorsteinn og Grettir lágu í svefnlofti sínu að Grettir hafði lagið hendur sínar undan klæðunum. Þorsteinn vakti og sá það. Grettir vaknaði litlu síðar.", "Þá mælti Þorsteinn: \"Séð hefi eg handleggi þína frændi,\" segir hann, \"og þykir mér eigi undarlegt þó að mörgum verði þung högg þín því að einskis manns handleggi hefi eg slíka séð.\"", "\"Vita máttir þú það,\" sagði Grettir, \"að eg mundi ekki slíku til leiðar koma sem eg hefi unnið ef eg væri eigi allknár.\"", "\"Betur þætti mér,\" segir Þorsteinn, \"þó að væru mjórri og nokkuru gæfusamlegri.\"", "Grettir segir: \"Satt er það sem mælt er að engi maður skapar sig sjálfur. Láttu mig nú sjá þína handleggi,\" segir hann.", "Þorsteinn gerði svo. Hann var manna lengstur og grannvaxinn.", "Grettir brosti að og mælti: \"Eigi þarf að horfa á þetta lengur. Krækt er saman rifjum í þér og eigi þykist eg slíkar tengur séð hafa sem þú berð eftir og varla ætla eg þig kvenstyrkan.\"", "\"Vera má það,\" sagði Þorsteinn, \"en þó skaltu það vita að þessir hinir mjóvu handleggir munu þín hefna, ella mun þín aldrei hefnt verða.\"", "\"Hvað má vita hversu verður um það er lýkur?\" sagði Grettir, \"en allólíklegt þykir mér það vera.\"", "Eigi er þá getið fleira um viðurtal þeirra. Leið nú á vorið. Kom Grettir sér í skip og fór út til Íslands um sumarið. Skildu þeir bræður með vináttu og sáust aldrei síðan."], "recap": ["Grettir er hjá Þorsteini bróður sínum það sem eftir er vetrar og fram á vor.\nEinn morgun liggja þeir á svefnlofti bæjarins og berst þá líkamsbygging þeirra í tal.\nÞorsteinn segir Gretti mjög sterklega byggðan, handleggir hans séru svo sverir að ekki sé skrítið að mönnum þyki högg hans þung.\nGrettir svarar að hann hefði ekki unnið frægðarverk sín ef ekki væri hann svona sterkur.\nÞorsteinn svarar þá að hann hefði heldur valið að Grettir væri örlítið rýrari og gæfusamlegri.\nGrettir segir þá að enginn maður skapi sig sjálfur, þetta sé ekki á hans valdi, og biður svo um að sjá handleggi Þorsteins.\nÞorsteinn, sem er hávaxinn maður og mjög grannur, sýnir sína handleggi og Grettir gerir þá grín að því að hann hafi líklega ekki einu sinni styrk á við kvenmann.\nÞorsteinn svarar þá að svo megi vera en Grettir megi vita það að þessir mjóu handleggir muni verða þeir sem hans síðar hefni en Grettir segist ekki gott að vita hvað framtíðin beri í skauti sér og féll svo niður þetta tal þeirra.\nLíður nú á vorið og kemur Grettir sér í skip og fer til Íslands um sumarið. \nÞeir bræður Þorsteinn og Grettir skiljast með mikilli vináttu en sjást aldrei aftur eftir þetta."]}, {"num": 42, "paras": ["Þar er nú til að taka er áður er frá horfið að Þorbjörn öxnamegin spurði víg Þorbjarnar ferðalangs sem fyrr var sagt. Brást hann reiður mjög og kveðst vilja að ýmsir ættu högg í annars garði.", "Ásmundur hærulangur lá lengi sjúkur um sumarið og er honum þótti að sér draga heimti hann til sín frændur sína og sagði að hann vildi að Atli tæki við allri fjárvarðveislu eftir hans dag \"en uggir mig,\" sagði Ásmundur, \"að þú megir varla í kyrrðum sitja fyrir ójafnaði. En það vildi eg að allir mínir tengdamenn sinnuðu honum sem best. En til Grettis kann eg ekki að leggja því að mér þykir á hverfanda hjóli mjög um hans hagi. Og þó hann sé sterkur maður þá uggir mig að hann eigi meir um vandræði að véla en fulltingja frændum sínum. En þótt Illugi sé ungur þá mun hann þó verða þroskamaður ef hann heldur sér heilum.\"", "Og er Ásmundur hafði skipað með sonum sínum sem hann vildi dró að honum sóttin. Andaðist hann litlu síðar og var jarðaður að Bjargi, því að Ásmundur hafði látið gera þar kirkju, og þótti héraðsmönnum það mikill mannskaði.", "Atli gerðist nú gildur bóndi og hafði mannmargt með sér. Hann var aðfangamaður mikill. Að áliðnu sumri fór hann út á Snjófellsnes að fá sér skreið. Hann rak marga hesta og reið heiman til Mela í Hrútafjörð til Gamla mágs síns. Réðst þá til ferðar með Atla Grímur Þórhallsson, bróðir Gamla, við annan mann. Riðu þeir Haukadalsskarð vestur og svo sem liggur út á Nes, keyptu þar skreið mikla og báru á sjö hestum, sneru heimleiðis er þeir voru albúnir."], "recap": ["Frá Íslandi er það að segja að Þorbjörn öxnamegin frétti af því að Grettir hefði vegið Þorbjörn ferðalang frænda hans (kafli 37), verður mjög reiður yfir því og finnst hann hafa ástæðu til að hefna.\nÁsmundur hærulangur er langt leiddur af sótt, hann vill að Atli taki við búi á Bjargi og fjárvarðveislu, vonast til þess að hann fái aðstoð frá bræðrum sínum en óttast þó að Atli muni lenda í óhjákvæmilegum deilum.\nÁsmundur hefur áhyggjur af Gretti, finnst líf hans mjög óstöðugt og telur líklegra að hann komi sér í vandræði en að hann geti aðstoðað Atla við búið og fjárvarðveisluna.\nÁsmundur telur svo að Illugi, sem er enn mjög ungur, muni þroskast vel ef hann heldur sér heilum.\nSkömmu síðar andast Ásmundur og er grafinn að Bjargi þar sem hann hafði látið gera kirkju og þykir héraðsmönnum dauði hans mikill mannskaði.\nAtli tekur við búinu og sinnir vel, hefur marga menn í vinnu og er hörku duglegur.\nUm haustið fer hann út á Snæfellsnes til að fá sér skreið, hann kemur við hjá Rannveigu systur sinni í Hrútafirði, Grímur, bróðir Gamla mágs Atla, fer með að ná í skreiðina og bera þeir hana á sjö hestum heim aftur."]}, {"num": 43, "paras": ["Þorbjörn öxnamegin spurði að Atli og Grímur voru heiman farnir. Voru hjá honum Þórissynir frá Skarði, Gunnar og Þorgeir. Þorbirni lék öfund á vinsældum Atla og því eggjaði hann þá bræður Þórissonu að þeir skyldu sitja fyrir Atla er þeir færu utan af Nesinu. Riðu þeir þá heim til Skarðs og biðu þar til þess er þeir Atli fóru upp um með lestina. En er þeir komu fram um bæinn á Skarði þá var sén för þeirra. Brugðu þeir bræður þá skjótt við með húskarla sína og riðu eftir þeim.", "En er þeir Atli sáu ferð þeirra bað hann þá taka ofan klyfjarnar af hestunum \"og munu þeir vilja bjóða mér bætur fyrir húskarl minn er Gunnar drap í fyrra sumar. Orkum ekki á fyrri en verjum hendur vorar ef þeir vekja fyrri við oss.\"", "Nú koma hinir að og hlaupa þegar af baki. Atli fagnar þeim og spurði að tíðindum \"eða viltu bæta mér nokkuru Gunnar fyrir húskarl minn?\"", "Gunnar svarar: \"Annars væruð þér verðir Bjargsmenn en eg bæti það góðu. Væri og meiri bóta vert fyrir víg Þorbjarnar er Grettir vó.\"", "\"Ekki á eg því að svara,\" sagði Atli, \"enda ertu ekki aðili þess máls.\"", "Gunnar kvað nú fyrir það ganga mundu \"og göngum að þeim og neytum þess nú að Grettir er nú eigi nærri.\"", "Þeir hlupu að Atla og voru átta saman en þeir Atli sex saman. Atli gekk fram fyrir sína menn og brá sverðinu Jökulsnaut er Grettir hafði gefið honum.", "Þá mælti Þorgeir: \"Margt er líkt með þeim er góðir þykjast. Ofarlega bar Grettir saxið í fyrra sumar á Hrútafjarðarhálsi.\"", "Atli svarar: \"Hann mun og vanari við stórvirkin en eg.\"", "Síðan börðust þeir. Gunnar sótti að Atla með ákefð og var hinn óðasti.", "Og er þeir höfðu barist um stund mælti Atli: \"Engi frami er í því að við drepum verkmenn hvor fyrir öðrum og er það næst að við sjálfir leikumst við því að eg hefi aldrei með vopnum vegið fyrr en nú.\"", "Gunnar vildi það eigi.", "Atli bað húskarla sína að geyma að lestinni \"en eg mun sjá hvað þeir gera að\" gekk þá svo hart fram að þeir Gunnar hrukku fyrir. Drap Atli þar tvo fylgdarmenn þeirra bræðra. Eftir það sneri hann á móti Gunnari og hjó til hans svo að í sundur tók skjöldinn fyrir neðan mundriða um þvert og kom á fótinn fyrir neðan knéð. Og þegar hjó hann annað högg svo að það varð að banasári.", "Nú er að segja frá Grími Þórhallssyni að hann réðst á móti Þorgeiri og áttust þeir lengi við því að hvortveggi þeirra var hraustur maður. Þorgeir sá fall Gunnars bróður síns. Vildi hann þá undan leita. Grímur hljóp eftir honum og elti hann þar til að Þorgeir drap fæti og féll áfram. Þá hjó Grímur með öxi milli herða honum svo stóð á kafi. Þá gáfu þeir grið fylgdarmönnum þeirra þremur sem eftir voru. Eftir það bundu þeir sár sín og hófu upp klyfjar á hestana og fóru síðan heim og lýstu vígum þessum.", "Sat Atli þá heima með fjölmenni um haustið. Þorbirni öxnamegin líkaði stórilla og gat þó ekki að gert því að Atli var mjög vinsæll. Grímur var með honum veturinn og svo Gamli mágur hans. Þar var þá og Glúmur Óspaksson, annar mágur hans. Hann bjó þá á Eyri í Bitru. Höfðu þeir setu fjölmenna á Bjargi og var þar glaumur mikill um veturinn."], "recap": ["Þorbjörn öxnamegin fréttir af ferðum Alta og Gríms en hann er öfundsjúkur út í Atla fyrir vinsældir hans í samfélaginu og vill einnig hefna fyrir vígið á Þorbirni frænda sínum ferðalangi sem Grettir drap.\nGunnar og Þorgeir Þórissynir, sem einnig voru með í bardaganum í kafla 30 (Gunnar drap húskarl Atla), eru með Þorbirni og manar Þorbjörn þá til að sitja fyrir Atla og Grími þegar þeir koma af Snæfellsnesi.\nAtli spyr Gunnar hvort hann sé kominn til að bæta sér víg Atla húskarls síns en Gunnar segir að frekar ætti að greiða bætur fyrir Þorbjörn ferðalang sem Grettir vó.\nAtli segir það mál ekki koma Gunnari við þar sem hann sé ekki aðili að því en Gunnar er ósammála og hvetur menn sína til bardaga við Atla og hans menn og muni þeir nú njóta þess að Grettir sé ekki nærri til að aðstoða Atla.\nAtli berst við Gunnar og Grímur við Þorgeir, Atli er vopnaður sverðinu Jökulsnaut sem Grettir hafði gefið honum og fer svo að hann heggur Gunnar banasári, Grímur drepur einnig Þorgeir.\nAtli og Grímur fara heim á Bjarg og eru þar um veturinn ásamt Gamla mági Atla og fleirum, gott orð fer af Atla og vinsældir hans aukast. \nÞorbjörn Öxnamegin unir stórilla við sinn hlut."]}, {"num": 44, "paras": ["Þorbjörn öxnamegin tók við eftirmáli um víg Þórissona. Bjó hann málið til á hendur þeim Grími og Atla en þeir bjuggu til varna um aðfarir og frumhlaup til óhelgi þeim bræðrum. Voru málin lögð til Húnavatnsþings og fjölmenntu mjög hvorirtveggju. Varð Atla gott til liðs því að hann átti frændafla mikinn. Gengu þá að beggja vinir, töluðu um sættir og sögðu allir að Atla væri vel um farið, ótilleitinn en þó öruggur í einangri. Þóttist Þorbjörn sjá að eigi mundi annað virðingarvænna en taka sættinni. Skildi Atli það til að hann vildi hafa hvorki héraðssektir né utanferðir.", "Voru þá teknir menn til gerðar, Þorvaldur Ásgeirsson fyrir hönd Atla, en af Þorbjarnar hendi var Sölvi hinn prúði. Hann var son Ásbrands Þorbrandssonar, Haraldssonar hrings er numið hafði Vatnsnes allt utan til Ambáttarár fyrir vestan en fyrir austan allt inn til Þverár og þar yfir um þvert til Bjargaóss og allt þeim megin Bjarga út til sjóvar. Sölvi var ofláti mikill og vitur maður og því kjöri Þorbjörn hann fyrir til gerðar fyrir sína hönd.", "Og eftir það sögðu þeir upp gerðina, að þá Þórissonu skyldi bæta hálfum bótum en hálfar féllu niður fyrir aðför og frumhlaup og fjörráð við Atla. Víg húskarls Atla þess er var drepinn á Hrútafjarðarhálsi, stóðst það á endum og þeirra tveggja er féllu með Þórissonum. Grímur Þórhallsson skyldi láta héraðsvist sína en Atli vildi einn halda upp fébótum.", "Þessi gerð líkaði Atla vel en Þorbirni heldur illa og skildu þó sáttir að kalla en þó hraut það upp fyrir honum Þorbirni að eigi mundi fyrir enda um gert með þeim ef svo færi sem hann vildi. Atli reið heim af þinginu og þakkaði Þorvaldi vel fyrir liðveislu sína. Grímur Þórhallsson réðst þá suður í Borgarfjörð og bjó þá að Gilsbakka og var gildur bóndi."], "recap": ["Þorbjörn öxnamegin tekur við eftirmáli um víg Gunnars og Þorgeirs Þórissona.\nHann sækir Grím og Atla til saka fyrir víg þeirra bræðra en Grímur og Atli bera við að um sjálfsvörn hafi verið að ræða þar sem þeir bræður hafi ráðist á þá.\nAtli hefur gott stuðningsnet og fer svo að hann þarf aðeins að greiða hálfar bætur fyrir þá bræður en Grími er hins vegar gert að flytjast úr héraðinu. \nAtli unir vel við sinn hlut og fer sáttur heim af þingi og Grímur flyst suður í Borgarfjörð og gerist þar bóndi á bænum Gilsbakka.\nÞorbjörn öxnamegin er hins vegar ósáttur við málalok og finnst á sig halla."]}, {"num": 45, "paras": ["Sá maður var með Þorbirni öxnamegin er Áli hét. Hann var húskarl og heldur ógæfur og vinnulítill. Þorbjörn bað hann starfa betur ella kveðst hann mundu lemja hann. Áli kvað þess öngan fýst hafa og var hinn kífnasti í móti. Þorbjörn þoldi honum eigi og rak hann niður undir sig og fór með hann illa.", "Eftir það fór Áli brott úr vistinni og fór norður yfir háls til Miðfjarðar. Létti eigi fyrr en hann kom til Bjargs. Atli var heima og spurði hvert hann skyldi fara. Hann kvaðst leita sér vistar.", "\"Ertu eigi vinnumaður Þorbjarnar?\" kvað Atli.", "\"Ei fór það svo keypilega með okkur,\" segir Áli. \"Eg var þar ekki lengi en mér þótti illt meðan eg var. Skildum við svo að mér þótti hann ekki vel syngja að kverkum mér og mun eg þangað aldrei fara til vistar hvað sem annað verður af mér. Er það og satt að mikill munur er hvorum ykkar verður betur til hjóna sinna. Vildi eg gjarna nú vinna hjá þér ef þess væri kostur.\"", "Atli svarar: \"Nóga hefi eg vinnumenn þó að ekki seilist eg í hendur Þorbirni til þeirra manna er hann hefir ráðið en mér þykir þú þollaus og far aftur til hans.\"", "Áli mælti: \"Þar kem eg eigi ónauðigur.\"", "Nú dvaldist Áli þar um stund. Einn morgun fór hann til verks með þeim húskörlum Atla og vann svo að hvaðanæva voru á honum hendurnar. Lét Áli svo ganga fram á sumarið. Atli lagði ekki til hans en lét þó gefa honum mat því að honum líkaði starfinn vel.", "Þorbjörn fréttir nú að Áli er á Bjargi. Hann reið þá til Bjargs við þriðja mann og kallaði Atla til tals við sig. Atli gekk út og heilsaði þeim.", "Þorbjörn mælti: \"Enn viltu endurnýja við mig Atli um mótgang og áleitni. Eða því hefir þú tekið vinnumann minn og er slíkt óskilríkilega gert?\"", "Atli svarar: \"Ekki er mér það sýnt að hann sé þinn vinnumaður. En ekki vil eg á honum halda ef þú sýnir skilríki til að hann sé þitt hjón. En ekki nenni eg draga hann úr húsum út.\"", "\"Þú munt ráða að sinni,\" sagði Þorbjörn, \"en kref eg mannsins og fyrirbýð eg vinnu hans. En koma mun eg annað sinn og er eigi víst að við skiljumst þá betri vinir en nú.\"", "Atli svarar: \"Heima mun eg bíða og taka við því sem að höndum kemur.\"", "Síðan reið Þorbjörn heim. En er verkmenn komu heim um kveldið segir Atli þá viðurtal þeirra Þorbjarnar og bað Ála fara leið sína og sagðist ekki vildu dvelja vist hans.", "Áli svarar: \"Satt er hið fornkveðna, ofleyfingarnir bregðast mér mest. Og ætlaði eg það eigi að þú mundir nú reka mig á brottu þar sem eg hefi unnið hér til sprengs í sumar og vonað til þess að þú mundir mér nokkura forstöðu veita en þann veg farið þér þó að þér látið allgóðvættlega. Nú skal mig hér lemja fyrir augum þér ef þú vilt mér öngva forstöðu veita eða hjálp.\"", "Atla gekkst hugur við um tal hans og nennti nú eigi að reka hann á brottu frá sér. Leið nú þar til er menn tóku til sláttar.", "Það var einn dag nokkuru fyrir miðsumar að Þorbjörn öxnamegin reið til Bjargs. Hann var svo búinn að hann hafði hjálm á höfði og gyrður við sverð og spjót í hendi. Það var fjaðraspjót og breið mjög fjöðurin. Væta var úti um daginn. Atli hafði sent húskarla sína til sláttar en menn hans sumir voru norður við Horn til afla. Atli var heima og fáir menn aðrir.", "Þorbjörn kom þar nær hádegi um daginn. Hann var einn í ferð og reið að útidyrum. Aftur var hurð en öngvir menn úti. Þorbjörn drap á dyr og fór síðan á bak húsum svo að mátti ekki sjá hann frá dyrunum heiman. Menn heyrðu að barið var og gekk út kona ein. Þorbjörn hafði svip af konunni og lét ekki sjá sig því að hann ætlaði annað að vinna. Hún kom í stofu. Atli spurði hvað komið var. Hún kvaðst ekki hafa séð komið úti. Og er þau töluðu þetta þá laust Þorbjörn mikið högg á dyrnar.", "Þá mælti Atli: \"Mig vill sjá finna og mun hann eiga erindið við mig hversu þarft sem er.\"", "Gekk hann þá fram og út í dyrnar. Hann sá öngvan úti. Væta var úti mikil og því gekk hann eigi út og hélt sinni hendi í hvorn dyrastafinn og litast svo um.", "Í því bili snaraði Þorbjörn fram fyrir dyrnar og lagði tveim höndum til Atla með spjótinu á honum miðjum svo stóð í gegnum hann.", "Atli mælti við er hann fékk lagið: \"Þau tíðkast hin breiðu spjótin,\" segir hann.", "Síðan féll hann fram á þröskuldinn. Þá komu fram konur er í stofunni höfðu verið. Þær sáu að Atli var dauður. Þá var Þorbjörn á bak kominn og lýsti víginu á hendur sér og reið heim eftir það.", "Ásdís húsfreyja sendir eftir mönnum og var búið um lík Atla og var hann jarðaður hjá föður sínum.", "Hann var mjög harmdauður því hann hafði verið bæði vitur og vinsæll. Engi komu fram fégjöld fyrir víg Atla enda beiddist engi bóta því að Grettir átti eftirmálið ef hann kæmi út. Stóðu þessi mál kyrr um sumarið. Varð Þorbjörn lítt þokkaður af þessu verki og sat þó um kyrrt í búi sínu."], "recap": ["Þorbjörn öxnamegin hefur hjá sér húskarl sem heitir Áli, sá er latur og vinnur lítið, Þorbjörn hótar því að lemja hann ef hann vinni ekki betur, Áli þrætir við húsbónda sinn sem endar með því að Þorbjörn lemur Ála.\nEftir þetta strýkur Áli af úr vistinni og fer að Bjargi til Atla og biður hann vistar.\nAtli þekkir að þar er kominn vinnumaður Þorbjörn öxnamegin og segist ekki þurfa fleiri vinnumenn en vill að Áli snúi aftur til Þorbjörns.\nÁli neitar að fara og er hjá Atla og vinnur með hans húskörlum, Atli er nokkuð ánægður með störf hans og leyfir honum því að vera og sér honum fyrir fæði.\nÞorbjörn fréttir af Ála hjá Atla, hann ríður til Bjargs og sakar Atla um að hafa enn einu sinni brotið á sér, nú með því að taka Ála frá sér í leyfisleysi.\nAtli svarar Þorbirni að ekki skuli hann halda Ála ef Þorbjörn geti sýnt fram á að Áli sé hans vinnumaður, annars megi Áli vera á Bjargi áfram.", "Þorbjörn er ósáttur enda í fullum rétti til að krefjast þess að fá Ála aftur þar sem hann hefur brotið lög með því að flýja úr vistinni sem hann hafði ráðið sig í, hann segir þó Atla ráða í þetta sinn en hann muni koma aftur og er óvíst hvernig þeir skilji þá.\nAtli segist munu bíða heima og taka því sem að höndum ber.\nAtli segir Ála að hann geti ekki lengur haft hann í vist en Áli bregst illa við og segir Atla bregðast sér þrátt fyrir sín góðu störf á bænum, svo fer að Atli leyfir honum að vera áfram.\nDag einn kemur Þorbjörn öxnamegin á Bjarg, vopnaður fjaðurspjóti, hann bankar á dyrnar en felur sig þegar kona kemur til dyra, hann bankar svo aftur og þá kemur Atli út.\nÞorbjörn ræðst þá að Atla og stingur hann með spjótinu sem hann heldur á með báðum höndum svo Atli deyr.\nHinstu orð Atla: ,,Þau tíðkast nú hin breiðu spjótin.”\nÁsdís móðir Atla lætur búa um hann og grafa hjá Ásmundi föður hans en mikil eftirsjá er af honum því hann var bæði vinsæll og vitur.\nÞorbjörn öxnamegin lýsir strax víginu á hendur sér en enginn er til að biðja um bætur eða reka mál vegna vígs hans, Grettir er sá sem á að sjá um það en hann er í Noregi."]}, {"num": 46, "paras": ["Þetta sumar er nú var frá sagt kom skip út fyrir þing á Gásum. Var þá sagt frá ferðum Grettis. Þar með sögðu þeir um húsbrennuna. Við þessa sögu varð Þórir í Garði afar reiður og þóttist hann þar að sonarhefndum sjá eiga sem Grettir var. Reið Þórir með fjölmenni mikið og reifði á þingi brennumálið en menn þóttust ekki kunna til að leggja meðan enginn var til svara. Þórir kveðst ekki annað vilja en Grettir væri sekur ger um allt landið fyrir slík óverkan.", "Þá svarar Skafti lögsögumaður: \"Víst er þetta illt verk ef svo er sem þetta er sagt. Jafnan er hálfsögð saga ef einn segir því að fleiri eru þess fúsari að færa þangað sem eigi ber betur ef tvennt er til. Nú mun eg eigi leggja úrskurð á að Grettir sé sekur ger um þetta að svo gervu.\"", "Þórir var maður héraðsríkur og höfðingi mikill en vinsæll af mörgu stórmenni. Gekk hann að svo fast að öngu kom við um sýkn Grettis. Gerði Þórir Gretti þá sekan um allt landið og var honum síðan þyngstur allra sinna mótstöðumanna sem oft bar raun á. Hann lagði oftlega fé til höfuðs honum sem öðrum skógarmönnum, og reið við það heim. Margir mæltu að þetta væri meir gert af kappi en eftir lögum en þó stóð svo búið. Varð nú tíðindalaust fram yfir miðsumar."], "recap": ["Menn koma á skipi frá Noregi með fréttir af brunanum í Noregi og út spyrst að Grettir hafi orðið valdur að því að Þorgeir og Skeggi brunnu inni ásamt mönnum sínum.\nÞórir faðir Þorgeirs og Skeggja verður ákaflega reiður og segist vilja hefna sona sinna, hann fer með fjölmenni mikið á alþingi og vill fá Gretti dæmdan fyrir brennumálið. \nSkafti Þóroddsson lögmaður og fleiri vilja ekki dæma í málinu þar sem Grettir var ekki sjálfur þar til að segja sína hlið og hafði ekki heldur neinn til að tala sínu máli, því lægu ekki fyrir allar upplýsingar sem til þyrfti til að fá úrskurð í málinu.\nÞórir er hins vegar valdamikill höfðingi og gengur svo hart fram að ekki þýddi að ræða að Grettir gæti mögulega verið saklaus, fær hann dæmdan sekan skógarmann og leggur fé til höfuðs honum.\nGrettir er hér 20 ára gamall."]}, {"num": 47, "paras": ["Að áliðnu sumri kom Grettir Ásmundarson út í Hvítá í Borgarfirði. Fóru menn til skips um héraðið. Þessi tíðindi komu öll senn til Grettis, það fyrst að faðir hans var andaður, annað það að bróðir hans var veginn, það þriðja að hann var sekur ger um allt landið.", "Þá kvað Grettir vísu þessa:", "Allt kom senn að svinnum,", "sekt mín, bragar tíni.", "Föður skal drengr af dauða", "drjúghljóðr og svo bróður.", "Þó skal margr í morgun", "mótrunnr Héðins snótar,", "brjótr, um slíkar sútir,", "sverðs, daprari verða.", "Svo segja menn að Grettir brygði öngvan veg skapi við þessar fréttir og var jafnglaður sem áður. Nú sat Grettir við skip um hríð því að hann fékk öngvan fararskjót sem honum gast að.", "Sveinn hét maður er bjó að Bakka upp frá Þingnesi. Hann var góður bóndi og kátur maður og kvað oft svo að gaman var að. Hann átti merhryssi eitt, brúnt að lit, allra hrossa skjótast. Það kallaði Sveinn Söðulkollu.", "Grettir fór eina nótt burt af Völlum því að hann vildi ekki að kaupmenn yrðu varir við. Hann fékk sér svartan kufl og steypti utan yfir klæði og duldist svo. Hann gekk upp hjá Þingnesi og svo upp til Bakka. Var þá ljóst orðið. Hann sá brúnt hross við túnið og fór til og lagði við beisl, steig á bak og reið upp með Hvítá og fyrir neðan Bæ og svo til Flókadalsár og svo upp á götur fyrir ofan Kálfanes. Vinnumenn á Bakka stóðu upp í þann tíma og sögðu til bónda að maðurinn var á bak kominn.", "Hann stóð upp og brosti að og kvað þetta:", "Héðan reið á burt beiðir", "barðéls, nærri garði", "þjófr lét hönd um hrífa,", "hjálmþollr, Söðulkollu.", "Sjá mun Freyr að fleirum", "fullsterkr svaðilverkum", "Þundar skýs en þessu,", "það er heldr að mér belldi.", "Síðan tók hann hest sinn og reið eftir. Grettir reið þar til er hann kom upp fyrir bæinn á Kroppi. Þar fann hann mann er nefndist Halli og kvaðst fara skyldu ofan til skips á Völlu.", "Grettir kvað vísu:", "Segðu í breiðar byggðir,", "bráðlyndr, að þú fyndir", "uppi allt hjá Kroppi,", "álmþollr, Söðulkollu.", "Þar var staddr á steddu,", "strjúk allmikinn, Halli,", "drengr, sá er drýgir löngum", "dufl, í svörtum kufli.", "Og nú skilja þeir og fór Halli ofan eftir götum og allt ofan að Kálfanesi áður Sveinn kom á móti honum. Þeir kvöddust skjótt.", "Þá kvað Sveinn:", "Sáttu, hvar reið hinn reitni,", "raun er oss mikil, hrossi", "slyttimákr, að slíku,", "slægr frá næstum bæjum.", "Héraðsmenn skulu hvinni", "hefning fyrir það nefna.", "Bera skal búk að hvoru", "blán ef eg nái hánum.", "\"Máttu það af því,\" kvað Halli, \"eg fann þann mann er ríða kvaðst Söðulkollu og bað mig það að segja ofan í byggðina og héraðið. Var sá mikill vexti og var í sortum kufli.\"", "\"Eiga þykist hann mikið undir sér,\" kvað bóndi, \"og skal eg vita hver hann er\" og reið síðan eftir honum.", "Grettir kom í Deildartungu. Var þar úti kona.", "Grettir fann hana að máli og kvað vísu:", "Færðu hafloga hirði,", "hefir braut gripið lautar", "áll, vel borin vella,", "vigg, dís, gamanvísu.", "Og vildi svo jöldu", "Yggs líðgjafi ríða", "æst að eg mun gista,", "orðrakkr, að Gilsbakka.", "Konan nam vísuna. Hann reið eftir það leið sína.", "Sveinn kom þar litlu síðar, og var hún eigi inn gengin, og þegar hann kom kvað hann þetta:", "Hverr reið hóti fyrri", "héðan í róstuveðri", "hart á hrossi svörtu", "hjörgráðs boði áðan.", "Hann mun heldr að sönnu", "hundeygr í dag undan,", "djarfr er dáðum horfinn", "drengr sjá, rekast lengi.", "Hún sagði þá slíkt sem henni var kennt.", "Hann hugsaði vísuna og mælti: \"Ei er ólíklegt að þessi maður sé eigi mín leika en þó skal eg finna hann.\"", "Reið hann nú eftir byggðinni. Sá jafnan hvor annars ferð. Veður var bæði hvasst og vott. Grettir kom á Gilsbakka um daginn og er Grímur Þórhallsson vissi það fagnaði hann honum harðla vel og bauð honum með sér að vera. Hann þekkist það. Hann lét lausa Söðulkollu og sagði Grími hversu hún var til komin.", "Þá kom Sveinn og steig af baki og sá þar hross sitt. Hann kvað þetta:", "Hverr reið hryssu vorri?", "Hver verðr raun á launum?", "Hverr sá hvinn hið stærra?", "Hvað mun kuflbúinn dufla?", "Grettir var þá farinn af vosklæðum sínum og heyrði stökuna:", "Heim reið eg hryssu að Grími.", "Hann er gildr hjá kotmanni.", "Þat mun eg launa litlu.", "Láttu okkr vera sátta.", "\"Satt skal jafnt vera,\" sagði bóndi, \"og er fulllaunuð hrossreiðin.\"", "Eftir það kvað hvor sínar vísur og kvaðst Grettir eigi mundu að finna við það er hann átti eftir sínu að sjá. Var bóndi þar um nóttina og þeir báðir og gerðu að þessu gaman mikið. Þetta kölluðu þeir Söðulkolluvísur. Um morguninn reið bóndi heim og skildust þeir Grettir vel.", "Grímur sagði Gretti marga hluti norðan úr Miðfirði þá sem gerst höfðu meðan hann var utan og það að Atli var öngu bættur en uppgangur Þorbjarnar öxnamegins var svo mikill að væri óvíst að Ásdís húsfreyja gæti setið á Bjargi ef svo stæði.", "Nú dvaldist Grettir fár nætur með Grími því að hann vildi að engin frétt færi fyrir honum
