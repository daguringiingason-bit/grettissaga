 norður um heiðar.", "Grímur bað hann vitja sín ef hann þyrfti ásjár við \"en forðast mun eg lög, að verða sekur um bjargir við þig.\"", "Grettir kvað honum vel fara \"en það er líkara að síðar muni meir við þurfa.\"", "Reið Grettir nú norður Tvídægru og svo til Bjargs og kom þar á náttarþeli. Var fólk allt í svefni utan móðir hans. Hann gekk á bak húsum og þær dyr er þar voru því að honum voru þar kunnig göng og svo til skála og að rekkju móður sinnar og þreifaðist fyrst fyrir. Hún spurði hver þar væri. Grettir sagði til sín.", "Hún settist þá upp og hvarf til hans og blés við mæðilega og mælti:", "\"Ver velkominn frændi,\" sagði hún, \"en svipul verður mér sonaeignin. Er sá nú drepinn er mér var þarfastur en þú útlægur ger og óbótamaður en hinn þriðji er svo ungur að ekki má að hafast.\"", "\"Það er fornt mál\", segir Grettir, \"að svo skal böl bæta að bíða annað meira. En fleira er mönnum til hugganar en fébætur einar og er það líkast að hefnt verði Atla. En það er til mín kemur þá munu þar ýmsir sínum hlut fegnir er vér eigumst við.\"", "Hún kvað það eigi ólíklegt. Var Grettir þar nú um hríð á fárra manna vitorði og fréttist fyrir um atferli héraðsmanna. Höfðu menn ekki spurt til þess að Grettir væri kominn til Miðfjarðar. Hann spurði að Þorbjörn öxnamegin var heima og var fámennt hjá honum. Þetta var eftir túnannir."], "recap": ["Síðar þetta sumar kemur Grettir frá Noregi og leggur að landi í Borgarfirði.\nHann fær þá fréttir af þeim þremur stóru atburðum sem átt höfðu sér stað á meðan hann var erlendis:\nAð Ásmundur faðir hans hafi andast\nAð Atli hafi verið veginn\nAð hann hafi verið dæmdur sekur til skóggangs af brennumálinu\nSvo er sagt að Grettir hafi ekki sýnt nein viðbrögð við þessum fréttum eða skipt skapi á nokkurn hátt.\nGrettir sat fastur við skipið um hríð því hann hafði engan hest, svo fer þó að hann stelur hryssunni Söðulkollu frá bóndanum Sveini. \nSveinn er ósáttur við stuldinn á hryssunni og fer á eftir Gretti, Grettir kemst til Gríms Þórhallssonar (kafli 42), félaga þeirra Atla, og fær inni hjá honum á bænum hans Gilsbakka, Sveinn kemur þar að og nást sættir þeirra á milli.\nSöðulkolluvísur", "Grímur segir Gretti þær fréttir úr Miðfirði að Þorbjörn öxnamegin sé orðinn svo valdamikill að óvíst sé hvort Ásdís móðir Grettis geti verið áfram á Bjargi.\nGrettir dvelur nokkrar nætur hjá Grími því hann vill ekki að það fréttist norður að hann sé kominn til landsins.\nGrettir býst svo til að ríða af stað norður og býður Grímur honum aðstoð en þó ekki þannig að hann brjóti lögin þar sem Grettir sé dæmdur skógarmaður (sjá skýringar).\nGrettir kemur til Bjargs að næturlagi og fer inn bakdyramegin og vekur móður sína. \nÁsdís fagnar honum mjög en er ósköp leið yfir því hvernig komið er fyrir sonum hennar:\nAtli veginn\nGrettir útlægur\nIllugi svo ungur að hann kemur að litlu gagni\nGrettir segir að Atla verði hefnt.\nGrettir dvelur nú á Bjargi, fáir vita af því að hann sé kominn aftur til Miðfjarðar.\nGrettir fréttir að Þorbjörn öxnamegin sé heima og fámennt hjá honum."]}, {"num": 48, "paras": ["Einn veðurdag góðan reið Grettir vestur yfir hálsa til Þóroddsstaða. Hann kom þar nærri hádegi og drap á dyr. Konur gengu út og heilsuðu honum. Þær kenndu hann ekki. Hann spurði að Þorbirni. Þær sögðu hann farinn á engjar að binda hey og með honum son hans sextán vetra gamlan er Arnór hét. Þorbjörn var starfsmaður mikill og var nær aldrei iðjulaus. Og er Grettir hafði þetta spurt bað hann þær vel lifa og reið á burt og fram á veginn til Reykja.", "Þar gengur ein mýri ofan úr hálsinum og var þar á slátta mikil og hafði Þorbjörn látið slá þar mikið hey og var þá fullþurrt. Ætlaði hann það heim að binda og sveinninn með honum en kona tók rökin. Grettir reið nú neðan á teiginn en þeir feðgarnir voru ofar og höfðu bundið eina klyf en voru þá að annarri. Þorbjörn hafði sett skjöld sinn og sverð við klyfina en sveinninn hafði handöxi hjá sér.", "Þorbjörn sá manninn og mælti við sveininn: \"Maður ríður þar að okkur og skulum við hætta að binda heyið og vita hvað hann vill\" og svo gerðu þeir.", "Grettir steig af baki. Hann hafði hjálm á höfði og gyrður saxinu og spjót mikið í hendi og öngvir krókarnir á og var silfurrekinn falurinn á. Hann settist niður og drap úr geirnaglann því að hann vildi eigi að Þorbjörn mætti aftur senda.", "Þá mælti Þorbjörn: \"Þetta er mikill maður og eigi kann eg mann á velli að sjá ef það er eigi Grettir Ásmundarson og mun hann eiga ærnar sakir við oss. Og verðum við rösklega og látum öngvan bilbug á okkur sjá. Skulum við fara að með ráðum og mun eg ganga að honum framan og sjá hversu til tekst með okkur því að eg treysti mér við hvern mann ef eg á einum að mæta. En þú gakk á bak honum og högg tveim höndum í milli herða honum með öxinni. Þarftu eigi að varast að hann geri þér mein síðan er hann snýr baki að þér.\"", "Öngvan hafði Þorbjörn hjálm og hvorgi þeirra. Grettir gekk á mýrina og þegar hann kemur í skotmál við þá skaut hann spjóti að Þorbirni. En það var lausara á skaftinu en hann ætlaði og geigaði á flauginni og hljóp af skaftinu og niður í jörðina. Þorbjörn tók skjöldinn og setti fyrir sig en brá sverðinu og sneri á móti Gretti er hann kenndi hann. Grettir brá þá saxinu og sveipaði því til nokkuð svo að hann sá hvar pilturinn stóð á baki honum og því hafði hann sig lausan við. Er hann sá að pilturinn var kominn í höggfæri við sig þá reiddi hann hátt saxið. Laust hann bakkanum saxins í höfuð Arnóri svo hart að hausinn brotnaði og var það hans bani. Þá hljóp Þorbjörn mót Gretti og hjó til hans en hann brá við buklara hinni vinstri hendi og bar af sér en hann hjó fram saxinu og klauf skjöldinn af Þorbirni og kom saxið í höfuðið honum svo hart að í heilanum stóð og féll hann af þessu dauður niður. Ekki veitti Grettir þeim fleiri áverka. Leitaði hann þá að spjóti sínu og fann eigi. Gekk hann þá til hests síns og reið út til Reykja og lýsti þar vígunum.", "Kona sú er var á engiteignum sá á vígin. Hljóp hún þá heim felmsfull og sagði að Þorbjörn var veginn og þeir báðir feðgar. Þetta kom mjög á þá óvara er heima voru því að engi vissi um ferðir Grettis. Var þá sent eftir mönnum á næstu bæi. Kom þar brátt margt manna, færðu líkin til kirkju. Þóroddur drápustúfur tók við eftirmáli um vígin og hafði hann þegar flokk uppi.", "Grettir reið heim til Bjargs og fann móður sína og sagði þenna atburð.", "Hún varð glöð við þetta og kvað hann nú hafa líkst í ætt Vatnsdæla \"en þó mun þetta upphaf og undirrót sekta þinna. Veit eg það víst að þú mátt ekki hér langvistum vera sakir frænda Þorbjarnar en þó mega þeir nú vita að þér kann mikið að þykja.\"", "Grettir kvað þá vísu:", "Varð í Veðrafirði", "vopnsóttr í byr Þróttar,", "æst fór arfs og gneista", "afl, fangvinr Hafla.", "Nú er ósjötlað Atla", "andrán þegar hánum,", "dauðr hné hann fyrr að fríðri", "fold, maklega goldið.", "Ásdís húsfreyja kvað satt vera \"en eigi veit eg hvað er þú ætlar nú til ráða að taka.\"", "Grettir kvaðst nú mundu leita til vina sinna og frænda vestur til sveita \"en engi vandræði skal þér af mér leiða,\" segir hann.", "Bjóst hann þá til ferðar og skildu þau mæðgin með kærleikum. Fór hann fyrst til Mela í Hrútafjörð og sagði Gamla mági sínum allt það sem til hafði borið um vígið Þorbjörns.", "Gamli bað að hann skyldi flýta sér úr Hrútafirði \"meðan þeir halda flokkinum, frændur Þorbjarnar. En veita skulum vér þér að eftirmáli um víg Atla slíkt er vér megum.\"", "Eftir það reið Grettir vestur yfir Laxárdalsheiði og létti eigi fyrri en hann kom í Ljárskóga til Þorsteins Kuggasonar og dvaldist þar lengi um haustið."], "recap": ["Grettir fer til Þóroddsstaða í Hrútafirði þar sem Þorbjörn öxnamegin býr, hann spyr um Þorbjörn og er sagt að hann sé úti við heyskap ásamt Arnóri, 16 ára syni sínum.\nGrettir fer og finnur þá feðga úti á túni, er Þorbjörn sér að Grettir er kominn segir hann Arnóri að þeir skuli grípa til vopna og verjast Gretti.\n…látum engan bilbug á okkur finna - sýnum ekki hræðslu.\nGrettir kastar fyrst að þeim feðgum spjóti en það geigar á flugi, oddurinn dettur af skaftinu og það fer í jörðina.\nÞorbjörn segist sjálfur muni mæta Gretti að framan en Arnór skuli fara aftan að Gretti og höggva í bak hans með öxi.\nSvo fer þó að Grettir nær að höggva í höfuð Arnórs og drepa hann áður en Arnóri tekst að koma höggi á Gretti, þá ræðst Þorbjörn að Gretti en Grettir nær að höggva til hans svo fer í höfuðið og drepur hann.\nGrettir leitar að spjóti sínu en finnur ekki, fer svo beint til Reykja og lýsir vígunum á hendur sér.\nLík feðganna Þorbjörns og Arnórs eru færð til kirkju og tekur Þóroddur drápustúfur bróðir Þorbjörns við eftirmáli um vígin.", "Grettir fer heim á Bjarg og segir Ásdísi móður sinni að hann sé búinn að hefna Atla.\nÁsdís er ánægð með Gretti en segir þó að nú sé honum ekki vært að vera lengi hjá sér enn.\nGrettir kveður móður sína með miklum kærleikum og fer til Mela í Hrútafirði þar sem bjuggu Rannveig systir hans og Gamli mágur hans en Gamli segir honum að flýta sér úr Hrútafirði áður en frændur Þorbjarnar öxnamegin finni hann. \nGamli segir að hann muni veita Gretti liðsinni hvað varðar dómsmál um víg Atla.\nEftir þetta fer Grettir yfir Laxárdalsheiði og kemur í Ljárskóga til Þorsteins Kuggasonar (frændi Ásmundar og Grettis, kafli 26) og er hjá honum um haustið."]}, {"num": 49, "paras": ["Þóroddur drápustúfur fréttist fyrir hver að vegið mundi hafa Þorbjörn og þá feðga. Og er þeir komu til Reykja var þeim sagt að Grettir hefði þar komið og lýst vígunum á hendur sér. Þóroddur þóttist nú sjá hversu farið hafði. Fór hann þá til Bjargs og var þar mart manna fyrir og spurði hvort Grettir væri þar.", "Húsfreyja sagði að hann hafði á burt riðið og hún færi hann ekki í fylgsni \"ef hann væri hér. Munuð þér nú vel við una að svo búið standi. Var ekki ofhefnt fyrir víg Atla þó að þetta kæmi fyrir. Spurðuð þér ekki að þótt eg hefði skapraun af því. Er nú og vel þó svo standi.\"", "Riðu þeir þá heim og þótti ekki hægt til aðgerða.", "Spjótið það sem Grettir hafði týnt fannst ekki fyrr en í þeirra manna minnum er nú lifa. Það spjót fannst á ofanverðum dögum Sturlu lögmanns Þórðarsonar og í þeirri mýri er Þorbjörn féll og heitir þar nú Spjótsmýri. Og hafa menn það til merkja að Þorbjörn hefði þar drepinn verið þótt í sumum stöðum segi að hann hafi á Miðfitjum drepinn verið.", "Þeir frændur spyrja að Grettir var í Ljárskógum. Söfnuðu þeir þá mönnum saman og ætluðu til Ljárskóga. En er Gamli varð þess var frá Melum gerði hann þeim Þorsteini og Gretti vissu um ferðir Hrútfirðinga.", "Og er Þorsteinn varð þess var sendi hann Gretti inn í Tungu til Snorra goða því að þá var málfriður með þeim og lagði hann það til ráðs með Gretti að hann beiddi Snorra ásjá. En ef hann yrði eigi við bað hann Gretti fara vestur á Reykjahóla til Þorgils Arasonar \"og mun hann við þér taka í vetur. Hafst við í Vestfjörðum þar til sem sjötlast þessi málaferli.\"", "Grettir kvaðst hans ráðum hlíta mundu. Reið hann þá inn í Tungu og fann Snorra goða að máli og beiddi hann viðtöku.", "Snorri svarar: \"Eg gerist nú gamall maður og nenni eg nú ekki að halda seka menn ef mig rekur öngva nauðsyn til. Eða hvað bar nú til er öldungurinn vísaði þér nú frá sér?\"", "Grettir kvað Þorstein oft hafa vel til sín gert \"en fleira mun nú við þurfa en hans eins ef duga skal.\"", "Snorri mælti: \"Til mun eg leggja orð mín ef þér mætti lið að verða en annars staðar skaltu til leita um vistaferli þín en hjá mér.\"", "Skildu þeir að svo mæltu. Sneri Grettir þá vestur til Reykjaness. Hrútfirðingar komust með flokk sinn á Sámsstaði. Þá fréttu þeir að Grettir var burt úr Ljárskógum og hurfu þar aftur."], "recap": ["Þóroddur drápustúfur (sér um eftirmál um víg feðganna Þorbjörns öxnarmegin og Arnórs) fær af því fréttir að Grettir hafi vegið þá feðga og fer til Bjargs.\nÁsdís húsfreyja segir Gretti vera farinn og segir það sanngjarnt að svona hafi farið fyrir Þorbirni því Atli hafi átt skilið að svo yrði hefnt fyrir hann.\nÞóroddur og hans menn frétta af því að Grettir sé í Ljárskógum hjá Þorsteini Kuggasyni og safna liði til að fara að honum.\nGamli, mágur Grettis, fréttir af ferðum þeirra og kemur orði til Grettis til að fara hann við.\nÞorsteinn sendir Gretti þá til Snorra goða á Tungu þar sem hann að biðja um aðstoð, ef Snorri vilji ekki aðstoða hann eigi hann að fara til Þorgils Arasonar á Reykjahóla (kafli 27) og fá veturvist hjá honum. \nSnorri goði vill ekki taka Gretti til sín og fer Grettir því vestur á Reykjahóla til Þorgils."]}, {"num": 50, "paras": ["Grettir kom á Reykjahóla nær veturnóttum og beiddi Þorgils veturvistar.", "Þorgils sagði að honum væri til reiðu matur sem öðrum frjálsum mönnum \"en ekki er hér vönd vistargerð.\"", "Grettir kvaðst ekki um það vanda.", "\"Er hér enn annar hlutur til vandhæfa,\" segir Þorgils. \"Þeir menn ætla hér til vistar er mikið þykja vanstilltir, sem eru þeir fóstbræður Þorgeir og Þormóður. Veit eg eigi hversu yður hentar saman að vera en þeirra vist skal hér jafnan vera er þeir vilja. Nú máttu vera hér ef þú vilt en öngum yður skal duga að eiga illt við annan.\"", "Grettir sagði að hann mundi á öngvan mann leita fyrri og einkanlega ef bóndi vildi svo.", "Litlu síðar komu þeir fóstbræður heim. Ekki féll blítt á með þeim Þorgeiri og Gretti en Þormóður lét sér vel fara. Þorgils bóndi sagði þeim fóstbræðrum allt slíkt sem hann sagði Gretti en þeir gerðu svo mikil metorð hans að hvorigir lögðu öðrum öfugt orð en þó fóru ekki þykkjur þeirra saman. Leið nú svo öndverður veturinn af.", "Það segja menn að Þorgils bóndi átti eyjar þær sem Ólafseyjar heita. Þær liggja út á firðinum, hálfa aðra viku undan Reykjanesi. Þar átti Þorgils bóndi uxa góðan og hafði eigi sóttur orðið um haustið. Talaði Þorgils um jafnan að hann vildi ná honum fyrir jólin.", "Það var einn dag er þeir fóstbræður bjuggust til að sækja uxann ef þeim fengist hinn þriðji maðurinn til liðs. Grettir bauð að fara með þeim en þeir létu vel yfir því, fara síðan þrír á teinæringi. Veður var kalt og lék á norðan. Skipið stóð í Hvalshaushólmi. Sigldu þeir út og græddist heldur vindurinn, komu við eyjarnar og tóku uxann.", "Þá spurði Grettir hvort þeir vildu heldur leggja út uxann eða halda skipinu því að brim nokkuð var við eyna. Þeir báðu hann halda skipinu. Hann stóð við mitt skipið á það borð er frá landi horfði, tók honum sjórinn undir herðablöðin, og hélt svo að hvergi sveif. Þorgeir tók upp uxann aftan en Þormóður framan og hófu svo út í skipið, settust síðan til róðrar. Reri Þormóður í hálsi en Þorgeir í fyrirrúmi en Grettir í skut og héldu inn á flóann. Og er þeir komu inn fyrir Hafraklett styrmdi þá að þeim.", "Þá mælti Þorgeir: \"Frýr nú skuturinn skriðar.\"", "Grettir mælti: \"Eigi skal skuturinn eftir liggja ef allvel er róið í fram.\"", "Þorgeir féll þá svo fast á árar að af gengu báðir háirnir.", "Þá mælti hann: \"Legg þú til Grettir meðan að eg bæti að háunum.\"", "Grettir dró þá fast árarnar meðan Þorgeir bætti að háunum. En er Þorgeir tók að róa höfðu svo lúist árarnar að Grettir hristi þær í sundur á borðinu. Þormóður kvað betra að róa minna og brjóta ekki. Grettir þreif erði tvö er lágu í skipinu og rak borur stórar á borðstokkunum og reri svo sterklega að brakaði í hverju tré. En með því að skip var gott en heldur menn í röskvara lagi þá náðu þeir Hvalshaushólm.", "Grettir spyr hvort þeir vildu heldur fara heim með uxann eða setja upp skipið. Þeir kjöru heldur að setja upp skipið og settu þeir upp með öllum sjónum þeim sem í var og jöklinum en það var mjög sýlt. En Grettir leiddi uxann og var hann mjög stirður í böndunum en allfeitur. Varð honum mjög mætt. En þá er hann kom neðan hjá Tittlingsstöðum þraut uxann gönguna.", "Þeir fóstbræður gengu til húss því að hvorigir vildu veita öðrum að sínu hlutverki. Þorgils spyr að Gretti en þeir sögðu hvar þeir höfðu skilið. Hann sendi þá menn á móti honum og er þeir komu ofan undir Hellishóla sáu þeir hvar maður fór í móti þeim og hafði naut á baki og var þar kominn Grettir og bar þá uxann. Undruðust þá allir hversu mikið hann gat orkað. Lék Þorgeiri næsta öfund á um afl Grettis.", "Það var einn dag nokkuð eftir jól að Grettir fór í laug einn saman.", "Þorgeir vissi það og mælti við Þormóð: \"Förum við til og vitum hversu Gretti bregður við ef eg ræð á hann, þá er hann fer frá lauginni.\"", "\"Ekki er mér um það,\" sagði Þormóður, \"og muntu ekki gott fá af honum.\"", "\"Fara vil eg þó,\" sagði Þorgeir.", "Snýr hann nú ofan á brekkuna og bar hátt öxina.", "Grettir gekk þá neðan frá lauginni og er þeir fundust mælti Þorgeir: \"Er það satt Grettir,\" sagði hann, \"að þú hefir það mælt að þú skyldir aldrei renna fyrir einum?\"", "\"Eigi veit eg það svo víst,\" sagði Grettir, \"en skammt hefi eg fyrir þér runnið,\" kvað Grettir.", "Þorgeir reiddi þá upp öxina. Í því hljóp Grettir undir Þorgeir og færði hann niður allmikið fall.", "Þorgeir mælti þá til Þormóðar: \"Skaltu standa hjá er fjandi sjá drepur mig undir sér?\"", "Þormóður þreif þá í fætur Gretti og ætlaði að draga hann ofan af Þorgeiri og fékk ekki að gert. Hann var gyrður saxi og ætlaði að bregða. Þá kom Þorgils bóndi að og bað þá vera spaka og fást ekki við Gretti. Þeir gerðu svo og sneru þessu í gaman. Ekki áttust þeir fleira við svo að getið sé. Þótti mönnum Þorgils mikla gæfu til hafa borið að stilla slíka ofstopamenn. En er vora tók fóru þeir á burt allir.", "Grettir fór inn til Þorskafjarðar. Var hann spurður að hversu honum hefði líkað vistargerðin eða veturvistin á Reykjahólum.", "Hann svarar: \"Þar hefi eg svo verið að eg hefi jafnan mínum mat orðið fegnastur þá er eg náði honum.\"", "Fór hann síðan vestur yfir heiðar."], "recap": ["Grettir fer til Reykjahóla að finna Þorgils og biður um að fá að vera hjá honum.\nÞorgils segist munu taka við honum en þar séu einnig í vist þeir fóstbræður Þorgeir Hávarðsson og Þormóður Kolbrúnarskáld (kafli 27), Gretti verði að láta sér lynda við þá en þeir eru allir skapmenn miklir.\nGretti og Þorgeiri kemur ekkert sérlega vel saman en Þormóður og Grettir eru ágætir félagar og líður svo veturinn.\nÞeir félagar róa þrír saman út í Ólafseyjar að sækja uxa sem Þorgils á, veður er heldur vont, þeir ná samt uxanum en koma í land töluvert frá Reykjahólum, uxinn getur ekki gengið alla leiðina heim á bæinn svo Grettir tekur hann á bak sér og ber hann - afl Grettis, öfund Þorgeirs.\nÞorgeir ræðst einn dag að Gretti og þeir takast á, Þormóður ætlar að aðstoða Þorgeir en Þorgils kemur þá að þeim, skilur þá að og biður Þorgeir og Þormóð að láta Gretti í friði, merkilegt þykir að Þorgils hafi tekist að stilla til friðar hjá slíkum ofstopamönnum.\nGrettir heldur leiðar sinnar vestur yfir heiðar þegar vorar."]}, {"num": 51, "paras": ["Þorgils Arason reið til þings með fjölmenni. Kom þar allt stórmenni um landið. Brátt fundust þeir Skafti lögmaður og tóku tal með sér.", "Þá mælti Skafti: \"Er það satt Þorgils að þú hefir haldið þá þrjá menn í vetur er mestir ójafnaðarmenn þykja vera og þó allir sekir og stillt þá svo að enginn hefir öðrum mein gert?\"", "Þorgils segir að það var satt.", "Skafti mælti: \"Mikill höfðingsskapur er slíkt. Eða hversu þykir hver þeirra skapi farinn eða hver hreystimaður hver þeirra mun vera?\"", "Þorgils segir: \"Alla ætla eg þá fullröskva til hugar en þeir eru tveir að eg ætla hræðast kunna. Er það þó ólíkt því að Þormóður er maður guðhræddur og trúmaður mikill en Grettir er svo myrkfælinn að hann þorir hvergi að fara þegar að myrkva tekur ef hann gerði eftir skapi sínu. En Þorgeir frænda minn hygg eg ekki hræðast kunna.\"", "\"Svo mun hver skapi farinn sem þú segir,\" segir Skafti.", "Skildu þeir svo talið.", "Á þessu alþingi kærði Þóroddur drápustúfur um víg Þorbjarnar öxnamegins því að hann hafði eigi fram komið á Húnavatnsþingi fyrir frændum Atla. Hugði hann að hér mundi hans mál síður fyrir borð borið. Þeir frændur Atla sóttu Skafta að málinu en hann kvaðst sjá lögvörn í því svo að þar mundu fullar fébætur fyrir koma.", "Síðan voru málin í gerð lagin og var það flestra ætlan að vígin mundu á standast, Atla og Þorbjarnar. En er Skafti vissi það gekk hann til gerðarmanna og spurði hvaðan þeir tóku það. Þeir kölluðu þá jafna bændur er vegnir voru.", "Skafti spyr: \"Hvort var fyrr, Grettir sekur ger eða Atli var veginn?\"", "En er það var reiknað þá varð það viku munur er Grettir var sekur ger á alþingi en hitt varð þegar eftir þingið.", "Skafti mælti: \"Það grunaði mig að yður mundi yfir sjást um málatilbúnaðinn að þér hélduð þann aðila er sekur var áður og hvorki mátti sín mál verja né sækja. Nú segi eg Gretti ekki eiga að gera með vígsmálinu og taki eftirmál sá sem næstur er að lögum.\"", "Þá mælti Þóroddur drápustúfur: \"Hver skal þá svara víginu Þorbjörns bróður míns?\"", "\"Sjáið þér sjálfir fyrir því,\" segir Skafti, \"en ekki munu frændur Grettis ausa fé fyrir hann eða verk hans ef honum kaupist enginn friður.\"", "Og er þess varð var Þorvaldur Ásgeirsson að Grettir var af sagður eftirmálinu leituðu þeir þá eftir hverjir næstir voru. Urðu þá skyldastir þeir Skeggi son Gamla að Melum og Óspakur son Glúms af Eyri úr Bitru. Þeir voru báðir kappsmenn miklir og framgjarnir. Varð Þóroddur nú að lúka bætur fyrir víg Atla. Var það tvö hundruð silfurs.", "Þá lagði til Snorri goði: \"Viljið þér nú Hrútfirðingar,\" sagði hann, \"að niður falli fégjald þetta og verði Grettir sýkn því að eg ætla að hann verði sárbeittur í sektinni?\"", "Þeir frændur Grettis tóku vel undir það og sögðust aldrei hirða um fé ef hann fengi frið og frelsi. Þóroddur kvaðst sjá að hans hlutur varð erfiður og lést þenna mundu upp taka fyrir sína hönd.", "Snorri bað þá vita áður hvort Þórir úr Garði vildi leyfi til leggja að Grettir yrði sýkn. En er hann varð þess vís brást hann reiður við og kvað Gretti aldrei skyldu úr sektum ganga eða komast \"og að firr að hann verði sýkn,\" sagði hann, \"að meira fé skyldi leggja til höfuðs honum en nokkurum öðrum skógarmönnum.\"", "En er hann tók þetta svo þvert varð ekki af sýknuninni. Tóku þeir Gamli féið til sín og varðveittu en Þóroddur drápustúfur fékk öngvar bætur eftir Þorbjörn bróður sinn. Lögðu þeir Þórir þá báðir fé til höfuðs Gretti, þrjár merkur silfurs hvor þeirra. Það þótti mönnum nýlunda því að aldrei hafði verið meira lagt en þrjár merkur. Snorri kvað þetta óviturlegt að bekkjast til að hafa þann mann í sektum er svo miklu illu mætti orka og kvað þess margan gjalda mundu. Skildu menn við það og riðu heim af þinginu."], "recap": ["Þorgils Arason fer á þing og hittir þar Skafta lögmann.\nSkafti spyr Þorgils hvort það sé satt sem hann heyrir, að Þorgils hafi hýst þrjá ofstopamenn saman og þeir ekki gert hver öðrum mein í vistinni, Þorgils játar því og Skafti segir hann mikinn höfðingja að hafa tekist það.\nSkafti spyr um skapferli þeirra og Þorgils svarar að allir séu þeir hugrakkir en þó ólíkir; Þorgeir hræðist ekkert, Þormóður sé guðhræddur en Grettir mjög myrkfælinn.\nÞóroddur drápustúfur kærir Gretti á þingi fyrir vígið á Þorbirni öxnamegin og vill fá fyrir hann bætur.\nSkeggi sonur Gamla og Rannveigar og Óspakur sonur Glúms og Þórdísar, systrasynir Grettis og Atla, halda uppi vörnum fyrir Gretti og segja að hann hafi bara verið að hefna fyrir víg Atla og því lítur út fyrir að vígin séu jafngild og málið falli því niður.\nSkafti stígur þá fram og segir að Grettir hafi verið dæmdur sekur áður en Atli var veginn, hann hafi ekki verið viðstaddur á þingi þá og ekki fengið að verja sig og sé því ekki sanngjarnt að frændur hans þurfi að greiða bætur fyrir Þorbjörn.\nÞóroddur drápustúfur á þó enn að greiða bætur fyrir Atla og hann spyr þá hver eigi að greiða bætur fyrir Þorbjörn bróður sinn ef ekki frændur Grettis, Skafti segir að hann verði sjálfur að finna út úr því.", "Snorri goði skerst þá í málið leggur til að málið verði leyst þannig að Þóroddur drápustúfur sleppi við að borga bætur fyrir víg Atla en Grettir verði sýknaður og fái að ganga frjáls aftur.\nÞóroddur drápustúfur vill taka því og fá greiddar bætur fyrir Þorbjörn bróður sinn og að Grettir fái sýkn.\nÞórir Skeggjason (faðir Skeggja og Þorgeirs sem brunnu inni í Noregi) er hins vegar æfur af reiði yfir þessu og harðneitar að málin verði látin falla og Grettir fái sýkn.\nÞóroddur þarf því að greiða 200 silfurs í bætur fyrir víg Atla.\nÞórir og Þóroddur leggja svo hvor um sig fé til höfuðs Grettis, að hver svo sem nær honum og drepur hann fái þrjár merkur silfurs frá hvorum þeirra sem er meira fé en áður hafði verið lagt til höfuðs skógarmanni.\nEftir það ríða menn heim að þingi og Grettir er á flótta en Snorri goði segir óviturlegt að áreita og hafa mann dæmdan sekan sem er svo sterkur og mikill skapofsamaður sem Grettir er því hann geti gert mikinn skaða á flóttanum."]}, {"num": 52, "paras": ["Þá er Grettir kom yfir Þorskafjarðarheiði í Langadal lét hann sópa greipur um eignir smábænda og hafði af hverjum það er kallaði. Tók hann af hverjum vopn en sumum klæði. Gengu þeir mjög misjafnt af en allir sögðust nauðgir láta þegar hann var á brottu.", "Þá bjó í Vatnsfirði Vermundur hinn mjóvi bróðir Víga-Styrs. Hann átti Þorbjörgu dóttur Ólafs pá Höskuldssonar. Hún var kölluð Þorbjörg hin digra.", "Vermundur var þenna tíma til þings riðinn er Grettir var í Langadal. Hann fór ofan yfir háls til Laugabóls. Þar bjó sá maður er Helgi hét. Hann var þar helst fyrir bændum. Þaðan hafði Grettir góðan hest er bóndi átti. Þaðan fór hann inn til Gervidals. Þar bjó sá maður er Þorkell hét. Hann var vel birgur að kosti og þó lítilmenni. Hafði Grettir þaðan slíkt er hann vildi og þorði Þorkell ekki að að finna eða á að halda. Þaðan fór Grettir til Eyrar og svo út þeim megin fjarðar og hafði af hverjum bæði vistir og klæði og gerði mörgum harðleikið og þótti flestum þungt undir að búa.", "Grettir fór nú djarflega og hafði enginn varðhöld á sér. Hann fór nú uns er hann kom í Vatnsfjarðardal og fór þar til sels. Dvaldist hann þar margar nætur og lá þar í skógum og svaf og hugði ekki að sér.", "En er smalamenn vissu það fóru þeir til bæjar og sögðu að sá dólgur væri kominn í byggðina að þeim þótti ekki dæll viðfangs. Söfnuðust þá bændur saman og höfðu þrjá tigu manna. Leyndust þeir í skóginum svo að Grettir vissi ekki til og létu smalamenn halda njósnum nær færi gæfi á Gretti en þó vissu þeir ógjörla hver maðurinn var.", "Nú bar svo til einn dag þá er Grettir lá og svaf að bændur komu að honum. Og er þeir sáu hann áttu þeir ráðagerð um hversu þeir skyldu taka hann svo að minnst yrði manntjón í og skipuðu til að tíu skyldu á hann hlaupa en sumir skyldu bera bönd að fótunum. Þeir gerðu nú svo og fleygðu sér ofan á hann en Grettir brá við svo hart að þeir hrutu af honum en hann komst á kné og í því gátu þeir kastað böndum á hann og fætur honum. Þá spyrnti Grettir svo fast við eyrun á tveimur að þeir lágu í roti. Nú hljóp á hann hver að öðrum en hann ruddist um fast og lengi en þó gátu þeir hlaðið honum um síðir og bundu hann.", "Eftir það áttu þeir um að tala hversu við hann skyldi gera. Báðu þeir Helga af Laugabóli taka við honum og annast hann þar til að Vermundur kæmi heim af þingi.", "Hann svarar að \"annað ætla eg mér þarfara en láta húskarla mína sitja yfir honum því að eg á lönd erfið og kemur hann aldrei í mína ferð.\"", "Þá báðu þeir Þorkel í Gervidal við honum að taka, kváðu hann vera nógtarmann.", "Þorkell mælti í móti og kvað öngvan kost á því \"þar sem eg ligg einn í húsi og kerling mín en hvar fjarri öðrum mönnum og komið þér ekki þeim kassa á mig,\" segir hann.", "\"Þú, Þórálfur á Eyri,\" sögðu þeir, \"tak við Gretti og ger til hans vel um þingið ella fær þú hann af þér til næsta bæjar og ábyrgst að hann verði ekki laus. Set hann svo bundinn niður sem nú tekur þú við honum.\"", "Hann svarar: \"Ekki vil eg við Gretti taka því að eg hefi hvorki til föng né fé að halda hann. Hefir hann og ekki á minni jörðu tekinn verið. Líst mér heldur vandræði en virðing við honum að taka eða gera mikið með honum og hann kemur aldrei í mín hús inn.\"", "Eftir það leituðu þeir við hvern bónda og mæltu allir í móti. Og eftir þessu viðtali þeirra hafa kátir menn sett fræði það er Grettisfærsla hét og aukið þar í kátlegum orðum til gamans mönnum.", "En er þeir höfðu þetta talað lengi þá kom það ásamt með þeim að þeir mundu eigi gera happ sitt að óhappi og fóru til og reistu gálga þar þegar í skóginum og ætluðu hengja Gretti og hlömmuðu nú mjög yfir þessu.", "Þá sáu þeir ríða þrjá menn neðan eftir dalnum. Var einn í litklæðum. Þeir gátu að mundi Þorbjörg húsfreyja úr Vatnsfirði og svo var. Ætlaði hún til sels. Hún var skörungur mikill og forvitur. Hún hafði héraðsstjórn og skipaði öllum málum þegar Vermundur var eigi heima.", "Hún veik þangað að sem mannfundurinn var og var hún af baki tekin. Bændur fögnuðu henni vel.", "Hún mælti þá: \"Hvað þingi hafið þér eða hver er þessi hinn hálsdigri er hér situr í böndum?\"", "Grettir nefndi sig og heilsaði henni.", "Hún svarar: \"Hvað rak þig til þess Grettir,\" sagði hún, \"að þú vildir gera hér óspektir þingmönnum mínum?\"", "\"Eigi má nú við öllu sjá. Vera varð eg nokkur.\"", "\"Slíkt er mikið gæfuleysi,\" segir hún, \"að vesalmenni þessi skyldu taka þig svo að ekki lagðist fyrir þig. Eða hvað ætlið þér nú af honum að gera?\"", "Bændur sögðu henni að þeir ætluðu að festa hann á gálga fyrir óspektir sínar.", "Hún svarar: \"Vera má að Grettir hafi sakir til þess en ofráð mun það verða yður Ísfirðingum að taka Grettir af lífi því að hann er maður frægur og stórættaður þó að hann sé eigi gæfumaður. Eða hvað viltu nú vinna til lífs þér Grettir ef eg gef þér líf?\"", "Hann svarar: \"Hvað mælir þú til?\"", "\"Þú skalt vinna eið,\" sagði hún, \"að gera öngvar óspektir hér um Ísafjörð. Öngum skaltu hefna þeim sem í aðför hafa verið að taka þig.\"", "Grettir kvað hana ráða. Síðan var hann leystur. Og þá kvaðst hann mest bundist hafa að sínu skaplyndi að hann sló þá eigi er þeir hældust við hann. Þorbjörg bað hann fara heim með sér og fékk honum hest til reiðar. Fór hann þá heim í Vatnsfjörð og beið þar til þess er Vermundur kom heim og gerði húsfreyja vel við hann. Varð hún af þessu mjög fræg víða um sveitir.", "Vermundur var ófrýnn er hann kom heim og spurði því Grettir væri þar. Þorbjörg sagði allt sem farið hafði með þeim Ísfirðingum.", "\"Hvers naut hann að því,\" sagði Vermundur, \"er þú gafst honum líf?\"", "\"Margar greinir voru til þess,\" sagði Þorbjörg. \"Það fyrst,\" segir hún, \"að þú munt þykja meiri höfðingi en áður er þú áttir þá konu er slíkt þorði að gera. Þá mundi það og ætla Hrefna frændkona hans að eg mundi eigi láta drepa hann. Það hið þriðja að hann er hinn mesti afreksmaður í mörgum greinum.\"", "\"Vitur kona ertu,\" sagði Vermundur, \"í flestu og haf þökk fyrir.\"", "Þá mælti hann til Grettis: \"Lítið lagðist nú fyrir þig, þvílíkur garpur sem þú ert, er vesalmenni skyldu taka þig og fer svo jafnan óeirðarmönnum.\"", "Grettir kvað þá vísu þessa:", "Mitt var gilt", "gæfuleysi", "í marþaks", "miðjum firði", "er gamlir", "grísir skyldu", "halda mér", "að höfuðbeinum.", "\"Hvað vildu þeir af þér gera,\" kvað Vermundur, \"þá er þeir höfðu tekið þig?\"", "Grettir kvað:", "Sögðu mér,", "þau er Sigar veitti,", "mægða laun", "margir hæfa", "uns lofgróinn", "laufi sæmdar", "reynirunn", "rekkar fundu.", "Vermundur mælti: \"Hvort mundu þeir hafa hengt þig ef þeir einir hefðu um vélt?\"", "Myndi eg sjálfr", "í snöru egnda", "helsti brátt", "höfði stinga", "ef Þorbjörg", "þessu skáldi,", "hún er allsnotr,", "eigi byrgi.", "Vermundur mælti: \"Hvort bauð hún þér til sín?\"", "Grettir svaraði:", "Mig bað hjálp", "handa tveggja", "Sifjar vers", "með sér fara.", "Sú, gaf þveng", "Þundar beðju", "góðan hest,", "er mig gæddi friði.", "\"Mikil mun verða ævi þín og erfið,\" segir Vermundur, \"og er þér kennt að varast óvini þína. En ekki nenni eg að halda þig og hafa þar fyrir þykkju margra ríkra manna. Er þér enn best að leita til frænda þinna en fáir munu verða til að taka þig ef öðru mega við koma. Ertu og ekki auðkvæður til fylgdar við flesta menn.\"", "Grettir var í Vatnsfirði nokkura hríð og fór þaðan til Vestfjarða og leitaði til margra göfugra manna og bar jafnan eitthvert við það er engi tók við honum."], "recap": ["Grettir fer yfir Þorskafjarðarheiði og yfir í Ísafjarðardjúp, þar fer hann á milli bæja og lætur greipar sópa, hirðir vopn og klæði eftir þörfum og endar svo í seli í Vatnsfjarðardal (sjá kort bls.329) þar sem hann hefst við.\nVermundur í Vatnsfirði er aðal höfðinginn í sveitinni en hann er á þingi, kona hans er Þorbjörg (dóttir Ólafs páa og Þorgerðar Egilsdóttur og systir Kjartans úr Laxdæla sögu), hún mikill skörungur og forvitur (sér fyrir óorðna atburði) og fer með völd þegar Vermundur er í burtu.\nBændur í nærsveitum frétta af Gretti í selinu og safnast saman 30 talsins og ná eftir mikil átök að handsama hann og binda hann niður.\nEnginn treystir sér þó til þess að hafa Gretti og gæta hans þar til Vermundur kemur heim af þingi svo úr verður að þeir reisa gálga og ætla að hengja hann.\nÞorbjörg kona Vermundar kemur þá að og biður menn að sleppa Gretti, sem sé frægur af afrekum sínum og auk þess stórættaður (Hrefna eiginkona Kjartans bróður Þorbjargar er frænka Grettis), en þó með því skilyrði að hann lofi að hefna ekki fyrir aðförina og láti menn í sveitinni vera.\nVermundur kemur heim og hittir Gretti, hann segir ævi Grettis munu verða erfiða og hann muni þurfa að varast óvini sína, Vermundur vill ekki leyfa Gretti að vera hjá sér því þá kalli hann yfir sig fjandskap margra öflugra manna fyrir að hýsa sekan skógarmann.\nEftir þetta hrekkst Grettir milli margra göfugra manna á Vestfjörðum en enginn vill leyfa honum að vera hjá sér."]}, {"num": 53, "paras": ["Um haustið er á leið sneri Grettir aftur hið syðra og léttir eigi fyrr en hann kom í Ljárskóga til Þorsteins Kuggasonar frænda síns og þar var vel við honum tekið. Bauð Þorsteinn honum með sér að vera um veturinn og það þekktist hann.", "Þorsteinn var iðjumaður mikill og smiður og hélt mönnum mjög til starfa. Grettir var lítill verklundarmaður og því fór lítt skap þeirra saman. Þorsteinn hafði látið gera kirkju á bæ sínum. Hann lét brú gera heiman frá bænum. Hún var ger með hagleik miklum. En utan í brúnni, undir ásunum þeim er upp héldu brúnni, var gert með hringum, og dynbjöllur, svo að heyrði yfir til Skarfsstaða, hálfa viku sjóvar, ef gengið var um brúna, svo hristust hringarnir. Hafði Þorsteinn mikinn starfa fyrir þessari smíð því að hann var járngerðarmaður mikill. Grettir var atgangsmikill að drepa járnið en nennti misjafnt en þó var hann spakur um veturinn svo að ekki bar til frásagnar. En er Hrútfirðingar frétta að Grettir var með Þorsteini höfðu þeir flokk uppi er vora tók.", "En Þorsteinn frétti það. Sagði hann Gretti að hann leitaði sér annars hælis en vera þar \"því að eg sé að þú vilt ekki starfa en mér henta ekki þeir menn sem eigi vinna.\"", "\"Hvert vísar þú mér þá?\" segir Grettir.", "Þorsteinn bað hann fara suður um land og finna frændur sína \"en vitja mín ef þeir duga eigi þér.\"", "Grettir gerði nú svo að hann fór suður til Borgarfjarðar á fund Gríms Þórhallssonar og dvaldist þar fram yfir þing. Grímur vísaði honum til Skafta lögmanns á Hjalla. Grettir fór suður hinar neðri heiðar og létti eigi fyrr en hann kom í Tungu til Þórhalls Ásgrímssonar Elliða-Grímssonar og fór lítt með byggðum. Þórhallur kenndist við Gretti sakir foreldra sinna og þó var Grettir nafnkunnigur mjög um allt land af atgervi sinni. Þórhallur var vitur maður og gerði vel til Grettis en ekki vildi hann vist hans þar álengdar."], "recap": ["Grettir fer suður í Dalina til frænda síns Þorsteins Kuggasonar í Ljárskógum (kafli 26), Þorsteinn tekur honum vel og býður honum að vera hjá sér yfir veturinn.\nÞorsteinn er mjög iðinn og heldur mönnum sínum við vinnu en Grettir nennir lítið að vinna, lundarfar þeirra er mjög ólíkt en Grettir er þó rólegur hjá honum um veturinn.\nUm vorið frétta Hrútfirðingar (þeir sem vilja hefna fyrir Þorbjörn og Þórissyni) að Grettir sé hjá Þorsteini og safna saman hópi til að fara að Ljárskógum.\nÞorsteinn fréttir það og segir Gretti að drífa sig í burtu, hann vilji hvort eð er ekki vinna neitt og því nenni Þorsteinn ekki að hafa fyrir því að verja hann.\nÞorsteinn segir honum að fara suður á land og finna frændur sína þar en koma aftur til sín fái hann ekki liðsinni hjá þeim.\nGrettir rekst á milli bæja en enginn vill leyfa honum að vera hjá sér nema stutt í einu."]}, {"num": 54, "paras": ["Grettir fór úr Tungu upp til Haukadals og þaðan norður á Kjöl og hafðist þar við um sumarið lengi og var nú eigi traust að hann tæki eigi af mönnum plögg sín, þeim sem fóru norður eða norðan um Kjölinn, því að honum varð illt til féfanga.", "Það var einn dag að Grettir var jafnan norður á Dúfunefsskeiði að hann sá að maður reið norðan eftir Kilinum. Sá var mikill á baki og hafði góðan hest og beisl háseymt, vel turnað. Annan hest hafði hann í taumi og á töskur. Þessi maður hafði síðan hatt á höfði og sá óglöggt í andlit honum.", "Grettir leist vel á hestinn og þing hans og fór til móts við hann og heilsaði honum og spurði hann að nafni en hann kvaðst Loftur heita \"veit eg hvað þú heitir,\" segir hann, \"þú munt vera Grettir hinn sterki Ásmundarson eða hvert viltu fara?\"", "\"Ekki hefi eg staðnefnt um það,\" segir Grettir, \"en það er erindi mitt að vita ef þú vilt af leggja nokkurt plagg af því sem þú ferð með.\"", "Loftur svarar: \"Því mun eg fá þér það sem eg á eða hvað viltu við gefa?\"", "Grettir svarar: \"Hefir þú eigi spurt það að eg legg ekki fé í móti og sýnist þó það flestum að eg fái það sem eg vil?\"", "Loftur mælti: \"Bjóð þú þeim þessa kosti er þér þykja góðir. En ekki vil eg svo láta það er eg á og fari hvorir sinn veg\" og reið fram hjá Gretti og keyrði hestinn.", "Grettir mælti: \"Ekki munum við svo skjótt skilja\" og þreif í taumana á hesti Lofts fyrir framan hendur honum og hélt báðum höndum.", "Loftur mælti: \"Far þú veg þinn. Ekki færð þú af mér ef eg get á haldið.\"", "\"Það mun nú reynt verða,\" segir Grettir.", "Loftur seildist niður með kinnleðrunum og tók taumana milli hringanna og handa Grettis, heimtandi svo fast að hendur Grettis hrukku niður eftir taumunum þar til sem hann dró af honum allt beislið.", "Grettir leit eftir í lófana og sá að þessi maður mundi hafa afl í krummum heldur en eigi og leit eftir honum og mælti: \"Hvert ætlar þú nú að fara?\"", "Loftur svarar og kvað:", "Ætla eg hreggs", "í hrunketil", "steypi niðr", "frá stórfrerum.", "Þar má hængr", "hitta grundar", "lítinn stein", "og land hnefa.", "Grettir mælti: \"Eigi er víst að leita eftir byggðum þínum ef þú segir eigi ljósara.\"", "Hann mælti þá og kvað:", "Erat mér dælt", "að dylja þig", "ef þú vilt", "vitja þangað.", "Það er úr byggð", "Borgfirðinga", "þar er Balljökul", "bragnar kalla.", "Síðan skildu þeir. Sér Grettir þá að hann hefir ekki afl við þessum manni. Þá kvað Grettir vísu:", "Mér stóð málma skúrar", "mundangs hvatr og Atli,", "staddr vildi eg svo sjaldan,", "snarr Illugi fjarri", "þá er ófælinn ólar", "endr dró mér úr hendi,", "brúðr strýkr horsk, ef hræðumk,", "hvarma, Loftr hinn armi.", "Eftir þetta fór Grettir suður af Kilinum og reið til Hjalla og fann Skafta og beiddi hann ásjár.", "Skafti svarar: \"Það er mér sagt að þú farir heldur óspaklega og grípir fyrir mönnum góss sitt og samir þér það illa, svo stórættuðum manni. Nú væri allt betur um að tala ef þú rændir eigi. En með því að eg skal heita lögmaður í landinu þá stendur mér eigi að taka við útlegðarmönnum og brjóta svo lögin. Eg vil að þú leitir þangað nokkur að þú þyrftir eigi að leggjast á fé manna.\"", "Grettir kvaðst það gjarna vildu en sagði þó að hann þóttist varla einn saman vera mega fyrir myrkfælni.", "Skafti kvað hann ekki því einu mundu mega við hlíta er honum þætti best \"og trú þú öngum svo vel að þér verði svo sem í Vestfjörðum. Hefir það mörgum að bana orðið að hann hefir oftryggur verið.\"", "Grettir þakkaði honum fyrir heilræði sín og sneri aftur til Borgarfjarðar um haustið og fann Grím Þórhallsson vin sinn og sagði tillögur Skafta. Grímur bað hann fara norður til Fiskivatna á Arnarvatnsheiði og svo gerði hann."], "recap": ["Grettir fer úr Borgarfirðinum og norður á Kjöl þar sem hann hefst við á hálendinu yfir sumarið.\nHann rænir þá sem eiga leið um Kjöl og hirðir af þeim föt þeirra fyrir sig að nota.\nDag einn ríður framhjá maður að nafni Loftur og er sá með mjög flottan hatt sem Grettir vill eignast, Loftur neitar hins vegar að láta hattinn svo Grettir kippir í beislið á hestinum hans, Loftur er þó miklu sterkari en Grettir og kippir beislinu að sér.\nGrettir snýr því frá Lofti og ætlar í burtu, þeir kveðast á og fram kemur að Loftur búi í Langjökli/Balljökli (mögulega tröll, svo sterkur er hann?)\nGrettir fer eftir þetta til Skafta lögmanns sem skammar hann fyrir þann ósið að sitja fyrir fólki á Kili og ræna það, það sé stórmenni eins og honum ekki sæmandi.\nGrettir segist eiga svo erfitt með sig því hann sé svo myrkfælinn.\nGrettir fer nú til Gríms Þórhallssonar frænda síns sem sendir hann áfram til Fiskivatna á Arnarvatnsheiði."]}, {"num": 55, "paras": ["Grettir fór upp á Arnarvatnsheiði og gerði sér þar skála sem enn sér merki og bjóst þar um því að hann vildi nú hvervetna annað en ræna, fékk sér net og bát og veiddi fiska til matar sér. Honum þótti dauflegt mjög á fjallinu því að hann var mjög myrkfælinn. En er það frétta aðrir skógarmenn að Grettir var þar niður kominn þá var mörgum hugur á að finna hann því að þeim þótti mikið traust að honum.", "Grímur hét maður norðlenskur. Hann var sekur. Að þeim manni keyptu Norðlendingar að hann skyldi drepa Gretti og hétu honum frelsi og fégjöfum ef hann kæmi því fram. Hann fór til móts við Gretti og beiddi hann viðtöku.", "Grettir svarar: \"Eigi þykir mér sem þér sé að hólpnara þó að þú værir hjá mér. Eruð þér og vansénir, skógarmennirnir, en illt þætti mér einum saman að vera ef annars væri kostur. Vil eg og að sá einn sé hjá mér að hann verður að starfa slíkt er til fellst.\"", "Grímur kvaðst ekki til annars ætla og skoraði á hann fast um vistina. Lét Grettir þá teljast og tók við honum. Hann var þar nú fram á veturinn og sat um Gretti og þótti eigi dælt að honum að ráða. Grettir grunaði hann og hafði vopn sín hjá sér nótt og dag og þorði hann aldrei að honum að ganga þá er hann vakti.", "Það var einn morgun er Grímur kom heim af veiði að hann gekk inn í skálann og stappaði fótum og vildi vita hvort Grettir svæfi en hann brá sér hvergi við og lá kyrr. Saxið hékk uppi yfir Gretti. Hugsar Grímur nú að eigi mundi gefast betra færi. Gerir hann nú hark mikið svo að Gretti skyldi orð um finnast en það var ekki. Þóttist hann nú vita að Grettir mundi sofnaður og stillti að rekkjunni hljóðlega og seildist til saxins og tók ofan og brá. Í því hljóp Grettir fram á gólfið og greip saxið í því er hinn reiddi en annarri hendi í herðar Grími og rak hann niður svo mikið fall að hann lá nær í óviti.", "\"Gafstu svo þó að þú létir góðvættlega.\"", "Hafði hann af honum þá sannar sögur og drap hann síðan. En nú þóttist Grettir sjá hvað það var að taka við skógarmönnum. Og leið svo veturinn. Að öngu þótti Gretti meira mein en myrkfælni."], "recap": ["Grettir fer á Arnarvatnsheiði og gerir sér þar skála til að búa í, hann fær sér net og bát og veiðir fisk sér til matar, honum þykir vistin þar þó mjög daufleg því hann er mjög myrkfælinn.\nAðrir skógarmenn heyra af dvalarstað Grettis og vilja fara til hans og fá að vera með honum þar í útlegð.\nEinhverjir vilja vera með honum því hann er góður útlagi, klár að bjarga sér.\nAðrir vilja reyna að drepa hann og fá frelsi úr skóggangi og fé fyrir.\nÚtlagi nokkur að norðan heitir Grímur, Hrútfirðingar (þeir sem vilja ná Gretti) fá hann til að fara og drepa Gretti og heita honum þess í stað frelsi og peningum.\nGrímur fer til Grettis og fær að vera með honum í skálanum, er hann þar um veturinn en Grettir grunar hann um að ætla sér illt og er alltaf með vopn nærri sér svo Grímur leggur ekki í að gera honum neitt lengi vel.\nEinn morgun kemur Grímur inn í skálann og heldur að Grettir sé sofandi og ætlar að höggva til hans með saxi en Grettir stekkur þá upp og drepur hann."]}, {"num": 56, "paras": ["Þórir í Garði spyr nú hvar Grettir er niður kominn og vildi setja til eitthvert ráð að hann yrði drepinn.", "Maður hét Þórir rauðskeggur. Hann var manna gildastur og vígamaður mikill og fyrir það var hann sekur ger um allt landið. Þórir í Garði sendi honum orð og er þeir fundust beiddi hann Rauðskegg fara sendiferð sína og drepa Gretti hinn sterka. Rauðskeggur kvað það eigi auðveldaverk, sagði að Grettir var vitur maður og var um sig.", "Þórir bað hann til ráða \"og er slíkt drengilegt svo röskum manni sem þú ert en eg skal koma þér úr sekt og þar með gefa þér nógt fé.\"", "Við þessu ráði tók Rauðskeggur. Sagði Þórir honum hversu hann skyldi að fara að vinna Gretti. Eftir það fór Rauðskeggur fyrir austan land því að honum þótti gruna mega síður um ferðir sínar. Hann kom að Arnarvatnsheiði þá er Grettir hafði verið þar einn vetur. En er Grettir og Rauðskeggur fundust beiddi hann Gretti viðurtöku.", "Hann svarar: \"Eigi kann eg að láta fleiri svo oft leika að mér sem sá er hér kom í fyrra haust og lét allskjallkænlega. En þegar hann hafði hér verið litla hríð sat hann um líf mitt. Nú mun eg eigi á það hætta oftar að taka við skógarmönnum.\"", "Þórir svarar: \"Full vorkunn þykir mér þér á vera þó að þú trúir illa skógarmönnum en heyrt muntu mín hafa getið um vígaferli og ójafnað en aldrei um slíkt dáðleysi að svíkja lánardrottin minn. Nú er því illt illum að vera að margur ætlar þar annan eftir vera. Mundi eg og eigi hafa hingað farið ef eg ætti betra kosti en eigi þykir mér við upp gefnir ef við veitumst að. Nú máttu hætta á við mig fyrst hversu þér gest að mér. Lát mig þá fara á burt ef þú finnur ódyggð með mér.\"", "Grettir svarar: \"Hætta má eg enn á við þig en vit það fyrir víst ef eg gruna um svik við þig þá verður það þinn bani.\"", "Þórir kvað hann svo gera. Eftir það tók Grettir við honum og fann hann það að hann mundi hafa tveggja manna megin til hvers sem hann gekk. Var hann búinn til hvers sem Grettir vildi senda hann. Til einkis þurfti Grettir að víkjast og aldrei hafði honum þótt ævi sín jafngóð síðan hann kom í útlegð en þó var hann svo var um sig að aldrei sá Þórir færi á honum.", "Þórir rauðskeggur var tvo vetur hjá Gretti á heiðinni. Tók honum nú að leiðast á heiðinni að vera, hugsar nú um hvert ráð hann skal gera það sem Grettir sæi eigi við.", "Eina nótt um vorið kom á stormviðri mikið er þeir voru í svefni. Grettir vaknaði og spurði hvar bátur þeirra væri. Þórir spratt upp og hljóp til bátsins og braut hann allan í sundur og kastaði ýmsa vega brotunum og var því líkt sem veðrið hefði fleygt.", "Eftir það gekk hann inn í skálann og mælti hátt: \"Eigi hefir nú vel til tekist, vinur minn\", sagði hann, \"að bátur okkar er allur brotinn í sundur en netin liggja langt út í vatnið.\"", "\"Sæk þú þau þá,\" segir Grettir, \"því að mér þykir þér sjálfrátt verið hafa er báturinn er brotinn.\"", "Þórir svarar: \"Það er svo í atgervi að mér er minnst hent er sund er. En flest annað þykist eg reyna mega við hvern annan óbreyttan mann. Máttu það vita að eg hefi eigi þér starf ætlað síðan eg kom til þín. Mundi eg eigi biðja þessa ef eg væri til fær að gera.\"", "Grettir stóð upp og tók vopn sín og gekk til vatnsins. Þar var svo við vaxið að nes gekk fram í vatnið en víkurhvarf mikið var öðrumegin nessins. Vatnið var djúpt að landinu.", "Grettir mælti: \"Leggst út eftir netjunum og lát mig sjá hversu fær maður þú ert.\"", "\"Sagði eg þér áðan,\" segir Þórir, \"að eg er ekki syndur og eigi veit eg hvar nú er garpskapur þinn og áræði.\"", "\"Ná mun eg netunum,\" sagði Grettir, \"en svík þú mig ekki er eg trúi þér.\"", "Þórir svarar: \"Ætla þú mér eigi slíka svívirðing og dáðleysi.\"", "Grettir mælti: \"Þú munt sjálfur gefa þér raun hver þú ert.\"", "Síðan kastaði hann klæðunum og vopnunum og lagðist eftir netunum. Sveipar hann þeim saman og fer að landi og kastar þeim upp á bakkann. Og er hann ætlaði á land að ganga þá greip Þórir saxið og brá skjótt. Hann hljóp þá skjótt á móti Gretti er hann sté upp á bakkann og hjó til hans. Grettir kastaði sér á bak aftur ofan í vatnið og sökk sem steinn. Þórir horfði út á vatnið og ætlaði að verja landið ef hann kæmi upp. Kafaði Grettir nú sem næst bakkanum svo að Þórir mátti ekki sjá hann þar til sem hann kom í víkina að baki honum og gekk þar á land. Við þessu gat Þórir eigi séð. Fann hann eigi fyrr en Grettir tók hann upp yfir höfuð sér og færði niður svo hart að saxið hraut úr hendi honum og fékk Grettir tekið það og hafði ekki orða við hann og hjó þegar höfuð af honum og lauk svo hans ævi.", "Eftir það vildi Grettir aldrei við skógarmönnum taka en þó mátti hann varla einn saman vera."], "recap": ["Þórir Skeggjason í Garði fréttir hvar Grettir er niðurkominn og kallar á fund sinn Þóri rauðskegg sem er dæmdur sekur skógarmaður.\nÞórir í Garði biður nafna sinn rauðskegg að fara og drepa Gretti og fái hann að launum sýkn saka og fé.\nÞórir rauðskeggur fer og finnur Gretti og biður um að fá að vera með honum á Arnarvatnsheiði, Grettir vill hins vegar ekki taka við honum minnugur þess hvernig fór með Grím.\nÞórir rauðskeggur lofar öllu fögru og svo fer að Grettir tekur við honum en segir þó að ef upp komist að Þórir ætli að svíkja sig verði það hans bani.\nÞórir rauðskeggur er hjá Gretti í tvo vetur og og er Grettir alsæll með félagsskapinn þó hann hafi alltaf varan á ef Þórir skyldi svíkja hann.", "Þóri fer að leiðast vistin og vill fara að finna leið til að drepa Gretti svo hann komist í burtu.\nEina nótt er vont veður og stormur og Grettir hefur áhyggjur af bát sínum á vatninu, Þórir fer út og brýtur bátinn í spað og dreifir netum um vatnið, fer svo inn og segir Gretti að báturinn hafi brotnað í veðrinu og netin séu að týnast í vatninu. \nGrettir segir Þóri að fara út og ná í netin en Þórir segist ekki geta það því hann sé ósyndur, þeir fara saman út og Grettir kastar af sér fötum og vopnum og fer í vatnið að sækja netin.\nÞegar Grettir kemur upp úr ræðst Þórir að honum en Grettir stekkur aftur í vatnið og í kaf, Þórir stendur á bakkanum og bíður eftir að Grettir komi upp úr og ætlar þá að höggva til hans, Grettir kemur hins vegar upp úr vatninu aftan við Þóri, ræðst að honum og heggur af honum höfuðið.\nEftir þetta tekur Grettir ekki aftur við öðrum skógarmanni því hann treystir engum lengur."]}, {"num": 57, "paras": ["Á alþingi frétti Þórir úr Garði dráp Þóris rauðskeggs. Þóttist hann nú sjá að eigi var auðvelt við að eiga. Tók hann þá það til ráðs að hann reið vestur yfir heiðar hinar neðri af þinginu og hafði nær átta tigu manna og ætlaði að fara að taka Gretti af lífi. En er Grímur Þórhallsson vissi það þá gerði hann Gretti orð og bað hann vera varan um sig. Grettir hugði jafnan að mannaferðum.", "Það var einn dag að hann sá margra manna reið og stefndi til byggða hans. Hljóp hann þá í hamraskarð eitt og vildi eigi renna því að hann sá eigi liðið allt. Í því kom Þórir að með allt liðið og bað þá nú ganga í milli bols og höfuðs á Gretti og kvað lítið mundu fyrir illmennið leggjast.", "Grettir svarar: \"Eigi er sopið þó að í ausuna sé komið. Hafið þér og langt til sótt og munu nokkurir fá leiksmark áður en vér skiljum.\"", "Þórir eggjaði mjög menn til atsóknar. Hamraskarðið var mjótt svo að hann gat vel varið öðrumegin en það undraðist hann að aldrei var að baki honum gengið svo að honum yrði mein að því. Féllu þá menn af Þóri en sumir urðu sárir en þeir gátu ekki að gert.", "Þá mælti Þórir: \"Það hefi eg spurt,\" sagði hann, \"að Grettir væri afbragðsmaður fyrir hreysti sakir og hugar en það vissi eg aldrei að hann væri svo fjölkunnigur sem nú sé eg því að þar falla hálfu fleiri sem hann horfir bakinu við. Nú sé eg að hér er við tröll að eiga en ekki við menn.\"", "Biður hann þá frá hverfa og svo var gert. Grettir undraðist því svo mátti verða en þó var hann ákaflega móður. Þórir sneri á burt og hans menn og riðu norður á sveitir. Þótti mönnum þeirra ferð hin sneypilegasta. Hafði Þórir látið átján menn en margir sárir. Grettir veik nú upp í skarðið og fann þar mann mikinn vexti. Hann sat upp við hamarinn og var sár mjög.", "Grettir spurði hann að nafni en hann sagðist Hallmundur heita \"en það má eg segja þér til kenningar að þér þótti eg fast taka í taumana á Kili um sumarið er við fundumst. Þykist eg nú það hafa launað þér.\"", "\"Það er víst,\" sagði Grettir, \"að mér þykir þú hafa sýnt mér mikinn drengskap hvenær sem eg get það launað þér.\"", "Hallmundur segir: \"Það vil eg nú að þú komir til heimkynna minna því að þér mun langt þykja hér á heiðinni.\"", "Grettir kveðst það gjarnan vildu. Nú fara þeir báðir samt suður undir Balljökul. Þar átti Hallmundur helli stóran og dóttur gilda vexti og skörulega. Þau gerðu vel við Gretti og græddi hún þá báða. Þar dvaldist Grettir lengi um sumarið.", "Hann kvað flokk um Hallmund og er þetta þar í:", "Hátt stígr höllum fæti", "Hallmundr í sal fjalla.", "Þessi vísa er þar í:", "Varð í Veðrafirði", "vígfús á benstíga", "naðr í Virfils veðri", "vopnhríðar fram skríða.", "Kostr mun köppum traustum", "Keldhverfinga að erfa.", "Olli hvatr úr helli", "Hallmundr er eg komst undan.", "Svo hafa þeir frá sagt að Grettir dræpi sex menn á fundinum en Hallmundur tólf. Þá er á leið sumarið fýsti Gretti aftur til byggða að finna vini sína og frændur. Hallmundur bað hann sín vitja er hann færi suður um land og hét Grettir því.", "Fór hann þá vestur til Borgarfjarðar og þaðan til Breiðafjarðardala og leitaði ráða við Þorstein Kuggason hvert hann skyldi þá á leita.", "En Þorsteini þótti nú fjölgast mótstöðumenn hans og kvað fá mundu við honum taka \"en fara máttu suður á Mýrar og vita hvar þar býr fyrir.\"", "Grettir fór nú suður á Mýrar um haustið."], "recap": ["Þórir Skeggjason í Garði fréttir að Grettir hafi afgreitt Þóri rauðskegg og ákveður að taka málin í eigin hendur, safnar saman nær átta tugi manna og ætlar að fara upp á Arnarvatnsheiði og taka Gretti af lífi.\nGrímur Þórhallsson á Gilsbakka, (bróðir Gamla mágs Grettis og einnig frændi hans), fréttir af þessu og varar Gretti við.\nGrettir hleypur í mjótt hamraskarð þar sem Þórir og hans menn finna hann, þeir sækja að honum og verst hann fimlega og fellir marga manna Þóris.\n,,Eigi er sopið þó að í ausuna sé komið.”\nÞóri finnst ótrúlegt að sjá Gretti verjast mönnum sínum sem bæði sækja að honum að framan og aftan í skarðinu og finnst sem við ofurefli sé að etja og að hann hljóti að vera að fá einhverja aðstoð.\n,,Nú sé ég að hér er við tröll að eiga en ekki menn.”\nÞórir flýr af hólmi með menn sína og liggja þá átján þeirra í valnum og margir sárir.", "Grettir er mjög þreyttur en þykir skrítið að Þórir hafi flúið og skilur ekki af hverju menn hans sóttu ekki að honum að aftan, sér hann þá stóran og mikinn mann og nokkuð sáran, spyr hver þar sér og sá segist heita Hallmundur og sé sá sem hafi tekið fast í tauminn hjá Gretti á Kili nokkrum árum áður (Loftur - kafli 54), hafði hann aðstoðað Gretti í skarðinu og er Grettir ákaflega þakklátur.\nHallmundur býður Gretti að koma með sér í helli sinn í Langjökli (Balljökull), þar býr hann ásamt dóttur sinni sem gerir að sárum þeirra beggja og þar dvelst Grettir um sumarið.\nSagt er að Grettir hafi drepið sex manna Þóris en Hallmundur tólf menn.\nGrettir vill nú fara aftur til byggða og fer til Þorsteins Kuggasonar frænda síns í Ljárskógum í Dölunum og leitar ráða um hvert hann geti nú farið, Þorsteinn segir að sífellt fleiri menn snúist gegn Gretti og fáir vilji taka við honum en segir honum að fara suður á Mýrar í Borgarfirði og reyna fyrir sér þar."]}, {"num": 58, "paras": ["Þá bjó í Hólmi Björn Hítdælakappi. Hann var Arngeirsson, Bersasonar goðlauss, Bálkasonar er nam Hrútafjörð sem fyrr segir. Björn var höfðingi mikill og harðfengur og hélt jafnan seka menn. Grettir kom í Hólm og tók Björn vel við honum því að vinátta hafði verið með hinum fyrrum frændum þeirra. Grettir spurði ef hann vildi honum nokkra ásjá veita.", "Björn sagði að hann ætti svo sökótt um allt land að menn mundu forðast bjargir við hann um það er sekt nemur \"en heldur skal eg þér gagn gera ef þú lætur þá menn vera í friði sem í minni vernd eru hvers sem þú gerir við aðra menn hér í byggð.\"", "Grettir játaði því.", "Björn mælti: \"Að því hefi eg hugað að í því fjalli sem fram gengur fyrir utan Hítará mun vera vígi gott og þó fylgsni ef klóklega er um búið. Er þar bora í gegnum fjallið og sér það neðan af veginum því að þjóðgatan liggur niðri undan en sandbrekka svo brött fyrir ofan að fáir menn munu upp komast ef einn maður röskur er til varnar uppi í bælinu. Nú líst mér það helst ráð og umtalsmál að vera þar því að þaðan er hægt að leita til fanga ofan á Mýrar og út til sjóvar.\"", "Grettir kvaðst hans forsjá hlíta mundu ef hann vildi nokkuð til leggja. Fór Grettir þá í Fagraskógafjall og bjóst þar um. Hann tjaldaði með grá vaðmáli fyrir boruna á fjallinu og þótti sem þar sæi í gegnum neðan af götunum. Réð hann þá til fanga ofan í byggðina. Þótti Mýramönnum mikill vágestur kominn er Grettir var.", "Þórður Kolbeinsson bjó þá á Hítarnesi. Hann var skáld gott. Í þenna tíma var fjandskapur mikill með þeim Birni og Þórði og þótti Birni eigi verr en hálfneytt þó að Grettir gerði óspekt mönnum Þórðar eða fé.", "Grettir var jafnan með Birni og reyndu þeir margan frækleik, og vísar svo til í sögu Bjarnar að þeir kölluðust jafnir að íþróttum. En það er flestra manna ætlan að Grettir hafi sterkastur verið á landinu síðan þeir Ormur Stórólfsson og Þórálfur Skólmsson lögðu af aflraunir. Þeir Grettir og Björn lögðust í einu eftir allri Hítará ofan frá vatni og út til sjóvar. Þeir færðu stéttir þær í ána er aldrei síðan hefir úr rekið hvorki með vatnavöxtum né ísalögum eða jöklagangi. Sat Grettir í Fagraskógafjalli svo einn vetur að honum voru öngvar aðfarir gervar en þó misstu þá margir síns fyrir honum og fengu ekki að gert því að hann hafði gott vígi en átti jafnan vingott við þá sem næstir honum voru."], "recap": ["Á Mýrum fer Grettir til Björns Hítdælakappa í Hólmi við Hítará, Björn var mikill höfðingi og tók jafnan á móti sekum mönnum. \nBjörn segir að hann vilji gera fylgsni í helli í Fagraskógafjalli við Hítará og Grettir megi vera hjá honum ef hann hjálpi honum að útbúa fylgsnið, Grettir fer í það verkefni.\nFer Grettir svo um sveitina til bænda og nær í alls kyns mat og varning í þeirra óþökk og fer með í fylgsnið,\n,,Þótti Mýrarmönnum mikill vágestur kominn er Grettir var.”\nÞórður Kolbeinsson býr á Hítarnesi og eru þeir Björn óvinir, Björn kippir sér því lítið upp við að Grettir ræni menn Þórðar og búfénaði frá þeim.\nGrettir og Björn eru mikið saman, þykja nokkuð jafn sterkir og öflugir og vinna ýmis þrekvirki, þar á meðal setja þeir steina í Hítará til að geta komist yfir hana og má enn sá þessa steina þar.\nGrettisstillur.\nGrettir dvelur í Fagraskógafjalli í einn vetur án þess að nokkur reyni að koma ná honum og koma fyrir kattarnef."]}, {"num": 59, "paras": ["Maður hét Gísli. Hann var sonur Þorsteins sem Snorri goði lét drepa. Gísli var mikill maður og sterkur og afburðarmaður í vopnum og klæðum og gerði um sig mikið og nokkuð sjálfhælinn. Hann var siglingamaður og kom það sumar út í Hvítá er Grettir hafði einn vetur verið í fjallinu. Þórður Kolbeinsson reið til skips. Gísli fagnaði honum vel og bauð honum varning sinn sem hann vildi. Þórður þá það og tóku þeir tal með sér.", "Gísli mælti: \"Er það satt sem mér er sagt að þér verður ráðfátt að koma í burt skógarmanni þeim er yður gerir margt mein?\"", "Þórður sagði: \"Ekki höfum vér til reynt en mörgum líst hann torsóttlegur vera og hefir að því mörgum orðið.\"", "\"Von þykir mér að yður veiti þungt við Björn er þér rekið eigi þenna af yður. Er því verr að eg mun of fjarri í vetur að eg mætti bæta að þessu ráði.\"", "\"Spyrja mun þér best þykja við hann að eiga.\"", "\"Eigi þarftu að segja mér frá Gretti,\" sagði Gísli. \"Reynt hefi eg brattara þá er eg var í herförum með Knúti konungi hinum ríka og fyrir vestan haf og þótti eg verja mitt rúm. Og kæmi eg í færi við hann þá treysti eg mér og vopnum mínum.\"", "Þórður svarar, kvað hann eigi til einskis vinna skyldu ef hann réði Gretti af \"er og meira fé lagt til höfuðs honum en nokkrum öðrum skógarmanni og voru áður sex merkur silfurs en í sumar lagði til Þórir úr Garði þrjár merkur og ætla menn að sá muni nóg til vinna er hlýtur.\"", "\"Allt verður til fjárins unnið,\" sagði Gísli, \"og er oss eigi síst kaupmönnum. En nú skulum við hljótt fara með þessu tali. Kann vera að hann sé varari um sig,\" sagði hann, \"þegar hann veit að eg er í ráðum með þér og yður. Eg ætla að vera í vetur út á Ölduhrygg eða er nokkuð bæli hans á veginum? Mun hann eigi við þessu sjá. Skal eg ekki fjölmenni draga að honum.\"", "Þórði líkaði vel þessi ráðagerð. Reið hann heim síðan og lét kyrrt um þetta.", "Hér fór sem mælt er að oft er í holti heyrandi nær. Þeir menn höfðu verið hjá viðurtali þeirra Gísla sem voru vinir Bjarnar í Hítardal og sögðu honum innilega frá. En er þeir Grettir fundust gat Björn um fyrir honum, sagði nú reyna mundu hversu hann stæði á móti.", "\"Væri eigi ógaman,\" segir Björn, \"þó að þú hrektir fyrir honum en drepir hann eigi ef þú mátt annað.\"", "Grettir glotti við og gaf sér fátt um.", "Nær réttum um haustið fór Grettir ofan í Flysjuhverfi og sótti sér sauði. Hann gat náð fjórum geldingum. Bændur urðu varir við ferð hans og fóru eftir honum. Það var mjög jafnsnemma að hann komst undir hlíðina og hinir komust að og vildu elta frá honum en ekki báru þeir vopn á hann. Þeir voru sex saman og flæktust á veginn fyrir hann. Honum gerði hermt við sauðina og þreif tvo og kastaði forbrekkis svo þeir lágu í óviti. Og er hinir sáu það gengu þeir að ódjarflega. Grettir tók sauðina og krækti saman á hornunum og kastaði um sína öxl sínum tveimur, gekk síðan upp í bæli sitt. Bændur hurfu aftur og þóttust illt hafa af fengið og undu þeir nú verr en áður sínum hlut.", "Gísli sat við skip um haustið þar til er því var til hlunns ráðið. Bar honum margt til dvala og var af því síðbúinn og reið litlu fyrir veturnætur. Fór hann þá sunnan og gisti undir Hrauni fyrir sunnan Hítará.", "Um morguninn áður Gísli reið þaðan talaði hann til fylgdarmanna sinna: \"Nú skulum vér ríða í litklæðum í dag og látum skógarmanninn það sjá að vér erum eigi sem aðrir förumenn er hér rekast daglega.\"", "Þeir voru þrír saman og gerðu svo. Og er þeir komu út yfir ána þá talaði hann enn til: \"Hér er mér sagt til skógarmannsins upp í tindunum þessum og ekki er hér greiðgengt. Eða mun honum eigi vel líka að finna oss og sjá þing vor?\"", "Þeir kveða hann jafnan vanan þess.", "Þenna morgun hafði Grettir snemma upp staðið í bæli sínu. Veður var kalt og frjósanda og fallinn að snjór og þó lítill. Hann sá að þrír menn riðu sunnan yfir Hítará og skein á skrúðklæðin og smelta skjölduna. Gretti kom nú í hug hverjir vera mundu og þykist munu þurfa að fá sér eitthvert plagg af þessum. Var honum forvitni á að finna þá er svo mikið gömbruðu, tekur nú vopn sín og hleypur nú ofan í skriðuna.", "Og er Gísli heyrði til að grjótið sarglaði mælti hann svo: \"Maður fer þar ofan úr hlíðinni og heldur mikill og sá vill oss finna. Verðum nú við rösklega því að hér ber veiði í hendur.\"", "Fylgdarmenn hans sögðu þenna eigi mundu hlaupa í hendur þeim ef hann treysti sér eigi \"og er vel að sá hafi brek er beiðist.\"", "Eftir það hlaupa þeir af baki.", "Grettir kom að í því og tók til klæðsekks er Gísli hafði fyrir aftan sig við söðul sinn og mælti: \"Þetta mun eg hafa. Eg lýt oft að litlu.\"", "Gísli svarar: \"Eigi skal það vera eða veist þú eigi við hvern er þú átt um.\"", "Grettir svarar: \"Eigi er mér það svo glöggt um. Mun eg og ekki að þessu mannamun gera síðan eg mæli til svo lítils.\"", "\"Vera má að þér þyki lítið,\" segir hann, \"en heldur vil eg láta þrjá tigu hundraða. En ofarlega mun liggja ójafnaður í þér og sækjum að honum piltar og sjáum hvað hann má.\"", "Þeir gerðu svo. Grettir lét hefjast fyrir og veik að steini þeim er þar stendur við götuna og Grettishaf er kallað og varðist þaðan. Gísli eggjaði fast fylgdarmenn sína. Grettir sá nú að hann var ekki slíkur fullhugi sem hann lést því að hann stóð jafnan á baki mönnum sínum. Gretti leiddist nú þófið og sveipaði til saxinu og hjó annan fylgdarmann Gísla banahögg og hljóp nú frá steininum og sótti svo fast að Gísli hrökk fyrir allt út með fjallinu. Þá féll annar förunautur Gísla.", "Grettir mælti þá: \"Það sér lítt á að þú hefir víða vel fram gengið og illa skilst þú við þína félaga.\"", "Gísli svarar: \"Sá er eldurinn heitastur er á sjálfum liggur og er illt að fást við heljarmanninn.\"", "Skiptust þeir þá fám höggum við áður en Gísli kastaði vopnunum og hefir á rás undan út með fjallinu. Grettir gefur honum tóm til að kasta því sem honum líkar og í hvert sinn er Gísli sér ráðrúm til kastaði hann einhverju klæði. Fór Grettir aldrei harðara eftir en sund var í milli þeirra. Allt hljóp Gísli út yfir fjallið og svo um þveran Kaldárdal og svo um Áslaugarhlíð og fyrir ofan Kolbeinsstaði og svo út í Borgarhraun. Þá var Gísli í línklæðum einum og gerðist nú ákaflega móður. Grettir fór eftir og var jafnan í hendingu með þeim. Hann reif þá upp hríslu mikla. En Gísli létti eigi fyrr en hann kom út að Haffjarðará. Hún var gengin upp og ill yfirferðar. Gísli ætlaði þegar út á ána. Grettir snaraði þá eftir honum og greip hann og kenndi þá aflsmunar.", "Rak Grettir hann þá niður undir sig og mælti: \"Ertu Gísli sá er finna vildir Gretti Ásmundarson?\"", "Gísli svarar: \"Eg hefi nú fundið hann en eigi veit eg hversu við skiljumst og haf nú það sem þú hefir fengið en lát mig fara lausan.\"", "Grettir mælti: \"Ekki mun þér skiljast það sem eg segi þér og verð eg nú að gera þér áminning\" rekur síðan skyrtuna fram yfir höfuð honum og lætur ganga límann um bak honum og báðar síðurnar. En Gísla fýsti jafnan að snúa sér undir. Afhýðir Grettir hann með öllu og lét hann síðan lausan. Hugsaði Gísli það að fyrr vildi hann ekki læra af Gretti en hafa slíka flenging aðra. Vann hann og aldrei oftar til slíkrar húðstroku.", "En þegar Gísli kom fótum undir sig hljóp hann út á hyl einn mikinn og svimaði þar yfir ána og kom um nóttina á þann bæ er í Hrossholti heitir og var þá mjög þrekaður. Þar lá hann viku og hljóp blástur í búkinn. Eftir það fór hann til vistar sinnar.", "Grettir sneri aftur og tók upp þing hans sem Gísli hafði niður kastað og færði heim til sín og fékk Gísli ekki af þeim síðan.", "Mörgum þótti þetta maklega gert við Gísla fyrir umfang sitt og raup er hann hafði af sér gert.", "Grettir kvað þetta um sameign þeirra:", "Rennr, sá er rispar tönnum", "raunlítt er skal bítast,", "marr, né mæðist fyrri,", "mest fyr öðrum hesti.", "En fyr mér um Mýrar", "margnenninn dag þenna,", "fremd er hann firrðr og sæmdum,", "físandi rann Gísli.", "Eftir um vorið bjóst Gísli til skips og bauð á því mestan varnað að nokkur hlutur færi suður með fjalli, það sem hann ætti, kvað þar sjálfan fjandann fyrir vera. Gísli reið suður með sjó alla leið til skips og fundust þeir Grettir aldrei síðan og þótti öngvum til hans koma upp frá því og er hann úr sögunni.", "Enn versnaði með þeim Þórði Kolbeinssyni og Gretti. Setti Þórður nú mörg ráð til að Grettir yrði á burt komið eða drepinn ella."], "recap": ["Gísli Þorsteinsson kemur til landsins um sumarið, hann er mikill maður og sterkur, með góð vopn og klæði og nokkuð sjálfshælinn.\nÞórður fer til skips og taka þeir Gísli tal saman, Gísli spyr um Gretti og segist hafa heyrt af honum og að hann hafi reynst mönnum erfiður viðureignar. \nÞórður segir Gísla að best sé fyrir hann að heyra bara um Gretti en ekki hitta hann, Gísli segist þá hafa komist í mun meiri mannraunir í herförum erlendis, hreykir sér mjög og segist sko alveg treysta sér til að berjast við Gretti. \nÞórður segir að til mikils sé að vinna þar sem mikið fé hafi verið lagt til höfuðs Gretti og hvetur Gísla til að fara gegn Gretti.\nGísli segist ætla að reyna sig við verkefnið en segir að best sé að Grettir viti ekki að þeir Þórður hafi talað saman því þá verði hann var um sig.\nMenn frá Birni í Hítardal heyra á tal Gísla og Þórðar og láta Björn vita sem varar Gísla við því sem koma skal, segir jafnframt að gaman væri ef Grettir léki Gísla grátt án þess þó að drepa hann.", "Gísli er við skipið um sumarið þar til það er sett upp á land og ríður þá að Hítará þar sem hann gistir, morguninn eftir segir hann við fylgdarmenn sína tvo að þeir skuli ríða saman í litklæðum og láta skógarmanninn Gretti sjá það þarna séu ekkert venjulegir menn á ferð.\nGrettir var uppi í bæli sínu í hellinum og sér til mannanna skrautlegu, hann vill endilega fara á eftir þeim og ná sér í klæði af þeim og stekkur af stað niður hlíðina að þeim.\nGrettir kemur að þeim og segist vilja fá litskrúðug föt úr fórum þeirra en Gísli hvetur menn sína til bardaga.\nÞeir berjast, Gísli lætur menn sína tvo berjast við Gretti en heldur sig sjálfur til baka, Grettir  drepur svo mennina báða en þá leggur Gísli á flótta.\nGrettir eltir Gísla alla leið yfir í Haffjarðará, á leiðinni tínir Gísli af sér þungar og litríkar spjarirnar og Grettir hirðir þær upp (sjá mynd bls. 338).\nÞegar kemur að Haffjarðará er Gísli á nærklæðunum einum saman, hann stekkur í ána en Grettir þrífur þá til hans, klæðir hann úr nærtreyjunni og híðir hann með trjágrein, niðurlægir hann, en sleppir honum síðan og kemst Gísli burt."]}, {"num": 60, "paras": ["Nú er Grettir hafði verið tvo vetur í Fagraskógafjalli og er hinn þriðji var kominn þá fór Grettir suður á Mýrar á þann bæ er í Lækjarbug heitir og hafði þaðan sex geldinga að óvilja þess er átti. Þaðan fór hann ofan til Akra og rak á burtu tvö naut til sláturs og marga sauði og fór upp fyrir sunnan Hítará.", "En er bændur urðu varir við ferð hans gerðu þeir orð Þórði á Hítarnesi og báðu hann fyrir bindast að ráða Gretti af en hann fór undan. En við bæn manna fékk hann til Arnór son sinn, er síðan var kallaður jarlaskáld, að fara með þeim og bað þá eigi láta Gretti undan reka. Voru þá menn sendir um alla byggðina.", "Bjarni hét maður er bjó á Jörva í Flysjuhverfi. Hann safnaði mönnum fyrir utan Hítará. Ætluðu þeir svo til að sínum megin skyldu koma hvorir flokkarnir.", "Grettir var við þriðja mann. Hét sá Eyjólfur er fór með honum, son bónda úr Fagraskógum, og var röskur maður og hinn þriðji maður með þeim.", "Þeir komu fyrst, Þórarinn frá Ökrum og Þorfinnur úr Lækjarbug og voru nær tuttugu menn saman. Grettir vildi þá leita út yfir ána. Þá komu þeir Þorgeir og Arnór og Bjarni utan að ánni. Nes mjótt gekk fram í ána þeim megin sem Grettir var. Hann rak féið í framanvert nesið þá er hann sá mannaförina því að hann vildi aldrei laust láta það sem hann fékk höndum á komið.", "Mýramenn réðu þegar til atgöngu og létu gildlega. Grettir bað fylgdarmenn sína að geyma að þeir gengju eigi að baki honum. Ei máttu í senn allmargir að honum ganga. Varð þar hörð viðureign með þeim. Grettir hjó á tvær hendur með saxinu og varð þeim eigi auðvelt að sækja að honum. Féllu þá sumir Mýramenn en sumir urðu sárir. Þeir urðu seinir utan yfir ána því að vaðið var ei allnær. Ei höfðu þeir lengi barist áður en þeir hurfu frá. Þórarinn frá Ökrum var gamall maður mjög, svo að hann var ekki í atsókninni.", "En er úti var bardaginn þá kom að Þrándur son Þórarins og Þorgils Ingjaldsson bróðurson Þórðar og Finnbogi son Þorgeirs Þórhaddssonar úr Hítardal og Steinólfur Þorleifsson úr Hraundal. Þeir eggjuðu menn mjög til atsóknar. Gerðu þeir enn harða hríð.", "Grettir sá nú að annaðhvort varð að gera, flýja eða hlífast ekki við. Gengur hann nú svo hart fram að öngvir héldust við því svo var mannmargt að honum þótti ósýnt til undankomunnar utan sem vinna sem mest áður en hann félli, vildi og hafa þann einnhvern fyrir sig er honum þótti manntak í vera. Hljóp hann þá að Steinólfi úr Hraundal og hjó til hans í höfuðið og klauf hann í herðar niður og þegar annað högg hjó hann til Þorgils Ingjaldssonar og kom á hann miðjan og tók nálega í sundur. Þá vildi Þrándur fram hlaupa og hefna frænda síns. Grettir hjó til hans á lærið hægra svo að úr tók allan vöðvann og varð hann þegar óvígur. Eftir það veitti hann Finnboga mikinn áverka.", "Þá kallaði Þórarinn og bað þá frá hverfa \"því að því verra munuð þér af honum fá sem þér berjist lengur en hann kýs menn úr liði yðru.\"", "Þeir gerðu svo og sneru frá. Þar voru fallnir fimm menn en fimm sárir til ólífis og örkumla. En flestir höfðu nokkurar skeinur þeir sem á fundinum höfðu verið. Grettir var ákaflega móður en lítt sár. Leituðu Mýramenn við þetta undan og höfðu fengið mikinn mannskaða því að þar féllu margir röskvir menn.", "En þeim utan yfir ána fórst seint og komu eigi fyrr en slitið var fundinum. Og er þeir sáu ófarir sinna manna þá vildi Arnór ekki hafa sig í hættu og fékk hann mikið ámæli af föður sínum og mörgum öðrum. Ætla menn að hann hafi engi garpur verið. Það heitir nú Grettisoddi er þeir börðust.", "En þeir Grettir tóku sér hross og riðu upp undir fjall því að þeir voru allir sárir. Og er þeir komu í Fagraskóga var Eyjólfur þar eftir. Þar var bóndadóttir úti og spurði að tíðindum.", "Grettir sagði af hið ljósasta og kvað vísu:", "Hæg munat, hirði-Sága", "hornflæðar, nú græða", "stór, þótt steyptust fleiri,", "Steinólfs höfuðskeina.", "Því er um Þorgils ævi", "þung von að bein sprungu.", "Lýðr segir átta aðra", "auðbrjóta þar dauða.", "Eftir það fór Grettir í bæli sitt og sat þar um veturinn."], "recap": ["Mörgum þykir þetta makleg málagjöld fyrir Gísla sem var montinn og sjálfhælinn en stóð þó engan veginn undir því, Gísli hvarf svo á brott og sást ekki meir.\nEnn versnar þó með þeim Þórði og Gretti eftir þetta og vill Þórður allt til þess vinna að koma Gretti burt eða fyrir kattarnef.\nGrettir hefur nú verið tvo vetur í Fagraskógafjalli og líður á þriðja veturinn.\nGrettir fer suður á Mýrar ásamt tveimur fylgdarmönnum, fer á milli bæja og tekur búfénað ófrjálsri hendi, bændum til mikillar armæðu.\nBændur úr sveitinni fara á eftir Gretti og verður bardagi milli þeirra Mýramanna og Grettis og fylgdarmanna hans, margir Mýramenn falla og særast og svo fer að þeir hörfa undan Gretti, Grettir fer svo í bæli sitt og er þar um veturinn."]}, {"num": 61, "paras": ["En er þeir Björn fundust sagði hann Gretti að honum þótti nú mikið að orðið \"og mun þér ekki hér fært vera álengdar. Hefir þú nú drepið bæði frændur mína og vini en ekki mun eg kasta niður því sem eg hefi játað þér meðan þú ert hér.\"", "Grettir kvaðst hendur sínar og líf eiga að verja \"en illa er það er þér mislíkar.\"", "Björn kvað nú svo búið vera verða. Litlu síðar komu þeir menn til Bjarnar sem misst höfðu frændur sína fyrir Gretti og báðu að hann léti eigi óeirðarmann þenna vera þar lengur til skapraunar við þá. Björn sagði að svo skyldi vera þegar að vetur létti af.", "Þrándur var græddur, sonur Þórarins á Ökrum. Hann var gildur maður fyrir sér. Hann átti Steinunni dóttur Hrúts á Kambsnesi. Þorleifur í Hraundal faðir Steinólfs var mikill maður fyrir sér. Frá honum eru komnir Hraundælir.", "Ekki er nú getið um sameign Grettis og þeirra Mýramanna fleira meðan er hann var þar í fjallinu. Hélt Björn og vináttu við hann en þó fækkuðust heldur vinir Bjarnar fyrir þetta er hann lét Gretti þar vera því að menn undu illa við að hafa frændur sína bótalausa.", "Um þing leitaði Grettir burt af Mýrum. Fór hann þá enn til Borgarfjarðar og fann Grím Þórhallsson og leitaði hann þá ráðs hversu hann skyldi þá breyta. Grímur kveðst eigi hafa efni til þess að halda hann og því fór Grettir til fundar við Hallmund vin sin og dvaldist þar um sumarið þar til er á leið.", "Um haustið fór Grettir í Geitland og beið þar til þess er bjart veður kom. Þá gekk hann upp á Geitlandsjökul og stefndi á landsuður eftir jöklinum og hafði með sér ketil og eldsvirki. Það ætla menn að hann hafi farið að tilvísan Hallmundar því að honum hefir verið víða kunnigt.", "Grettir fór þar til er hann fann dal í jöklinum, langan og heldur mjóvan, og lukt að jöklum öllum megin svo að þeir skúttu fram yfir dalinn. Hann komst ofan í einhverjum stað. Hann sá þá fagrar hlíðir grasi vaxnar og smákjörr. Þar voru hverar og þótti honum sem jarðhitar mundu valda er eigi luktust saman jöklarnir yfir dalnum. Á lítil féll eftir dalnum og sléttar eyrar báðum megin. Lítill var þar sólargangur en það þótti honum ótal hve margur sauður þar var í dalnum. Það fé var miklu betra og feitara en hann hefði þvílíkt séð.", "Grettir bjóst nú þar um og gerði sér skála af þeim viði sem hann fékk þar til. Tók hann sér nú sauði til matar. Var þar betri einn sauður til niðurlags en tveir annars staðar.", "En ær mókollótt var þar með dilki sú er honum þótti mest afbragð í vera fyrir vaxtar sakir. Var honum forvitni á að taka dilkinn og svo gerði hann og skar síðan dilkinn. Hálf vætt mörs var í dilkinum en hann var þó öllu betri. En er Mókolla missti dilks síns fór hún upp á skála Grettis hverja nótt og jarmaði svo að hann mátti öngva nótt sofa. Þess iðraðist hann mest er hann hafði dilkinn skorið fyrir ónáðum hennar.", "Hvert kveld er hálfrökkvað var heyrði hann hóað upp í dalnum og þá hljóp féð allt til hins sama bóls hvert kveld.", "Svo hefir Grettir sagt að fyrir dalnum hafi ráðið blendingur, þurs einn sá er Þórir hét, og í hans trausti hafði Grettir þar verið. Við hann kenndi Grettir dalinn og kallaði Þórisdal. Dætur kvað hann Þóri eiga og henti Grettir gaman að þeim enda tóku þær því vel því að þar var ekki margkvæmt. En þá er fastað var gerði Grettir þá minning að þá skyldi eta mör og lifrar um langaföstu.", "Ekki bar þar til tíðinda um veturinn. Þá þótti Gretti þar svo dauflegt að hann mátti þar eigi lengur vera. Fór hann þá í burt úr dalnum og gekk suður þvers af jöklinum og kom þá að norðan að miðjum Skjaldbreið. Reisti hann upp hellu og klappaði á rauf og sagði svo ef maður legði auga sitt við raufina á hellunni að þá mætti sjá í gil það sem fellur úr Þórisdal.", "Síðan fór hann suður um land og svo til Austfjarða. Var hann í þessari ferð um sumarið og veturinn og fann alla hina meiri menn og bægði honum svo við að hvergi fékk hann vist né veru. Svo fór hann aftur hið nyrðra og dvaldist í ýmsum stöðum."], "recap": ["Björn kemur nú til Grettis og segir honum að hann geti ekki lengur verið í fylgsni sínu þar sem hann hafi drepið svo marga úr sveitinni.\nGrettir er um kyrrt yfir veturinn en fer svo í Borgarfjörð og hittir þar Grím Þórhallsson frænda sinn (bróðir Gamla, mágs Grettis), Grímur getur hins vegar ekki leyft honum að vera og því fer hann til Hallmundar vinar síns í Langjökli og dvelst þar um sumarið.\nGrettir fer svo upp á Geitlandsjökul og finnur þar dal í jöklinum þar sem eru fagrar hlíðar, hverar vegna jarðhita og lítil á sem fellur niður eftir dalnum, lítil sól kemst í dalinn en þar er fé feitara og betra en hann hafði vanist.\nGrettir byggir sér skála í dalnum en þar býr einnig þurs sem heitir Þórir ásamt dætrum sínum tveimur.\nGrettir fær að búa í dalnum, sem hann kallar Þórisdal, í skjóli þursins.\nAð vetri liðnum vill Grettir færa sig og fer um alla Austfirði næsta sumar og vetur til að leita skjóls meðal manna þar en fær hvergi inni, fer svo aftur norður og dvelst á ýmsum stöðum."]}, {"num": 62, "paras": ["Litlu síðar en Grettir fór af Arnarvatnsheiði kom sá maður á heiðina er Grímur hét. Hann var son ekkjunnar á Kroppi. Hann hafði drepið son Eiðs Skeggjasonar úr Ási og varð fyrir það sekur ger. Hann settist nú þar sem Grettir hafði áður verið og veiddi vel úr vatninu. Hallmundi lék öfund á er Grímur var kominn í stað Grettis og hugsaði að honum skyldi engi árferð í vera þótt hann veiddi mart.", "Svo bar til einn dag að Grímur veiddi hundrað fiska og bar heim til skála og bjó um úti. En um morguninn eftir er hann kom til var í burtu hver fiskur.", "Þetta þótti honum undarlegt og fór til vatnsins og veiddi nú tvö hundruð fiska, færði heim og bjó um og fór allt á sömu leið að allir voru í burt að morgni. Nú þótti honum eigi að einum brunni bera.", "Hinn þriðja dag veiddi hann þrjú hundruð fiska, bar heim og vakti yfir skála sínum. Grímur sá út í hurðarboruna ef nokkur kæmi til skálans. Leið nú svo nokkuð fram á nóttina. Og er eigi var þriðjungur af nótt þá heyrir hann gengið úti hjá og stigið heldur hart. Og er Grímur varð þessa var tók hann öxi er hann átti. Það var allhvasst vopn. Hann vildi vita hvað þessi hafðist að. Komumaðurinn hafði mikinn meis að baki og setti niður og litaðist um og
