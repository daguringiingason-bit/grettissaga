aum leita eldiviðar. Hann varð illa við og kvaðst kvaldur er hann skyldi kveljast úti í hverju illviðri. Hann fór ofan fyrir stigana og fann þar rót kerlingar og þóttist vel hafa gengið, þreif upp og stritaði heim til skála og kastaði niður og varð af dykur mikill. Það heyrði Grettir.", "\"Aflað hefir Glaumur nokkurs og skal eg fara út og sjá hvað það er\" og tekur upp bolöxi og gengur út.", "Glaumur mælti þá: \"Fær þú eigi verr í sundur en eg hefi heim fært.\"", "Grettir varð skapfátt við þrælinn og tvíhenti öxina til rótarinnar og eigi geymdi hann hvað tré það var. Og jafnskjótt sem öxin kom við tréið snerist hún flöt og stökk af trénu og á fót Grettis hinn hægra fyrir ofan kné og svo að stóð í beini og var það sár mikið.", "Þá leit hann á tréið og mælti: \"Sá varð nú drjúgari er verr vildi og mun þetta eigi eitt saman fara. Er hér nú komið það sama tré sem eg hefi út kastað tvo daga. Hefir þig nú Glaumur hent tvö slys, það annað að þú slökktir eld vorn og það að þú barst heim þetta óheillatré, en ef þig hendir hið þriðja slys þá verður það þinn bani og vor allra.\"", "Þá tók Illugi og batt um skeinu Grettis og blæddi lítt og svaf Grettir vel um nóttina og svo liðu þrjár nætur að engi kom verkur í sárið. En er þeir leystu til var skeinan saman hlaupin svo að nálega var gróin.", "Illugi mælti þá: \"Það vil eg ætla að þér verði eigi langt mein að þessu sári.\"", "\"Vel væri þá,\" segir Grettir, \"en undarlega hefir þetta til borið að hverju sem verður en hinn veg segir mér hugur um.\""], "recap": ["Nú líður fram á haustið og biður Þuríður þá um að sér verði ekið til sjávar, Þorbjörn spyr af hverju og hún svarar að erindið sem nú lítið en muni leiða af sér eitthvað stærra og merkilegra.\nÞegar hún kemur í fjöruna sér hún tré sem er sviðið og gniðað öðrum megin, hún ristir rúnir í tréð og kveður galdra, lætur svo setja tréð í sjóinn og mælir svo fyrir að það skuli reka til Drangeyjar:\n,,Og verði Gretti allt mein að.”\nÞorbjörn skilur ekkert í þessu veseni á fóstru sinni.\nNokkrum dögum eftir gjörning Þuríðar ganga Grettir og félagar niður bjargið að leita að eldivið og finna þá tréð umrædda.\nIllugi vill taka tréð með upp á eyjuna og segir að þetta sé mikill eldiviður, Grettir vill það hins vegar alls ekki og vill reka það aftur út á sjó:\n,,Illt tré og af illum sent og skulum við annan eldivið hafa…því það er sent okkur til óheilla.”\nDaginn eftir fara þeir aftur að leita að eldivið, sjá aftur tréð nálægt stigunum og reka það aftur á haf út.", "Þriðja daginn er veður vont og nenna þeir bræður ekki út að safna eldivið heldur reka Glaum út til þess, hann fer niður og finnur tréð og ber það heim.\nGrettir fer út með öxi, gáir ekki að um hvaða tré ræðir og leggur til við að höggva tréð í eldivið.\nUm leið og hann heggur í tréð stekkur öxin af því og í lærið á Gretti svo kemur mikið sár inn að beini.\nGrettir áttar sig á hvað hafi gerst, hvaða tré þetta sé og hvaðan það sér komið.\nGrettir reiðist Glaumi, segir að nú hafi hann tvívegis gerst sekur um mistök; fyrst að láta eldinn slokkna og nú að koma með tréð illa, geri hann þriðju mistökin verði það hans bani.\nIllugi bindur um sár Grettis svo lítið blæðir, þrjár nætur líða án þess að verkur komi í sárið, þá leysir Illugi sárabindið og virðist sem sárið sé næstum gróið.\nIllugi er vongóður um að Gretti verði ekki meira mein að sárinu en Grettir er ekki viss um að það sé rétt hjá bróður sínum."]}, {"num": 80, "paras": ["Nú leggjast þeir niður um kveldið. Og er kom að miðri nótt braust Grettir um fast. Illugi spurði hví hann væri svo ókyrr.", "Grettir sagði að honum gerðist illt í fætinum \"og þætti mér líkara að nokkuð litbrigði væri á.\"", "Kveiktu þeir þá ljós. Og er til var leyst sýndist fóturinn blásinn og kolblár en sárið var hlaupið í sundur og miklu illilegra en í fyrstu. Þar fylgdi mikill verkur svo að hann mátti hvergi kyrr þola og eigi kom honum svefn á augu.", "Þá mælti Grettir: \"Svo skulum vér við búast sem krankleiki þessi sem eg hefi fengið mun eigi til einskis gera jótt í móts við hann ellegar mun þér eigi auðið verða að sigra hann.\"", "Þorbjörn svarar: \"Svo marga hrakför hefi eg þangað farið að þangað kem eg eigi. Er það ærið eitt að þau stórviðri ganga að hvergi er fært hver nauðsyn sem á er.\"", "Hún svarar: \"Allráðlaus ertu er þú sérð eigi bragð til þessa. Nú mun eg enn ráð þar til leggja. Far þú fyrst og afla þér til manna og ríð út til Hofs til Halldórs mágs þíns og tak þá ráð af honum. En ef eg ræð nokkuru um heilsufar Grettis, hvað má þá kalla örvænt að eg ráði vindblöku þeirri er á leikur um stundir?\"", "Þorbirni þótti verða mega að kerling sæi lengra en hann ætlaði og sendi þegar eftir mönnum upp í hérað. Voru þar skjót svör að öngvir þeir sem upp höfðu gefið sinn part vildu nokkurn létta undir leggja, kváðu að Þorbjörn skyldu hafa bæði eyjarhlut og atför við Gretti. Tungu- Steinn fékk honum fylgdarmenn sína tvo, Hjalti bróðir hans sendi honum þrjá menn, Eiríkur í Goðdölum sendi honum einn mann. Þá hafði hann heiman sex menn. Riðu þeir tólf úr Viðvík út til Hofs. Halldór bauð þeim þar að vera og spurði að erindum. Þorbjörn sagði af hið ljósasta. Halldór spurði hver þetta hefði ráðið. Hann sagði að fóstra hans fýsti hann mjög.", "\"Það mun eigi góðu reifa,\" sagði Halldór, \"því að hún er fjölkunnig en það er nú fyrirboðið.\"", "\"Ekki má fyrir öllu sjá um það,\" segir Þorbjörn, \"en um skal nú lúka á einnhvern hátt ef eg má ráða. Eða hversu skal eg fara þess að eg komist í eyna?\"", "\"Sjá þykist eg það,\" segir Halldór, \"að þú treystir einhverju en ei veit eg hversu gott það er. Nú ef þú vilt áfram halda þá far þú út í Haganes í Fljót til Bjarnar vinar míns. Hann á skútu góða. Seg honum orð mín að hann ljái þér skipið. Þaðan mun sigla mega inn til Drangeyjar, en ósýn líst mér ferð yður ef Grettir er ósjúkur og heill. Vitið þér það og víst, vinnið þér hann eigi með drengskap, að nóga á hann eftirmálsmenn. Drepið eigi Illuga ef þér megið annað. En sjá þykist eg að eigi mun allt kristilegt í þessum ráðum.\"", "Nú fékk Halldór þeim sex menn til ferðar. Hét einn Kár en annar Þorleifur, þriðji Brandur. Eigi voru nefndir fleiri. En þaðan fóru þeir átján út í Fljót og komu í Haganes og sögðu Birni orðsending Halldórs. Hann kvað það skylt hans vegna en sagðist ekki eiga Þorbirni vanlaunað en honum sýndist þetta óraferð og latti mjög. Ekki létust þeir aftur mundu hverfa, fóru til sjóvar og settu fram skipið og var þar reiðinn hjá í naustinu. Bjuggust þeir nú til siglingar. Öllum sýndist þeim ófært sem á landi stóðu.", "Nú vinda þeir á. Tók skipið skjótan skrið og mikinn fram á fjörðinn. En svo sem þeir komu aðallega fram á fjörðinn og á djúpið hægðist veðrið svo að þótti aldrei of hvasst. Komu þeir um kveldið er rökkvað var inn til Drangeyjar."], "recap": ["Þuríður gamla hvetur nú Þorbjörn öngul til að fara og finna Gretti, Þorbjörn er tregur til eftir þrjár fýluferðir en Þuríður kemur honum af stað.\nÞorbjörn öngull fer um sveitina og safnar mönnum til að hafa með sér út í Drangey til að berjast við Gretti og eru þeir að lokum tólf saman.\nÞorbjörn kemur til Halldórs mágs síns sem spyr hver hafi ráðlagt honum að fara ferð þessa, Þorbjörn segir að Þuríður hafi gert það og svarar Halldór þá að það boði ekki gott og slæmt sé að mæta Gretti sé hann ósjúkur og heill, en takist Þorbirni að sigra Gretti þá eigi hann ekki að drepa Illuga.\nHalldór fær honum sex menn til viðbótar svo þeir telja átján í heildina, fara þeir á skip og koma undir kvöld að Drangey."]}, {"num": 82, "paras": ["Nú er frá því að segja að Grettir var svo sjúkur að hann mátti eigi á fætur standa. Sat Illugi yfir honum en Glaumur skyldi halda vörð. Hann hafði þá enn mörg orð í móti og kvað þeim svo þykja sem falla mundi fjör úr þeim þó að ekki bæri til. Nú fór hann út úr skálanum og allnauðigur.", "Og er hann kom til stiganna mæltist hann við einn saman og sagði nú að hann skyldi eigi upp draga stigann. Tók hann nú að syfja mjög og lagðist niður og svaf allan daginn og allt þar til er Þorbjörn kom til eyjarinnar. Þeir sáu nú að stiginn var ekki upp dreginn.", "Þá mælti Þorbjörn: \"Brugðið er nú lagi,\" segir hann, \"úr því sem vant er að öngvir eru menn á gangi enda stendur stiginn þeirra. Má vera að fleira beri til tíðinda í ferð vorri en vér hugðum fyrir öndverðu. Nú skulum vér flýta oss til skálans og látum nú eigi áræðisskort verða. Vitum það fyrir víst ef þeir eru heilir að vér munum þurfa að hver dugi sem best.\"", "Síðan gengu þeir upp á eyna og lituðust um og sáu hvar maður lá skammt frá uppgöngunni og hraut fast.", "Þorbjörn kenndi Glaum og gekk að honum og rak sverðshjöltin við eyra honum og bað mannfýluna vaka \"og sannlega er sá eigi vel staddur er líf sitt á undir þínum trúnaði.\"", "Glaumur sest upp og mælti: \"Nú ætla þeir að láta sem vant er. Eða þykir ykkur of mikið frelsi mitt þó að eg liggi hér í kuldanum?\"", "Öngull mælti: \"Ertu vitlaus er þú skynjar ekki að óvinir yðrir eru komnir og munu drepa yður alla.\"", "Þá mælti Glaumur ekki en æpti upp sem hann mátti er hann kenndi mennina.", "\"Gerðu annaðhvort,\" segir hann Öngull, \"að þú þegir í stað og seg oss frá híbýlum yðrum ella drep eg þig.\"", "Þá þagði Glaumur sem honum væri í vatn drepið.", "Þorbjörn mælti: \"Eru þeir að skála bræður eða því eru þeir ekki á ferli?\"", "\"Eigi er það hið hægra,\" segir Glaumur, \"því að Grettir er sjúkur og kominn að bana en Illugi situr yfir honum.\"", "Öngull spurði að heilsufari hans og hvað til hefði borið. En síðan sagði Glaumur hversu til hafði borið um skeinu Grettis.", "Þá hló Öngull og mælti: \"Satt er hið fornkveðna, að langvinirnir rjúfast síst, og hitt annað, illt er að eiga þræl að einkavin, þar sem þú ert Glaumur og hefir þú skemmilega svikið þinn lánardrottin þó að hann væri eigi góður.\"", "Margir lögðu illt til hans fyrir sína ódyggð og lömdu hann nálega til bótleysis og létu hann þar liggja. En þeir gengu heim til skálans og komu við hurðina stundar fast.", "Þá mælti Illugi: \"Knýr Hösmagi hurð bróðir,\" segir hann.", "\"Og knýr heldur fast,\" sagði Grettir, \"og óþyrmilega\" og í því brast sundur hurðin.", "Þá hljóp Illugi til vopna og varði dyrnar svo að þeir náðu eigi inngöngu. Sóttust þeir þá lengi og komu þeir engu við nema spjótalögum og hjó Illugi öll þau af skafti. Og er þeir sáu að þeir gátu ekki að gert hlaupa þeir upp á skálann og rufu. Þá færðist Grettir á fætur og þreif spjót og lagði út á milli viða. Þar varð fyrir Kár heimamaður Halldórs frá Hofi og stóð þegar í gegnum hann.", "Öngull mælti og bað þá fara varlega og geyma sín vel \"því að vér megum sigra þá ef vér geymum ráðs að.\"", "Rufu þeir nú um ásendana og treystu síðan á ásinn þar til er hann brast í sundur. Grettir mátti eigi af knjánum rísa. Greip hann þá saxið Kársnaut. Í því hlupu þeir ofan í tóftina og varð nú hörð svipan með þeim. Grettir hjó með saxinu til Víkars fylgdarmanns Hjalta Þórðarsonar og kom á öxlina vinstri í því er hann hljóp í tóftina og sneið um þverar herðarnar og niður hina hægri síðuna og tók þar sundur þvert manninn og steyptist búkurinn ofan á Gretti í tvo hluti. Gat hann þá ei upp rétt saxið svo skjótt sem hann vildi. Og í því lagði Þorbjörn öngull í milli herða Gretti og var það mikið sár.", "Þá mælti Grettir: \"Ber er hver á bakinu nema sér bróður eigi.\"", "Illugi kastaði skildi þá yfir hann og varði hann svo Gretti rösklega að allir menn ágættu vörn hans.", "Grettir mælti þá til Önguls: \"Hver vísaði yður leið í eyna?\"", "Öngull mælti: \"Kristur vísaði oss leið.\"", "\"En eg get,\" sagði Grettir, \"að hin arma kerlingin fóstra þín hafi vísað þér því að hennar ráðum muntu treyst hafa.\"", "\"Fyrir eitt skal nú yður koma,\" sagði Öngull, \"hverjum sem vér höfum treyst.\"", "Þeir sóttu að fast en Illugi varði þá báða alldrenglega. En Grettir var með öllu óvígur bæði af sárum og sjúkleika. Þá bað Öngull að þeir skyldu bera skjöldu að Illuga \"því að eg hefi öngvan fundið hans líka, eigi eldra mann.\"", "Þeir gerðu nú svo og þröngdu að honum með viðum og vopnum svo að hann kom öngri vörn við. Gátu þeir þá handtekið hann og héldu honum. Hann hafði flestum veitt nokkura áverka þeim sem í atsókninni voru en drepið þrjá fylgdarmenn Önguls.", "Eftir það gengu þeir að Gretti. Var hann þá fallinn áfram. Varð þá engi vörn af honum því að hann var áður kominn að bana af fótarsárinu. Var lærið allt grafið upp að smáþörmum. Veittu þeir honum þá mörg sár svo að lítt eða ekki blæddi. En er þeir hugðu að hann mundi dauður þreif Öngull til saxins og kvað hann nógu lengi hafa borið það. En Grettir hafði fast hneppt fingur að meðalkaflanum og varð ekki laust. Fóru þeir þá til margir og gátu ekki að gert. Átta tóku þeir til áður en lauk og fengu eigi að gert að heldur.", "Þá mælti Öngull: \"Því skulum vér reka sparmælið við skógarmanninn? Og leggið niður höndina við stokkinum.\"", "Og er það var gert hjuggu þeir af honum höndina í úlfliðnum. Þá réttust fingurnir og losnuðu af meðalkaflanum. Þá tók Öngull saxið tveim höndum og hjó í höfuð Gretti. Varð það allmikið högg svo að saxið stóðst ei og brotnaði skarð í miðri egginni. Og er þeir sáu það spurðu þeir því að hann spillti svo góðum grip.", "Öngull svarar: \"Þá er auðkenndara ef að verður spurt.\"", "Þeir sögðu þessa eigi þurfa þar sem maðurinn var dauður áður.", "\"Að skal þó meira gera,\" segir Öngull.", "Hjó hann þá á háls Gretti tvö högg eða þrjú áður af tæki höfuðið.", "\"Nú veit eg víst að Grettir er dauður,\" sagði Öngull.", "Lét Grettir þann veg líf sitt, hinn vaskasti maður er verið hefir á Íslandi, vetri fátt í hálffimmtugum er hann var veginn. En þá var hann fjórtán vetra er hann vó Skeggja, hið fyrsta víg, og þá gekk honum allt til vegs og frama til þess er hann átti við Glám þræl og var hann þá tuttugu vetra. En er hann féll í útlegð var hann hálfþrítugur. En í sekt var hann vel nítján vetur og kom oft í stórar mannraunir og hélt ávallt vel trú sína úr því sem ráða var. Sá hann flest fyrir þó að hann gæti eigi að gert.", "\"Hér höfum vér mikinn garp að velli lagt,\" sagði Þorbjörn. \"Skulum vér nú hafa höfuðið með oss til lands því að eg vil eigi missa þess fjár sem lagt hefir verið til höfuðs honum. Mega þeir þá ekki dyljast við að eg hefi drepið Gretti.\"", "Þeir báðu hann ráða og létu sér þó fátt um finnast því að öllum þótti óprúðlega að unnið.", "Þá mælti Öngull við Illuga: \"Mikill skaði er það um svo röskvan mann sem þú ert er þig hefir hent sú óviska að ráðast til illvirkja með útlegðarmanni þessum og verða fyrir það dræpur og ógildur.\"", "Illugi svarar: \"Svo fremi veistu það sem úti er alþingi í sumar hverjir útlægir verða. En ei muntu né kerling fóstra þín dæma þessi mál því að galdrar ykkrir og forneskja hafa drepið Gretti þó að þér bæruð járn á hann dauðvona og gerðuð svo mikið níðingsverk ofan á fordæðuskap.\"", "Þá sagði Öngull: \"Rösklega segir þú en eigi mun svo vera. Vil eg sýna það að mér sýnist mannskaði í þér og mun eg gefa þér líf ef þú vilt vinna oss trúnaðareið að hefna öngum þeim er í þessari ferð hafa verið.\"", "Illugi mælti: \"Það þætti mér umtalsmál ef Grettir hefði mátt verja sig og hefðuð þér unnið hann með drengskap og harðfengi. En nú er þess engi von að eg muni það til lífs mér vinna að vera slíkur ódrengur sem þú. Er það skjótt af að segja að enginn skal yður óþarfari en eg ef eg lifi því að seint mun fyrnast mér hversu þér hafið unnið á Gretti. Kýs eg miklu heldur að deyja.\"", "Þá átti Þorbjörn tal við förunauta sína hvort þeir skyldu láta Illuga lifa eða eigi. Þeir kváðu hann ráða skyldu aðgerðum því að hann hafði ráðið ferðinni. Öngull kvaðst eigi kunna að eiga þenna mann yfir höfði sér er öngu vildi heita þeim.", "Og er Illugi vissi að þeir ætluðu að höggva hann þá hló hann og mælti svo: \"Nú réðuð þér það af er mér var nær skapi.\"", "Leiddu þeir hann þá er lýsti austur á eyna og hjuggu hann þá og lofuðu allir hans hreysti og þótti hann öllum ólíkur sínum jafnöldrum. Þeir dysjuðu þá bræður báða þar í eyjunni en tóku síðan höfuð Grettis og báru með sér og allt það sem þar var fémætt í vopnum og klæðum. Saxið góða lét Öngull ekki í skipti koma og bar það lengi síðan.", "Þeir höfðu Glaum með sér og bar hann sig allilla. Veður féll þegar um nóttina. Reru þeir til lands um morguninn. Fór Öngull þar á land sem honum þótt gegnast en sendi út skipið til Bjarnar.", "Og er þeir komu mjög inn til Óslands þá tók Glaumur svo illa að bera sig að þeir nenntu eigi að fara með hann lengra og drápu hann þar og grét hann hástöfum áður en hann var höggvinn.", "Öngull fór heim í Viðvík og þóttist vel hafa fram gengið í þessari ferð. Höfuð Grettis lögðu þeir í salt í útihúsi því er Grettisbúr var kallað þar í Viðvík. Lá það þar um veturinn. Öngull var óþokkaður mjög af þessum verkum þegar að menn vissu að Grettir hafði með gerningum unninn verið.", "Sat Öngull kyrrt fram yfir jól. Þá reið hann móts við Þóri í Garði og sagði honum af vígum þessum og það með að hann þóttist eiga fé það er lagt var til höfuðs Gretti.", "Þórir sagði að hann mundi eigi dylja þess að hann hefði ollað sektum Grettis \"hefi eg og oft fengið hart af honum en ekki vildi eg það til lífs hans vinna að gera mig að ódáðamanni eða fordæðu sem þú hefir gert. Mun eg síður leggja þér fé að mér sýnist þú ólífismaður vera fyrir galdur og fjölkynngi.\"", "Öngull svarar: \"Meir ætla eg að þér komi til féfesti og vesalmennska en að þú hirðir með hverju að Grettir væri unninn.\"", "Þórir sagði að skjótur væri vegur með þeim að þeir skyldu bíða alþingis og hafa það er lögmanni sýndist réttast. Skildu þeir með því að þar stóð á illu einu með Þóri og Þorbirni öngli."], "recap": ["Grettir er nú svo sjúkur að hann getur varla stigið í lappirnar, Illugi situr yfir honum en Glaumur á að standa vörð um stigana.\nGlaumur fer út að stigunum til að gæta þeirra en verður mjög þreyttur og sofnar, stigarnir hanga því niðri.\nÞorbjörn öngull og hans menn koma að stigunum niðri og sjá enga menn á verði uppi á eyjunni, Þorbjörn fyllist von um að nú hafi hann loks erindi sem erfiði.\nÞorbjörn og menn hans klifra upp stigana og finna Glaum sofandi, segja hann ónytjung og að hann hafi sannarlega brugðist húsbónda sínum og fer svo að þeir berja hann til óbóta.\nÞeir fara svo að húsi Grettis og Illuga og berja fast á hurðina þar til þeir ná að brjóta hana upp og ætla inn.\nIllugi verst inngöngu þeirra og svo fer að þeir fara upp á þak hússins og spenna það upp til að komast inn. \nGrettir reisir sig upp eins og hann getur, notast við spjót sem og Kársnaut til að verja sig gegn mönnunum og nær að drepa tvo þeirra", "Svo fer að Þorbjörn öngull nær að leggja spjót í herðar Grettis og verður mikið sár, Illugi kastar þá skildi yfir bróður sinn og ver hann eins og hann getur.\n,,Ber er hver að baki nema sér bróður eigi.”\nÞorbjörn og menn hans sækja hart að Gretti og Illuga en Illugi ver þá bræður af mikilli dirfsku, þeir ná þó að þrengja að Illuga með skjöldum sínum svo hann getur ekki lengur varist og handsama þeir hann.\nIllugi hafði þá sært flesta sem í aðsókninni voru og drepið þrjá þeirra.\nEftir það ganga þeir að Gretti, sem er nær dauða en lífi af völdum sársins á lærinu, og stinga hann í bak og fyrir þar til þeir telja hann látinn.\nÞorbjörn Öngull ætlar þá að taka Kársnaut úr hendi Grettis en fingur Grettis kreppa svo fast um skaftið að saxið næst ekki úr hendi hans, þeir höggva þá hendina af Gretti og réttist þá úr fingrum hans svo þeir ná saxinu.\nÞorbjörn tekur þá saxið og heggur í höfuð Grettis svo skarð kemur í saxið, heggur svo af honum höfuðið en þarf til þess tvö eða þrjú högg.\n,,Nú veit eg víst að Grettir er dauður.”", "Þar með lét Grettir lífið, hinn vaskasti maður er uppi hafði verið á Íslandi, var hann 35 ára þegar hann féll og hafði verið í útlegð í rúm nítján ár í heildina.\nÞorbjörn öngull tekur höfuð Grettis með sér í land til að geta innheimt það fé sem hafði verið lagt til höfuðs Grettis.\nÞorbjörn segir við Illuga að slæmt sé að hann hafi verið með Gretti þennan tíma því nú megi dæma hann sekan á þingi fyrir að aðstoða skógarmann.\nIllugi svarar því til að Þorbjörn sé líka í vondum málum þar sem hann hafi treyst á galdra til að ná Gretti, sem bannað var með lögum, og auk þess unnið það níðingsverk að ráðast á Gretti með vopnum þegar hann var dauðvona af völdum sársins á leggnum. \nÞorbjörn segir Illuga að hann vilji þyrma lífi hans en þó með því skilyrði að Illugi heiti því að vinna honum og hans mönnum trúnaðareið og ekki hefna Grettis með því að ráðast að þeim.\nIllugi harðneitar því tilboði og segist sannarlega frekar vilja deyja en vera Þorbirni og mönnum hans hliðhollur.\nÞeir fara þá með Illuga austur á eyjuna og höggva hann þar, fær hann mikið lof fyrir hraustleika og þykir framar jafnöldrum sínum í stærð og styrk og hugrekki.", "Þorbjörn og menn hans dysja svo bræðurna Gretti og Illuga í Drangey.\nÞeir taka allt fémætt með úr eyjunni sem og höfuð Grettis en Þorbjörn tekur Kársnaut, einnig taka þeir Glaum með sér en drepa hann svo þegar þeir komu á land því hann var svo illa farinn eftir barsmíðarnar.\nÞorbjörn öngull fer heim til sín í Viðvík, höfuð Grettis er lagt í salt og geymt yfir veturinn í útihúsi í Viðvík sem kallað er Grettisbúr.\nÖngull var mjög ánægður með ferð sína en hann var óþokkaður af öðrum fyrir hana þar sem hann hafði beitt göldrum til að ná Gretti.\nEftir jól fer Þórir öngull að hitta Þóri í Garði og ætlar að innheimta það fé sem lagt hafði verið til höfuðs Grettis.\nÞórir vill hins vegar ekki borga Þorbirni þar sem hann hafi beitt göldrum við að ná Gretti og ætti því með réttu að hljóta dauðarefsingu.\nÞorbjörn sakar þá Þóri um að hann sé nískur frekar en að það skipti hann máli hvernig Grettir hafi verið veginn.\nÞórir segir að þeir skuli bíða fram til Alþingis og láta lögmann skera úr um hvað sér réttast í þessum efnum, skilja þeir svo í illu."]}, {"num": 83, "paras": ["Frændum þeirra Grettis og Illuga líkaði stórilla er þeir fréttu vígin og tóku svo að Öngull hefði gert níðingsverk að drepa dauðvona mann, og í annarri grein um fjölkynngi. Sóttu þeir að hinum vitrustu mönnum og mæltist illa fyrir mál Önguls.", "Hann reið nú vestur til Miðfjarðar þá fjórar vikur voru af sumri. Og er það fréttist til ferða hans stefndi Ásdís að sér mönnum og voru þar margir hennar vinir, Gamli og Glúmur mágar hennar og synir þeirra, Skeggi er skammhöndungur var kallaður og Óspakur, er fyrr var getið. Ásdís var svo vinsæl að allir Miðfirðingar snerust til liðs með henni og jafnvel þeir sem áður voru óvinir Grettis. Var þar hinn fyrsti maður Þóroddur drápustúfur og flestir Hrútfirðingar.", "Öngull kemur nú til Bjargs með tuttugu menn. Þeir höfðu höfuð Grettis með sér. Þá voru enn eigi komnir allir þeir sem henni höfðu liði heitið. Þeir gengu inn í stofu með höfuðið og settu niður á gólf. Húsfreyja var í stofu og margir menn aðrir. Ekki varð að kveðjum við þá.", "Öngull kvað þá vísu:", "Flutti eg upp úr eyju", "ómett höfuð Grettis.", "Þann grætr nála Nauma", "nauðig hára rauðan.", "Hér mátt gjálfrs á gólfi", "griðbíts höfuð líta,", "það mun, fagrlogs Fríðar,", "fúna allt nema salti.", "Húsfreyja sat kyrr á meðan hann kvað vísuna. Eftir það kvað hún vísu:", "Mundut síðr en sauðir,", "Sýrar gráps, fyr dýri,", "komið er norðr að Njörðum", "nýtt skaup, á sjá hlaupa,", "ef styrviðir stæðu,", "stála Freyr, í eyju,", "verið hef eg lofs um lýði", "létt, ósjúkan Gretti.", "Þá mæltu margir að eigi væri undarlegt þó að hún ætti hrausta sonu svo hraust sem hún var, þvílík skapraun sem henni var ger.", "Óspakur var úti og átti tal við fylgdarmenn Önguls þá sem eigi höfðu inn gengið og spurði að vígunum en allir lofuðu vörn Illuga. Þá sögðu þeir frá hversu Grettir hafði haldið fast saxinu þá er hann var dauður. Það þótti mönnum undarlegt.", "Þá var sén margra manna reið vestan að. Voru þar komnir margir vinir húsfreyju og þeir Gamli og Skeggi vestan frá Melum. Öngull hafði þar ætlað að hefja féránsdóm eftir Illuga því að þeir kölluðu sér allt fé hans. En er fjölmennið kom sá Öngull að hann gat ekki að gert. Voru þeir hinir áköfustu, Óspakur og Gamli, og vildu veita Öngli atgöngu en þeir sem vitrari voru báðu þá hafa við ráð Þorvalds frænda síns og annarra höfðingja og sögðu að því verr mundi mál Önguls fyrir mælast sem fleiri vitrir menn sætu yfir.", "Varð þá svo á meðal gengið að Öngull reið á burt og hafði með sér höfuð Grettis því að hann ætlaði að hafa það til alþingis. Reið hann nú heim og þótti þunglega á horfast því að flestir allir höfðingjar á landinu voru annaðhvort skyldir eða mægðir við þá Gretti og Illuga.", "Þetta sumar fékk Skeggi skammhöndungur dóttur Þórodds drápustúfs. Gekk Þóroddur þá að málum með frændum Grettis."], "recap": ["Frændur Grettis og Illuga eru mjög ósáttir við hvernig þeir bræður voru vegnir og aðdragandann að því, bæði að galdrar hefðu komið við sögu og einnig það níðingsverk að drepa dauðvona mann.\nÞorbjörn öngull ríður vestur til Miðfjarðar og er fréttist af ferðum hans stefnir Ásdís móðir Grettis og Illuga mönnum saman til sín, þar á meðal eru Gamli og Glúmur tengdarsynir hennar og synir þeirra og fleiri.\nÁsdís er svo vinsæl að meira að segja menn sem áður höfðu verið óvinir Grettis, Þóroddur drápustúfur og fleiri Hrútfirðingar, snúast til liðs við hana.\nÞorbjörn öngull kemur til Bjargs og er með höfuð Grettis með sér og ræðir við Ásdísi en þá eru ekki allir hennar fylgdarmenn komnir til hennar, mönnum þykir ekki skrítið að Grettir, Illugi og Atli hafi verið svona flottir þar sem hún þykir með eindæmum öflug.\nFylgdarmenn Þorbjörns önguls lofa framgöngu Illuga í lokabardaga þeirra bræðra og segja einnig frá því hversu fast Grettir hélt um saxið eftir dauðann og þykir það undarlegt.", "Þá sést til hóps manna koma ríðandi að vestan og voru þar komnir vinir Ásdísar til að veita henni liðsinni.\nÞorbjörn öngull hafði ætlað að hefja féránsdóm eftir Illuga, sem var dómur sem haldinn var yfir sekum mönnum til að skipta eignum þeirra, en hann hafði enga ástæður til þess þar sem Illugi var ekki dæmdur sekur.\nÞorbjörn hættir við að hefja féránsdóminn þegar hann sér liðsinni Ásdísar ríða að þeim, menn Ásdísar vilja ráðast að Þorbirni en eru hvattir til að halda ró því málin verði yfirfarin á Alþingi og betra sé að hafa fleiri þar til að mæta Þorbirni.\nÞorbjörn fer í burtu og tekur með sér höfuð Grettis en þykir þungt að vita að flestir höfðingar á landinu tengjast nú Gretti og Illuga og eru á þeirra bandi."]}, {"num": 84, "paras": ["Nú riðu menn til alþingis og urðu færri liðveislumenn Önguls en hann ætlaði því að málið mæltist illa fyrir. Þá spurði Halldór hvort þeir skyldu hafa höfuð Grettis með sér til alþingis. Öngull lést það ætla að hafa.", "\"Það er óráðlegt,\" segir Halldór, \"því að nógu margir munu vera mótstöðumenn þínir þó að þú gerir eigi slíkar áminningar til þess að vekja upp harma manna.\"", "Þá voru þeir komnir á veg og ætluðu að ríða Sand suður. Öngull lét þá taka höfuðið og grafa niður í sandþúfu eina. Er það kölluð Grettisþúfa.", "Á alþingi var fjölmennt og bar Öngull fram mál sín og hrósaði mjög verkum sínum að hann hafði drepið þann skógarmann er gildastur hefði verið á landinu og þóttist eiga fé það sem lagið var til höfuðs honum. En Þórir hafði hin sömu svör sem fyrr voru sögð. Þá var lögmaður beiddur úrskurðar. Hann kvaðst heyra vilja ef nokkurar gagnsakir kæmu þar í móti er þar fyrir mætti Öngull missa sektarfjárins, ellegar mundi hann hafa slíkt sem til höfuðs honum var lagið.", "Þá kvaddi Þorvaldur Ásgeirsson til Skammhöndung að bera fram sökina og stefndi Þorbirni öngli annarri stefnu um galdur og fjölkynngi þá er Grettir mundi og bana af fengið en annarri um það er þeir vógu að honum hálfdauðum manni og lét varða skóggang.", "Nú varð mikill sveitardráttur og urðu þeir fáir er sinnuðu Þorbirni. Varð nú öðruvís en hann hugði því að Þorvaldi og Ísleifi mági hans þótti það ólífsverk að gera manni gerningar til bana. En með tillögum skynsamra manna varð sú lykt á málum þessum að Þorbjörn skyldi sigla samsumars og koma aldrei til Íslands meðan þeir lifðu eftir er mál áttu eftir Illuga og Gretti. Var þá í lög tekið að alla forneskjumenn gerðu þeir útlæga.", "Og er hann sá hver hans kostur mundi verða hafði hann sig af þinginu því að þá var búið að frændur Grettis mundu að honum ganga. Fékk hann og ekki af því fé er til höfuðs Gretti var lagið því að Steinn lögsögumaður vildi ei að það gyldist fyrir níðingsverk. Öngu voru þeir menn bættir er fallið höfðu með Þorbirni í Drangey. Skyldi það vera jafnt og víg Illuga. Líkaði það þó frændum hans allilla.", "Riðu menn nú heim af þinginu og féllu niður allar þær sakir er menn höfðu á höndum Gretti.", "Skeggi, son Gamla en mágur Þórodds drápustúfs en systurson Grettis, fór norður til Skagafjarðar með atgangi Þorvalds Ásgeirssonar og Ísleifs mágs hans, er síðan var biskup í Skálholti, og samþykki alls almúga og fékk sér skip og fór til Drangeyjar að sækja lík þeirra bræðra, Grettis og Illuga, og færðu út til Reykja á Reykjaströnd og grófu þar að kirkju. Og er það til marks að Grettir liggur þar að um daga Sturlunga er kirkja var færð að Reykjum voru grafin upp bein Grettis og þótti þeim geysistór og þó mikil. Bein Illuga voru grafin síðan fyrir norðan kirkju en höfuð Grettis var grafið heima að Bjargi að kirkju.", "Sat Ásdís húsfreyja að Bjargi og var svo vinsæl að aldrei voru henni ónáðir gervar og eigi heldur meðan Grettir var í sekt.", "Skeggi skammhöndungur tók við búi að Bjargi eftir Ásdísi og var mikill maður fyrir sér. Hans son var Gamli faðir Skeggja á Skarfsstöðum og Ásdísar móðir Odds munks. Margir menn eru frá honum komnir."], "recap": ["Nú fara menn á Alþingi og eru færri sem fylgja Þorbirni en hann átti von á því menn eru ósáttir við viðskipti hans og Grettis.\nHalldór mágur hans spyr hvort hann ætli með höfuð Grettis með á þing og svarar Þorbjörn því játandi, Halldóri líst illa á þá hugmynd því það muni bara vekja upp harm mótstöðumanna hans.\nÞeir eru þá komnir af stað en Þorbjörn öngull lætur þá grafa höfuðið niður í sandþúfu og er hún kölluð Grettisþúfa.\nÁ þingi fara mál svo að Þorbjörn öngull fær ekki féð er lagt hafði verið til höfuðs Gretti heldur er hann dæmdur fyrir að hafa beitt göldrum gegn Gretti og fyrir að hafa unnið það níðingsverk að drepa dauðvona mann, skal hann sigla burt það sama sumar og koma aldrei til Íslands á meðan þeir lifðu sem áttu mál eftir Illuga og Gretti.\nEr þá jafnan lögfest á þingi að gera alla galdramenn útlæga.\nSkeggi sonur Gamla, frændi Grettis og mágur Þórodds drápustúfs, fer til Drangeyjar og sækir lík Grettis og Illuga, fer með þau út til Reykja á Reykjaströnd þar sem þau eru grafin að kirkju, höfuð Grettis er hins vegar grafið heima að Bjargi að kirkju."]}, {"num": 85, "paras": ["Þorbjörn öngull réðst í skip að Gásum með allt það sem hann mátti með komast af fé sínu en Hjalti bróðir hans tók við jörðum. Öngull fékk honum og Drangey. Varð Hjalti síðan höfðingi mikill og er hans ekki getið lengur við þessa sögu.", "Öngull fór til Noregs og lét enn mikið um sig. Þóttist hann mikið þrekvirki unnið hafa í drápi Grettis. Virtu og margir svo þeir sem ókunnigt var hversu það hafði til borið en margir vissu hversu frægur maður Grettir hafði verið. Sagði hann það eitt af viðskiptum þeirra sem honum var til frama en lét hitt liggja niðri í sögunni sem minnur var til frægðar.", "Þessi saga kom um haustið austur til Túnbergs. Er Þorsteinn drómundur frétti vígin varð hann mjög hljóður við, því að honum var sagt að Öngull væri mjög gildur og harðfengur. Minntist Þorsteinn ummæla þeirra sem hann hafði þá er þeir Grettir töluðust við endur fyrir löngu um handleggina.", "Þorsteinn hélt nú fréttum til um ferðir Önguls. Voru þeir báðir í Noregi um veturinn og var Þorbjörn norður í landi en Þorsteinn í Túnbergi og hafði hvorgi séð annan. En þó varð Þorbjörn vís að Grettir átti bróður í Noregi og þótti vanséð við í ókunnu landi og því leitaði hann sér ráðs hvert hann skyldi á leita.", "Í þenna tíma fór margt Norðmanna út í Miklagarð og gengu þar á mála. Af því þótti Þorbirni fýsilegt að fara þangað, afla sér svo fjár og frægðar en hafa sig eigi í Norðurlöndum fyrir frændum Grettis. Bjó hann nú ferð sína úr Noregi og fór út í lönd og létti eigi fyrr en hann kom út í Miklagarð og gekk þar á mála."], "recap": ["Þorbjörn öngull fer á skip að Gásum með allt það sem hann kemst með af fé, Hjalti bróðir hans tekur við jörðum hans, þar á meðal Drangey, og verður hann mikill höfðingi.\nÞorbjörn fer til Noregs og gortar sig af því þrekvirki að hafa unnið Gretti.\nÞorsteinn drómundur bróðir Grettis fréttir af Þorbirni öngli þar og hyggur á hefndir fyrir bræður sína, minnist ummæla sinna áður um það að grannir handleggir sínir myndu hefna Grettis.\nMargir Norðmenn fara um þessar mundir til Miklagarðs og gerast þar atvinnuhermenn, Þorbirni líst vel á það, vill fara og afla sér fjár og frægðar og komast burt af Norðurlöndunum þar sem Grettir á skyldmenni.\nFer Þorbjörn nú þangað og gerist atvinnuhermaður hjá Miklagarðskeisara."]}, {"num": 86, "paras": ["Hér hefur upp þátt Spesu og Þorsteins.", "Þorsteinn drómundur var ríkur maður og hafði hina mestu virðing. Hann spurði nú að Þorbjörn öngull var farinn úr landi og út í Miklagarð. Brá hann skjótt við og seldi frændum sínum eignir sínar í hendur en hann réðst til ferðar og leitaði eftir Öngli og fór jafnan þar eftir sem hinn fór undan. Vissi Öngull ekki til hans ferða.", "Þorsteinn drómundur kom út í Miklagarð litlu síðar en Öngull og vildi fyrir hvern mun drepa hann en hvorgi kenndi annan. Nú vildu þeir koma sér í sveit með Væringjum og var því vel tekið þegar þeir vissu að þeir voru Norðmenn. Þá var Mikael katalak konungur yfir Miklagarði.", "Þorsteinn drómundur sat nú um Öngul ef hann mætti að nokkuru kenna hann og gat það ekki leikið fyrir fjölmenni. Lá hann þar jafnan vakandi og undi lítt við sinn hag. Þóttist hann mikils hafa misst.", "Nú var það þessu næst að Væringjar áttu að fara í herför nokkura að friða landið af hernaði. Og áður en þeir fóru heiman var það siður þeirra og lög að eiga vopnaþing og enn gerðu þeir svo. Og þá er vopnaþingið var sett þá skyldu allir Væringjar þar koma og svo þeir sem þá ætluðu að ráðast til ferðar með þeim og sýna vopn sín. Hér komu þeir báðir, Þorsteinn og Öngull. Bar Þorbjörn fyrr fram sín vopn. Hann hafði þá saxið Grettisnaut. En er hann sýndi það þá dáðust margir að og sögðu að það væri allgott vopn og kváðu það mikið lýti á að skarðið var í miðri egginni og spurðu hann hvað til hefði borið.", "Öngull sagði það frásagnarvert \"því að það er þessu næst segjanda að út á Íslandi,\" segir hann, \"að eg drap kappa þann er Grettir hét hinn sterki er þar hefur mestur garpur verið og fullhugi því að hann gat engi unnið fyrr en eg kom til. Og með því að mér varð auðið að vinna hann þá bar eg af honum en þó hafði hann mörg mín öfl. Hjó eg þá í höfuð honum með saxinu og þá brotnaði skarð í egginni.\"", "Þeir sögðu er næstir stóðu að sá hefði verið harður í haus og sýndi hver öðrum. Af þessu þóttist Þorsteinn vita hver Öngull var og beiddist að sjá saxið sem aðrir. Lét Öngull það til reiðu því að flestir lofuðu hreysti hans og framgöngu. Hann hugði að þessi mundi svo gera en hann vissi öngva von að Þorsteinn væri þar eða frændur Grettis.", "Tók Drómundur nú við saxinu og jafnskjótt reiddi hann það upp og hjó til Önguls. Kom það högg í höfuðið og varð svo mikið að í jöxlum nam staðar. Féll Þorbjörn öngull ærulaus dauður til jarðar.", "Við þetta urðu menn mjög ókvæða. Greip gjaldkerinn staðarins þegar Þorstein og spurði fyrir hverja sök hann gerði slíkt óhæfuverk þar á heilögu þingi.", "Þorsteinn sagðist vera bróðir Grettis hins sterka og það með að hann hefði aldrei hefndinni fram komið fyrr en þar. Og þá tóku margir undir að sjá hinn sterki maður mundi mikill fyrir sér hafa verið þar sem Þorsteinn hefði rekist svo langt út í heim að hefna hans. Ráðsmönnum staðarins þótti þetta líklegt. En fyrir því að engi var sá þar er kynni nokkuð um að bera með Þorsteini þá voru það lög þeirra að hver sá er mann dræpi skyldi öngu fyrir týna nema lífinu. Fékk Þorsteinn skjótan dóm og heldur harðan. Hann skyldi setja í myrkvastofu í dyflissu eina og bíða þar bana ef engi leysti hann út með fé.", "En er Þorsteinn kom í dyflissuna var þar maður fyrir. Sá hafði þar lengi verið og kominn að bana af vesöld. Þar var bæði fúlt og kalt.", "Þorsteinn mælti við þenna mann: \"Hversu þykir þér ævi þín?\"", "Hinn svarar: \"Harðla ill því að mér vill engi við hjálpa en eg á öngva frændur til að leysa mig.\"", "Þorsteinn mælti: \"Mart er fyrir óráðinu um slíkt og verum kátir og gerum okkur nokkuð að gleði.\"", "Hinn kvað sér að öngu gaman verða.", "\"Þó skulum við prófa,\" segir Þorsteinn. Tók þá og kvað kvæði. Hann var raddmaður mikill svo að varla fannst hans líki. Sparði hann nú ekki af. Almenningsstræti var skammt fram frá dyflissunni. Kvað Þorsteinn svo hátt að gall í múrnum og hinum er áður var hálfdauður þótti mikið gaman að vera. Lét hann svo ganga fram á kveldið."], "recap": ["Þorsteinn drómundur er ríkur maður og nýtur mikillar virðingar.\nHann ætlar sér að hefna fyrir bræður sína og eltir Þorbjörn öngul til Miklagarðs en hvorugur þeirra þekkir hinn í sjón.\nNorrænir menn sem gegndu herþjónustu í Miklagarði voru kallaðir Væringjar.\nVæringjar eiga að fara í herför til að friða landið og er það siður þeirra að eiga vopnaþing áður en farið er í slíka för en þar sýna menn vopn sín.\nÁ vopnaþingið koma bæði Þorbjörn öngull og Þorsteinn drómundur og sýnir Þorbjörn saxið góða Grettisnaut, áður Kársnaut, sem hann hafði náð af Gretti við víg hans.\nMenn dást að saxinu en hafa orð á að skarðið, sem myndaðist þegar Þorbjörn hjó í höfuð Grettis, sé mikið lýti á vopninu og spyrja hvernig það hafi myndast.\nÞorbjörn segir þá frá því að hann hafi drepið Gretti, eitthvað sem engum öðrum hafi tekist þrátt fyrir margar tilraunir, hann hafi náð saxinu af Gretti og hoggið með því í höfuð hans og þannig hafi skarðið komið til.\nÞorsteinn heyrir í Þorbirni og áttar sig á því hver hann er, gengur fram og biður um að fá að sjá saxið en Þorbjörn veit ekki hver Þorsteinn er og lætur hann hafa saxið.\nÞorsteinn reiðir saxið á loft og heggur í höfuð Þorbjörns önguls og drepur hann.", "Mönnum bregður mjög við þennan atburð, þykir þó að Grettir hljóti að hafa verið mjög öflugur fyrst bróðir hans er kominn alla þessa leið til að hefna hans.\nÞar sem enginn er á þingi með Þorsteini til að vitna um að hann sé bróðir Grettis og hafi því haft ástæðu til að hefna er hann tekinn höndum.\nLögin þar eru þau að hver sá sem drepur annan mann skuli sjálfur týna lífi, Þorsteinn fær snöggan og harðan dóm en hann á að sitja í myrkrastofu í dýflissu og bíða þar bana ef enginn leysir hann út með fé.\nÍ dýflissunni hittir hann annan mann sem er mjög niðurdreginn því hann segist ekki eiga neinn að sem geti hjálpað honum. \nÞorsteinn hvetur manninn til að vera bjartsýnn og gleðjast með sér því framtíðin sé óráðin. \nÞorsteinn er raddsterkur og tekur til við að fara með kvæði og hafði hátt og skemmti bæði sér og félaganum í dýflissunni, svo hátt hafði hann að heyrðist út á almenningsstræti sem var þar rétt hjá."]}, {"num": 87, "paras": ["Spes hét göfug garðshúsfreyja þar í staðnum, harðla rík og stórættuð. Sigurður hét bóndi hennar. Hann var auðigur og ættsmærri en hún. Hafði hún verið gefin honum til fjár. Ekki varð ástríki mikið með þeim hjónum og þóttist hún næsta vargefin. Hún var stórlynd og svarkur mikill.", "Svo bar til að þá er Þorsteinn skemmti um kveldið að Spes gekk um strætið nær dyflissunni að hún heyrði þangað rödd svo fagra að hún kallaðist öngva slíka heyrt hafa. Hún gekk með marga sveina og bað þá víkja þangað og vita hver þessa ágætu rödd hefði. Þeir kölluðu nú og spurðu hver þar væri svo harðlega spenntur. Þorsteinn nefndi sig.", "Þá mælti Spes: \"Ertu þvílíkur atgervimaður um annað sem á kveðandi?\"", "Hann sagði lítið bragð að því.", "\"Hvað hefir þú til saka,\" segir hún, \"er þig skal kvelja hér til bana?\"", "Hann sagði að hann hefði drepið mann og hefnt bróður síns \"en eg gat það eigi með vottum sýnt,\" sagði Þorsteinn, \"og því var eg hér settur,\" segir hann, \"nema nokkur vildi mig út leysa. En mér þykir þess engi von því að eg á hér öngvan skyldan mann.\"", "\"Mikill mannskaði mun það ef þú ert drepinn. Eða var bróðir þinn slíkur frægðarmaður sá er þú hefndir?\"", "Hann sagði að sá var meir en hálfu gildari maður. Hún spurði hvað til merkja væri um það.", "Þá kvað Þorsteinn vísu þessa:", "Eigi máttu átta", "eggþings boðar, hringa", "Grund, úr Grettis hendi", "geðrakks koma saxi", "áðr hvardyggir hjuggu", "herðendr fetils gerðar", "axlarfót af ýti", "unnblakks hugar rökkum.", "\"Mikil ágæti eru slíkt,\" sögðu þeir er skildu vísuna.", "Og sem hún vissi þetta mælti hún svo: \"Viltu þiggja líf að mér ef kostur er?\"", "\"Eg vil gjarna,\" sagði Þorsteinn, \"ef þessi félagi minn er og út leystur með mér sem hér situr. Ella munum við sitja hér báðir.\"", "Hún svarar: \"Meira mannkaup ætla eg í þér sé en honum.\"", "\"Svo sem það er,\" sagði Þorsteinn, \"þá munum við fylgjast burt héðan annaðhvort báðir eða hvorgi okkar.\"", "Hún gekk þá þangað sem Væringjar voru og beiddi útlausnar fyrir Þorstein og bauð fé til. Þeir voru þess fúsir. Fékk hún svo um gengið með vinsældum sínum og ríkdómi að þeir voru báðir út leystir. En þegar Þorsteinn komst úr dyflissunni fór hann til móts við Spes. Húsfreyja tók hann til sín og hélt hann á laun en stundum var hann með Væringjum í herferðum og reyndist hinn mesti fullhugi í öllum framgöngum."], "recap": ["Þorsteinn drómundur situr í dýflissu í Miklagarði, dæmdur til dauða fyrir vígið á Þorbirni öngli, og skemmtir sér og félaga sínum með kveðskap sem heyrist út á stræti."]}, {"num": 88, "paras": ["Í þenna tíma var Haraldur Sigurðarson í Miklagarði og kom Þorsteinn sér í vináttu við hann. Þótti Þorsteinn nú mikilhæfur því að Spes lét hann ekki fé skorta. Lögðust þau nú á hugi, Þorsteinn og Spes. Fannst henni mikið um atgervi hans. Varð henni féskylft mjög því að hún hélt sér mjög til vinsælda. Bóndi hennar þóttist og finna að hún tók sér háttaskipti, bæði í skaplyndi og margri breytni og einkanlega í fjárauðn. Saknaði hann bæði gulls og gripa er hurfu úr hennar geymslu.", "Og eitthvert sinn talaði Sigurður bóndi hennar við hana og segir að hún tæki undarlega breytni upp \"þú gefur eigi gaum að góssi okkru og sukkar því ýmsa vega. En svo er sem eg sjái þig í svefni og viltu aldrei vera þar stödd sem eg er. Nú veit eg fyrir víst að eitthvert ber til.\"", "Hún svarar: \"Eg sagði þér og svo frændur mínir þá er við komum saman að eg vildi vera sjálfráð og frjáls allra þeirra hluta sem mér stæði vel að veita og af því spara eg ekki fé þitt. Eða viltu nokkuð aðra hluti við mig tala þá sem mér megi blygð í verða?\"", "Hann svarar: \"Eigi er mér það grunlaust að þú haldir einnhvern þann mann er þér þykir betri en eg.\"", "\"Eigi veit eg,\" segir hún, \"að mikið sé fyrir því en þó vil eg það ætla að þú megir það með öngum sannindum segja. En ekki munum við tvö ein við talast ef þú berð þessa óvissu að mér.\"", "Hann lét nú falla niður þetta tal að sinni.", "Þau Þorsteinn héldu fram hinu sama og voru ekki viðsjál við orði vondra manna því að hún treysti visku og vinsældum. Oft sátu þau á tali og skemmtu sér.", "Það var eitt kveld er þau sátu í einu lofti þar sem í voru gripir hennar. Hún bað Þorstein kveða nokkuð því að hún hugði bónda sitja við drykk sem hann átti vanda til. Hún strengdi aftur dyrnar. Og er hann hafði kveðið um stund var brotist á hurðina og kallað að upp skyldi láta. Var þar kominn bóndinn með marga sveina. Húsfreyja hafði lokið upp einni stórri kistu og sýndi Þorsteini gripi sína. En er hún kenndi hver var vildi hún ekki lúka upp dyrnar.", "Hún talar við Þorstein: \"Skjót er ráðagerð mín. Hlaup hér niður í kistuna og lát hljótt um þig.\"", "Hann gerði svo. Hún rak lás fyrir kistuna og settist þar upp á. Í því kom bóndi inn í loftið og höfðu þeir þá brotið upp loftið.", "Húsfreyja mælti: \"Því farið þér með svo miklu harki eða fara ófriðarmenn eftir yður?\"", "Bóndi svarar: \"Nú er vel að þú gefur sjálf raun hver þú ert. Eða hvar er sá maður er mest renndi raustum áðan? Get eg að þér þyki hann fagurhljóðari en eg.\"", "Hún mælti: \"Enginn er allheimskur ef þegja má. Fer þér og svo. Þú þykist vera slægur og ætlar að þú munir festa á mér lygi þína en hér mun raun á nú. Ef þú hefir satt að mæla þá tak þú hann því að eigi mun hann hlaupa út um veggina eða ræfrið.\"", "Hann leitaði um húsið og fann ekki.", "Hún mælti: \"Hví tekur þú hann ekki nú ef þú þykist þó eftir vísu ganga?\"", "Hann þagnaði þá og þóttist ekki vita við hver brögð hann var kominn og frétti fylgdarmenn sína hvort þeim heyrðist eigi sem honum. En er þeir sáu að húsfreyju mislíkaði varð ekki af vitnisburði þeirra og sögðu að jafnan heyrði eigi eftir því sem var. Gekk bóndi þá út og þóttist vita með sannindum þó að hann fyndi eigi manninn. Lét hann þá af að forvitnast um húsfreyju og hagi hennar langa stund.", "Annan tíma var það enn miklu síðar að þau Þorsteinn og Spes sátu í fatabúri einu. Þar voru inni klæði bæði skorin og óskorin er þau bóndinn áttu. Sýndi hún Þorsteini marga dúka og röktu í sundur. Og er þau uggði minnst kom þar að þeim bóndinn með marga menn og brutu upp loftið. En meðan þeir gerðu það rak hún klæðin ofan á Þorsteinn og studdist við klæðahlaðann er þeir komu inn í húsið.", "\"Hvort muntu enn þræta,\" segir bóndi, \"að hér væri maður hjá þér? Munu þeir menn vera hér nú er sáu ykkur bæði.\"", "Hún bað þá vera eigi svo óða \"mun yður nú eigi bresta en látið mig vera kyrra og skýfið mér hvergi.\"", "Þeir leituðu nú um húsið og fundu ekki, gefa upp um síðir.", "Þá mælti húsfreyja: \"Gott er það jafnan að gefa betri raun en margir ætla og var það von að eigi munduð þér það finna sem ekki var til. Eða viltu nú bóndi ganga við heimsku þinni og bera mig undan þessu illmæli?\"", "Hann mælti: \"Síður ber eg þig undan að eg þykist víst vita að þú ert sönn að þessu sem eg hefi á þig borið. Skaltu og verða þig við að hafa um það mál ef þú getur það af þér fært.\"", "Hún kvað sér það ekki í móti skapi. Skildu þau að því tal sitt.", "Eftir þetta var Þorstein með Væringjum jafnan. Og það segja menn að hann hafi leitað ráða undir Harald Sigurðarson og ætla menn að þau hefðu eigi svo úr ráðið ef þau hefðu eigi hans við notið og hans visku.", "Og þá er fram liðu stundir gerði Sigurður bóndi orð á því að hann mundi fara heiman að einhverjum erindum sínum. Ekki latti húsfreyja hann þess. Og er bóndi var á burtu kom Þorsteinn til Spes og voru þau þá jafnan bæði saman. Svo var háttað í garði hennar að hann var húsaður fram yfir sjóinn og voru það nokkur hús er sjórinn gekk upp undir. Þar sátu þau Spes og Þorsteinn jafnan. Þar var lítil hlemmur í gólfinu svo að enginn vissi nema þau tvö. Skyldi hann opinn standa ef skjótt þyrfti til að taka.", "Nú er frá bónda að segja að hann fór hvergi á burt nema hann leyndist og vildi speja um húsfreyju. Bar það og svo til að þá er þau varði síst á einu kveldi og þau sátu í sjóvarloftinu og skemmtu sér að þar kom bóndinn að þeim óvörum með fjölda fólks og leiddi nú nokkura menn til gluggs er á var á húsinu og bað þá sjá hvort eftir því væri sem hann sagði. Allir sögðu að hann hefði rétt talað og svo mundi fyrr hafa verið, hlupu nú á loftið.", "Og er þau heyrðu brakið mælti hún til Þorsteins: \"Hér verður þú niður að fara hvað sem kostar. Ger mér vísbending ef þú kemst fram undan húsunum.\"", "Hann kvað já við og steypti sér niður í gólfið en húsfreyja spyrnti fæti sínum á hlemminn, féll síðan aftur í lag og sá þá hvergi nývirki á gólfinu.", "Kom bóndi í loftið og hans menn. Þeir fóru nú leitandi og fundu ekki sem von var. Loftið var autt svo að þar var engi hlutur inni nema slétt gólfið og pallar. Sat húsfreyja þar og lék að fingurgullum sínum. Hún gaf sér fátt að þeim og lét sem hún ætti ekki um að vera. Nú þótti bónda allkynlegt og spurði fylgdarmenn sína hvort þeir hefðu eigi séð manninn. Þeir kváðust fyrir víst hafa séð hann.", "Þá mælti húsfreyja: \"Hér mun koma að því sem mælt er að þrisvar hefir allt orðið forðum. Hefir þér og svo farið Sigurður,\" sagði hún. \"Þú hefir gert mér þrisvar ónáðir að því sem mér þykir. Eða eruð þér nú nokkuru hyggnari en fyrir öndverðu?\"", "\"Eg var nú ekki einn til frásagnar,\" segir bóndi. \"Skaltu fyrir allt það eiga undanfærslu því að eg vil með engu móti þessa svívirðing hafa óbætta.\"", "\"Eg ætla,\" sagði húsfreyja, \"að þú beiðir þess er eg vil bjóða því að mér þykir allgott að færast undan þessum áburð. Er hann svo á loft kominn að mér verður mikill vanmetnaður í ef eg hrind honum eigi af mér.\"", "\"Einn veg skaltu þess synja,\" segir bóndi, \"að þú hafir eigi gefið góss vort né gripi.\"", "Hún svarar: \"Þann tíma sem eg færist undan skal eg einn veg hrinda af mér öllum þeim greinum sem þú hefir til mín að tala. En hygg að hvar niður skal koma. Vil eg þegar nú á morgun fara fram fyrir biskup og nefni hann mér fulla undanfærslu fyrir svo fallin orð fyrir þenna áburð.\"", "Bóndi lét sér þetta vel nægja og gekk í burt með sína menn.", "Nú er frá Þorsteini að segja að hann lagðist fram undan húsunum og gekk upp þar sem honum líkaði og tók sér eina skíðu með logandi eldi og hélt upp svo að sjá mátti úr garði húsfreyju. Hún var löngum úti um kveldið og um nóttina því að hún vildi vita ef Þorsteinn kæmi á land. Og er hún sá eldinn þóttist hún vita að hann var á land kominn því að þau höfðu þetta ráð gert með sér.", "Eftir um morguninn bauð Spes bónda sínum að þau skyldu við talast fyrir biskupi um sín mál og hann var þess albúinn. Koma þau nú fram fyrir biskup og hefir bóndi hinar sömu sakir við hana sem fyrr var getið. Biskup spurði hvort hún hefði við þetta kennd verið fyrri en enginn sagðist það heyrt hafa. Þá spurði hann með hverjum líkindum hann bæri þetta að henni. Hann leiddi þá fram menn er séð höfðu að hún sat í læstu húsi og þar einn maður hjá henni. Og á því sagði bóndinn sér grun að sá maður mundi glepja hana. Biskup sagði að hún mátti vel færast undan þessum áburð ef hún vildi.", "Hún kvað sér nú allvel líka \"trúi eg,\" sagði Spes, \"að mér verði gott til eiðakvenna um þetta mál.\"", "Var henni nú nefndur eiður og ákveðinn dagur til að fram skyldi koma. Fór hún eftir það heim og lét vel yfir sér. Fundust þau Þorsteinn og Spes og gerðu ráð sín."], "recap": ["Rík og göfug kona að nafni Spes heyrir sönginn úr dýflissunni og heillast af raddstyrk og kveðskap Þorsteins. Hún kemur því til leiðar að honum sé leyst úr haldi gegn greiðslu."]}, {"num": 89, "paras": ["Nú leið sá dagur og þar til sá dagur kom sem Spes skyldi vinna eiðinn. Þá býður hún til öllum sínum vinum og frændum og setti sig til með hinum bestum klæðum er hún átti. Margar dýrar konur gengu með henni. Þá voru á votviðri mikil. Vegurinn var votur og ein veisa mikil yfir að fara áður en til kirkju kæmi. Og svo sem Spes og skari hennar kemur fram að veisunni var þar fyrir fjölmenni mikið og fjöldi fátækra manna er sér báðu ölmusu því að þetta var almenningsstræti. Allir þóttust þeir skyldir vera að fagna henni sem kunnu og báðu henni góðs fyrir það er hún hafði þeim oft vel við hjálpað. Þar var einn stafkarl milli annarra fátækra manna, mikill vexti og hafði sítt skegg.", "Kvendið nam staðar við fenið því að hoffólkinu þótti fenið óhreint yfirferðar.", "Og svo sem þessi hinn mikli stafkarl sá húsfrúna, að hún var betur búin en aðrar konur, mælti hann svo til hennar: \"Góða húsfreyja,\" sagði hann, \"haf til lítillæti að eg beri þig yfir fen þetta því að vér erum skyldir til, stafkarlar, að þjóna þér það sem vér kunnum.\"", "\"Hvað muntu vel bera mig,\" sagði hún, \"er þú getur eigi borið sjálfan þig?\"", "\"Þó væri þér lítillætisraun,\" segir hann, \"og má eg eigi bjóða betur en eg hefi til og mun þér til alls betur takast að þú hafir eigi metnað við fátækan mann.\"", "\"Vit það fyrir víst,\" segir hún, \"berir þú mig eigi vel þá verður það þitt húðlát eða annarrar svívirðingar meiri.\"", "\"Feginn vil eg hætta á það,\" sagði hann og færðist á fætur út á díkið.", "Hún lét sem hún hugði allillt til að hann bæri hana en þó fór hún á bak honum. Stumraði hann allseint og gekk við tvær hækjur.", "Og er hann kemur á mitt fenið reiðir hann á ýmsar hliðar. Hún bað hann herða sig \"og skaltu aldrei verri för farið hafa en þá ef þú fellir mig hér í niður.\"", "Leitar nú veslugur áfram og færist nú í aukana, kostar nú alls kapps við og kemst allnær landinu. Og þá drepur hann fæti og rýkur áfram svo að hann kastar henni upp á bakkann en féll sjálfur í díkið upp undir hendur. Og í því er hann liggur þanninn grípur hann til hennar, húsfrúinnar, og festi hvergi á klæðunum. Tekur hann þá saurugri hendi upp á kné henni og allt á lærið bert.", "Hún spratt upp og bannaði, sagði að jafnan hlyti illt af vondum förumönnum \"og væri það maklegt að þú lægir dauður ef mér þætti eigi skömm í því sakir vesaldar þinnar.\"", "Hann mælti þá: \"Missæl er þjóðin. Eg þóttist gera vel við þig og hugði eg til ölmusu af þér en eg hefi af þér heitingar og hrakning en ekki til gagns\" og lét sem honum kæmi í allt skap.", "Þótti mörgum hann aumlegur en hún kvað hann vera hinn mesta bragðakarl. En er margir báðu fyrir hann tekur hún til pungs síns og voru þar í margir gullpeningar.", "Hún hristir niður peningana og mælti: \"Haf það nú karl. Aldrei mun það gott að þú hafir eigi fullt fyrir það er eg hefi hrakið þig enda er nú við skilist eftir því sem þú vannst til.\"", "Hann tíndi upp gullið og þakkaði henni fyrir vel gert. Gekk Spes til kirkju og var þar fjölmenni mikið fyrir. Gekk Sigurður að með kappi og bað hana færa sig undan áburði þeim sem hann hefði á hana borið.", "Hún svarar: \"Ekki sinni eg þínum áburði. Eða hvern mann kallast þú hafa séð í húsi hjá mér? Því að jafnan verður til einnhver dugandi maður að vera hjá mér og kalla eg það blygðarlaust. En fyrir það vil eg sverja að öngum manni hefi eg gull gefið og af öngum manni hefi eg saurgast líkamlega utan af bónda mínum og þeim vondum stafkarli er tók sinni saurugri hendi á lær mér er eg var borin yfir díkið í dag.\"", "Nú tóku margir undir að þetta væri fullur eiður og henni væri það ekki mannlýti þó að karl hefði fíflað á henni voveiflega. Hún sagði að það mætti telja sem væri.", "Eftir þetta sór hún svo fallinn eið sem nú var greint. Mæltu það margir að hún mundi það sanna sem mælt er að lítið skyldi í eiði ósært. Hún kveðst það ætla að vitrum mönnum skyldi svo lítast sem þetta væri eigi um grun gert.", "Þá töluðu til frændur hennar að slíkt væri mikil skapraun burðugum konum að hafa bótalausa þvílíka álygi því að það var þar dauðasök ef kona varð opinber að því að hún hóraðist undir bónda sinn. Spes beiddi þá biskup að hann gerði skilnað þeirra Sigurðar því að hún sagðist eigi vilja þola álygi hans. Fluttu þetta frændur hennar. Varð þá svo með atgangi þeirra og býtingum að þau voru skilin og Sigurður fékk lítið af góssinu. Var hann ger úr landi burt. Fór þar sem víða eru dæmi til að hinir lægri verða að lúta. Gat hann og öngu fram komið þó að hann hefði rétt að mæla.", "Spes tók nú við öllum peningum þeirra og þótti hinn mesti kvenskörungur.", "Þá er menn hugðu að eiðstaf hennar þótti mönnum sem grunur hefði í verið og ætluðu að vitrir menn mundu hafa diktað fyrir henni þessi atkvæði. Gátu menn þá upp grafið að sá stafkarl sem hana hafði borið var Þorsteinn drómundur en þó fékk Sigurður öngva rétting þessa máls."], "recap": ["Spes er gift auðugum en ástlausum manni. Hún og Þorsteinn draga sig saman í leyni og verður úr ástarsamband sem þau fara laumulega með."]}, {"num": 90, "paras": ["Þorsteinn drómundur var með Væringjum meðan mestur orðrómur lék á málum þessum. Verður hann svo frægur að þar þótti varla þvílíkur atgervismaður komið hafa sem hann. Fékk hann af Haraldi Sigurðarsyni hinn mesta heiður því að hann virti frændsemi við hann og hans ráðum hefir Þorstein fram farið að því er menn ætla.", "Bráðlega eftir það er Sigurður var úr landi rekinn hóf Þorsteinn bónorð við Spes. Tók hún því sæmilega en veik þó til frænda sinna. Voru þá stefnur að áttar. Kom það ásamt með þeim að hún mundi mestu fyrir ráða. Var þá keypt með þeim með samþykki frænda hennar og urðu þeirra samfarir góðar og höfðu auð fjár. Þótti Þorsteinn mikill gæfumaður hversu hann hafði úr ráðið sínum vandræðum. Voru þau ásamt tvo vetur þar í Miklagarði.", "Eftir það sagði Þorsteinn húsfreyju sinni að hann vildi vitja eigna sinna aftur til Noregs. Hún sagði hann skyldi ráða. Seldi hann þá eignir þær er hann átti og höfðu þau af óf lausafjár. Réðust þau þá utan úr löndum með góðu föruneyti og fóru alla leið uns þau komu í Noreg. Tóku frændur Þorsteins harðla vel við þeim báðum og sá það brátt að hún var ör og stórlynd. Gerðist hún brátt harðla vinsæl. Áttu þau börn saman og sátu nú að eignum sínum og undu vel sínu ráði.", "Þá var Magnús konungur hinn góði yfir Noregi. Fór Þorsteinn skjótt á fund hans og var þar vel tekinn því að hann var mjög frægur orðinn af því er hann hafði hefnt Grettis hins sterka. Vita menn varla dæmi til að nokkurs manns af Íslandi hafi hefnt verið í Miklagarði annars en Grettis Ásmundarsonar.", "Svo er sagt að Þorsteinn yrði hirðmaður Magnúss konungs. Sat Þorsteinn um kyrrt níu vetur síðan hann kom í Noreg og þóttu þau hin mestu sæmdarmenn bæði. Þá kom utan úr Miklagarði Haraldur konungur Sigurðarson og gaf Magnús konungur honum hálfan Noreg við sig. Voru þá báðir konungar í Noregi um hríð.", "Eftir andlát Magnúss konungs undu margir lítt þeir sem höfðu verið vinir hans því að allir unnu honum. En mönnum varð vangætt til lyndis Haralds konungs því að hann var harður og refsingasamur.", "Þorsteinn drómundur gerðist þá hnignandi og var þó hinn hraustasti maður. Þá var liðið frá drápi Grettis Ásmundarsonar sextán vetur."], "recap": ["Eiginmaður Spesar verður tortrygginn. Fram fer hið fræga eiðatökuatriði þar sem Spes sver eið um sakleysi sitt með orðum sem eru bókstaflega sönn en blekkjandi í reynd — frægt dæmi um kænsku hennar."]}, {"num": 91, "paras": ["Margir eggjuðu Þorstein að fara á fund Haralds konungs og gerast honum handgenginn en hann tók ekki undir það.", "Þá mælti Spes: \"Það vil eg Þorsteinn,\" sagði hún, \"að þú farir ekki á fund Haralds konungs því að við eigum öðrum konungi meira vangoldið og þarf fyrir því að hugsa. En við gerumst nú gömul bæði og af æskuskeiði en okkur hefir meir gengið eftir ástundan en kristilegum kenningum eða röksemdum réttinda. Nú veit eg að þessa okkar skuld mega hvorki leysa okkrir frændur né fémunir utan við sjálf gjöldum skyn fyrir. Nú vil eg breyta ráðhag okkrum og fara úr landi og á páfagarð því að eg trúi að þar má mitt mál leysast.\"", "Þorsteinn svarar: \"Mér eru þessir hlutir jafn kunnigir sem þér er nú talar þú. Er það skylt að þú ráðir þessu er svo gegnir vel er þú lést mig ráða er miklu var óvænlegar á stefnt og svo breyta öllu sem þú segir fyrir.\"", "Þetta kom mjög á menn óvara. Nú var Þorsteinn tveimur vetrum miður en hálfsjötugur og þó hraustur til allra athafna sinna. Bauð hann nú til sín öllum frændum sínum og tengdamönnum og gerði bera fyrir þeim ráðastofnan sína. Tóku vitrir menn vel undir það og þótti þó hinn mesti skaði að burtför þeirra.", "Þorsteinn sagði ekki víst um afturkomu sína \"vil eg nú þakka yður öllum,\" segir Þorsteinn, \"hversu þér genguð um mitt góss meðan eg var úr landi næst. Nú vil eg bjóða yður og biðja að þér takið við fé barna minna og þeim sjálfum og fæðið þau upp eftir því sem yðar er manndómur því að eg er svo til aldurs kominn að jöfn von er á hvort eg kem aftur þó að eg lifi. Skuluð þér svo fyrir öllu sjá því sem eg á hér allt eftir sem eg mun ekki aftur vitja til Noregs.\"", "Þá svöruðu menn að margt væri gott til ráða \"ef húsfreyja er eftir til umsjár.\"", "Þá mælti hún: \"Því fór eg utan úr löndum og úr Miklagarði með Þorsteini, og fyrirlét eg bæði frændur og fé, að eg vildi að eitt gengi yfir okkur bæði. Nú hefir mér hér gott þótt. En ekki slægir mig hér til langvista í Noregi eða hér í Norðurlöndum ef hann fer á burt. Hefir og jafnan þokki með okkur verið og ekki að áskilnaði orðið. Nú munum við bæði ásamt fara því að okkur er kunnigast um þá hluti marga er orðið hafa síðan við fundumst.\"", "Og er þau höfðu þenna veg á gert um hagi sína þá bað Þorsteinn valinkunna menn skipta í sundur fénu í helminga. Tóku frændur Þorsteins þann helming er börnin skyldu eiga og fæddust þau upp með föðurfrændum sínum og urðu síðan hinir mestu þroskamenn og er mikil ætt frá þeim komin þar í Víkinni. En Þorsteinn og þau Spes skiptu í sundur sínum hlut fjárins og gáfu sumt til kirkna fyrir sál sinni en sumt höfðu þau með sér. Réðust þau nú til Rómferðar og báðu margir vel fyrir þeim."], "recap": ["Spes fær skilnað frá eiginmanni sínum og giftist Þorsteini drómundi. Þau verða vellauðug og njóta mikillar virðingar í Miklagarði."]}, {"num": 92, "paras": ["Fóru þau nú allan veg þar til er þau komu til Rómaborgar. Svo sem þau komu fram fyrir þann er til þess var skipaður að heyra skriftamál manna þá sögðu þau sannlega allt hversu farið hafði og með hverjum klókskap þau höfðu sinn hjúskap bundið. Þau gáfu sig auðmjúklega undir þvílíkar skriftir sér til yfirbóta sem hann vildi á þau leggja. En fyrir þann skuld að þau höfðu sjálf orkast hugar á að bæta sína meinbugi án allri þröngvan og hatri af kirkjunnar formönnum þá var þeim létt um allar álögur svo sem fremst mátti vera en beðin með blíðu að þau skipuðu nú sem skynsamlegast fyrir sinni sál og lifðu hreinlega þaðan í frá að fenginni lausn allra sinna mála. Þóttu þau vel og viturlega farið hafa.", "Þá mælti Spes: \"Nú þykir mér vel farið hafa og lyktast okkart mál. Höfum við nú eigi ógæfu saman átt eina. Kann vera að heimskir menn dragi sér til eftirdæma okkra hina fyrri ævi. Skulum við nú gera þá endalykt okkars lífs að góðum mönnum sé þar eftir líkjanda. Nú skulum við kaupa að þeim mönnum sem hagir eru á steinsmíði að þeir geri sinn stein hvoru okkru og mættum við svo bæta það sem við höfum brotið við guð.\"", "Nú lét Þorsteinn lagða verða peninga til steinsmíðar báðum þeim og þvílíks annars sem þau þurftu og þau máttu eigi missa til viðurlífis. Og að lyktaðri þessari smíð og á viðurkvæmilegum tíma og öllum hlutum tilbúnum skildu þau sína stundlega samvist að sjálfráði sínu að þau mættu því heldur njótandi verða heilagrar samvistu annars heims. Settist þá í sinn stein hvort þeirra og lifðu svo langan tíma sem guð vildi skipa og entu svo sína ævi.", "Hafa það flestir menn sagt að Þorsteinn drómundur og hans kona Spes þykja verið hafa hinir mestu gæfumenn úr því sem ráða var. En ekki hafa börn hans né afkvæmi til Íslands komið svo að saga sé frá ger."], "recap": ["Þegar aldur færist yfir ákveða þau Spes og Þorsteinn að bæta fyrir syndir sínar: þau selja eigur sínar, gefa fé til fátækra og fara í pílagrímsferð til Rómar."]}, {"num": 93, "paras": ["Hefir Sturla lögmaður svo sagt að enginn sekur maður þykir honum jafnmikill fyrir sér hafa verið sem Grettir hinn sterki. Finnur hann til þess þrjár greinir. Þá fyrst að honum þykir hann vitrastur verið hafa því að hann hefir verðið lengst í sekt einnhver manna og varð aldrei unninn meðan hann var heill. Þá aðra að hann var sterkastur á landinu sinna jafnaldra og meir laginn til að koma af afturgöngum og reimleikum en aðrir menn. Sú hin þriðja að hans var hefnt út í Miklagarði sem einskis annars íslensks manns og það með hver giftumaður Þorsteinn drómundur varð á sínum efstum dögum, sá hinn sami er hans hefndi.", "Lýkur hér sögu Grettis Ásmundarsonar, vors samlanda. Hafi þeir þökk er hlýddu en sá litla sem krabbað hefir söguna.", "Er hér verksins endir", "en vér séum allir guði sendir.", "Amen."], "recap": ["Í Róm ganga þau til skrifta og ákveða að ljúka ævinni sem einsetufólk, hvort í sinni steinklefa, til að friðþægja fyrir líf sitt — og þar lýkur sögunni."]}]</script>
<script>
const chapters = JSON.parse(document.getElementById('chapterData').textContent);
const total = chapters.length;
const byNum = {};
chapters.forEach(c => byNum[c.num] = c);

const groupsEl = document.getElementById('groups');
const groupSize = 10;
for (let start = 1; start <= total; start += groupSize){
  const end = Math.min(start + groupSize - 1, total);
  const details = document.createElement('details');
  details.className = 'group';
  if (start === 1) details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = `Kaflar ${start}–${end}`;
  details.appendChild(summary);
  const ul = document.createElement('ul');
  ul.className = 'chapter-list';
  for (let n = start; n <= end; n++){
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = `#kafli-${n}`;
    a.dataset.num = n;
    a.textContent = `${n}. kafli`;
    li.appendChild(a);
    ul.appendChild(li);
  }
  details.appendChild(ul);
  groupsEl.appendChild(details);
}

const readingEl = document.getElementById('reading');

function renderChapter(num){
  num = Math.max(1, Math.min(total, num));
  const c = byNum[num];
  if (!c) return;

  document.querySelectorAll('.chapter-list a').forEach(a => {
    a.classList.toggle('active', Number(a.dataset.num) === num);
  });
  // open the group containing this chapter
  document.querySelectorAll('details.group').forEach(d => d.open = false);
  const activeLink = document.querySelector(`.chapter-list a[data-num="${num}"]`);
  if (activeLink) {
    activeLink.closest('details.group').open = true;
    activeLink.scrollIntoView({block:'nearest'});
  }

  const paras = c.paras.map(p => `<p>${escapeHtml(p)}</p>`).join('');
  let recapHtml = '';
  if (c.recap && c.recap.length){
    const recapParas = c.recap.map(r => `<p>${escapeHtml(r)}</p>`).join('');
    recapHtml = `
      <button class="recap-toggle" id="recapToggle">Búin/n að lesa? Sjá einfaldað ágrip &darr;</button>
      <div class="recap-box" id="recapBox">
        <h3>Ágrip af ${num}. kafla</h3>
        ${recapParas}
      </div>`;
  }

  const prevLink = num > 1 ? `<a href="#kafli-${num-1}">&larr; ${num-1}. kafli</a>` : `<span class="disabled">&larr; ${num-1}. kafli</span>`;
  const nextLink = num < total ? `<a class="next" href="#kafli-${num+1}">${num+1}. kafli &rarr;</a>` : `<span class="disabled next">Sögu lokið</span>`;

  readingEl.innerHTML = `
    <p class="progress">Kafli ${num} af ${total}</p>
    <h2 class="chapter-num"><span>${num}.</span> kafli</h2>
    <div class="chapter-rule"></div>
    <div class="chapter-body">${paras}</div>
    ${recapHtml}
    <div class="chapter-nav">${prevLink}${nextLink}</div>
    <div class="further">
      Ítarefni: <a href="https://quizlet.com/is/839777813/grettis-saga-prof-flash-cards/" target="_blank" rel="noopener">æfingaspurningar um Grettis sögu á Quizlet</a> · <a href="flashcards.html">flashcards á þessari síðu</a>
    </div>
  `;

  const rt = document.getElementById('recapToggle');
  if (rt){
    rt.addEventListener('click', () => {
      const box = document.getElementById('recapBox');
      box.classList.toggle('open');
      rt.innerHTML = box.classList.contains('open') ? 'Fela kaflaágrip &uarr;' : 'Sýna kaflaágrip &darr;';
    });
  }

  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  document.getElementById('sidebar').classList.remove('open');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function currentFromHash(){
  const m = location.hash.match(/kafli-(\d+)/);
  return m ? parseInt(m[1], 10) : 1;
}

window.addEventListener('hashchange', () => renderChapter(currentFromHash()));

document.getElementById('jumpBtn').addEventListener('click', () => {
  const v = parseInt(document.getElementById('jumpInput').value, 10);
  if (v) location.hash = `kafli-${v}`;
});
document.getElementById('jumpInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('jumpBtn').click();
});

document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

// ---------- Accessibility settings ----------
const a11yToggle = document.getElementById('a11yToggle');
const a11yPanel = document.getElementById('a11yPanel');
a11yToggle.addEventListener('click', () => a11yPanel.classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (!a11yPanel.contains(e.target) && e.target !== a11yToggle) a11yPanel.classList.remove('open');
});

const A11Y_KEY = 'grettis-a11y-settings';
function loadA11y(){
  try {
    const raw = localStorage.getItem(A11Y_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { size: 'normal', font: 'normal', theme: 'dark' };
}
function saveA11y(s){
  try { localStorage.setItem(A11Y_KEY, JSON.stringify(s)); } catch(e){}
}
function applyA11y(s){
  document.body.classList.remove('font-large','font-xlarge','font-dyslexic','theme-light');
  if (s.size === 'large') document.body.classList.add('font-large');
  if (s.size === 'xlarge') document.body.classList.add('font-xlarge');
  if (s.font === 'dyslexic') document.body.classList.add('font-dyslexic');
  if (s.theme === 'light') document.body.classList.add('theme-light');
  document.querySelectorAll('.a11y-opt').forEach(btn => {
    const key = btn.dataset.size ? 'size' : (btn.dataset.font ? 'font' : 'theme');
    const val = btn.dataset.size || btn.dataset.font || btn.dataset.theme;
    btn.classList.toggle('active', s[key] === val);
  });
}
let a11ySettings = loadA11y();
applyA11y(a11ySettings);
document.querySelectorAll('.a11y-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.size) a11ySettings.size = btn.dataset.size;
    if (btn.dataset.font) a11ySettings.font = btn.dataset.font;
    if (btn.dataset.theme) a11ySettings.theme = btn.dataset.theme;
    saveA11y(a11ySettings);
    applyA11y(a11ySettings);
  });
});

renderChapter(currentFromHash());
</script>
</body>
</html>
