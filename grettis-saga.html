sá öngvan mann úti. Hann baukar til fiskanna og þykir nú gott hönd á að hafa, rótar ofan í meisinn öllum fiskunum. Þá er fullur meisinn. Fiskurinn var svo stór að Grímur ætlaði að hestur mundi eigi bera meira. Hinn tekur nú og ræðst undir byrðina. Og í því er hann vildi upp standa hljóp Grímur út og hjó tveim höndum á hálsinn svo að öxin sökk að hamri. Hinn brá við hart og hefir á rás með meisinn suður á fjall. Grímur sneri eftir honum og vildi vita hvort honum hefði tekið. Þeir fóru allt suður undir Balljökul. Þar gekk þessi maður inn í helli. Eldur var bjartur í hellinum. Þar sat kona við, stór vexti og þó skörugleg. Það heyrir Grímur að hún heilsaði föður sínum og nefndi Hallmund. Hann kastaði niður hart byrðinni og andvarpaði hátt. Hún spurði því hann væri blóðugur.", "Hann svarar og kvað þetta:", "Það er mér sýnt", "að sínu má", "engi maðr", "afli treysta", "því að svo bregst", "á banadægri", "hölda hugr", "sem heill bilar.", "Hún spurði þá innilega að atburðum þeirra en hann sagði allt sem farið hafði.", "\"Skaltu nú heyra til,\" segir hann, \"en eg mun segja frá athöfnum mínum og mun eg kveða þar um kvæði en þú skalt rísta eftir á kefli.\"", "Hún gerði svo.", "Þá kvað hann Hallmundarkviðu og er þetta þar í:", "Þótti eg gildr", "er eg Gretti strauk", "nógu fast", "niðr af taumum.", "Sá eg hitt", "að horfa gerði", "sýna stund", "sér í gaupnir.", "Það var næst", "er Þórir kom", "Arnarvatns", "upp á heiði", "og við tveir", "við tigu átta", "odda leik", "eiga knáttum.", "Sýndust gild", "Grettis handa", "skýlihögg", "á skjöldum þeirra.", "Þó frá eg mín", "miklu stærri", "eggja spor", "ýtum sýnast.", "Eg lét hendr", "og höfuð fjúka", "brögnum af", "er að baki gengu", "svo að kappar", "Kelduhverfis", "átján þar", "eftir lágu.", "Hefi eg þursa", "og þeirra kyn", "hart leikið", "og hamarsbúa", "en meinvætti", "marga barði", "og blendingum", "að bana orðið.", "Svo álfa kind", "og óvættum", "nær hefi eg öllum", "óþarfr verið.", "Margra athafna sinna gat Hallmundur í kviðunni því að hann hafði farið um allt landið.", "Þá mælti dóttir hans: \"Ekki hefir sjá maður sleppifengur verið og var það eigi ólíklegt því að þú settir illa á stofn við hann. Eða hver mun nú hefna þín?\"", "Hallmundur svarar: \"Eigi er víst að þess verði auðið. Vita þykist eg að Grettir mundi hefna ef hann mætti sér við koma en ekki mun hægt að ganga í móti gæfu þessa manns því að honum mun mikið lagið verða.\"", "Eftir það dró svo mikið mætti Hallmundar sem fram leið kvæðinu. Var það nú og jafnskjótt að kviðunni var lokið og Hallmundur dó. Hún bar sig þá lítt og grét allsárt.", "Þá gekk Grímur fram og bað hana hreysta sig \"og verður hver þá að fara er hann er feigur. Varð þetta mjög af tilstofningu hans. Mátti eg varla sjá að hann rændi mig.\"", "Hún kvað hann mikið hafa að mæla um það \"og gefst illa ójafnaður.\"", "Gladdist hún þá heldur í viðræðunni. Þar dvaldist Grímur margar nætur í hellinum og nam kviðuna og fór þá laglega með þeim.", "Grímur var á Arnarvatnsheiði um veturinn eftir dauða Hallmundar. Eftir það kom Þorkell Eyjólfsson til móts við hann á heiðina og börðust þeir. Lauk svo þeirra viðskipti að Grímur átti vald á lífi Þorkels og vildi eigi drepa hann en Þorkell tók hann til sín og kom honum utan og gaf honum mikið góss og þótti þar hvortveggi vel gera við annan. Grímur varð síðan farmaður og er mikil saga frá honum sögð."], "recap": ["Eftir að Grettir hafði yfirgefið skála sinn á Arnarvatnsheiði nokkrum árum áður hafði komið þangað annar skógarmaður að nafni Grímur og sest þar að.\nHallmundur vinur Grettis er ósáttur við veru Gríms og vill hann burt.\nGrímur veiðir mikið og einn dag dregur hann 100 fiska á land og leggur fyrir utan skála sinn en daginn eftir eru þeir horfnir. \nNæsta dag veiðir hann 200 fiska og fer eins með þá, en þriðja daginn veiðir hann 300 og ákveður að vaka um nóttina til að sjá hvernig fer með fiskana.\nSér hann hvar stór maður kemur og ætlar að taka fiskinn, Grímur ræðst á manninn og nær að særa hann illa en maðurinn tekur fiskinn og ríkur af stað, Grímur eltir hann allt þar til hann kemur í helli í Balljökli (Langjökli) og þar er dóttir mannsins.\nHeyrir Grímur nú að hann segist vera Hallmundur og fer með vísur þar sem fram kemur ýmislegt sem hann hefur gert um ævina en dóttirin ristir vísurnar á kefli að ósk föður síns.\nHallmundarkviða bls.154-155.\nEftir að hann hefur lokið við kveðskapinn segir hann að Grettir myndi hefna sín ef hann gæti, dregur svo mjög af honum og hann andast loks.\nGrímur berst svo við Þorkel Eyjólfsson úr Laxdæla sögu, á möguleika á að drepa hann en hlífir honum, Þorkell tekur hann þá til sín og hjálpar honum svo hann verður farandmaður mikill og á góða ævi."]}, {"num": 63, "paras": ["Nú er þar til að taka að Grettir er kominn austan úr fjörðum og fór nú huldu höfði og duldist því að hann vildi ekki finna Þóri og lá úti um sumarið á Möðrudalsheiði og í ýmsum stöðum. Hann var og stundum á Reykjaheiði.", "Það frétti Þórir að Grettir var á Reykjaheiði og safnaði mönnum og reið á heiðina og ætlaði nú að hann skyldi eigi undan reka. Grettir varð eigi nálega var við er þeir komu að honum. Hann var þá við sel er þar stóð skammt frá veginum. Þá var hann við annan mann. Og er þeir sáu flokkana, og varð skjótt til ráða að taka, þá bað Grettir að þeir skyldu fella hestana og draga inn í selið og svo gerðu þeir. Þórir reið um fram norður eftir heiðinni og misstu vinar í stað og fundu ekki og hurfu nú aftur.", "Og er flokkurinn var vestur um riðinn þá mælti Grettir: \"Eigi mun þeim ferðin þykja góð ef vér finnumst eigi. Nú skaltu geyma hesta okkar en eg skal fara móts við þá. Væri þeim það hjáleikur ef þeir kenndu mig eigi.\"", "Förunautur hans latti þessa en þó fór hann og tók sér annan búning og hafði síðan hött niður fyrir andlitið og hafði staf í hendi, gekk síðan á veginn fyrir þá. Þeir heilsuðu honum og spurðu hvort hann hefði nokkra menn séð ríða um heiðina.", "\"Séð mun eg hafa þá sem þér leitið að. Skorti yður nú alllítið að finna þá því að þeir voru hér fyrir sunnan mýrarnar þær sem eru til vinstri handar.\"", "En er þeir heyrðu þetta þeystu þeir út á mýrarnar. Þar voru svo mikil fen að þeir komust hvergi fram og urðu að draga úr hestana og hröktust þar í lengi dags. Báðu þeir illa fyrir honum, þessum förumanni er þá hafði svo dárað.", "Grettir sneri skjótt aftur til móts við félaga sinn og er þeir fundust kvað Grettir vísu:", "Ríðkat rækimeiðum", "randar hóts á móti.", "Sköpuð er þessum þegni", "þraut, fer eg einn á brautu.", "Vilkat Viðris bálkar", "vinnendr snara finna.", "Hnekki eg frá þar er flokkar", "fara Þóris mjög stórir.", "Þeir riðu nú sem hvatast vestur af og fram um bæinn í Garði áður en Þórir kom af fjallinu með flokk sinn. Og er þeir komu nærri bænum kom maður í för þeirra. Sá kenndi þá ekki. Þeir sjá að kona stóð úti, ung og skrautbúin. Grettir spurði hver kona sú mundi vera. Sá hinn nýkomni maður sagði að það væri dóttir Þóris.", "Þá kvað Grettir vísu:", "Svinn mun segja kunna", "Sól gullinna stóla,", "opt þótt eigi skipti", "orð mín, föður þínum", "hvar eg ríð um bæ breiðan,", "barðjós, og nær garði,", "láðskreytis er lítið", "lið, með dreng hinn þriðja.", "Af þessu þóttist sjá vita hinn nýkomni maður hverjir vera mundu og reið til byggðar og sagði að Grettir væri um riðinn.", "En er Þórir kom heim þótti mörgum Grettir hafa vafið héðin að höfði þeim. Setti Þórir þá gíslingar fyrir Gretti hvar sem hann kæmi. Tók Grettir það til ráðs að hann sendi fylgdarmann sinn vestur á sveitir með hestana en hann fór upp til fjalla og var í dularkufli og fór svo norður þar öndverðan vetur svo að hann kenndist ekki.", "Öllum þótti Þórir nú hafa fengið af slíkt eða verra en fyrr í þeirra viðskiptum."], "recap": ["Grettir fer huldu höfði og dvelst ýmist á Möðrudalsheiði eða Reykjaheiði en vill forðast að hitta Þóri Skeggjason í Garði (húsbruninn í Noregi, synir hans, sótti sekt Grettis mjög á þingi og fékk hann dæmdan) - sjá kort á bls.344-345 um ferðir Grettis.\nÞórir fréttir af ferðum Grettis um svæðið og ætlar að ná honum, Grettir er ásamt fylgdarmanni sínum og fela þeir sig í seli, Grettir dulbýst með stóran hatt á höfði, fer og hittir Þóri og hans menn og segist hafa séð Gretti fara út á mýrasvæði þar nærri, Þórir fer þangað með menn sína og hesta og festast þeir í mýrunum og lenda í vandræðum.\nÁ meðan ríða þeir Grettir og fylgdarmaður hans áfram og framhjá Garði, þar kemur að þeim maður sem þekkir þá ekki, þeir sjá svo dóttur Þóris fyrir utan bæinn og kveður Grettir þá vísu sem verður til þess að maðurinn sem hafði komið að þeim áttar sig á að þar er Grettir.\nMaðurinn ríður til byggðar og segir frá að Grettir hafi riðið framhjá, Þórir áttar sig á að Grettir hafi blekkt þá og verður æfur, setur njósnara um alla sveitina til að finna Gretti.\nGrettir sendir þá fylgdarmann sinn vestur um sveitir með hesta þeirra en sjálfur fer hann upp til fjalla í dulargervi svo hann þekkist ekki og er þar um veturinn.\nÞórir kemur illa út eftir þennan blekkingarleik Grettis og þykir Grettir hafa leikið hann grátt.\nGrettir er nú 31 árs, búinn að vera 11 ár í útlegð."]}, {"num": 64, "paras": ["Steinn hét prestur er bjó að Eyjardalsá í Bárðardal. Hann var búþegn góður og ríkur að fé. Kjartan hét son hans, röskur maður og vel á legg kominn.", "Þorsteinn hvíti hét maður er bjó að Sandhaugum, suður frá Eyjardalsá. Steinvör hét kona hans, ung og glaðlát. Þau áttu börn og voru þau ung í þenna tíma. Þar þótti mönnum reimt mjög sakir tröllagangs.", "Það bar til tveim vetrum fyrr en Grettir kom norður í sveitir að Steinvör húsfreyja að Sandhaugum fór til jólatíða til Eyjardalsár eftir vana en bóndi var heima. Lögðust menn niður til svefns um kveldið. Og um nóttina heyrðu menn brak mikið í skálann og til sængur bónda. Engi þorði upp að standa að forvitnast um því að þar var fámennt mjög. Húsfreyja kom heim um morguninn og var bóndi horfinn og vissi enginn hvað af honum varð orðið. Liðu svo hin næstu misseri.", "En annan vetur eftir vildi húsfreyja fara til tíða. Bað hún húskarl sinn heima vera. Hann var tregur til en bað hana ráða. Fór þar allt á sömu leið sem fyrr að húskarl var horfinn. Þetta þótti mönnum undarlegt. Sáu menn þá blóðdrefjar nokkurar í útidyrum. Þóttust menn það vita að óvættir mundu hafa tekið þá báða. Þetta fréttist víða um sveitir.", "Grettir hafði spurn af þessu og með því að honum var mjög lagið að koma af reimleikum eða afturgöngum þá gerði hann ferð sína til Bárðardals og kom aðfangadag jóla til Sandhauga. Hann duldist og nefndist Gestur. Húsfreyja sá að hann var furðu mikill vexti en heimafólk var furðu hrætt við hann. Hann beiddist þar gistingar.", "Húsfreyja kvað honum mat til reiðu \"en ábyrgst þig sjálfur.\"", "Hann kvað svo vera skyldu \"mun eg vera heima,\" segir hann, \"en þú far til tíða ef þú vilt.\"", "Hún svarar: \"Mér þykir þú hraustur ef þú þorir heima að vera.\"", "\"Ei læt eg mér að einu getið,\" sagði hann.", "\"Illt þykir mér heima að vera,\" segir hún, \"en ekki kemst eg yfir ána.\"", "\"Eg skal fylgja þér yfir,\" segir Gestur.", "Síðan bjóst hún til tíða og dóttir hennar með henni, lítil vexti. Hláka mikil var úti og áin í leysingum. Voru á henni jakaför.", "Þá mælti húsfreyja: \"Ófært er yfir ána bæði mönnum og hestum.\"", "\"Vöð munu á vera,\" kvað Gestur, \"og verið ekki hræddar.\"", "\"Ber þú fyrst meyna,\" kvað húsfreyja, \"hún er léttari.\"", "\"Ekki nenni eg að gera tvær ferðir að þessu,\" segir Gestur, \"og mun eg bera ykkur á handlegg mér.\"", "Hún signdi sig og mælti: \"Þetta er ófæra eða hvað gerir þú þá af meynni?\"", "\"Sjá mun eg ráð til þess,\" segir hann og greip þær upp báðar og setti hina yngri í kné móður sinnar og bar þær svo á vinstra armlegg sér en hafði lausa hina hægri hönd og óð svo út á vaðið. Eigi þorðu þær að æpa, svo voru þær hræddar. En áin skall þegar upp á brjósti honum. Þá rak að honum jaka mikinn en hann skaut við hendi þeirri er laus var og hratt frá sér. Gerði þá svo djúpt að strauminn braut á öxlinni. Óð hann sterklega þar til er hann kom að bakkanum öðrumegin og fleygir þeim á land.", "Síðan sneri hann aftur og var þá hálfrökkvað er hann kom heim til Sandhauga og kallaði til matar. Og er hann var mettur bað hann heimafólk fara innar í stofu. Hann tók þá borð og lausa viðu og rak um þvera stofuna og gerði bálk mikinn svo að engi heimamaður komst fram yfir. Enginn þorði í móti honum að mæla og í öngum skyldi kretta. Gengið var í hliðvegginn stofunnar inn við gaflhlaðið og þar þverpallur hjá. Þar lagðist Gestur niður og fór ekki af klæðunum. Ljós brann í stofunni gegnt dyrum. Liggur Gestur svo fram á nóttina.", "Húsfreyja kom til Eyjardalsár til tíða og undruðu menn um ferðir hennar yfir ána. Hún sagðist eigi vita hvort hana hefði yfir flutt maður eða tröll.", "Prestur kvað mann víst vera mundu \"þó að fárra maki sé og látum hljótt yfir,\" sagði hann. \"Má vera að hann sé ætlaður til að vinna bót á vandræðum þínum.\"", "Var húsfreyja þar um nóttina."], "recap": ["Steinn prestur að Eyjardalsá í Bárðardal, Kjartan sonur hans.\nÞorsteinn hvíti á Sandhaugum suður frá Eyjardalsá, Steinvör kona hans. \nSteinvör fer til jólamessu til Eyjadalsár en Þorsteinn er heima á Sandhaugum og gistir þar, brak og brestir heyrast á Sandhaugum um nóttina og er Þorsteinn horfinn morguninn eftir og finnst ekki aftur.\nÁri síðar fer Steinvör aftur til jólamessu til Eyjadalsár, aftur heyrast brak og brestir á Sandhaugum og morguninn eftir er húskarl hennar horfinn og blóðslettur finnast.\nTalið er að óvættir myndu hafa tekið þá báða.\nGrettir fréttir af þessum atburðum síðustu tvenn jól og þar sem honum hefur gengið vel að ráða niðurlögum óvætta ákveður hann að fara í þetta verkefni.", "Grettir fer því til Sandhauga í Bárðardal og kemur þangað á aðfangadag, dulbúinn og segist heita Gestur.\nHann fær gistingu á bænum en fólki þykir hann stór og mikill og heimilisfólk smeykt við hann.\nHúsfreyja vill fara til jólamessu en veður er vont og áin milli bæjanna ófær, Grettir tekur þá húsfreyju og dóttur hennar á öxl sér og veður með þær yfir ána.\nFólk á Eyjardalsá furðar sig á að mæðgurnar hafi komist yfir ána og Steinvör segist ekki viss hvort maður eða tröll hafi flutt þær yfir.\nSteinn prestur vonast til að þarna sé kominn maðurinn sem muni ráða niðurlögum óvættanna.\nÁ Sandhaugum undirbýr Grettir sig fyrir átök."]}, {"num": 65, "paras": ["Nú er frá Gretti það að segja að þá er dró að miðri nótt heyrði hann út dynur miklar. Því næst kom inn í stofuna tröllkona mikil. Hún hafði í hendi trog en annarri skálm heldur mikla. Hún litast um er hún kom inn og sá hvar Gestur lá og hljóp að honum en hann upp í móti og réðust á grimmlega og sóttust lengi í stofunni. Hún var sterkari en hann fór undan kænlega en allt það sem fyrir þeim varð brutu þau, jafnvel þverþilið undan stofunni. Hún dró hann fram yfir dyrnar og svo í anddyrið. Þar tók hann fast í móti. Hún vildi draga hann út úr bænum en það varð eigi fyrr en þau leystu frá allan útidyraumbúninginn og báru hann út á herðum sér. Þæfði hún þá ofan til árinnar og allt fram að gljúfrum. Þá var Gestur ákaflega móður en þó varð annaðhvort að gera að herða sig ella mundi hún steypa honum í gljúfrin. Alla nóttina sóttust þau. Eigi þóttist hann hafa fengist við þvílíkan ófagnað fyrir afls sakir. Hún hafði haldið honum svo fast að sér að hann mátti hvorigri hendi taka til nokkurs utan hann hélt um hana miðja, kvinnuna. Og er þau komu á árgljúfrið bregður hann flagðkonunni til sveiflu. Í því varð honum laus hin hægri hendi. Hann þreif þá skjótt til saxins er hann var gyrður með og bregður því, höggur þá á öxl tröllinu svo að af tók höndina hægri og svo varð hann laus en hún steyptist í gljúfrin og svo í fossinn.", "Gesturinn var þá bæði stirður og móður og lá þar lengi á hamrinum. Gekk hann þá heim er lýsa tók og lagðist í rekkju. Hann var allur þrútinn og blár.", "Og er húsfreyja kom frá tíðum þótti henni heldur raskað um híbýli sín. Gekk hún þá til Gests og spurði hvað til hefði borið er allt var brotið og bælt. Hann sagði allt sem farið hafði. Henni þótti mikils um vert og spurði hver hann var. Hann sagði þá til hið sanna og bað sækja prest og kvaðst vildu finna hann. Var og svo gert.", "En er Steinn prestur kom til Sandhauga varð hann brátt þess vís að þar var kominn Grettir Ásmundarson er Gestur nefndist. Prestur spurði hvað hann ætlaði af þeim mönnum mundi vera orðið er þar höfðu horfið. Grettir kvaðst ætla að í gljúfrin mundu þeir hafa horfið. Prestur kvaðst ei kunna að leggja trúnað á sagnir hans ef engi merki mætti til sjá. Grettir segir að síðar vissu þeir það gerr. Fór prestur heim. Grettir lá í rekkju margar nætur. Húsfreyja gerði við hann harðla vel. Og leið svo af jólin.", "Þetta er sögn Grettis að tröllkonan steyptist í gljúfrin niður er hún fékk sárið, en Bárðardalsmenn segja að hana dagaði uppi þá er þau glímdu, sprungið þá að hann hjó af henni höndina og standi þar enn í konulíking á bjarginu. Þeir dalbúarnir leyndu þar Gretti um veturinn.", "Eftir jól var það einn dag að Grettir fór til Eyjardalsár og er þeir Grettir fundust og prestur mælti Grettir: \"Sé eg það prestur,\" segir hann, \"að þú leggur lítinn trúnað á sagnir mínar. Nú vil eg að þú farir með mér til árinnar og sjáir hver líkindi þér þykir á vera.\"", "Prestur gerði svo. En er þeir komu til fossins sáu þeir skúta upp undir bergið. Það var meitilberg svo mikið að hvergi mátti upp komast og nær tíu faðma ofan að vatninu. Þeir höfðu festi með sér.", "Þá mælti prestur: \"Langt um ófært sýnist mér þér niður að fara.\"", "Grettir svarar: \"Fært er víst en þeim mun best, þeir sem ágætismenn eru. Mun eg forvitnast hvað í fossinum er en þú skalt geyma festar.\"", "Prestur bað hann ráða og keyrði niður hæl á berginu og bar að grjót."], "recap": ["Grettir bíður þess sem koma skal á Sandhaugum og undir miðja nótt heyrast brak og brestir og inn kemur tröllkona mikil og sterk.\nGrettir og tröllkonan takast á, brjóta allt og bramla í húsinu áður en átökin færast út, þau eigast við alla nóttina og þykist Grettir aldrei hafa komist í hann jafn krappan.\nLeikurinn berst að árgljúfrinu og er tröllkonan nálægt því að draga Gretti með sér í gljúfrið en þá losnar hægri hendi hans, hann nær í saxið sem hann er girtur með og nær að höggva höndina af tröllkonunni svo hún steypist í gljúfrin og svo í fossinn. \nGrettir fer aftur heim á bæinn og er allur marinn og blár og mjög þreyttur, húsfreyja kemur heim og furðar sig á skemmdunum á húsinu, Grettir segir henni þá allt af létta og er hún honum ákaflega þakklát. \nHún spyr hann þá hver hann sé og hann segir henni að hann heiti ekki Gestur heldur sé hann Grettir Ásmundarson, hann biður hana svo að sækja prest sem hún gerir.\nGrettir segir presti að hann telji að tröllkonan hafi tekið mennina tvo sem hurfu með sér í fossinn en presturinn á bágt með að trúa honum. \nGrettir hvílist yfir jólin hjá Steinvöru en fer svo að finna prestinn og fara þeir saman að gljúfrinu til að sjá hvort þeir finni merki um mennina tvo og tröllkonuna."]}, {"num": 66, "paras": ["Nú er frá Gretti að segja að hann lætur stein í festaraugað og lét svo síga ofan að vatninu.", "\"Hvern veg ætlar þú nú,\" segir prestur, \"að fara?\"", "\"Ekki vil eg vera bundinn,\" segir Grettir, \"þá er eg kem í fossinn. Svo boðar mér hugur um.\"", "Eftir það bjó hann sig til ferðar og var fáklæddur og gyrti sig með saxinu en hafði ekki fleiri vopn. Síðan hljóp hann af bjarginu og niður í fossinn. Sá prestur í iljar honum og vissi síðan aldrei hvað af honum varð. Grettir kafaði undir fossinn og var það torvelt því að iða var mikil og varð hann allt til grunns að kafa áður en hann kæmist upp undir fossinn. Þar var forberg mikið og komst hann inn þar upp á. Þar var hellir mikill undir fossinum og féll áin fram af berginu.", "Hann gekk þá inn í hellinn og var þar eldur mikill á bröndum. Grettir sá að þar lá jötunn ógurlega mikill. Hann var hræðilegur að sjá. En er Grettir kom að honum hljóp jötunninn upp og greip flein einn og hjó til þess er kominn var því að bæði mátti höggva og leggja með því. Tréskaft var í. Það kölluðu menn þá heftisax er þann veg var gert. Grettir hjó á móti með saxinu og kom á skaftið svo að í sundur tók. Jötunninn vildi þá seilast á bak sér aftur til sverðs er þar hékk í hellinum. Í því hjó Grettir framan á brjóstið svo að nálega tók af alla bringspalina og kviðinn svo að iðrin steyptust úr honum ofan í ána og keyrði þau ofan eftir ánni.", "Og er prestur sat við festina sá hann að slyðrur nokkurar rak ofan eftir strengnum, blóðugar allar. Hann varð þá laus á velli og þóttist nú vita að Grettir mundi dauður vera. Hljóp hann þá frá festarhaldinu og fór heim. Var þá komið að kveldi og sagði víslega að Grettir væri dauður og sagði að mikill skaði væri eftir þvílíkan mann.", "Nú er frá Gretti að segja. Hann lét skammt höggva í milli þar til er jötunninn dó. Gekk Grettir þá innar eftir hellinum. Hann kveikti ljós og kannaði hellinn. Ekki er frá því sagt hversu mikið fé hann fékk í hellinum en það ætla menn að verið hafi mikið. Dvaldist honum þar fram á nóttina. Hann fann þar tveggja manna bein og bar þau í belg einn. Leitaði hann þá úr hellinum og lagðist til festarinnar og hristi hana og ætlaði að prestur mundi þar vera. En er hann vissi að prestur var heim farinn varð hann þá að handstyrkja sig upp festina og komst hann svo upp á bjargið.", "Fór hann þá heim til Eyjardalsár og kom í forkirkju belgnum þeim sem beinin voru í og með rúnakefli því er vísur þessar voru forkunnlega vel á ristnar:", "Gekk eg í gljúfr hið dökkva,", "gein veltiflug steina", "við hjörgæði hríðar", "hlunns úrsvölum munni.", "Fast lá framan að brjósti", "flugstraumr í sal Naumu.", "Heldr kom á herðar skáldi", "hörð fjón Braga kvonar.", "Og enn þessi:", "Ljótr kom mér í móti", "mellu vinr úr helli.", "Hann fékkst heldr að sönnu", "harðfengr við mig lengi.", "Harðeggjað lét eg höggvið", "heptisax af skepti.", "Gangs klauf brjóst og bringu", "bjartr gunnlogi svarta.", "Þar sagði svo að Grettir hafi bein þessi úr hellinum haft. En er prestur kom til kirkju um morguninn fann hann keflið og það sem fylgdi og las rúnirnar. En Grettir hafði farið heim til Sandhauga."], "recap": ["Þegar Grettir og presturinn koma að árbakkanum lætur Grettir sig síga niður í fossinn og kafar undir hann, fáklæddur en með saxið sitt.\nUndir fossinum finnur Grettir mikinn helli, fer þar inn og sér að eldur logar og þar liggur mikill jötunn, Grettir tekst á við jötuninn og drepur hann svo iðrin á honum leka ofan í ána.\nPrestur sér blóðslykju fljóta í ánni og gerir ráð fyrir að Grettir sé dáinn, fer heim með þær fréttir og segir að mikill skaði sé eftir þvílíkan mann.\nGrettir er í hellinum fram á nótt og finnur þar töluvert fé sem og bein tveggja manna sem hann setur í belg.\nGrettir snýr heim að bænum og setur belginn með beinunum í anddyri kirkjunnar ásamt rúnakefli sem hann hefur rist á vísur um það sem gerðist í hellinum, fer hann svo til Sandhauga.\nPresturinn finnur svo beinin og vísurnar þegar hann kemur til kirkju morguninn eftir."]}, {"num": 67, "paras": ["En þá er prestur fann Gretti spurði hann innilega eftir atburðum en hann sagði alla sögu um ferð sína og kvað prest ótrúlega hafa haldið festinni. Prestur lét það á sannast. Þóttust menn það vita að þessar óvættir mundu valdið hafa mannahvörfum þar í dalnum. Varð og aldrei mein af afturgöngum eða reimleikum þar í dalnum síðan. Þótti Grettir þar gert hafa mikla landhreinsan. Prestur jarðaði bein þessi í kirkjugarði.", "Grettir var síðan á Sandhaugum um veturinn. og duldist þó fyrir alþýðu manna. En er Þórir í Garði hafði af pata nokkurn að Grettir væri í Bárðardal, þá setti hann menn til höfuðs honum. Réðu menn honum þá að hann skyldi á burt leita og fór hann þá vestur.", "En er hann kom á Möðruvöllu til Guðmundar hins ríka, beiddi hann þá Guðmund ásjá en hann kvað sér ekki hent við honum að taka \"en sá einn er þér,\" sagði Guðmundur, \"að koma þér þar nokkur sem þú mættir vera óhræddur um líf þitt.\"", "Grettir kvaðst eigi vita hvar það væri.", "Guðmundur mælti: \"Ey sú liggur á Skagafirði er heitir Drangey. Hún er svo gott vígi að hvergi má komast upp á hana nema stigar séu við látnir. Gætir þú þangað komist þá veit eg eigi þess manns von er þig sæki þangað með vopnum eða vélum ef þú gætir vel stigans.\"", "\"Reynt skal þetta vera,\" segir Grettir, \"en svo gerist eg myrkfælinn að það má eg ekki til lífs vinna mér að vera einn saman.\"", "Guðmundur mælti: \"Vera má að svo sé en trú þú öngum svo vel að þú trúir eigi best sjálfum þér. En vandsénir eru margir.\"", "Grettir þakkaði honum heilræði. Fór hann þá burt af Möðruvöllum.", "Hann létti ei fyrr en hann kom til Bjargs. Móðir hans fagnaði honum vel og þau Illugi bæði. Dvaldist hann þar nokkurar nætur. Þar frétti hann víg Þorsteins Kuggasonar. Hafði það orðið um haustið áður en Grettir fór til Bárðardals. Þótti honum nú taka mjög um að höggast.", "Reið Grettir þá suður Holtavörðuheiði og ætlaði að hefna Hallmundar ef hann hitti Grím. En er hann kom í Norðurárdal frétti hann að Grímur var fyrir tveimur vetrum eða þremur á burt þaðan sem fyrr var sagt. En því hafði Grettir svo seint spurt þessi tíðindi að hann fór huldu höfði þá tvo vetur og þann hinn þriðja sem hann var í Þórisdal og hafði öngva menn fundið þá er honum vildu nokkurar fréttir segja.", "Sneri hann þá til Breiðafjarðardala og sætti þeim mönnum er fóru yfir Brattabrekku. Lét hann þá enn sópa greipur um eignir smábænda. Það var um hásumarsskeið.", "Þetta sumar er á leið fæddi Steinvör að Sandhaugum sveinbarn og hét Skeggi. Hann var fyrst kenndur Kjartani syni Steins prests að Eyjardalsá. Skeggi var ólíkur öðrum systkinum sínum fyrir sakir afls og vaxtar. En þá er hann var fimmtán vetra var hann sterkastur norður þar og var þá eignaður Gretti. Hugðu menn að hann mundi afbragðsmaður verða en hann andaðist sextán vetra og er engi saga af honum."], "recap": ["Daginn eftir fer prestur og finnur Gretti, fær alla sólarsöguna um atburðina undir fossinum og trúir því nú að þessir óvættir hafi valdið mannshvörfum í dalnum.\nEftir þetta varð aldrei vart við neina óvætti þar í dalnum og þóttust menn vita að Grettir hefði fargað þeim og unnið þar með mikla landhreinsun.\nGrettir dvelst á Sandhaugum um veturinn á laun en svo fer að Þórir í Garði fær veður af honum þar og sendir menn til að ná honum. \nEr Gretti ráðlagt að flýja og heldur hann þá vestur.\nGrettir kemur á Möðruvelli til Guðmundar ríka og biður um að fá að vera hjá honum en fær ekki inni þar.\nGuðmundur ráðleggur Gretti hins vegar að fara í Drangey í Skagafirði, hún sé gott vígi, þar séu klettaveggir upp og ekki hægt að komast í hana nema stigi sé látinn niður falla, þar sé einstigi upp og því ekki hægt að sækja að honum ef hann gæti þess vel (kort bls.344-345 um ferðir Grettis).", "Gretti líst vel á þessa hugmynd en hefur áhyggjur af myrkfælninni og hann geti ekki verið einn í eyjunni, Guðmundur segir honum að treysta engum betur en sjálfum sér.\nGrettir fer þá heim að Bjargi í Miðfirði og hittir Ásdísi móður sína og Illuga bróður sinn.\nFréttir hann að Þorsteinn Kuggason frændi hans hafi verið veginn og þykir honum farið að fækka í hópi sinna stuðningsmanna.\nGrettir fer suður um Holtavörðuheiði og ætlar að hefna Hallmundar en fréttir þá að Grímur skógarmaður sé á bak og burt og því tekst honum ekki að ljúka þeirri hefnd.\nÞetta sumar fæðir Steinvör að Sandhaugum dreng, sá verður mikið stærri og sterkari en systkini sín og telja menn að hann sé sonur Grettis, hann andast sextán ára og eru engar frekari sögur af honum."]}, {"num": 68, "paras": ["Eftir víg Þorsteins Kuggasonar lagði Snorri goði fæð mikla á þá Þórodd son sinn og Sám son Barkar hins digra, en það er ei greint hvað þeir höfðu helst til saka utan það að þeir hafi eigi viljað gera eitthvert stórvirki það er Snorri lagði fyrir þá. Og því rak Snorri goði Þórodd burt frá sér og bað hann eigi fyrr aftur koma en hann hefði drepið einnhvern skógarmann og svo varð að vera. Fór Þóroddur þá yfir til Dala.", "Þá bjó á Breiðabólstað í Sökkólfsdal ekkja sú er Geirlaug hét. Hún hélt smalamann þann sem sekur var orðinn um áverkamál. Hann var frumvaxta piltungur. Það frétti Þóroddur Snorrason og reið á Breiðabólstað. Hann spurði hvar smalamaður væri.", "Húsfreyja kvað hann vera hjá fé \"eða hvað viltu honum?\"", "\"Eg skal hafa líf hans,\" segir Þóroddur, \"því að hann er sekur skógarmaður.\"", "Hún svarar: \"Það er þér engi frami að drepa hann, veslinginn, slíkur ofurgarpur sem þú þykist vera. Mun eg vísa þér til meira þrekvirkis ef þér er mikill hugur á að reyna þig.\"", "\"Hvert er það?\" segir hann.", "Hún svarar: \"Hér upp í fjallinu liggur Grettir Ásmundarson. Fást þú við hann. Það er meir við þitt hæfi.\"", "Þóroddur tók vel máli þessu \"og skal svo vera.\"", "Keyrði hann þá hestinn sporum og reið upp eftir dalnum. Og er hann kom á hæðirnar fyrir neðan Austurá sá hann hvar var ljósbleikur hestur með söðli. Hann sá þar og mikinn mann með vopnum og sneri þegar til móts við hann. Grettir heilsaði honum og spurði hver hann væri.", "Þóroddur nefndi sig og mælti: \"Hví spyrð þú mig eigi heldur að erindum mínum en nafni?\"", "\"Því,\" sagði Grettir, \"að þau ein munu vera að lítið mun til koma eða ertu son Snorra goða?\"", "\"Svo er og víst,\" segir Þóroddur, \"en þó skal nú reyna hvor okkar meira má.\"", "\"Auðvitað er það,\" sagði Grettir. \"Eða hefir þú eigi frétt það að eg hefi orðið lítil heillaþúfa um að þreifa flestum mönnum?\"", "\"Veit eg það,\" segir Þóroddur, \"en þó skal nú nokkuð til voga\" og brá sverði og sótti að Gretti með ákefð en hann hlífði sér með skildi en ekki bar hann vopn á Þórodd og fór svo um stund. Ekki varð hann sár.", "Grettir mælti þá: \"Látum við af þessum leik því að öngan sigur muntu fá í okkrum viðskiptum.\"", "Þóroddur hjó þá sem tíðast.", "Grettir leiddist við hann að fást. Þreif hann til Þórodds og setti hann niður hjá sér og mælti: \"Alls á eg kosti við þig gera það sem eg vil og ekki hræðist eg að þú verðir mér að bana en hræðist eg hærukollinn Snorra goða föður þinn og ráð hans. Þau hafa flestum á kné komið. Og skyldir þú ætla þér það er þú gætir orkað. En ekki er það barnafæri að berjast við mig.\"", "En er Þóroddur sá að hann kom öngu fram sefaðist hann heldur og skildu þeir við það. Reið Þóroddur heim í Tungu og sagði föður sínum sameign þeirra Grettis.", "Snorri goði brosti að og mælti: \"Margur er dulinn að sér og varð ykkar mikill mannamunur. Þú hjóst upp á hann en hann mátti gera við þig hvað er hann vildi. En þó gerði Grettir viturlega er hann drap þig eigi því að eg mundi eigi nennt hafa að þín væri óhefnt. Skal eg heldur leggja honum til liðs ef eg verð við staddur hans mál.\"", "Fannst það mjög að Snorra að honum þótti Grettir vel hafa gert við Þórodd og var jafnan vin hans síðan í tillögum sínum."], "recap": ["Snorri goði er reiður út í son sinn Þórodd, rekur hann frá sér og segir honum að koma ekki heim aftur fyrr en hann hafi drepið einhvern skógarmann.\nÞóroddur fer að finna Gretti og ætlar að takast á við hann, Grettir þekkir að þar er kominn Þóroddur Snorrason og segir honum að það sé ekki sterkur leikur hjá honum að ætla að ráðast að sér því það verði ójafn leikur og mikill munur á aflsmunum þeirra.\nÞóroddur lætur sér ekki segjast og ræðst að Gretti sem verst einungis með skildi en tekur ekki upp vopn, Gretti fer svo að leiðast þessi leikur og setur Þórodd niður við hlið sér og segir honum að hætta þessu veseni, hann vilji ekki drepa Þórodd því þá fái hann Snorra goða upp á móti sér sem hann vill alls ekki.\nÞóroddur róast þá og fer að lokum heim til föður síns og segir honum af viðureign sinni við Gretti.\nSnorri er ánægður með Gretti, að hann hafi þyrmt lífi Þórodds svo Snorri þurfi ekki að hefna hans, og er á bandi Grettis eftir þetta."]}, {"num": 69, "paras": ["Grettir reið norður til Bjargs litlu síðar en þeir Þóroddur skildu og duldist þar enn um stundar sakir. Þá gerðist svo mikið bragð að myrkfælni hans að hann þorði hvergi að fara þegar er rökkva tók. Móðir hans bauð honum þar að vera en kvaðst þó sjá að það mundi honum eigi duga fyrir þann skuld að hann átti sökótt um allt landið.", "Grettir kvað hana öngvar ónáðir af sér skyldu hafa \"en eigi mun eg það lengur til lífs mér vinna,\" segir hann, \"að vera einn saman.\"", "Illugi bróðir hans var þá fimmtán vetra gamall og allra manna gervilegastur. Hann var hjá viðtali þeirra. Grettir sagði móður sinni hvað Guðmundur hinn ríki hafði ráðið honum og lést mundu leita ef kostur væri að komast í Drangey en þó kvaðst hann eigi þar vera mega nema hann fengi einnhvern dygðarmann að vera hjá sér.", "Þá mælti Illugi: \"Eg mun fara með þér bróðir en eigi veit eg að þér sé fylgd í mér utan það að trúr mun eg þér vera og eigi renna frá þér meðan þú stendur uppi og gerr veit eg hvað um þig líður ef eg fylgi þér.\"", "Grettir svarar: \"Þú ert svo manna að mér er mest gleði að og ef móður minni væri ei í móti skapi vildi eg gjarna að þú færir með mér.\"", "Ásdís mælti þá: \"Er svo nú komið að eg sé að tvennum vandræðum gegnir. Eg þykist ekki Illuga missa mega en eg veit að svo mikil atkvæði eru að um hagi Grettis að hann verður eitthvert úr að ráða. En þó að mér þyki mikið fyrir að sjá á bak ykkur báðum sonum mínum þá vil eg það þó til vinna ef Grettir væri þá nær en áður.\"", "Illugi varð glaður við þetta því að hann hugði gott til að fara með Gretti. Hún fékk þeim lausafé mikið. Bjuggust þeir þá til ferðar.", "Leiddi Ásdís þá frá garði og áður en þau skildu mælti hún svo: \"Nú farið þið þar synir mínir tveir og mun ykkur samdauði verða tregast og má enginn renna undan því sem honum er skapað. Mun eg hvorigan ykkarn sjá sinni síðan. Látið nú eitt yfir ykkur ganga. En eigi veit eg hverja heill þið sækið þangað í Drangey en þar munuð þið beinin bera og margir munu þar fyrirmuna ykkur þarvistar. Sjáið þið vel fyrir svikum. En vopnbitnir munuð þið verða. En undarlega hafa mér draumar gengið. Gæt ykkar vel við gerningum. Fátt er rammara en forneskjan.\"", "En er hún hafði þetta mælt grét hún mjög.", "Þá mælti Grettir: \"Grát þú eigi móðir. Það skal sagt að þú hafir sonu átt en eigi dætur ef við erum með vopnum sóttir. Og lif vel og heil.\"", "Eftir það skildu þau.", "Þeir fóru nú norður um sveitir og hittu frændur sína. Dvöldust svo á haust fram til vetrar. Þá sneru þeir til Skagafjarðar og fóru norður Vatnsskarð og svo til Reykjaskarðs og svo ofan Sæmundarhlíð og svo á Langholt. Þeir komu til Glaumbæjar að áliðnum degi. Grettir hafði kastað hetti sínum á öxl sér. Svo gekk hann jafnan úti hvort sem var betra eða verra.", "Þaðan fóru þeir og er þeir komu skammt á veg kom maður til móts við þá, höfuðmikill, hár og mjór og illa klæddur. Hann heilsaði þeim og spurðu hvorir aðra að nafni. Þeir sögðu til sín en hann nefndist Þorbjörn. Hann var einhleypur maður og nennti ekki að vinna og skrumaði mikið og var hent að honum gaman mikið eða dáruskapur af sumum mönnum. Hann gerði sér við þá dælt og sagði mart ofan úr héraði frá byggðarlagsmönnum. Gretti þótti gaman mikið að honum.", "Hann spurði hvort þeir þættust ekki þurfa þess manns er starfaði fyrir þeim \"vildi eg gjarna fara með ykkur,\" segir hann.", "Svo fékk hann um talað að þeir létu hann fylgja sér. Var fjúkanda mjög og kalt. En með því að þessi maður var umfangsmikill og hinn mesti gárungur átti hann kenningarnafn og var kallaður glaumur.", "\"Mikið fannst þeim í Glaumbæ er þú gekkst þar heim hettulaus í því illviðri,\" sagði Glaumur, \"hvort þú mundir því hraustari sem þú varst ókulvísari. En hér voru bóndasynir tveir, afburðarmenn allmiklir, og kvaddi sauðamaður þá til fjár með sér og þóttust varla geta klætt sig fyrir kulda.\"", "Grettir sá einn ungan mann inn í dyrum og dró þar á sig vöttur sína en annar gekk á milli fjóss og haugs \"og mun eg hvorigan þeirra hræðast.\"", "Eftir það fóru þeir ofan til Reyniness og voru þar um nóttina. Þaðan fóru þeir út á ströndina til þess bæjar er að Reykjum hét. Þar bjó sá maður er Þorvaldur hét og var góður bóndi. Bað Grettir hann ásjá og sagði honum fyrirætlan sína að hann vildi komast út í Drangey. Bóndi sagði að Skagfirðingum mundi það þykja engi vinsending og taldist undan. Grettir tók þá fésjóð er móðir hans hafði gefið honum og fékk bónda. Hann varð léttbrýnn við féið og fékk til húskarla sína þá að flytja þá um nóttina í tunglsljósi. Frá Reykjum er skemmst til eyjarinnar og er það vika sjós.", "En er þeir komu í eyna þótti Gretti þar gott um að litast því að hún var grasi vaxin en sjábrött svo að hvergi mátti upp á komast nema þar sem stigarnir voru við látnir og ef upp var dreginn hinn efri stiginn þá var það einskis manns færleikur að komast á eyna. Þar var þá og fuglberg mikið á sumrum. Þar var þá átta tigir sauða í eynni er bændur áttu. Það voru mest hrútar og ær er þeir ætluðu til skurðar. Settist Grettir þar nú kyrrt. Þá hafði hann fimmtán vetur eða sextán í sekt verið að því sem Sturla Þórðarson hefir sagt."], "recap": ["Grettir fer heim á Bjarg til Ásdísar og Illuga, hann vill þó ekki dvelja þar því margir séu á eftir honum. \nGrettir segir móður sinni frá tillögu Guðmundar um að fara í Drangey en segist eiga erfitt með að fara þangað sökum myrkfælninnar.\nIllugi, sem þarna er 15 ára, heyrir á tal þeirra mæðgina og býðst til að fara með bróður sínum í Drangey og dvelja þar með honum, Gretti líst vel á þessa tilhögun og vill hafa bróður sinn með sér.\nÁsdís vill helst ekki missa Illuga en vill þó allt fyrir Gretti gera, segir hann glíma við svo mikla erfiðleika að eitthvað verði fyrir hann að gera, hún fellst á að þeir fari saman og lætur þá hafa mikið fé til ferðarinnar.\nÞegar Ásdís kveður þá bræður segir hún að þetta sé í síðasta skipti sem hún muni sjá þá, biður þá að snúa bökum saman og láta eitt yfir sig ganga, þeir munu deyja af sárum í Drangey, fátt sé jafn illvígt og galdur, grætur hún síðan mjög.", "Grettir biður móður sína að gráta ekki og segir:\n,,Það skal sagt að þú hafir sonu átt en eigi dætur ef við erum með vopnum sóttir. Og lif vel og heil.”\nÞeir bræður halda sína leið í átt að Drangey, á leiðinni hitta þeir mann sem heitir Þorbjörn og er kallaður Glaumur og fær hann að fylgja þeim.\nÞeir komast út í Drangey og er það Þorvaldur bóndi að Reykjum sem kemur þeim þangað yfir í skiptum fyrir fúlgu fjár.\nGretti líst vel á sig í Drangey, þar er ekki hægt að komast upp ef stiginn er ekki látinn síga, þar er nóg af fugli og auk þess átta tugir sauða sem bændur í Skagafirði eiga, mest þó hrútar.\nGrettir, sem enn er 31 árs, hefur nú verið fimmtán eða sextán vetur í útlegð eftir því sem Sturla Þórðarson segir - vangaveltur um hvort árin þrjú sem hann afplánaði í Noregi teljist með?"]}, {"num": 70, "paras": ["Þá er Grettir kom í Drangey voru þessir héraðshöfðingjar í Skagafirði.", "Hjalti bjó að Hofi í Hjaltadal, son Þórðar Hjaltasonar, Þórðarsonar skálps. Hjalti var höfðingi og göfugmenni mikið og vinsæll. Þorbjörn öngull hét bróðir hans. Hann var mikill maður og sterkur og harðfengur og ódæll. Þórður faðir þeirra hafði kvongast í elli sinni og var sú kona ekki móðir þeirra bræðra. Hún var illa til stjúpbarna sinna og verst til Þorbjarnar því að hann var illfengur og ófyrirleitinn.", "Það var eitt sinn að Þorbjörn öngull sat að tafli. Þá gekk stjúpmóðir hans hjá og sá að hann tefldi hnettafl. Það var stórt halatafl. Henni þótti hann óþrifinn og kastaði að honum nokkurum orðum en hann svarar illa. Hún greip þá upp töflina og setti halann á kinnbein Þorbirni og hljóp af í augað svo að úti lá á kinninni. Hann hljóp upp og þreif til hennar óþyrmilega svo að hún lagðist í rekkju af og af því dó hún síðan og sögðu menn að hún hefði verið ólétt. Síðan varð hann mesti óeirðarmaður. Tók hann þá við fé sínu og bjó fyrst í Viðvík.", "Halldór Þorgeirsson, Þórðarsonar frá Höfða, bjó að Hofi á Höfðaströnd. Hann átti Þórdísi Þórðardóttur systur þeirra bræðra Hjalta og Þorbjarnar önguls. Halldór var gildur bóndi og ríkur að fé.", "Björn hét maður er bjó í Haganesi í Fljótum. Hann var vinur Halldórs að Hofi. Þessir veittust að hverju máli.", "Tungu-Steinn hét maður er bjó á Steinsstöðum. Hann var Bjarnarson, Ófeigssonar þunnskeggs, Kráku-Hreiðarssonar, sonar þess er Eiríkur í Goðdölum gaf tunguna niður frá Skálamýri. Steinn var frægur maður.", "Eiríkur hét maður son Hólmgöngu-Starra Eiríkssonar úr Goðdölum, Hróaldssonar, Geirmundarsonar örðigskeggja. Hann bjó að Hofi í Goðdölum. Þessir voru allir virðingamenn miklir.", "Bræður tveir bjuggu þar sem heitir að Breiðá í Sléttahlíð og hét Þórður hvortveggi. Þeir voru rammir að afli og þó gæfir menn. Þeir áttu allir part í Drangey. Svo segja menn að eigi ættu færri menn í eynni en tuttugu og vildi engi sinn part öðrum selja. Þórðarsynir áttu mest í, því að þeir voru ríkastir."], "recap": ["Héraðshöfðingjar í Skagafirði þegar Grettir fer út í Drangey:\nHjalti Þórðarson að Hofi í Hjaltadal, Þorbjörn öngull bróðir hans í Viðvík sem er illa innrættur og óvarkár óeirðamaður.\nHalldór Þorgeirsson að Hofi á Höfðaströnd, kvæntur Þórdísi systur Hjalta og Þorbjörn önguls.\nBjörn í Haganesi í Fljótum, vinur Halldórs að Hofi.\nTungu-Steinn Bjarnason að Steinsstöðum.\nEiríkur Hólmgöngu-Starrason að Hofi í Goðdölum.\nBræðurnir Þórður og Þórður að Breiðá í Sléttahlíð, sterkir menn og gæfir.\nAllir þessir menn eiga part í Drangey, Hjalti og Þorbjörn öngull Þórðarsynir áttu mest því þeir voru ríkastir.\nKort bls.352."]}, {"num": 71, "paras": ["Nú líður fram að sólhvörfum. Þá bjuggust bændur að sækja sláturfé sitt í eyna.", "Þeir skipuðu skútu og fékk hver mann fyrir sig en sumir tvo. En er þeir komu nærri eyjunni sáu þeir þar menn á ferli. Það þótti þeim undarlegt og gátu það til að nokkurir menn mundu hafa brotið þar skip sitt og komist þar á land. Reru nú þar að sem stigarnir voru en hinir sem fyrir voru drógu upp stigana. Þá þótti bændum undarlega við bregða og kölluðu á þá og spurðu hverjir þar væru fyrir. Grettir nefndi sig og svo sína félaga. Bændur spurðu hver hann flutti út í eyna.", "Grettir svarar: \"Sá flutti mig sem farið átti og hendurnar hafði og meiri var minn vinur en yðvar.\"", "Bændur svöruðu: \"Lát oss ná fé voru og far til lands með oss og haf frjálst það sem þú hefir niður lagt af fé voru.\"", "Grettir svarar: \"Vel er það boðið en þó munu nú hvorir hafa það sem fengið hafa. Og er það skjótt að segja yður að héðan fer eg eigi nema eg sé dauður um dreginn. Ekki læt eg laust það sem eg hefi höndum á komið.\"", "Nú þögnuðu bændur og þótti mikill vogestur kominn í Drangey. Buðu þeir honum nú marga kosti, bæði með fégjöfum og fögrum heitum, en Grettir neitti öllu og fóru bændur á burt við svo búið og undu illa við sinn hlut. Sögðu þeir héraðsmönnum hver vargur kominn var í eyna. Þetta kom mikið á þá óvara og þótti eigi hægt til aðgerða. Áttu þeir um þetta að tala um veturinn og gátu eigi ráð til séð að koma Gretti úr eyjunni."], "recap": ["Þegar líða tekur á haustið ætla bændur að sækja sláturfé sitt út í Drangey.\nÞeir sigla af stað en þegar þeir koma að eyjunni sjá þeir að menn eru þar sem kippa upp stigunum svo ekki er hægt að komast upp á eyjuna.\nBændur kalla á mennina í eyjunni og spyrja hverjir þeir séu og svara Grettir eins og er.\nBændur biðja Gretti að láta þá fá féð og koma svo með þeim í land og lofa honum að hann fái að fara þegar þangað er komið.\nGrettir segir hins vegar að hann fari ekki af eyjunni nema dauður og ekki ætli hann að láta þá hafa kindurnar.\nBændum þykir mikill vágestur vera kominn í eyjunna, reyna að tala Gretti til og lofa honum öllu fögru en án árangurs.\nBændur snúa aftur heim og segja frá því að Grettir sé sestur að í eyjunni, menn í Skagafirði skeggræða Gretti yfir veturinn en finna engin ráð til þess að koma honum úr Drangey."]}, {"num": 72, "paras": ["Líður nú þar til er menn fara til Hegranessþings um vorið. Kom fjölmenni mikið úr öllum héruðum þeim sem menn áttu þangað að sækja. Sátu menn þar lengi á vorið bæði yfir málum og gleði því að þá var mart gleðimanna í héröðum.", "En er Grettir spurði að alþýða manna var farin til þingsins hafði hann gert ráð við vini sína því að hann átti ávallt gott við þá sem næstir honum voru og sparði ekki við þá það sem hann fékk til. Hann sagði að hann vildi fara til lands til aðdrátta en þeir Illugi og Glaumur skyldu eftir vera. Óráðlegt þótti Illuga þetta vera en lét þó svo vera sem Grettir vildi. Hann bað þá geyma stigans og sagði þeim þar á liggja. Eftir það fór hann á land og aflaði það sem hann þóttist þurfa. Hann duldist nú hvar sem hann kom og varði öngvan að hann mundi á land kominn. Nú spurði hann af þinginu að þar var gleði mikil. Var Gretti forvitni á að koma til þingsins og tekur fornan búning, heldur vondan, og kemur svo á þingið að menn gengu frá lögréttu heim til búða.", "Þá töluðu til sumir menn ungir að veður væri gott og fagurt og sé gott ungum mönnum að hafa glímur og skemmtan. Þeir kváðu það allráðlegt. Fóru menn þá og settust niður fram frá búðunum. Gengu þeir Þórðarsynir mest fyrir skemmtan.", "Þorbjörn öngull var uppvöðslumikill og ruddi fast til gleði. Varð hver til að fara sem hann vildi. Tók hann í herðar hverjum manni og hnykkti fram á völlinn. Nú glímdu fyrst þeir sem ósterkastir voru og þá hver að öðrum og gerðist af þessu gleði mikil.", "En er flestir höfðu glímt nema þeir sem sterkastir voru áttu bændur um að tala hver til mundi verða að taka á öðrum hvorum þeirra Þórðanna er fyrr voru nefndir en þar varð enginn til. Þeir gengu þá fyrir ýmsa menn og buðu sig fram en því firr fór sem nær kallaði.", "Þorbjörn öngull litast þá um og sá hvar maður sat, mikill vexti, og sá óglöggt í andlit honum. Þorbjörn þreif til hans og kippti honum fast. Hann sat kyrr og bifðist hvergi.", "Þá mælti Þorbjörn: \"Enginn hefir setið jafnfast fyrir mér í dag sem þú eða hver er þessi maður?\"", "Hann svarar: \"Gestur heiti eg.\"", "Þorbjörn mælti: \"Þú munt vilja skemmta nokkuru og ertu aufúsugestur.\"", "Hann svarar: \"Skjótt þykir mér mart skipast kunna og mun eg ekki hlaupa í leik með yður en mér er allt ókunnigt fyrir.\"", "Töluðu þá margir að hann væri góðs fyrir verður ef hann vildi skemmta mönnum nokkuru, ókunnur maður. Hann spurði hvers þeir beiddu hann. Þeir báðu hann glíma við einnhvern.", "Hann kvaðst niður hafa lagt að rjá \"en gaman þótti mér að því um skeið.\"", "En er hann afneitti eigi með öllu báðu þeir hann því meir.", "Hann mælti: \"Ef yður þykir undir um að eg sé dreginn þá munuð þér það til vinna að handsala mér grið hér á þinginu og þar til sem eg kem til heimilis míns.\"", "Þá þutu upp allir og kváðust það gjarna vilja. Hafur hét sá maður er mest fýsti að þessum manni væru grið gefin. Hann var Þórarinsson, Hafurssonar, Þórðarsonar hnapps er land hafði numið upp frá Stíflu í Fljótum til Tunguár. Hann bjó á Hnappsstöðum og var orðamaður mikill. Hann sagði fyrir griðum með mikilli röksemd og er þetta upphaf á:", "\"Hér set eg grið,\" segir hann, \"allra manna á millum, einkanlega þeim sama Gest til nefndum er hér situr, og að undir skildum öllum goðorðsmönnum og gildum bændum og allrar alþýðu vígra manna og vopnfærra og allir aðrir héraðsmenn í Hegranessþingi eða hvaðan sem hvorir eru að komnir, nefndra manna eða ónefndra, handsölum grið og fullan frið komumanni hinum ókunna er Gestur nefnist, til gamans, glímu og gleði allrar, til hérvistar og heimferðar hvort er hann þarf að fara á legi eða landi eða flutningi. Skal hann hafa grið í öllum stöðum, nefndum og ónefndum, svo lengi sem hann þarf til heillar heimkomu að höldnum tryggðum. Set eg þessi grið fyrir oss og vora frændur, vini og venslamenn, svo konur sem karla, þýjar og þræla, sveina og sjálfráða menn. Sé sá griðníðingur er griðin rýfur eða tryggðum spillir, rækur og rekinn frá guði og góðum mönnum, úr himinríki og frá öllum helgum mönnum og hvergi hæfur manna í milli, og svo frá öllum út flæmdur sem víðast varga reka eða kristnir menn kirkjur sækja, heiðnir menn hof blóta, eldur brennur, jörð grær, mælt barn móður kallar og móðir mög fæðir, aldir elda kynda, skip skríður, skildir blika, sól skín, snæ leggur, Finnur skríður, fura vex, valur flýgur vorlangan dag og standi honum beinn byr undir báða vængi, himinn hverfur, heimur er byggður og vindur veitir vötn til sjóvar, þrælar korni sá. Hann skal firrast kirkjur og kristna menn, heiðna hölda, hús og hella, heim hvern nema helvíti. Nú skulum vér vera sáttir og sammála hver við annan í huga góðum hvort sem vér finnumst á fjalli eða fjöru, skipi eða skíði, jörðu eða jökli, í hafi eða á hests baki, svo sem vin sinn í vatni finni eða bróður sinn á braut finni, jafnsáttir hver við annan sem sonur við föður eða faðir við son í samförum öllum. Nú leggjum vér hendur saman og allir vér og höldum vel griðin og öll orð töluð í tryggðum þessum að vitni guðs og góðra manna og allra þeirra er orð mín heyra eða nokkurir eru nær staddir.\"", "Tóku þá margir til orða að mikið var um mælt.", "Gestur mælti þá: \"Vel hefir þú um mælt og sagt ef þér spillið eigi um síðar. Skal eg nú ekki dvelja það sem eg hefi til fram að láta.\"", "Eftir það kastaði hann kuflinum og því næst öllum bolklæðum. Þá leit hver til annars og brá mjög vo fyrir grön. Þóttust þeir kenna að þetta var Grettir Ásmundarson því að hann var ólíkur öðrum mönnum fyrir vaxtar sakir og þrekleika og þögnuðu nú allir en Hafur þóttist ósvinnur orðinn. Gengu tveir og tveir saman af héraðsmönnum og ámælti hver öðrum en þeim mest er fyrir griðunum hafði sagt.", "Þá mælti Grettir: \"Gerið greiðlegt fyrir mér hvað yður býr í skapi því að ekki sit eg lengi klæðlaus. Eigið þér miklu meira í hættu en eg hvort þér haldið grið yður eða eigi.\"", "Þeir svöruðu fá og settust niður. Þórðarsynir og Halldór mágur þeirra tóku nú tal með sér. Vildu sumir halda griðin en sumir eigi. Hnippaði hver kolli að öðrum.", "Grettir kvað vísu:", "Dulist hefir margr í morgun", "menja runnr við kunnan.", "Renna víst á runna", "ranns ímu tvær grímur.", "Skotið mun heldr fyr hölda", "hvassorða leikborði.", "Öld bilar orð að halda.", "Allt dró slafr af Hafri.", "Þá mælti Tungu-Steinn: \"Þykir þér svo vera Grettir eða hvað munu þeir af ráða, höfðingjarnir? En satt er það að þú ert afbragðsmaður fyrir hreysti sakir. Eða sérð þú eigi að hver þeirra kjáir nefinu að öðrum?\"", "Grettir kvað þá vísu:", "Héldu Hlakkar tjalda", "hefjendr saman nefjum", "Hildar veggs og hjuggust", "hregg-Nirðir til skeggjum", "og geðstrangir gengu,", "griða tóku að iðrast,", "Sváfnis látrs í sveitir", "sviptendr er mig kenndu.", "Þá mælti Hjalti Þórðarson: \"Ekki skal svo vera, segir hann. \"Halda skulum vér grið vor þó að vor hafi orðið hyggindismunur. Vil eg eigi að menn hafi það til eftirdæma að vér sjálfir höfum gengið á grið þau sem vér höfum sett og seld. Skal Grettir fara liðugur þangað sem hann vill og hafa grið til þess er hann kemur aftur úr þessari ferð. Eru þá úti þessi tryggðamál hvað sem í gerist með oss.\"", "Allir þökkuðu honum fyrir og þótti hann höfðinglega gera, slíkar sakir sem til voru. Þorbjörn öngull varð hljóður við.", "Var þá talað til að annar hvor þeir Þórðanna mundi taka á Gretti en hann bað þá ráða. Nú gekk annar fram þeirra bræðra. Grettir stóð fyrir réttur en hinn hljóp að honum sem snarast og gekk Grettir hvergi úr sporum. Grettir seildist aftur yfir bak Þórði og tók svo í brækurnar og kippti upp fótunum og kastaði honum aftur yfir höfuð sér svo að hann kom að herðum niður og varð það allmikið fall. Þá mæltu menn að þeir skyldu fara til báðir bræðurnir senn og svo var gert. Þá urðu allmiklar sviptingar og máttu ýmsir betur en þó hafði Grettir ávallt annan hvorn undir en ýmsir fóru á kné eða fengu slyðrur fyrir öðrum. Svo tókust þeir fast á að hvervetna var blátt og blóðrisa. Öllum þótti að þessu hin mesta skemmtun.", "Og er þeir hættu þökkuðu allir fyrir glímuna þeim og var það dómur þeirra er hjá sátu að þeir væru eigi sterkari tveir en Grettir einn en hvor þeirra hafði tveggja manna megin þeirra sem gildir voru. Þeir voru svo jafnsterkir að hvorgi bar af öðrum ef þeir reyndu með sér.", "Grettir var ekki lengi á þinginu. Bændur báðu hann gefa upp eyna en hann neitti því og gátu bændur ekki að gert.", "Grettir fór aftur til Drangeyjar og tók Illugi feginsamlega við honum. Settust þeir um kyrrt. Sagði Grettir þeim nú frá ferðum sínum. Leið nú fram á sumarið.", "Öllum þótti Skagfirðingar mikinn drengskap sýnt hafa og hversu vel þeir héldu grið sín og má þá af slíku marka hverjir dygðarmenn þá voru, slíkar sakir sem Grettir hafði gert við þá.", "Bændur þeir sem óríkari voru töluðu með sér að þeim væri lítið gagn að eiga lítinn part í Drangey og buðu nú að selja Þórðarsonum en Hjalti kvaðst eigi kaupa vilja. En bændur skildu það til að sá er kaupa vildi skyldi annaðhvort drepa Gretti eða koma honum burt. Þorbjörn öngull kvaðst eigi spara að bindast fyrir um atför við Gretti ef þeir vildu gefa honum fé til. Hjalti bróðir hans lagði af við hann sinn part í eyjunni því að Þorbjörn var þeirra harðfengari og óvinsæll. Svo gerðu þá fleiri bændur. Fékk Þorbjörn öngull þá mikinn hlut eyjarinnar með litlu verði en hann bast undir að koma Gretti á burtu."], "recap": ["Menn úr nærsveitum fara til Hegranesþings um vorið, fjölmenni úr öllum héruðum á þinginu.\nGrettir fréttir þetta og ákveður að fara í land en Illugi og Glaumur eiga að vera eftir í Drangey.\nGrettir fer um bæi og nær í það sem hann þarf, er dulbúinn og kemst um allt án þess að nokkur verði hans var.\nGrettir fréttir af því að það sé mikil gleði á þingi og vill fara þangað svo hann dulbýr sig eins og áður sem maður að nafni Gestur og mætir til þings.\nMenn glíma sér til skemmtunar á þinginu og eru bræðurnir Hjalti og Þorbjörn öngull Þórðarsynir þar við stjórn og velja menn til að glíma.\nBræðurnir Þórður og Þórður eru mjög sterkir, þykja erfiðir viðureignar í glímunni og eftir því sem á líður finnst enginn til að glíma við þá. \nÞorbjörn öngull kemur þá auga á stóran og mikinn mann sem situr í hópnum og sést illa í andlit hans, Þorbjörn fer til hans og spyr hann nafns og svarar sá stórvaxni að hann heiti Gestur.", "Þorbjörn öngull biður Gest að glíma við Þórð og Þórð en Gestur þessi neitar til að byrja með, svo fer þó að Gestur segist munu glíma ef þinggestir heiti honum því að hann fái grið þar á þinginu og þar til hann kemur heim til sín.\nHafur á Knappsstöðum, orðamaður mikill - segir fyrir griðum með mikilli röksemd bls.175-176.\nEftir ræðu Hafurs samþykkja allir menn á þingi að Gestur fái grið á þingi og til að komast heim til sín.\nGestur kastar þá kuflinum af sér og sjá allir að þar er kominn Grettir Ásmundarson í öllu sínu veldi, miklu stærri og þreknari en aðrir.\nUppi verður fótur og fit, menn takast á um hvort halda eigi griðinn eða ráðast á Gretti, Hjalti og Þorbjörn öngull Þórðarsynir og Halldór mágur þeirra ræða saman og fer svo að Hjalti segir að halda skuli griðinn en Þorbjörn öngull verður hljóður við.\nGrettir glímir svo við bræðurna Þórð og Þórð í glímu og hefur þá undir, mönnum þykir mikil skemmtun að.\nEftir það reyna menn að fá Gretti til að gefa upp dvöl sína í Drangey en hafa ekki erindi sem erfiði.\nGrettir snýr svo aftur í Drangey og tekur Illugi honum feginsamlega, líður svo sumarið.\nBændur vilja losna við sinn hlut í Drangey, Þorbjörn öngull fær mikinn hluta eyjunnar á litlu verði með því skilyrði að hann komi Gretti burt þaðan."]}, {"num": 73, "paras": ["Að áliðnu sumri fór Þorbjörn öngull með alskipaða skútu til Drangeyjar en þeir gengu fram á bjargið. Töluðust þeir þá við. Bað Þorbjörn Gretti gera fyrir orð sín að fara úr eyjunni. Grettir kvað þess öngva von.", "Þorbjörn mælti: \"Vera má að eg megi gera þér þvílíkt liðsinni þótt þú gerðir þetta en nú hafa bændur margir lagt upp við mig það er þeir hafa átt í eynni.\"", "Grettir svarar: \"Nú kvaðstu það upp að eg er ráðinn enn til að ganga héðan aldrei er þú sagðist eiga mestan hlut eyjarinnar. Er það vel þó að við deilum kálið. En það var satt að mér þótti erfitt að hafa alla Skagfirðinga í móti mér en hér er hvorgi til sparandi því að við munum ekki kafna í vinsældum manna. Máttu vel af leggja ferðir þínar hingað því allt er um gert fyrir mér.\"", "\"Sinnar stundar bíður hvað,\" sagði Þorbjörn, \"og muntu ills bíða.\"", "\"Hætt mun á það verða,\" sagði Grettir og skildu við svo búið.", "Fór Þorbjörn heim aftur."], "recap": ["Um haustið ferð Þorbjörn öngull á meðalstórum báti að Drangey.\nHann kallar til Grettis og biður hann að fara úr eyjunni en Grettir neitar.\nÞorbjörn segist nú eiga stóran hluta eyjarinnar en Grettir er þá þeim mun ákveðnari að fara ekki og segir Þorbirni öngli að hann þurfi ekki að koma oftar út í eyjuna:\n,,Er það vel þó að við deilum kálið.”\nVið skiptum með okkur; þú átt eignina en getur ekki nýtt hana, ég er á eigninni og kemst ekki burt.\nÞorbjörn svarar að þeir skuli sjá hvað setur í þeim efnum, illt bíði Grettis.\nGrettir segist ætla að hætta á það, skiljast þeir svo og Þorbjörn siglir heim aftur."]}, {"num": 74, "paras": ["Svo er sagt að þá er Grettir hafði tvo vetur verið í Drangey þá höfðu þeir skorið flest allt sauðfé það sem þar hafði verið. En einn hrút létu þeir lifa svo að getið sé. Hann var hösmögóttur að lit og hyrndur mjög. Að honum hentu þeir mikið gaman því að hann var svo spakur að hann stóð fyrir úti og rann eftir þeim þar sem þeir gengu. Hann gekk heim til skála á kveldin og gneri hornum sínum við hurðina.", "Gott þótti þeim í eyjunni því að þar var gott til matar fyrir fugls sakir og eggja. En til eldiviðar var þar hneppst að afla og lét Grettir jafnan þrælinn kanna reka og rak þar oft kefli og bar þau heim til elda. Ekki þurftu þeir bræður að starfa utan að fara í bjarg þá er þeim líkaði.", "Þrællinn tók að letjast mjög á starfanum. Gerðist hann nú möglunarsamur og ógeymnari en verið hafði. Hann skyldi geyma um eld hverja nótt og bauð Grettir mikinn varnað á því því að skip var ekki hjá þeim.", "Nú bar svo til að eldur slokknaði fyrir þeim á einni nótt. Þá varð Grettir styggur við og kvað það maklegt að Glaumur væri hýddur. En hann, þrællinn, sagði illa ævi sína að liggja hér í útlegð en vera hraktur og barður ef nokkuð mistækist. Grettir spurði Illuga hvað þá væri til ráða. En hann kvaðst eigi annað sjá en þeir mundu þar verða að bíða til þess er skip bæri að.", "Grettir sagði að þeim var blint til þess að ætla \"mun eg heldur hætta til hvort eg kemst til lands.\"", "\"Mikið þykir mér það,\" segir Illugi, \"því að við erum upp gefnir ef þér verður nokkuð.\"", "\"Ekki mun eg á sundi drukkna,\" sagði Grettir. \"En þó mun eg verr trúa þrælnum héðan frá svo mikið sem oss lá hér við.\"", "Það var vika sjóvar sem skemmst var til lands úr eyjunni."], "recap": ["Grettir hefur verið tvo vetur í Drangey með Illuga og Glaumi.\nÞeir hafa nýtt nær allt sauðfé en eiga einn hrút eftir, nóg er af fugli og eggjum í eyjunni og því fer vel um þá.\nÞeir þurfa að treysta á rekavið til að hafa eldivið til að brenna og fær Glaumur það verkefni að fylgjast með honum og sækja.\nGlaumur verður latur og ógætinn með viðinn og nennir ekki að fylgja þessu verkefni eftir.\nGrettir leggur hart að Glaumi að passa eldiviðinn því þeir hafa ekki bát til að fara í land að sækja við heldur treysta á rekann.\nSvo gerist það að eldur slokknar hjá þeim eina nóttina því eldiviðurinn er búinn, Grettir verður æfur og vill hýða Glaum en sá svarar að hann eigi það nú ekki skilið þar sem hann væri með þeim í útlegðinni.\nGrettir spyr Illuga hvað þeir eigi til bragðs að taka, Illugi vill bíða eftir að skip sigli hjá og fá þannig eld en Grettir vill frekar synda til lands og sækja eld þannig.\nIlluga líst ekki á það og hefur áhyggjur af því að Grettir drukkni en Grettir segir það ekki munu gerast, hann muni komast þessa 7,5 km sem eru á milli lands og eyjar."]}, {"num": 75, "paras": ["Býst Grettir nú til sunds og hafði söluvoðarkufl og gyrður í brækur. Hann lét fitja saman fingurna. Veður var gott. Hann fór að áliðnum degi úr eyjunni. Allóvænlegt þótti Illuga um hans ferð.", "Grettir lagðist nú inn á fjörðinn og var straumur með honum en kyrrt með öllu. Hann sótti fast sundið og kom inn til Reykjaness þá er sett var sólu. Hann gekk til bæjar að Reykjum og fór í laug því honum var orðið nokkuð kalt. Bakaðist hann lengi í lauginni um nóttina og fór síðan í stofu. Þar var mjög heitt því að eldur hafði verið um kveldið og var lítt rokin stofan. Hann var móður mjög og sofnaði fast. Lá hann þar allt á dag fram.", "En er á leið morguninn stóðu heimamenn upp og komu konur tvær í stofu fyrst. Það var griðkona og dóttir bónda. Grettir var við svefn og höfðu fötin svarfast af honum ofan á gólfið. Þær sáu hvar maður lá og kenndu hann.", "Þá mælti griðkona: \"Svo vil eg heil, systir, hér er kominn Grettir Ásmundarson og þykir mér raunar skammrifjamikill vera og liggur ber. En það þykir mér fádæmi hversu lítt hann er vaxinn niður og fer þetta eigi eftir gildleika hans öðrum.\"", "Bóndadóttir svarar: \"Því ber þér svo mart á góma? Og ertu eigi meðalfífla og vertu hljóð.\"", "\"Eigi má eg hljóð vera um þetta, sæl systirin,\" segir griðkona, \"því að þessu hefði eg eigi trúað þó að nokkur hefði sagt mér.\"", "Fór hún nú yfir að honum og gægðist en stundum hljóp hún til bóndadóttur og skellti upp og hló.", "Grettir heyrði hvað hún sagði. Og er hún hljóp enn yfir á gólfið greip hann til hennar og kvað vísu:", "Váskeytt er far flásu.", "Fár kann sverð í hári", "æskiruðr fyr öðrum", "örveðrs séa görva.", "Veðja eg hins að hreðjar", "hafit þeir en vér meiri", "þótt éldraugar eigi", "atgeira sin meiri.", "Síðan svipti hann henni upp í pallinn en bóndadóttir hljóp fram. Þá kvað Grettir vísu:", "Sverðlítinn kvað sæta,", "saumskorða, mig orðinn.", "Hrist hefir hreðja kvista", "hælin satt að mæla.", "Alllengi má ungum,", "eyleggjar bíð Freyja,", "lágr í læra skógi,", "lotu, faxi mér vaxa.", "Griðka æpti hástöfum en svo skildu þau að hún frýði eigi á Gretti um það er lauk.", "Litlu síðar stóð hann upp og gekk til Þorvalds bónda og sagði honum til vandkvæða sinna og bað hann flytja sig út og gerði hann svo og léði skip og flutti hann út og þakkaði Grettir honum fyrir þenna drengskap.", "En er það fréttist að Grettir hafði lagst viku sjóvar þótti öllum frábært, frækleikur hans bæði á sjá og landi.", "Skagfirðingar ámæltu mjög Þorbirni öngli fyrir það er hann kom eigi Gretti burt úr Drangey og kváðust mundu aftur taka hver sinn part. Honum þótti sér óhægt um og bað þá vera góða í."], "recap": ["Grettir býst nú til sunds, var í síðri yfirhöfn með hettu sem hann girti í brækurnar og var með einhvers konar sundfit á milli fingranna.\nHann kemur til lands við Reykjanes eftir að sól er sest og fer þá í heita laug sem þar var til að hlýja sér því honum var orðið kalt eftir sundið, fer hann svo inn á bæinn Reyki og svaf þar fram á næsta dag (Þorvaldur bóndi á Reykjum er Gretti hliðhollur).\nMjög heitt hafði verið í skálanum og hafði Grettir afklæðst þar sem hann lá.\nKoma þá inn í skálann bóndadóttir og vinnukona og sjá að þar liggur Grettir Ásmundarson og er hann nakinn, fer vinnukonan að grínast með það hvað sé lítið undir Gretti, það passi ekki alveg við hversu stór og þrekinn hann sé.\nVinnukonan stekkur til og frá og kíkir á milli fóta Grettis og gerir grín að honum en hann þrífur svo til hennar og dregur til sín og nauðgar henni til að þagga niður í henni sem tekst.\nGrettir gengur svo til Þorvalds bónda sem leggur til skip og flytur Gretti aftur út í Drangey með eld.\nFréttist nú að Grettir hafi synt til lands úr Drangey og þykir fólki mikið til hans koma að hafa unnið svo frækið afrek.\nSkagfirðingar ámæla Þorbirni öngli fyrir að hafa ekki komið Gretti úr Drangey og hóta því að taka aftur sinn hluta eyjunnar en hann biður þá að vera rólega, hann muni ná Gretti þaðan fyrr en síðar."]}, {"num": 76, "paras": ["Þetta sumar kom skip út í Gönguskarðsósi. Þar var á sá maður á skipi er Hæringur hét. Hann var ungur maður og fær svo vel að hann kleif hvert bjarg. Hann fór til vistar með Þorbirni öngli og var þar fram á haust. Hann fýsti Þorbjörn mjög til að fara til Drangeyjar og kvaðst vildu sjá hvort hún væri svo mikið bjarg að hvergi mætti upp komast. Þorbjörn kvað hann eigi til einskis vinna skyldu ef hann kæmist upp á eyna og fengi veitt Gretti áverka eða drepið hann. Gerði hann þetta ágengilegt fyrir Hæringi.", "Og eftir þetta fóru þeir til Drangeyjar og skutu honum, Austmanninum, upp í einhverjum stað og skyldi hann leynast að ef hann kæmist upp á eyna en þeir lögðu að stiganum og tóku tal við þá Gretti. Spurði Þorbjörn Gretti hvort hann ætlaði ekki úr eyjunni. Hann kveðst í öngu jafnráðinn.", "\"Mjög hefir þú á oss leikið,\" segir Þorbjörn, \"nær sem vér fáum þess hefnt en eigi uggir þú mart að þér.\"", "Lengi áttust þeir þetta við og kom ekki ásamt með þeim.", "En frá Hæringi er það að segja að hann kleif aftur og fram um bjargið og fékk upp komist í einhverjum stað þar sem hvorki hefir maður farið áður né síðan. En er hann kom upp á bjargið sér hann hvar þeir bræður voru og horfðu baki við honum. Hugðist hann nú á skammri stundu að vinna bæði til fjár og frægðar. Þá varði einskis um hans ferðir því að þeir hugðu að hvergi mátti upp komast nema þar sem stigarnir voru. Grettir fékkst við þá Þorbjörn og skorti þar eigi tygileg orð af hvorumtveggja. Þá varð Illuga litið hjá sér og sá mann kominn mjög að þeim.", "Hann mælti þá: \"Maður er hér kominn að okkur með reidda öxi og sýnist mér heldur ófriðlega láta.\"", "\"Snú þú í móti honum þá,\" segir Grettir, \"en eg mun geyma stigans.\"", "Illugi réðst í móti Hæringi og er Austmaðurinn sá það sneri hann undan einhvers staðar eftir eyjunni. Illugi elti hann meðan eyin vannst og þegar hann kom fram á bjargið hljóp Hæringur þá ofan fyrir og brotnaði í honum hvert bein. Lauk hans ævi svo. Þar heitir Hæringshlaup síðan sem hann týndist.", "Illugi kom aftur og spurði Grettir hversu hann hefði við þenna skilið er honum var ætlaður.", "\"Ekki vildi hann mér að hlíta,\" segir Illugi, \"að sjá ráð fyrir sér og braut hann bekrann ofan fyrir bjargið og biðji bændur fyrir honum sem hann sé dauður.\"", "Og er Öngull heyrði það bað hann þá burt leggja \"hefi eg nú farið tvær ferðir til móts við Gretti en eg mun eigi fara í þriðja sinn ef eg verð þá einskis vísari. En nú þykir mér meiri von að þeir megi sitja í Drangey fyrir mínum sökum. En það ætla eg að Grettir muni skemur sitja héðan af en hingað til.\"", "Nú fóru þeir heim. Þótti þessi ferð verri en hin fyrri og sat Grettir þenna vetur í Drangey og hittust þeir Þorbjörn ekki þann vetur.", "Á þessum misserum andast Skafti lögmaður Þóroddsson. Var Gretti það skaði mikill því að hann hafði heitið að ganga fyrir um sýknu hans þegar Grettir hefði tuttugu vetur í sekt, en sjá var hinn nítjándi sektar hans er nú var frá sagt um hríð.", "Um vorið andaðist Snorri goði og mart bar til tíðinda á þessum misserum það sem ekki kemur við þessa sögu."], "recap": ["Skip kemur að landi í Skagafirði og er þar á Austmaður sem heitir Hæringur, ungur maður og mjög klár í að klífa bjarg.\nHæringur fer í vist til Þorbjörn önguls og vill endilega spreyta sig á að klífa Drangey, Þorbjörn er til í það og hvetur Hæring til að reyna þá að særa eða drepa Gretti.\nÞeir sigla út í eyjuna, Hæringur leggur til við klifrið en Þorbjörn kallar á Gretti og ætlar að afvegaleiða hann með masi svo Hæringur komist þá aftan að honum. \nHæringur kemst upp leið sem hvorki hafði verið farin áður né hefur síðar verið farin, hann sé þá aftan á bæði Gretti og Illuga, hyggst vinna sér bæði til fjár og frægðar með því að fara aftan að Gretti og drepa hann og læðist að þeim bræðrum þar sem þeir standa á brúninni og tala niður til Þorbjörns sem er á báti.\nGrettir verður einskis var en Illuga verður litið um öxl og sér manninn nálgast þá, Grettir segir Illuga að ráðast að honum en hann muni sjálfur gæta stigans, Illugi hleypur á móti Hæringi sem verður hræddur, snýr við og hleypur eyjuna endilanga og stekkur svo fram af henni, brotnar í honum hvert bein og lýkur ævi hans en þar heitir Hæringshlaup síðan.\nÞorbjörn öngull snýr til baka, ósáttur við málalok, hefur nú farið tvisvar út að eyjunni án árangurs, er þess þó fullviss að skammt sé þar til hann nái Gretti, vill þó helst ekki þurfa að fara þangað í þriðja sinn.\nSkafti lögmaður andast, hann hafði heitið að ganga fyrir sýknu Grettis eftir tuttugu ára útlegðina og því mikill skaði fyrir Gretti sem þegar hefur verið nítján ár í útlegð.\nSnorri goði andast einnig um vorið og því fækkar enn bandamönnum Grettis."]}, {"num": 77, "paras": ["Þetta sumar á alþingi töluðu frændur Grettis mart um sekt hans og þótti sumum sem hann hefði úti sekt sína ef hann hefði mikið af hinu tuttugasta ári. En þeir sem sakir áttu við hann vildu það eigi og kölluðu hann margt útlegðarverk gert hafa síðan og þótti sekt hans eiga að vera því lengur. Þá var nýr lögmaður tekinn, Steinn Þorgestsson, Steinssonar mjögsiglanda, Þórissonar haustmyrkurs. Móðir Steins lögmanns var Arnóra dóttir Þórðar gellis. Steinn var vitur maður. Hann var þá beiddur úrskurðar en hann bað þá rannsaka hvort það væri hið tuttugasta sumar síðan hann var sekur ger. En það varð svo.", "Þá gekk að Þórir úr Garði og leitaði að færa í alla trega þá er mætti og gat hann fundið að Grettir hafði verið einn vetur út hér svo að hann var ósekur og urðu þá nítján vetur þeir sem hann hafði í sekt verið.", "Þá sagði lögsögumaður að engi skyldi lengur í sekt vera en tuttugu vetur alls þó að hann gerði útlegðarverk í þeim tímum \"en fyrr mun eg öngvan úr sekt segja.\"", "Og af þessu eyddist sýkn að sinni en þótti nú að vísu ganga að hann mundi sýkn vera á öðru sumri.", "Þetta líkaði illa Skagfirðingum ef Grettir kæmist úr sektinni, báðu nú Þorbjörn öngul gera annaðhvort, leggja aftur eyjuna eða drepa Gretti. En honum þótti vandi á höndum því að hann kunni eigi ráð til að vinna Gretti en vildi þó halda eyjunni. Leitaði hann allra bragða nú að stíga yfir Gretti, annaðhvort með harðfengi eða brögðum eða á hvern hátt er hann gæti það gert."], "recap": ["Tekist á um útlegð Grettis á Alþingi um sumarið, frændur hans segja að hann sé langt kominn með útlegðina og eigi að fá sýkn eftir tuttugu ár, þeir sem eiga sökótt við hann segja að hann hafi framið svo mörg ódæðisverk í útlegðinni að hann eigi að vera sekur lengur.\nSteinn Þorgestsson lögmaður tekur við af Skafta lögmanni, úrskurðar að Grettir eigi að fá sýkn eftir tuttugu vetur í útlegð, hann hafi þegar verið sekur í nítján vetur og verði því frjáls eftir ár.\nSkagfirðingar þrýsta mjög á að Þorbjörn öngull nái Gretti áður en hann fær sýkn, annars vilji þeir aftur sinn hlut í Drangey, Þorbjörn leitar allra leiða til að vinna Gretti því hann vill halda eyjunni fyrir sig."]}, {"num": 78, "paras": ["Fóstru átti Þorbjörn öngull er Þuríður hét. Hún var mjög gömul og til lítils fær að því er mönnum þótti. Hún hafði verið fjölkunnig mjög og margkunnig mjög þá er hún var ung og menn voru heiðnir. Nú þótti sem hún mundi öllu týnt hafa. En þó að kristni væri á landinu þá voru þó margir gneistar heiðnar eftir. Það hafði verið lög hér á landi að eigi var bannað að blóta á laun eða fremja aðra forneskju en varðaði fjörbaugssök ef opinbert yrði. Nú fór svo mörgum að gjörn var hönd á venju og það varð tamast sem í æskunni hafði numið. Og svo sem Þorbjörn öngull var þrotinn að ráðagerðum leitar hann þangað til trausts sem flestum þótti ólíklegast en það var til fóstru sinnar og spurði hvað þar væri til ráða að taka hjá henni.", "Hún svarar: \"Nú þykir mér koma að því sem mælt er að margur fer í geitarhús ullar að biðja. En hvað mundi eg síður en þykjast fyrir héraðsmönnum öðrum en vera til einskis maður þegar að mikið reyndi til? Nú sé eg eigi að mér mætti firr um fara en þér þótt eg rísi varla úr rekkju. Ef þú vilt mín ráð hafa þá vil eg ráða hversu með er farið.\"", "Hann játaði því og kvað hana sér lengi heilráða verið hafa. Leið nú fram að tvímánuði sumars.", "Það var einn veðurdag góðan að kerling mælti við Öngul: \"Nú er kyrrt veður og bjart. Vil eg nú að þú farir til Drangeyjar og troðir illsakir við Gretti. Mun eg fara með yður og vita hversu geymilega honum fara orð. Mun eg hafa eitthvað fyrir satt ef eg sé þá hversu heilladrjúgir þeir munu vera og mun eg þá mæla yfir þeim slíkum orðum sem mér líkar.\"", "Öngull svarar: \"Lest eg á ferðir til Drangeyjar því að jafnan er mér verra í hug þá eg fer í burt þaðan en þá eg kem.\"", "Þá mælti kerling: \"Ekki skal eg til leggja með þér ef þú lætur mig öngu ráða.\"", "\"Eigi skal svo vera fóstra mín,\" segir hann, \"en það hefi eg mælt að eg vildi svo koma þar í þriðja sinni að eitthvert skapaðist að með oss.\"", "\"Hætta verður á það,\" segir kerling, \"og muntu margt erfiði verða fyrir að hafa áður Grettir er við jörðu lagður og oft mun þér ósýnt um þykja hver þinn hluti verður og þungt muntu af fá um það er lýkur. En þó ertu svo undir bundinn að eitthvert verður úr að ráða.\"", "Eftir það lætur Þorbjörn öngull setja fram teinæring og sté þar á við tólfta mann. Kerling var í ferð með þeim. Tóku þeir róðrarleiði út til Drangeyjar. Og er þeir bræður sáu það gengu þeir fram að stiganum og tóku þeir enn að tala um mál sín og sagði Þorbjörn að hann var enn kominn að vitja þeirra mála ef Grettir vildi á burt fara og kvaðst enn leggja í léttan stað um fémissu og þarvist ef þeir skildu slysalaust.", "Grettir kvaðst engi miðlunarmál á því hafa eða gera að fara þaðan \"hefi eg þetta oft sagt og þarf þetta eigi við mig að tala,\" segir hann. \"Munuð þér það að gera sem þér viljið en hér mun eg bíða þess sem að höndum kemur.\"", "Nú þóttist Þorbjörn sjá að hans erindi varð ekki að sinni og mælti: \"Vita þóttist eg við hverja heljarmenn að hér er um að eiga og það er líkast að líði nokkur dagur áður eg kem hér aftur.\"", "\"Eigi tel eg það með skaða mínum þótt þú komir hér aldrei,\" segir Grettir.", "Kerling lá aftur í skut og voru borin að henni klæði.", "Hún hrærðist þá og mælti: \"Þessir menn munu vera hraustir og hamingjulausir. Verður yðvar mikill mannamunur. Þú býður þeim marga kosti góða en þeir neita öllum og fátt vísara til ills en kunna eiga gott að þiggja. Nú mæli eg það um við þig Grettir að þú sért heillum horfin, allri gift og gæfu, og allri vörn og visku, æ því meir sem þú lifir lengur. Vænti eg að þú eigir hér fá gleðidaga héðan frá en hingað til.\"", "Og er Grettir heyrði þetta brá honum mjög við og mælti hann: \"Hvað fjanda er á skipi með þeim?\"", "Illugi svarar: \"Það hygg eg að það sé kerlingin, fóstra Þorbjarnar.\"", "\"Fussum þeirri gerningavætti,\" sagði Grettir, \"og var þar eigi hins verra eftir von og við engin orð hefir mér meir brugðið en þessi er hún mælti. Og það veit eg að af henni og hennar fjölkynngi leiðir mér nokkuð illt. Skal hún og eitthvert til mín hafa er hún hefir okkur heim sótt\" og þreif upp stein stundar mikinn og kastaði ofan á skipið og kom á fatahrúguna.", "Það var þó lengra steinkast en Þorbjörn ætlaði að nokkur maður mundi kasta. Við það kom upp skrækur mikill. Hafði steinninn komið á þjólegg kerlingar svo að í sundur gekk.", "Þá mælti Illugi: \"Ekki vildi eg að þú hefðir þetta gert.\"", "\"Lasta þú eigi þetta,\" segir Grettir, \"en það uggir mig að of lítt hafi á komið því að eigi væri of goldið fyrir okkur báða þó að ein kerling komi fyrir okkur.\"", "\"Hvað mun hún koma fyrir okkur?\" sagði Illugi, \"og lítið leggst þá fyrir okkur.\"", "Þorbjörn fór nú heim og varð ekki af kveðjum er þeir skildu.", "Hann mælti þá við kerlingu: \"Nú fór sem mig varði að þú mundir litla sæmdarför fara til eyjarinnar. Hefir þú fengið örkuml en vér erum öngri sæmd að nær en áður og verðum að hafa bótalausa hverja svívirðing ofan á aðra.\"", "Hún svarar: \"Þetta mun upphaf óheilla þeirra og get eg að héðan af fari þeim heldur signanda. Kvíði eg eigi því ef eg lifi að eg geti eigi hefnt þessa atviks sem mér hefir gert verið.\"", "\"Hugstigin þykir mér þú vera fóstra,\" sagði Þorbjörn.", "Nú komu þau heim og lagðist kerling í rekkju og lá nær mánuð. Þá var saman runninn leggurinn er verr var. Tók hún þá á fætur að færast.", "Mikinn hlátur gerðu menn að ferðum þeirra Þorbjarnar og kerlingar og þótti nú oft áleikur í viðskiptum þeirra Grettis, það fyrst á vorþingi um griðasöluna en í annað sinn þá Hæringur týndist og nú hið þriðja sinni er þjóleggur kerlingar brotnaði og varð hér ekki í móti leikið. Hafði Þorbjörn öngull mikla skapraun af þessum orðum."], "recap": ["Þorbjörn öngull á fóstru sem heitir Þuríður, hún er mjög gömul en hafði verið fjölkunnug (göldrótt) og nýtt þá krafta þegar Íslendingar voru heiðnir, hafði ekki beitt þeim kröftum eftir að landsmenn tóku kristni því það varðaði við lög að fremja galdra.\nÞorbjörn leitar til Þuríðar um ráð til að ná Gretti, hún svarar honum að hún skuli hjálpa ef hann lofi að gera allt eins og hún segir og hann samþykkir það.\nSíðsumars kallar hún Þorbjörn til sín, biður hann að fara út í Drangey og espa Gretti upp með því að deila við hann, hún muni fara með og fremja galdur sem muni hjálpa Þorbirni að ná Gretti.\nÞorbjörn vill helst ekki fara út í eyjuna í þriðja sinn, minnugur hversu illa gekk í hin tvö skiptin að eiga við Gretti, en Þuríður fóstra segir að það verði að vera svo ætli hann að ná Gretti.\nEftir það lætur Þorbjörn setja út skip og fara þeir við tólfta mann út að eyjunni og Þuríður með þeim. \nÞorbjörn ræðir enn við Gretti þegar skipið kemur að eyjunni, svo fer sem áður að Grettir neitar að gefa eyjuna eftir en þeir eiga einhver orðaskipti um það.", "Þuríður liggur í felum undir fatahrúgu á skipinu, skyndilega bærir hún á sér og leggur álög á Gretti:\n,,Nú mæli eg það um við þig Grettir, að þú sért heillum horfinn, allri gift og gæfu, og allri vörn og visku, æ því meir sem þú lifir lengur. Vænti eg að þú eigir hér fáa gleðidaga héðan frá og hingað til.”\nGretti bregður mjög þegar hann heyrir þessi orð og spyr hvaða fjandi sé á skipi með þeim, Illugi svarar að þar sé líklega komin fóstra Þorbjörns.\nGrettir bregst ókvæða við, segir að fjölkynngi hennar muni leiða til ills fyrir sig og hún skuli fá eitthvað til minja frá sér, tekur svo upp stein og kastar honum á skipið og á fatahrúguna þar sem Þuríður liggur undir.\nHeyrist mikill skrækur undir hrúgunni, hafði steinninn lent á lærlegg Þuríðar svo hann gekk í sundur.\nÞorbjörn siglir nú heim án þess að kveðja Gretti, hann er ósáttur við Þuríði og segir að svo hafi farið sem hann grunaði, að þessi ferð yrði ekki til neins nema svívirðingar fyrir sig.\nÞuríður svarar honum að ferðin hafi ekki verið til einskis því nú muni fara að síga á ógæfuhliðina hjá Gretti og félögum.\nMenn gera mikið grín að viðskiptum Þorbjörns og Grettis og Þorbjörn hlýtur skömm af:\nGriðarsalan á þingi, Hæringur og dauði hans, fótbrot kerlingar."]}, {"num": 79, "paras": ["Nú líður fram á haustið þar til að voru þrjár vikur til vetrar. Þá beiddi kerling að henni skyldi aka til sjóvar. Þorbjörn spurði hvað hún vildi.", "\"Lítið er erindið en þó má vera,\" segir hún, \"að það væri fyrirboðan stærri tíðinda.\"", "Nú var svo gert sem hún beiddi og er hún kom til strandar haltraði hún fram með sjónum svo sem henni væri vísað til. Þar lá fyrir henni rótartré svo mikið sem axlbyrður. Hún leit á tréið og bað þá snúa fyrir sér. Það var sem sviðið og gniðað öðrumegin. Hún lét telgja á lítinn flatveg þar gnúið var. Síðan tók hún hníf sinn og reist rúnir á rótinni og rauð í blóði sínu og kvað yfir galdra. Hún gekk öfug andsælis um tréið og hafði þar yfir mörg römm ummæli. Eftir það lætur hún hrinda trénu á sjó og mælti svo fyrir að það skyldi reka út til Drangeyjar \"og verði Gretti allt mein að.\"", "Þaðan fór hún heim í Viðvík. Eigi kvaðst Þorbjörn vita til hvers þetta kæmi. Kerling kvað hann vita síðar gerr. Vindur var utan eftir firði og hóf rót kerlingar í móti veðri og þótti fara eigi vonum seinna.", "Nú sat Grettir í Drangey sem fyrr segir og þeir allir félagar og létu vel yfir sér. Annan dag eftir en kerling hafði tréið magnað gengu þeir Grettir ofan fyrir bjargið og leituðu að eldiviði. En er þeir komu vestur um eyna fundu þeir rótartré rekið upp.", "Þá mælti Illugi: \"Þetta er mikill eldiviður frændi og berum heim.\"", "Grettir spyrnti við fæti sínum \"illt tré og af illum sent og skulum við annan eldivið hafa\" og kastaði út á sjá og bað hann Illuga varast að bera það heim \"því að það er sent okkur til óheilla.\"", "Eftir það fóru þeir til skála og gátu ekki um þetta fyrir þrælnum. Annan dag fundu þeir tréið og var þá nær stigunum en hinn fyrra dag. Rak Grettir það á sjá út og kvað það aldregi skyldu heim bera. Leið nú af sú nótt. Þá kom á hvasst veður með vætu og nenntu þeir ekki að hafa sig úti og báðu Gl
